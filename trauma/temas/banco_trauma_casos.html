<!--
=============================================================
  MOTOR BANCO MIR — v10
  Novedades respecto a v9:
  - Numeración correlativa fija por sección (no se mezcla)
  - Badge neutro en pestaña "Todos" + mezcla real inter-secciones
  - Temporizador sticky editable en header (play/pausa/reset)
  - Buscador de texto en tiempo real
  - Modo repaso rápido (muestra RC + explicación directamente)
  - Estadísticas de errores recurrentes entre sesiones
=============================================================
-->
<!DOCTYPE html>
<html lang="es" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title id="page-title">Banco MIR</title>
<style>
:root{
  --bg:#f4f3ef;--surf:#fff;--bd:#e5e5e5;--bd2:#ddd;
  --txt:#1a1a1a;--txt2:#555;--txt3:#999;--txt4:#666;
  --hdr:#1a1a1a;--hdr-t:#fff;
  --ok-bg:#e6f9ef;--ok-t:#0b6e52;--ok-bd:#2da060;
  --ko-bg:#fdecea;--ko-t:#b91c1c;--ko-bd:#d94f45;
  --sc-ok:#dcf5ed;--sc-ko:#fdecea;--sc-rem:#f0f0f0;--sc-rem-t:#666;
  --exp:#fffbe6;--exp-bd:#f0c04a;--exp-t:#5a4500;
  --prog:#e5e5e5;--prog-fill:#1a56db;
  --star:#ccc;--star-on:#f59e0b;
  --hint:#fafafa;--hint-bd:#eee;
  --tab-bd:#ddd;--tab-t:#555;
  --all-bg:#e8f0fe;--all-t:#1a56db;--all-bd:#1a56db;
  --fab:#1a1a1a;--fab-t:#fff;
  --nota-btn-t:#1a56db;--nota-btn-bd:#1a56db;--nota-btn-bg:var(--surf);
  --timer-bg:#222;--timer-t:#fff;--timer-danger:#ef4444;
}
[data-theme="dark"]{
  --bg:#0f0f1a;--surf:#1e1e30;--bd:#2a2a45;--bd2:#333355;
  --txt:#e8e8f0;--txt2:#aaa;--txt3:#555;--txt4:#888;
  --hdr:#0a0a14;--hdr-t:#e8e8f0;
  --ok-bg:#0b3020;--ok-t:#4ade80;--ok-bd:#166534;
  --ko-bg:#2d0a0a;--ko-t:#f87171;--ko-bd:#7f1d1d;
  --sc-ok:#0b3020;--sc-ko:#2d0a0a;--sc-rem:#252540;--sc-rem-t:#aaa;
  --exp:#1a1500;--exp-bd:#a37f10;--exp-t:#d4b84a;
  --prog:#2a2a45;--prog-fill:#60a5fa;
  --star:#444;--star-on:#f59e0b;
  --hint:#1a1a2e;--hint-bd:#2a2a45;
  --tab-bd:#2a2a45;--tab-t:#aaa;
  --all-bg:#1a2a4a;--all-t:#60a5fa;--all-bd:#3b82f6;
  --fab:#2a2a50;--fab-t:#e8e8f0;
  --nota-btn-t:#60a5fa;--nota-btn-bd:#3b82f6;--nota-btn-bg:var(--surf);
  --timer-bg:#1a1a2e;--timer-t:#e8e8f0;
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:var(--bg);color:var(--txt);min-height:100vh;transition:background .25s,color .25s}

/* ── Header ── */
header{background:var(--hdr);color:var(--hdr-t);padding:9px 16px;display:flex;align-items:center;justify-content:space-between;gap:8px;flex-wrap:wrap;position:sticky;top:0;z-index:100}
header h1{font-size:13.5px;font-weight:600;white-space:nowrap}
.hright{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.hmeta{font-size:11px;color:#888}
.hbtn{background:none;border:none;cursor:pointer;font-size:16px;line-height:1;padding:3px 5px;border-radius:5px;transition:background .15s;color:var(--hdr-t)}
.hbtn:hover{background:rgba(255,255,255,.12)}
.sbadge{font-size:11px;padding:3px 9px;border-radius:5px;font-weight:500}
.sbadge.ok{background:#15803d;color:#dcfce7}.sbadge.warn{background:#92400e;color:#fef3c7}

/* ── Temporizador ── */
#timer-wrap{display:flex;align-items:center;gap:4px;background:var(--timer-bg);border-radius:7px;padding:3px 8px;border:1px solid rgba(255,255,255,.1)}
#timer-display{font-size:13px;font-weight:700;font-family:monospace;color:var(--timer-t);min-width:58px;text-align:center;cursor:pointer;border-radius:3px;padding:1px 3px}
#timer-display:hover{background:rgba(255,255,255,.08)}
#timer-display.editing{background:rgba(255,255,255,.15);outline:none;color:var(--timer-t)}
#timer-display.danger{color:var(--timer-danger)}
#timer-wrap button{background:none;border:none;cursor:pointer;color:rgba(255,255,255,.7);font-size:12px;padding:1px 3px;border-radius:3px;line-height:1}
#timer-wrap button:hover{background:rgba(255,255,255,.12);color:#fff}

/* ── Barra de progreso ── */
#prog-wrap{height:3px;background:var(--prog);position:sticky;top:40px;z-index:99}
#prog-bar{height:100%;background:var(--prog-fill);width:0%;transition:width .4s}

/* ── Contenedor ── */
.container{max-width:820px;margin:0 auto;padding:16px 12px}

/* ── Buscador ── */
.search-wrap{position:relative;margin-bottom:13px}
.search-wrap input{width:100%;padding:8px 34px 8px 12px;border:1.5px solid var(--bd2);border-radius:8px;font-size:13px;background:var(--surf);color:var(--txt);outline:none;transition:border-color .15s}
.search-wrap input:focus{border-color:var(--prog-fill)}
.search-clear{position:absolute;right:9px;top:50%;transform:translateY(-50%);background:none;border:none;cursor:pointer;color:var(--txt3);font-size:16px;display:none;line-height:1}
#search-count{font-size:11px;color:var(--txt3);margin-top:4px;display:none}

/* ── Modo repaso ── */
.mode-bar{display:flex;gap:6px;margin-bottom:12px;align-items:center}
.mode-btn{padding:5px 12px;border:1.5px solid var(--bd2);border-radius:7px;cursor:pointer;font-size:12px;font-weight:500;background:var(--surf);color:var(--txt2);transition:all .15s}
.mode-btn:hover{border-color:#999}
.mode-btn.on{background:var(--all-bg);color:var(--all-t);border-color:var(--all-bd)}

/* ── Tabs ── */
.tabs{display:flex;gap:7px;margin-bottom:13px;flex-wrap:wrap}
.tab{padding:7px 14px;border:1.5px solid var(--tab-bd);border-radius:8px;cursor:pointer;font-size:12.5px;font-weight:500;background:var(--surf);color:var(--tab-t);transition:all .15s}
.tab:hover{border-color:#999;color:var(--txt)}
.tab.t-all.on{background:var(--all-bg);color:var(--all-t);border-color:var(--all-bd)}

/* ── Score global ── */
.ph-global{background:var(--surf);border-radius:10px;border:1px solid var(--bd);padding:10px 15px;margin-bottom:10px;display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;border-left:4px solid var(--prog-fill)}
.score-row{display:flex;gap:7px;align-items:center;flex-wrap:wrap}
.sc{font-size:12px;font-weight:600;padding:3px 9px;border-radius:6px}
.sc.ok{background:var(--sc-ok);color:var(--ok-t)}.sc.ko{background:var(--sc-ko);color:var(--ko-t)}.sc.rem{background:var(--sc-rem);color:var(--sc-rem-t)}

/* ── Acciones ── */
.global-actions{display:none;margin-bottom:10px;gap:7px;flex-wrap:wrap;align-items:center}
.container[data-tab="all"] .global-actions{display:flex}
.sec-actions{margin:6px 0 15px;display:flex;gap:7px;flex-wrap:wrap}
.reset-btn{padding:7px 14px;background:var(--fab);color:var(--fab-t);border:none;border-radius:8px;cursor:pointer;font-size:12.5px;font-weight:500;transition:opacity .15s}
.reset-btn:hover{opacity:.82}
.nota-btn{padding:7px 14px;background:var(--nota-btn-bg);color:var(--nota-btn-t);border:1.5px solid var(--nota-btn-bd);border-radius:8px;cursor:pointer;font-size:12.5px;font-weight:500;transition:background .15s}
.nota-btn:hover{background:var(--all-bg)}

/* ── Nota box ── */
.nota-box,.global-nota-box{margin-top:8px;padding:12px 15px;border-radius:10px;border:2px solid var(--bd2);font-size:13px;line-height:1.7;display:none}
.nota-box.pass,.global-nota-box.pass{background:var(--ok-bg);border-color:var(--ok-bd);color:var(--ok-t)}
.nota-box.fail,.global-nota-box.fail{background:var(--ko-bg);border-color:var(--ko-bd);color:var(--ko-t)}
.nota-score{font-size:26px;font-weight:700;display:block;margin-bottom:4px}
.nota-detail{font-size:12px;opacity:.85;font-family:monospace}

/* ── Vista revisión ── */
.review-list{margin-top:12px;border-top:1px solid var(--bd2);padding-top:10px}
.review-title{font-size:12px;font-weight:700;margin-bottom:9px;color:var(--txt)}
.review-sec-label{font-size:11.5px;font-weight:700;color:var(--txt3);margin:8px 0 5px;padding-top:6px;border-top:1px solid var(--bd)}
.review-item{background:var(--surf);border-radius:8px;border:1px solid var(--bd);margin-bottom:7px;overflow:hidden}
.review-item summary{padding:9px 12px;cursor:pointer;font-size:12.5px;color:var(--txt);list-style:none;display:flex;gap:8px;align-items:flex-start}
.review-item summary::-webkit-details-marker{display:none}
.review-item summary::before{content:'▶';font-size:9px;color:var(--txt3);flex-shrink:0;margin-top:4px;transition:transform .18s}
details[open] summary::before{transform:rotate(90deg)}
.review-body{padding:0 12px 11px}
.review-ans{font-size:12px;color:var(--ok-t);margin-bottom:7px;font-weight:500}

/* ── Estadísticas ── */
.stats-box{margin-top:8px;padding:12px 15px;border-radius:10px;border:1.5px solid var(--bd2);background:var(--surf);display:none}
.stats-box.show{display:block}
.stats-title{font-size:12px;font-weight:700;margin-bottom:10px;color:var(--txt)}
.stats-item{display:flex;align-items:center;gap:8px;padding:6px 0;border-bottom:1px solid var(--bd);font-size:12.5px}
.stats-item:last-child{border-bottom:none}
.stats-bar-wrap{flex:1;background:var(--sc-rem);border-radius:4px;height:6px;overflow:hidden}
.stats-bar{height:100%;background:var(--ko-bd);border-radius:4px;transition:width .4s}
.stats-n{font-size:11px;color:var(--txt3);white-space:nowrap}
.stats-q{flex:2;color:var(--txt);font-size:12px;line-height:1.3}

/* ── Panel secciones ── */
.sec-panel{display:none}.sec-panel.visible{display:block}
.ph{background:var(--surf);border-radius:10px;border:1px solid var(--bd);padding:10px 14px;margin-bottom:8px;display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.ph-left{flex:1;display:flex;flex-direction:column;gap:5px}
.ph-label{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;color:var(--txt3);margin-bottom:1px}
.ph-desc{font-size:12px;color:var(--txt4)}
.fbtn{padding:6px 12px;font-size:12px;font-weight:500;border:1.5px solid var(--bd2);border-radius:8px;cursor:pointer;background:var(--surf);color:var(--txt2);transition:all .15s;white-space:nowrap}
.fbtn:hover{border-color:#999;color:var(--txt)}.fbtn.on{background:var(--ko-bg);color:#b91c1c;border-color:#f87171}
.no-failed{display:none;text-align:center;padding:16px;color:var(--txt3);font-size:13px;border:1.5px dashed var(--bd2);border-radius:8px;margin-top:4px}
.no-failed.show{display:block}
.no-results{display:none;text-align:center;padding:20px;color:var(--txt3);font-size:13px;border:1.5px dashed var(--bd2);border-radius:8px;margin:8px 0}

/* ── Hint ── */
.hint{font-size:11px;color:var(--txt3);margin-bottom:15px;padding:7px 11px;background:var(--hint);border-radius:6px;border:1px solid var(--hint-bd)}

/* ── Tarjeta ── */
.qcard{background:var(--surf);border-radius:10px;border:1px solid var(--bd);margin-bottom:7px;overflow:hidden;transition:box-shadow .15s}
.qcard:hover{box-shadow:0 2px 8px rgba(0,0,0,.08)}
.qcard.kb-focus{outline:2px solid var(--prog-fill);outline-offset:-2px}
.qcard.search-hidden{display:none}
.qhead{padding:11px 13px;cursor:pointer;display:flex;align-items:flex-start;gap:9px}

/* ── Badge numérico ── */
.qnum{font-size:11px;font-weight:700;padding:3px 7px;border-radius:5px;white-space:nowrap;flex-shrink:0;margin-top:2px;background:var(--sc-rem);color:var(--sc-rem-t)}
/* En pestaña "Todos" siempre neutro; en sección aplica color de sección */
.qnum.sec-colored{background:var(--sec-dim);color:var(--sec-col)}

.qtxt{font-size:13px;line-height:1.5;flex:1}
.star-btn{background:none;border:none;cursor:pointer;font-size:15px;color:var(--star);padding:0 2px;flex-shrink:0;margin-top:2px;line-height:1;transition:color .15s,transform .15s}
.star-btn:hover{transform:scale(1.2)}
.star-btn .si{display:inline}.star-btn .sf{display:none}
.star-btn.on .si{display:none}.star-btn.on .sf{display:inline;color:var(--star-on)}
.chev{font-size:15px;color:var(--bd2);flex-shrink:0;margin-top:2px;transition:transform .2s}
.qhead.open .chev{transform:rotate(180deg)}
.qbody{display:none;padding:0 13px 13px}.qbody.open{display:block}

/* ── Imagen ── */
.clinimg-wrap{margin:9px 0 7px;background:#111;border-radius:8px;overflow:hidden;border:1px solid var(--bd2);text-align:center}
.clinimg{max-width:100%;max-height:340px;object-fit:contain;display:block;margin:0 auto}
.clinimg-cap{font-size:11px;color:var(--txt3);padding:4px 0 5px;background:var(--hint);border-top:1px solid var(--bd)}

/* ── Opciones ── */
.opts{list-style:none;margin-top:9px;display:flex;flex-direction:column;gap:5px}
.opt{padding:9px 12px;border-radius:8px;border:1.5px solid var(--bd2);cursor:pointer;display:flex;align-items:flex-start;gap:9px;color:var(--txt);font-size:13px;line-height:1.45;transition:border-color .12s,background .12s;user-select:none}
.opt:hover:not(.done){border-color:#999;background:var(--hint)}
.opt.correct{background:var(--ok-bg);border-color:var(--ok-bd);color:var(--ok-t);font-weight:500;cursor:default}
.opt.wrong{background:var(--ko-bg);border-color:var(--ko-bd);color:var(--ko-t);cursor:default}
.opt.done:not(.correct):not(.wrong){cursor:default;opacity:.7}
.onum{font-size:11px;font-weight:700;flex-shrink:0;margin-top:2px;min-width:15px}

/* ── Modo repaso rápido ── */
.quick-card.qz{background:var(--surf);border-color:var(--bd2)}
.qz-hint{font-size:12.5px;color:var(--txt3);margin-bottom:8px}
.qz-btn,.qz-rate button{font:inherit;font-size:13px;font-weight:600;padding:8px 14px;border-radius:8px;cursor:pointer;border:1.5px solid var(--bd2);background:var(--surf);color:var(--txt)}
.qz-ans .quick-rc{margin-top:2px}
.qz-rate{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap}
.qz-rate .qz-ok{border-color:#16a34a;color:#16a34a}.qz-rate .qz-ko{border-color:#dc2626;color:#dc2626}
.qz-done{font-size:12.5px;font-weight:600}.qz-done.ok{color:#16a34a}.qz-done.ko{color:#dc2626}
.quick-card{padding:9px 12px;border-radius:8px;border:1.5px solid var(--ok-bd);background:var(--ok-bg);margin-top:8px}
.quick-rc{font-size:12.5px;font-weight:600;color:var(--ok-t);margin-bottom:6px}

/* ── Explicación ── */
.expbox{margin-top:10px;padding:10px 12px;background:var(--exp);border-left:4px solid var(--exp-bd);border-radius:0 8px 8px 0;font-size:12.5px;color:var(--exp-t);line-height:1.65}
.expbox b,.expbox strong{font-weight:600}
.et{display:block;margin-bottom:4px;font-weight:600;font-size:13px}
.atag{font-size:10px;padding:2px 6px;border-radius:4px;margin-left:5px;vertical-align:middle}
.atag.ok{background:var(--sc-ok);color:var(--ok-t)}.atag.ko{background:var(--sc-ko);color:#c0392b}

/* ── All-tab CSS ── */
.container[data-tab="all"] .ph{display:none!important}
.container[data-tab="all"] .sec-actions{display:none!important}
.container[data-tab="all"] .no-failed{display:none!important}
.container[data-tab="all"] .nota-box{display:none!important}
.container:not([data-tab="all"]) .global-nota-box{display:none!important}
.container:not([data-tab="all"]) #stats-global{display:none!important}
</style>
</head>
<body>
<header>
  <h1 id="h-tit">Banco MIR</h1>
  <div class="hright">
    <span class="hmeta" id="h-meta"></span>
    <!-- Temporizador -->
    <div id="timer-wrap" title="Haz clic en el tiempo para editar">
      <span id="timer-display">0:00:00</span>
      <button id="btn-tplay" onclick="timerToggle()" title="Play/Pausa">▶</button>
      <button onclick="timerReset()" title="Reset">↺</button>
    </div>
    <button class="hbtn" id="btn-dark" onclick="toggleDark()" title="Modo oscuro">🌙</button>
    <span id="save-badge" class="sbadge"></span>
  </div>
</header>
<div id="prog-wrap"><div id="prog-bar"></div></div>

<div class="container" id="main-cont" data-tab="all">
  <!-- Buscador -->
  <div class="search-wrap">
    <input type="text" id="search-input" placeholder="🔍 Buscar en enunciados..." oninput="onSearch(this.value)">
    <button class="search-clear" id="search-clear" onclick="clearSearch()">✕</button>
  </div>
  <div id="search-count"></div>

  <!-- Modo -->
  <div class="mode-bar">
    <span style="font-size:11.5px;color:var(--txt3);font-weight:600">MODO:</span>
    <button class="mode-btn on" id="mode-test" onclick="setMode('test')">📝 Test</button>
    <button class="mode-btn" id="mode-quick" onclick="setMode('quick')" title="Ves la pregunta, piensas la respuesta y la destapas">🧠 Repaso rápido</button>
    <button class="mode-btn" id="btn-stars" onclick="filterStarred()" style="margin-left:auto;border-color:#f59e0b;color:#b45309">⭐ Marcadas</button>
    <button class="mode-btn" id="btn-stats" onclick="toggleStats()">📊 Errores</button>
  </div>

  <!-- Stats globales -->
  <div class="stats-box" id="stats-global"></div>

  <!-- Tabs -->
  <div class="tabs" id="tabs-wrap"></div>

  <!-- Score global -->
  <div class="ph-global">
    <div class="ph-left">
      <span class="ph-desc" id="ph-gdesc"></span>
      <div class="score-row">
        <span class="sc ok" id="sc-ok-all">✓ 0</span>
        <span class="sc ko" id="sc-ko-all">✗ 0</span>
        <span class="sc rem" id="sc-rem-all">○ 0</span>
      </div>
    </div>
  </div>
  <div class="global-actions">
    <button class="reset-btn" onclick="resetAll()">↺ Reiniciar y mezclar</button>
    <button class="nota-btn" onclick="calcNotaAll()">✎ Calcular nota global</button>
  </div>
  <div class="global-nota-box" id="nota-all"></div>
  <p class="hint">💡 <b>1–5</b> responde · <b>↑↓</b> navega · <b>S</b> marca ⭐ · en Repaso rápido: <b>espacio</b> destapa, <b>1</b> la sabía, <b>2</b> no · Progreso guardado automáticamente</p>

  <div id="panels-wrap"></div>
</div>

<script>
/* ═══════════════════════════════════════ MOTOR v10 ═══════════════════════════════════════ */

var KEY=/*__KEY__*/'trauma_casos_clinicos_v1';
var META=/*__META_JSON__*/{"titulo": "Traumatología · Casos clínicos", "subtitulo": "50 casos de los temas del parcial · Patología del Aparato Locomotor", "examen": "Casos clínicos · 4 opciones, cada fallo resta 1/3", "secciones": {"t01": {"label": "T1 Semiología y generalidades", "emoji": "🩺", "color": "#4f8cff", "colorDim": "#4f8cff22", "desc": "8 casos clínicos"}, "t02": {"label": "T2/T5 Músculo, tendones, bursas y nervios", "emoji": "💪", "color": "#a78bfa", "colorDim": "#a78bfa22", "desc": "10 casos clínicos"}, "t04": {"label": "T4 Hueso y articulación", "emoji": "🦴", "color": "#2dd4bf", "colorDim": "#2dd4bf22", "desc": "6 casos clínicos"}, "t09f": {"label": "T9-10 Fracturas", "emoji": "🩻", "color": "#FF7044", "colorDim": "#FF704422", "desc": "10 casos clínicos"}, "t09h": {"label": "T9 Hombro", "emoji": "🫱", "color": "#f59e0b", "colorDim": "#f59e0b22", "desc": "8 casos clínicos"}, "t11": {"label": "T11 Fracturas en niños", "emoji": "🧒", "color": "#ec4899", "colorDim": "#ec489922", "desc": "8 casos clínicos"}}};
var D=/*__D_JSON__*/{"t01": [{"n": "1", "noShuffle": false, "img": null, "q": "Varón de 42 años con dolor lumbar de tipo eléctrico que desciende desde la nalga por la cara posterior del muslo y de la pierna hasta el pie, con parestesias en ese trayecto; empeora al toser y la maniobra de Lasègue es positiva. ¿Qué patrón de dolor presenta?", "o": ["Dolor mecánico por sobrecarga", "Dolor irradiado de tipo radicular", "Dolor referido de origen visceral", "Dolor inflamatorio de predominio nocturno"], "c": 2, "e": "Sigue un <b>trayecto nervioso (dermatoma)</b>, con parestesias y empeoramiento con la tos y el Lasègue: es <b>dolor irradiado radicular</b>, típico de la hernia discal L4-L5 o L5-S1. El referido no sigue trayecto nervioso; el mecánico mejora con el reposo y el inflamatorio despierta de madrugada."}, {"n": "2", "noShuffle": false, "img": null, "q": "Varón de 17 años con dolor continuo en la pierna, de predominio nocturno, que cede de forma llamativa con ácido acetilsalicílico. ¿Qué diagnóstico sugiere este patrón?", "o": ["Fractura de estrés", "Osteoma osteoide", "Tendinopatía", "Artrosis precoz"], "c": 2, "e": "El <b>osteoma osteoide</b> produce dolor continuo de predominio nocturno que <b>cede llamativamente con AAS y otros AINE</b>. La fractura de estrés y la tendinopatía dan dolor mecánico, que aparece con la carga y mejora con el reposo; la artrosis tampoco despierta al paciente por la noche."}, {"n": "3", "noShuffle": false, "img": null, "q": "Mujer de 52 años con dolor de hombro derecho; al abducir activamente el brazo, el dolor aparece entre los 60° y los 120° y desaparece al superar ese arco. ¿Qué sugiere este hallazgo?", "o": ["Capsulitis adhesiva", "Conflicto subacromial", "Inestabilidad glenohumeral", "Artrosis glenohumeral"], "c": 2, "e": "El <b>arco doloroso entre 60° y 120° de abducción</b> sugiere <b>conflicto subacromial</b>. La capsulitis y la artrosis se expresan como limitación de la movilidad activa y pasiva (problema articular o capsular); la inestabilidad, como sensación de que la articulación «se va»."}, {"n": "4", "noShuffle": false, "img": null, "q": "Mujer de 48 años con parestesias nocturnas en la mano; presenta hipoestesia palmar de los tres primeros dedos y de la mitad radial del cuarto, y signo de Tinel positivo en la muñeca. ¿Qué estructura está afectada?", "o": ["Raíz nerviosa C6", "Nervio mediano", "Nervio radial", "Nervio cubital"], "c": 2, "e": "La hipoestesia de los <b>tres primeros dedos y la mitad radial del cuarto en la cara palmar</b> corresponde al <b>nervio mediano</b>; el Tinel en la muñeca apoya un túnel carpiano. El cubital da el quinto dedo y la mitad cubital del cuarto; el radial, el primer espacio dorsal; C6, pulgar, índice y antebrazo lateral."}, {"n": "5", "noShuffle": false, "img": null, "q": "Mujer de 24 años, corredora de fondo, con dolor en el pie que aparece de forma reproducible al correr y desaparece al cesar la actividad; la radiografía simple es normal. ¿Qué prueba permite diagnosticar esta lesión no visible en la radiografía?", "o": ["Densitometría ósea (DXA)", "Gammagrafía ósea con 99mTc", "Ecografía de partes blandas", "PET-TC con 18F-FDG"], "c": 2, "e": "Es el dolor mecánico típico de la <b>fractura de estrés</b>. La <b>gammagrafía ósea</b> diagnostica fracturas por estrés no detectables en la radiografía simple. La DXA mide densidad mineral (osteoporosis), la ecografía no atraviesa el hueso y la PET se usa en tumores e infección oculta."}, {"n": "6", "noShuffle": false, "img": null, "q": "Mujer de 66 años con dolores óseos y anemia; las radiografías muestran múltiples lesiones líticas en cráneo y columna. ¿Qué estudio de laboratorio está indicado específicamente ante este hallazgo?", "o": ["Factor reumatoide y anticuerpos anti-CCP", "Proteinograma e inmunoelectroforesis", "Marcadores de remodelado óseo (CTX, P1NP)", "Procalcitonina sérica"], "c": 2, "e": "Ante <b>lesiones líticas múltiples</b> debe descartarse un <b>mieloma múltiple</b> con proteinograma e inmunoelectroforesis. FR y anti-CCP orientan a artritis reumatoide; CTX y P1NP sirven para seguir el tratamiento antiosteoporótico; la procalcitonina apunta a infección bacteriana sistémica."}, {"n": "7", "noShuffle": false, "img": null, "q": "Varón de 45 años, activo, con artrosis del compartimento interno de la rodilla y deformidad en varo; se desea posponer la prótesis. ¿Qué técnica quirúrgica está indicada?", "o": ["Osteotomía valguizante de tibia", "Artrodesis de rodilla", "Sinovectomía artroscópica", "Artrolisis con movilización bajo anestesia"], "c": 1, "e": "La <b>osteotomía valguizante de tibia</b> desplaza el eje de carga hacia el compartimento externo en la rodilla vara y artrósica y puede <b>posponer años la prótesis</b> en el joven. La artrodesis suprime el movimiento; la sinovectomía trata sinovitis crónicas; la artrolisis libera adherencias capsulares."}, {"n": "8", "noShuffle": false, "img": null, "q": "Varón de 63 años con flexión progresiva del cuarto y quinto dedos de la mano por retracción de la fascia palmar (enfermedad de Dupuytren). ¿Cuál es el tratamiento quirúrgico clásico?", "o": ["Tenorrafia", "Fasciectomía", "Tenolisis de flexores", "Fasciotomía descompresiva"], "c": 2, "e": "La <b>fasciectomía</b> (extirpación de la fascia) es el tratamiento clásico del <b>Dupuytren</b>, en el que la fascia palmar retraída flexiona los dedos. La fasciotomía descompresiva se indica en el síndrome compartimental; la tenolisis libera tendones adheridos y la tenorrafia sutura un tendón seccionado."}], "t02": [{"n": "1", "noShuffle": false, "img": null, "q": "Varón de 35 años que se corta con un cristal en el muslo: herida inciso-contusa contaminada con sección parcial del cuádriceps. ¿Cuál es el tratamiento adecuado?", "o": ["Vendaje compresivo, hielo y movilización precoz", "Reposo deportivo y AINE durante tres meses", "ATB, desbridamiento, limpieza quirúrgica y sutura", "Evacuación ecoguiada del hematoma y observación clínica"], "c": 3, "e": "En las <b>laceraciones y heridas musculares</b> se hace <b>prevención de la infección (ATB), desbridamiento, limpieza quirúrgica y sutura</b>. Hielo, compresión y movilización son medidas generales del hematoma y no tratan una herida contaminada; la evacuación ecoguiada del hematoma no es de rutina y no resuelve una herida contaminada."}, {"n": "2", "noShuffle": false, "img": null, "q": "Mujer de 28 años que, 36 horas después de bajar escaleras corriendo de forma intensa, refiere dolor muscular difuso en ambos cuádriceps, sin traumatismo. ¿Qué cabe esperar?", "o": ["Ecografía sin hallazgos y resolución en 5-7 días", "Hematoma interfibrilar ecográfico y curación en 3 semanas", "Desgarro fibrilar en RM y baja de 3 meses", "CPK > 10.000 UI/L con riesgo de fallo renal"], "c": 1, "e": "Son <b>agujetas (dolorimiento muscular diferido)</b>: lesión funcional que aparece a las 24-48 h, <b>desaparece en 5-7 días</b> y generalmente no es objetivable en pruebas complementarias. El hematoma es de la contusión, el desgarro da signo de la pedrada y la CPK > 10.000 es del aplastamiento."}, {"n": "3", "noShuffle": false, "img": null, "q": "Varón de 30 años en coma en la UCI tras un traumatismo craneoencefálico grave que, semanas después, desarrolla osificaciones en varios grupos musculares sin contusión local. ¿Qué subtipo de miositis osificante presenta?", "o": ["Circunscrita, por organización de un hematoma", "Progresiva, de origen hereditario", "Secundaria a fisioterapia intempestiva", "Generalizada, ligada a trastorno neurológico"], "c": 4, "e": "La forma <b>generalizada</b> se relaciona con un <b>trastorno neurológico (TCE, coma)</b>. La circunscrita aparece tras un traumatismo local por organización del hematoma; la progresiva es hereditaria, afecta sobre todo a MMSS y espalda y es mortal; la fisioterapia intempestiva es un factor etiológico, no un subtipo."}, {"n": "4", "noShuffle": false, "img": null, "q": "Varón de 24 años con una masa dura, irregular y no dolorosa en el muslo que limita la flexión de la rodilla, un año después de una contusión del cuádriceps. La TC muestra una lesión madura y bien delimitada. ¿Actitud?", "o": ["Indometacina y radioterapia a dosis bajas", "Extirpación quirúrgica de la lesión", "Masajes y fisioterapia intensiva", "Inmovilización y ejercicios isométricos"], "c": 2, "e": "Una vez <b>establecida (lesión «fría»)</b>, la miositis osificante se trata con <b>extirpación quirúrgica</b>; en fases precoces está contraindicada por riesgo de recidiva. Indometacina y radioterapia son preventivas; inmovilización e isométricos suaves, para la fase de formación; la fisioterapia intempestiva la favorece."}, {"n": "5", "noShuffle": false, "img": null, "q": "Varón de 50 años rescatado tras pasar 8 horas con las piernas atrapadas bajo escombros. Presenta CPK > 10.000 UI/L, mioglobinuria e hiperpotasemia. Además de eliminar la compresión, ¿qué medida es prioritaria?", "o": ["Restricción hídrica para limitar el edema muscular", "Hidratación precoz para mantener la diuresis", "Amputación primaria de ambas extremidades", "Yeso cerrado y elevación de los miembros"], "c": 2, "e": "En el <b>síndrome de aplastamiento</b> se elimina la compresión y se inicia <b>hidratación precoz para mantener la diuresis</b> (más bicarbonato, manitol y diálisis si precisa) por el riesgo de insuficiencia renal. La restricción hídrica la agrava; los yesos cerrados disminuyen el volumen compartimental."}, {"n": "6", "noShuffle": false, "img": null, "q": "Corredor de 23 años con dolor y parestesias en el compartimento anterolateral de ambas piernas al correr, que ceden al parar. La prueba de esfuerzo muestra PIC > 30 mmHg durante el ejercicio y no mejora pese a modificar la actividad. ¿Tratamiento?", "o": ["Inmovilización con yeso durante 6 semanas", "Infiltración de corticoide intracompartimental", "Indometacina y radioterapia a dosis bajas", "Fasciotomía subcutánea de los compartimentos"], "c": 4, "e": "Es un <b>síndrome compartimental crónico</b> (bilateral, anterolateral, PIC > 30 mmHg en esfuerzo). Se trata modificando la actividad y, si no basta, con <b>fasciotomía subcutánea o fasciectomía</b>. Indometacina y radioterapia previenen la miositis osificante; yeso e infiltraciones no figuran en su tratamiento."}, {"n": "7", "noShuffle": false, "img": null, "q": "Varón de 62 años que, semanas después de tomar levofloxacino por una neumonía, nota un nódulo palpable y doloroso en el tendón de Aquiles. ¿Qué sospecha?", "o": ["Tendinopatía crónica favorecida por el fármaco", "Tenosinovitis infecciosa por inoculación directa", "Bursitis aquílea de origen microcristalino", "Miositis osificante del tríceps sural"], "c": 1, "e": "Las <b>fluoroquinolonas</b> y los microtraumatismos repetidos causan <b>tendinopatía crónica (tendinosis)</b>: colágeno desorganizado, nódulo palpable con o sin dolor y riesgo de rotura, típica del Aquiles. La tenosinovitis infecciosa afecta a vainas flexoras de la mano; la miositis osificante sigue a contusiones."}, {"n": "8", "noShuffle": false, "img": null, "q": "Ganadero de 55 años con antecedente de herida en la mano manejando reses, que presenta tumefacción de la vaina flexora en la muñeca «en reloj de arena» y parestesias en territorio del mediano. Microbiología y anatomía patológica confirman tuberculosis. ¿Tratamiento?", "o": ["Infiltración local de corticoide", "Apertura quirúrgica de la polea A1", "Tuberculostáticos y sinovectomía", "AINE y férula de inmovilización"], "c": 3, "e": "Es una <b>tenosinovitis crónica tuberculosa</b> por inoculación directa (bacilo bovino), con tumefacción en reloj de arena y compresión del mediano en el túnel carpiano. Se trata con <b>tuberculostáticos y sinovectomía</b>. La infiltración y la apertura de la polea A1 corresponden al dedo en resorte."}, {"n": "9", "noShuffle": false, "img": null, "q": "Mujer de 32 años con una tumoración quística indolora en el dorso de la muñeca que cambia de tamaño; la ecografía confirma un ganglión y no le limita. ¿Actitud inicial más adecuada?", "o": ["Extirpación quirúrgica preferente", "Antibioterapia y drenaje urgente", "Infiltración de corticoide y férula rígida", "Observación: puede desaparecer sola"], "c": 4, "e": "El <b>ganglión</b> (degeneración mucoide) es muy frecuente en dorso de mano y muñeca y de <b>muy poca trascendencia</b>; varía de tamaño y <b>puede desaparecer espontáneamente</b>, por lo que cabe observar. Punción o extirpación quedan como opciones; antibioterapia y drenaje son de la bursitis infecciosa."}, {"n": "10", "noShuffle": false, "img": null, "q": "Varón de 30 años con lesión del plexo braquial por accidente de moto hace 2 años, sin recuperación de la flexión del codo pese a la rehabilitación; el EMG no muestra signos de reinervación y hay atrofia muscular establecida. ¿Qué opción de reconstrucción está indicada?", "o": ["Neurorrafia directa del musculocutáneo", "Injerto de nervio sural al tronco superior", "Transposición muscular del dorsal ancho", "Neurotización con nervios intercostales"], "c": 3, "e": "Con <b>más de 1 año</b> de evolución se recurre a la <b>reconstrucción</b>: transposición del <b>dorsal ancho para la flexión del codo</b> (trapecio para la abducción) o gracilis neurotizado. La neurorrafia y los injertos son para la lesión inmediata, y las neurotizaciones, para antes de un año."}], "t04": [{"n": "1", "noShuffle": false, "img": null, "q": "Mujer de 22 años que se ha luxado el hombro en repetidas ocasiones, sin traumatismo, simplemente al realizar determinados movimientos. Según el tiempo de evolución, esta luxación se clasifica como:", "o": ["Aguda", "Recidivante", "Habitual", "Inveterada"], "c": 3, "e": "La luxación <b>habitual</b> se reproduce con <b>determinados movimientos</b>, sin traumatismo. La recidivante reaparece con mínimos traumatismos y la inveterada lleva más de tres semanas sin reducir."}, {"n": "2", "noShuffle": false, "img": null, "q": "Varón de 35 años, con alta demanda funcional, diagnosticado de una luxación de codo no reducida de 5 semanas de evolución. ¿Cuál es la actitud indicada?", "o": ["Abstención terapéutica y analgesia", "Intentar la reducción cerrada o abierta", "Rehabilitación activa sin intentar reducir", "Ortesis funcional estabilizadora"], "c": 2, "e": "Más de tres semanas sin reducir define la luxación <b>inveterada</b>. <b>Hasta 1-2 meses</b> debe intentarse la reducción cerrada o abierta; pasados 2 meses se individualiza, y la abstención solo se plantea si la demanda funcional es baja."}, {"n": "3", "noShuffle": false, "img": null, "q": "Mujer de 84 años con luxación aguda de hombro que se reduce bajo anestesia mediante tracción-contratracción. Respecto a la actitud posterior, lo más adecuado es:", "o": ["Inmovilización estricta durante seis semanas", "Movilización precoz por tendencia a la rigidez", "Inmovilizar 3-4 semanas, como en el adulto joven", "Cirugía de refuerzo capsular inmediata"], "c": 2, "e": "Tras reducir una luxación aguda se inmoviliza 3-4 semanas, pero en <b>ancianos</b> se prefiere la <b>movilización precoz</b> porque tienden a la rigidez articular. La cirugía de refuerzo se reserva para las luxaciones recidivantes."}, {"n": "4", "noShuffle": false, "img": null, "q": "Mujer de 45 años con rodilla tumefacta. Artrocentesis: líquido turbio y amarillo, viscosidad baja, pH < 7, 15.000 leucocitos/µl con 60 % de PMN y glucosa normal. ¿Qué tipo de líquido es?", "o": ["Normal, sin patología articular", "Mecánico, por traumatismo", "Inflamatorio, como en la artritis reumatoide", "Séptico, por artritis infecciosa bacteriana aguda"], "c": 3, "e": "Turbio, <b>viscosidad baja</b>, <b>2.000-50.000 leucocitos</b> con PMN >50 % y glucosa normal o baja definen el líquido <b>inflamatorio</b> (AR, gota, pseudogota). El séptico es purulento, con >50.000 leucocitos, >75 % PMN y glucosa muy baja; el mecánico es claro, viscoso y <2.000 leucocitos."}, {"n": "5", "noShuffle": false, "img": null, "q": "Varón de 28 años con esguince de tobillo: dolor y tumefacción moderados, sin inestabilidad articular; la radiografía descarta fractura. ¿Cuál es el tratamiento indicado?", "o": ["Reparación ligamentaria quirúrgica", "Medidas RICE y analgesia", "Plastia ligamentosa de sustitución", "Reducción con anestesia"], "c": 2, "e": "Es un <b>esguince leve</b> (síntomas inflamatorios moderados y <b>sin inestabilidad</b>): RICE y analgesia, con 3-4 semanas de inmovilización solo si la inflamación es importante. La cirugía se reserva para esguinces severos seleccionados y para la inestabilidad crónica; la reducción es propia de las luxaciones."}, {"n": "6", "noShuffle": false, "img": null, "q": "Mujer de 30 años, jugadora de baloncesto, con episodios repetidos de fallo del tobillo tras varios esguinces antiguos. ¿Qué tratamiento debe valorarse?", "o": ["Reparación ligamentaria o plastia", "Inmovilización con yeso durante 3-4 semanas", "Reducción cerrada bajo anestesia", "Abstención terapéutica y reposo deportivo"], "c": 1, "e": "En las <b>inestabilidades articulares crónicas</b> se valora la <b>reparación ligamentaria o la plastia de sustitución</b>, junto con rehabilitación activa y ortesis funcionales. La inmovilización de 3-4 semanas corresponde al esguince agudo; la reducción bajo anestesia, a la luxación."}], "t09f": [{"n": "1", "noShuffle": false, "img": null, "q": "Niño de 6 años que cae sobre el codo. A las 48 horas presenta una equimosis lineal que recorre todo el pliegue de flexión del codo. ¿Qué fractura sugiere este signo?", "o": ["Fractura de la cabeza del radio", "Fractura supracondílea de húmero", "Fractura del cuello quirúrgico humeral", "Fractura de olécranon"], "c": 2, "e": "El <b>signo de Kirmisson</b> (equimosis lineal en el pliegue de flexión del codo) aparece en las fracturas supracondíleas. La equimosis en herradura axilar (Hennequin) orienta a fractura del cuello de húmero; para cabeza de radio u olécranon no se describe este signo."}, {"n": "2", "noShuffle": false, "img": null, "q": "Mujer de 78 años con osteoporosis que, al levantarse de una silla, nota un dolor brusco en la cadera y no puede apoyar; se confirma una fractura. Según su causa, se clasifica como fractura:", "o": ["Traumática por caída de baja energía", "Por fatiga o estrés", "Por insuficiencia o patológica", "Por mecanismo de tracción"], "c": 3, "e": "Las fracturas <b>por insuficiencia o patológicas</b> se producen durante una actividad normal sobre un hueso enfermo (osteoporosis, tumores). Las traumáticas requieren un traumatismo superior al que soporta el hueso sano y las de fatiga aparecen en hueso normal sometido a esfuerzos repetidos."}, {"n": "3", "noShuffle": false, "img": null, "q": "Varón de 40 años con fractura abierta de antebrazo tras caer de una escalera: herida de 5 cm, contaminación moderada, algún daño muscular y conminución moderada. Según Gustilo y Anderson, es de tipo:", "o": ["I", "II", "IIIA", "IIIB"], "c": 2, "e": "Herida de <b>1-10 cm</b>, contaminación moderada y daño muscular moderado definen el <b>tipo II</b>. El tipo I tiene herida menor de 1 cm y limpia; los IIIA y IIIB exigen herida mayor de 10 cm con contaminación severa."}, {"n": "4", "noShuffle": false, "img": null, "q": "Varón de 50 años con fractura cerrada de tibia por atropello. La piel está íntegra, pero hay abrasión profunda contaminada, ampollas y edema que hace temer un síndrome compartimental. Según Tscherne y Oestern, corresponde al:", "o": ["Grado 0", "Grado 1", "Grado 2", "Grado 3"], "c": 3, "e": "El <b>grado 2</b> de Tscherne incluye abrasión profunda contaminada, ampollas y edema próximo al síndrome compartimental. El grado 1 es una contusión desde dentro o abrasión superficial; el grado 3 ya implica necrosis, despegamiento, lesión vascular o síndrome compartimental establecido."}, {"n": "5", "noShuffle": false, "img": null, "q": "Agricultor de 45 años con fractura abierta de pierna: herida de 12 cm, gran lesión de partes blandas y contaminación con tierra (tipo III de Gustilo). Además de la profilaxis antitetánica, ¿qué pauta antibiótica está indicada?", "o": ["Cefalosporina de 1.ª generación en monoterapia", "Cefalosporina, gentamicina y penicilina G", "Cefalosporina y gentamicina, sin penicilina", "Doxiciclina y ceftazidima"], "c": 2, "e": "En las abiertas <b>tipo III</b> se asocian cefalosporina y aminoglucósido (gentamicina), y se <b>añade penicilina G</b> si la herida está muy contaminada, sobre todo con tierra. La cefalosporina sola es para los tipos I-II; doxiciclina y ceftazidima, para heridas en agua salada."}, {"n": "6", "noShuffle": false, "img": null, "q": "Varón de 30 años con fractura abierta de tibia tipo II que llega al hospital 12 horas después del accidente sin haber recibido antibiótico. ¿Qué se debe hacer con la herida?", "o": ["Cierre primario directo", "Desbridar y dejarla abierta", "Cobertura con colgajo libre inmediato", "Cierre primario, el plazo es de 12-16 h"], "c": 2, "e": "El Friedrich debe hacerse antes de 6-8 horas y el cierre primario solo es posible si no han pasado <b>más de 6-8 h sin cobertura antibiótica</b>. Superado ese plazo, se <b>desbrida y se deja abierta</b>; la cobertura definitiva se intenta antes de 5 días si no hay infección."}, {"n": "7", "noShuffle": false, "img": null, "q": "Varón de 35 años con fractura diafisaria de tibia abierta con conminución segmentaria: múltiples fragmentos pequeños que no se pueden reconstruir uno a uno. ¿Qué tipo de estabilización está indicada?", "o": ["Placa de compresión estática", "Fijación en puente con fijador externo", "Ferulización intramedular no cerrojada", "Tornillos de tracción interfragmentaria"], "c": 2, "e": "Cuando no se pueden reducir los fragmentos se usa la <b>fijación en puente</b>, que alinea los extremos sin actuar sobre el foco; se prefieren los <b>fijadores externos en las abiertas</b> y los internos en las cerradas. Placas y tornillos de compresión exigen reducir los fragmentos."}, {"n": "8", "noShuffle": false, "img": null, "q": "Motorista de 28 años con fractura abierta tipo IIIA de tibia con defecto óseo, estabilizada con fijador externo. La herida ha curado sin signos de infección. ¿Cuándo está indicado el aporte de hueso esponjoso?", "o": ["En el mismo cierre primario", "A las 4-6 semanas de la cura", "A los 6 meses si no hay callo", "Solo si aparece pseudoartrosis"], "c": 2, "e": "En las fracturas <b>tipo III</b> el injerto de esponjosa se aporta a las <b>4-6 semanas</b> tras la cura de la herida sin infección (o a los 3 meses si no hay callo). El aporte en el cierre primario se reserva para los tipos I y II."}, {"n": "9", "noShuffle": false, "img": null, "q": "Varón de 45 años intervenido de una fractura abierta de tibia hace 10 meses. La fractura no ha consolidado y presenta fístula con secreción fétida, rubor, leucocitosis y elevación de VSG y PCR. ¿Cuál es el tratamiento?", "o": ["Injerto óseo aislado sin desbridamiento previo", "Desbridamiento radical y estabilización", "Antibiótico oral y yeso cerrado", "Retirar material y carga precoz"], "c": 2, "e": "Es una <b>pseudoartrosis infectada</b>, típica de fracturas abiertas u operadas y de mal pronóstico. Se trata con <b>desbridamiento radical y estabilización</b>, que reduce el riesgo de sepsis y permite consolidar y cubrir la herida. Injertar sin desbridar o inmovilizar con yeso no controla la infección."}, {"n": "10", "noShuffle": false, "img": null, "q": "Varón de 25 años con una fractura de codo tratada hace 6 semanas que va perdiendo movilidad. La radiografía muestra osificación en las partes blandas periarticulares. ¿Qué complicación local presenta?", "o": ["Necrosis avascular", "Miositis osificante", "Artrosis postraumática", "Osteomielitis crónica"], "c": 2, "e": "La <b>osificación periarticular postraumática</b> o <b>miositis osificante</b> es una complicación local de las fracturas. La necrosis avascular y la artrosis afectan al hueso o al cartílago articular, no a las partes blandas, y la osteomielitis cursaría con signos de infección."}], "t09h": [{"n": "1", "noShuffle": false, "img": null, "q": "Varón de 50 años con dolor anterior de hombro y «chasquido»; la RM muestra subluxación anteromedial de la porción larga del bíceps en la corredera y rotura del subescapular. No mejora con tratamiento conservador. ¿Qué cirugía está indicada?", "o": ["Remplissage del defecto de Hill-Sachs asociado", "Tenodesis del bíceps y reparación del subescapular", "Reinserción del labrum y plicatura capsular anterior", "Forage de la cabeza humeral"], "c": 2, "e": "La <b>luxación de la PLB</b> se asocia a <b>lesión del subescapular</b>. Si fracasa lo conservador: cirugía artroscópica con <b>tenotomía o tenodesis</b> y <b>reparación del subescapular</b>. La reinserción del labrum y el remplissage son técnicas de la luxación recidivante; el forage, de la osteonecrosis."}, {"n": "2", "noShuffle": false, "img": null, "q": "Mujer de 45 años con omalgia lateral nocturna de meses de evolución; la ecografía muestra una calcificación en el supraespinoso. Persiste el dolor pese a fisioterapia y AINE. ¿Qué opción puede ofrecerse a continuación?", "o": ["Movilización bajo anestesia", "Distensión hidráulica capsular", "Sinovectomía isotópica", "Barbotaje o lavado ecoguiado"], "c": 4, "e": "En la <b>tendinitis calcificante</b> el tratamiento conservador incluye fisioterapia, AINE, infiltraciones, ondas de choque y <b>barbotaje (lavado ecoguiado)</b>; la cirugía es la limpieza artroscópica. La movilización bajo anestesia y la distensión hidráulica son del hombro congelado; la sinovectomía con radioisótopos, de la AR."}, {"n": "3", "noShuffle": false, "img": null, "q": "Mujer de 52 años, diabética, con capsulitis adhesiva de 10 meses y rigidez de todos los arcos activos y pasivos que no ha mejorado con fisioterapia, analgesia ni infiltraciones intraarticulares. ¿Qué opción está indicada?", "o": ["Acromioplastia y bursectomía subacromial", "Prótesis invertida de hombro", "Artrolisis artroscópica capsular", "Tenodesis de la porción larga"], "c": 3, "e": "Si fracasa el tratamiento conservador de la <b>capsulitis adhesiva</b>, se indica <b>movilización forzada bajo anestesia, distensión hidráulica, artrolisis artroscópica</b> o liberación abierta. La acromioplastia es del síndrome subacromial; la prótesis invertida, de la artropatía del manguito; la tenodesis, de la porción larga del bíceps."}, {"n": "4", "noShuffle": false, "img": null, "q": "Varón de 68 años con dolor mecánico de hombro, rigidez matutina y pérdida de rotación externa. La Rx muestra pinzamiento, osteofitos inferiores en la cabeza humeral, esclerosis subcondral y subluxación posterior; el manguito está íntegro. Fracasa el tratamiento conservador. ¿Opción quirúrgica?", "o": ["Artroplastia total de hombro", "Reparación del manguito en doble hilera", "Técnica de Latarjet", "Tenotomía de la porción larga"], "c": 1, "e": "Es una <b>artrosis glenohumeral</b> (osteofitos inferiores, esclerosis, subluxación posterior, manguito conservado). Si fracasa lo conservador: desbridamiento, hemiartroplastia o <b>artroplastia total de hombro</b>. No hay rotura que reparar; Latarjet trata la inestabilidad y la tenotomía, lesiones de la porción larga del bíceps."}, {"n": "5", "noShuffle": false, "img": null, "q": "Varón de 52 años operado hace un año de una fractura-luxación de húmero proximal, con dolor progresivo y crepitación. La Rx muestra aplanamiento y colapso de la cabeza humeral, sin cambios degenerativos en la glena. ¿Estadio de Cruess de su osteonecrosis?", "o": ["Estadio II: esclerosis", "Estadio III: fractura subcondral", "Estadio IV: colapso de la cabeza", "Estadio V: afectación de la glena"], "c": 3, "e": "La <b>fractura-luxación de húmero proximal</b> causa osteonecrosis postraumática. En Cruess, el <b>estadio IV es aplanamiento y colapso</b> de la cabeza humeral; el II, esclerosis; el III, fractura subcondral (signo de la media luna); el V, cambios degenerativos que se extienden a la glena."}, {"n": "6", "noShuffle": false, "img": null, "q": "Mujer de 78 años con dolor e inflamación del hombro. En la artrocentesis se observan cristales con birrefringencia débilmente positiva. ¿Diagnóstico?", "o": ["Gota por cristales de urato sódico", "Hombro de Milwaukee (hidroxiapatita)", "Artritis séptica glenohumeral", "Pseudogota por pirofosfato cálcico"], "c": 4, "e": "Los cristales de <b>pirofosfato cálcico</b> muestran <b>birrefringencia débil positiva</b> (pseudogota). La gota da cristales de urato en aguja con birrefringencia negativa; el hombro de Milwaukee, cristales de hidroxiapatita que se tiñen con rojo de alizarina y líquido hemático."}, {"n": "7", "noShuffle": false, "img": null, "q": "Niño de 3 años, sin antecedente traumático, con una prominencia ósea indolora en la clavícula derecha y movilidad entre ambos extremos; la función del hombro es normal. ¿Diagnóstico más probable?", "o": ["Disostosis cleidocraneal", "Pseudoartrosis congénita clavicular", "Deformidad de Sprengel", "Parálisis obstétrica de Erb-Duchenne"], "c": 2, "e": "La <b>pseudoartrosis congénita de clavícula</b> se debe a falta de unión de los núcleos de osificación; es <b>derecha en el 90 %</b>, con prominencia y movilidad de los extremos, función conservada y sin dolor. La disostosis cleidocraneal ausenta el tercio externo y altera el cráneo; Sprengel es una escápula elevada e hipoplásica."}, {"n": "8", "noShuffle": false, "img": null, "q": "Varón de 26 años, no deportista de contacto, con luxación recidivante anterior de hombro; la TC muestra una lesión de Hill-Sachs significativa sin defecto óseo de la glena, y la artro-RM, una lesión de Bankart. ¿Qué técnica se añade a la reparación de Bankart para tratar el defecto humeral?", "o": ["Remplissage del defecto humeral", "Técnica de Latarjet o tope óseo glenoideo", "Forage de la cabeza humeral", "Acromioplastia artroscópica"], "c": 1, "e": "La <b>Hill-Sachs</b> es una fractura por impacto de la cabeza contra el borde anterior de la glena; se trata con <b>remplissage</b> junto a la reparación de Bankart. Latarjet o tope óseo sustituyen al Bankart en defectos de glena o alto riesgo; el forage es de la osteonecrosis y la acromioplastia, del síndrome subacromial."}], "t11": [{"n": "1", "noShuffle": false, "img": null, "q": "Niño de 11 años con una luxación de codo ya reducida. En la radiografía se ve osificado el núcleo de la tróclea, pero no el de la epitróclea. ¿Qué debe sospecharse?", "o": ["Variante normal en el orden de osificación", "Arrancamiento de epitróclea incarcerado", "Fractura no desplazada del cóndilo lateral", "Epifisiólisis tipo V del húmero distal"], "c": 2, "e": "Según <b>CRITOE</b>, la epitróclea (5-7 años) se osifica antes que la tróclea (8-10 años). Si se ve la tróclea y no la epitróclea, debe sospecharse un <b>arrancamiento de la epitróclea incarcerado</b> en la articulación. No es una variante normal: el orden de aparición es predecible."}, {"n": "2", "noShuffle": false, "img": null, "q": "Niño de 5 años que cae sobre el codo; tiene dolor y no lo mueve. En la radiografía lateral no se ve trazo de fractura, pero las almohadillas grasas están elevadas (signo de la vela). ¿Qué indica este hallazgo?", "o": ["Variante anatómica normal sin relevancia clínica", "Derrame con probable fractura oculta", "Pronación dolorosa por ligamento anular", "Luxación aislada de cabeza radial"], "c": 2, "e": "La elevación de las almohadillas grasas (<b>signo de la vela</b>) es un signo indirecto de <b>derrame articular y fractura oculta</b>. No es una variante normal, y en la pronación dolorosa la radiografía es siempre normal."}, {"n": "3", "noShuffle": false, "img": null, "q": "Niño de 10 años en seguimiento tras una epifisiólisis de tibia distal. En el control, las líneas de Park-Harris convergen hacia un punto de la fisis en lugar de ser paralelas a ella. ¿Qué sugiere?", "o": ["Crecimiento fisario simétrico y normal", "Formación de un puente óseo fisario", "Hipercrecimiento compensador por hiperemia", "Remodelación por ley de Wolff"], "c": 2, "e": "Las <b>líneas de Park-Harris</b> paralelas a la fisis indican crecimiento simétrico normal; si <b>convergen o se inclinan</b>, sugieren un <b>puente óseo</b>. Por eso toda epifisiólisis debe seguirse al menos 6-12 meses."}, {"n": "4", "noShuffle": false, "img": null, "q": "Adolescente de 14 años, futbolista, que nota un chasquido y dolor en la cadera al hacer un sprint; tiene dolor selectivo a la palpación en la parte anterolateral de la pelvis, bajo la cresta ilíaca, que aumenta con la flexión resistida de la cadera. ¿Cuál es el diagnóstico más probable?", "o": ["Epifisiólisis tipo V de la cabeza femoral", "Fractura-avulsión apofisaria de la EIAS", "Fractura de estrés del cuello femoral", "Fractura patológica sobre quiste óseo"], "c": 2, "e": "Las <b>fracturas-avulsión apofisarias</b> (EIAS, tuberosidad isquiática, tuberosidad tibial anterior, epitróclea) son típicas de <b>adolescentes deportistas</b> y se deben a una contracción muscular violenta. El tipo V es una compresión axial, y el quiste óseo simple asienta típicamente en el húmero proximal."}, {"n": "5", "noShuffle": false, "img": null, "q": "Recién nacido tras un parto difícil que no mueve el brazo y tiene el codo tumefacto. La radiografía es poco valorable porque la epífisis humeral distal aún es cartilaginosa. De las siguientes, ¿qué prueba permite ver el cartílago no osificado?", "o": ["Tomografía computarizada", "Ecografía del codo", "Gammagrafía ósea", "Radiografía de estrés"], "c": 2, "e": "La <b>ecografía</b> permite ver el cartílago no osificado y es útil en lactantes, por ejemplo en la <b>epifisiólisis humeral distal del recién nacido</b>. El cartílago es radiotransparente; la TC se reserva para fracturas articulares y de transición del adolescente."}, {"n": "6", "noShuffle": false, "img": null, "q": "Niño de 9 años con epifisiólisis tipo II de radio distal que, tras la reducción cerrada, se muestra inestable. ¿Qué fijación es la adecuada?", "o": ["Agujas de Kirschner lisas y finas", "Tornillo que atraviese la fisis", "Agujas roscadas transfisarias", "Placa bloqueada que cruce la fisis"], "c": 1, "e": "En las epifisiólisis I-II inestables se usan <b>agujas de Kirschner lisas</b> percutáneas. Si hay que cruzar la fisis, deben ser lisas, finas, perpendiculares y retirarse pronto: <b>nunca</b> deben atravesarla tornillos ni agujas roscadas."}, {"n": "7", "noShuffle": false, "img": null, "q": "Adolescente de 15 años y 70 kg con una fractura diafisaria de fémur. ¿Cuál es el tratamiento de elección?", "o": ["Yeso pelvipédico (espica)", "Enclavado elástico con clavos de titanio", "Clavo rígido de entrada lateral", "Arnés de Pavlik"], "c": 3, "e": "En el <b>adolescente</b> el fémur se trata con <b>clavo intramedular rígido de entrada lateral</b> (trocantérea), que no daña la vascularización de la cabeza femoral ni la fisis, o con placa. El enclavado elástico es para 5-11 años, la espica para 6 meses-5 años y el Pavlik para lactantes."}, {"n": "8", "noShuffle": false, "img": null, "q": "Niño de 7 años con fractura supracondílea de húmero inmovilizada con yeso. A las pocas horas está ansioso, agitado y pide cada vez más analgesia. ¿Cuál es la actitud correcta?", "o": ["Aumentar la analgesia intravenosa y observar", "Abrir el yeso por completo y valorar fasciotomía", "Elevar el miembro y reevaluar a la mañana siguiente", "Sedar al niño y mantener el yeso"], "c": 2, "e": "Ansiedad, agitación y aumento de las necesidades de analgesia (<b>las «3 A»</b>) deben hacer sospechar un <b>síndrome compartimental</b>, más frecuente en la supracondílea. Hay que <b>abrir el yeso por completo</b> y valorar fasciotomía; analgesiar, sedar o esperar retrasan el diagnóstico."}]};

function injectSecCSS(){
  var css='';
  SECS.forEach(function(s){
    var m=META.secciones[s]||{};
    var c=m.color||'#1a56db',cd=m.colorDim||'#e8f0fe';
    css+='.tab.t-'+s+'.on{background:'+cd+';color:'+c+';border-color:'+c+'}\n';
    css+='.ph.s-'+s+'{border-left:4px solid '+c+'}\n';
    // Variables CSS por sección para el badge coloreado
    css+='#panel-'+s+' .qnum.sec-colored{background:'+cd+';color:'+c+'}\n';
  });
  var st=document.createElement('style');st.textContent=css;document.head.appendChild(st);
}
