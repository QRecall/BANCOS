<!--
=============================================================
  MOTOR BANCO MIR — v10
  Novedades respecto a v9:
  - Numeración correlativa fija por sección (no se mezcla)
  - Badge neutro en pestaña "Todos" + mezcla real inter-secciones
  - Temporizador sticky editable en header (play/pausa/reset)
  - Buscador de texto en tiempo real
  - Modo repaso rápido (muestra RC + explicación directamente)
  - Estadísticas de errores recurrentes entre sesiones
=============================================================
-->
<!DOCTYPE html>
<html lang="es" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title id="page-title">Banco MIR</title>
<style>
:root{
  --bg:#f4f3ef;--surf:#fff;--bd:#e5e5e5;--bd2:#ddd;
  --txt:#1a1a1a;--txt2:#555;--txt3:#999;--txt4:#666;
  --hdr:#1a1a1a;--hdr-t:#fff;
  --ok-bg:#e6f9ef;--ok-t:#0b6e52;--ok-bd:#2da060;
  --ko-bg:#fdecea;--ko-t:#b91c1c;--ko-bd:#d94f45;
  --sc-ok:#dcf5ed;--sc-ko:#fdecea;--sc-rem:#f0f0f0;--sc-rem-t:#666;
  --exp:#fffbe6;--exp-bd:#f0c04a;--exp-t:#5a4500;
  --prog:#e5e5e5;--prog-fill:#1a56db;
  --star:#ccc;--star-on:#f59e0b;
  --hint:#fafafa;--hint-bd:#eee;
  --tab-bd:#ddd;--tab-t:#555;
  --all-bg:#e8f0fe;--all-t:#1a56db;--all-bd:#1a56db;
  --fab:#1a1a1a;--fab-t:#fff;
  --nota-btn-t:#1a56db;--nota-btn-bd:#1a56db;--nota-btn-bg:var(--surf);
  --timer-bg:#222;--timer-t:#fff;--timer-danger:#ef4444;
}
[data-theme="dark"]{
  --bg:#0f0f1a;--surf:#1e1e30;--bd:#2a2a45;--bd2:#333355;
  --txt:#e8e8f0;--txt2:#aaa;--txt3:#555;--txt4:#888;
  --hdr:#0a0a14;--hdr-t:#e8e8f0;
  --ok-bg:#0b3020;--ok-t:#4ade80;--ok-bd:#166534;
  --ko-bg:#2d0a0a;--ko-t:#f87171;--ko-bd:#7f1d1d;
  --sc-ok:#0b3020;--sc-ko:#2d0a0a;--sc-rem:#252540;--sc-rem-t:#aaa;
  --exp:#1a1500;--exp-bd:#a37f10;--exp-t:#d4b84a;
  --prog:#2a2a45;--prog-fill:#60a5fa;
  --star:#444;--star-on:#f59e0b;
  --hint:#1a1a2e;--hint-bd:#2a2a45;
  --tab-bd:#2a2a45;--tab-t:#aaa;
  --all-bg:#1a2a4a;--all-t:#60a5fa;--all-bd:#3b82f6;
  --fab:#2a2a50;--fab-t:#e8e8f0;
  --nota-btn-t:#60a5fa;--nota-btn-bd:#3b82f6;--nota-btn-bg:var(--surf);
  --timer-bg:#1a1a2e;--timer-t:#e8e8f0;
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:var(--bg);color:var(--txt);min-height:100vh;transition:background .25s,color .25s}

/* ── Header ── */
header{background:var(--hdr);color:var(--hdr-t);padding:9px 16px;display:flex;align-items:center;justify-content:space-between;gap:8px;flex-wrap:wrap;position:sticky;top:0;z-index:100}
header h1{font-size:13.5px;font-weight:600;white-space:nowrap}
.hright{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.hmeta{font-size:11px;color:#888}
.hbtn{background:none;border:none;cursor:pointer;font-size:16px;line-height:1;padding:3px 5px;border-radius:5px;transition:background .15s;color:var(--hdr-t)}
.hbtn:hover{background:rgba(255,255,255,.12)}
.sbadge{font-size:11px;padding:3px 9px;border-radius:5px;font-weight:500}
.sbadge.ok{background:#15803d;color:#dcfce7}.sbadge.warn{background:#92400e;color:#fef3c7}

/* ── Temporizador ── */
#timer-wrap{display:flex;align-items:center;gap:4px;background:var(--timer-bg);border-radius:7px;padding:3px 8px;border:1px solid rgba(255,255,255,.1)}
#timer-display{font-size:13px;font-weight:700;font-family:monospace;color:var(--timer-t);min-width:58px;text-align:center;cursor:pointer;border-radius:3px;padding:1px 3px}
#timer-display:hover{background:rgba(255,255,255,.08)}
#timer-display.editing{background:rgba(255,255,255,.15);outline:none;color:var(--timer-t)}
#timer-display.danger{color:var(--timer-danger)}
#timer-wrap button{background:none;border:none;cursor:pointer;color:rgba(255,255,255,.7);font-size:12px;padding:1px 3px;border-radius:3px;line-height:1}
#timer-wrap button:hover{background:rgba(255,255,255,.12);color:#fff}

/* ── Barra de progreso ── */
#prog-wrap{height:3px;background:var(--prog);position:sticky;top:40px;z-index:99}
#prog-bar{height:100%;background:var(--prog-fill);width:0%;transition:width .4s}

/* ── Contenedor ── */
.container{max-width:820px;margin:0 auto;padding:16px 12px}

/* ── Buscador ── */
.search-wrap{position:relative;margin-bottom:13px}
.search-wrap input{width:100%;padding:8px 34px 8px 12px;border:1.5px solid var(--bd2);border-radius:8px;font-size:13px;background:var(--surf);color:var(--txt);outline:none;transition:border-color .15s}
.search-wrap input:focus{border-color:var(--prog-fill)}
.search-clear{position:absolute;right:9px;top:50%;transform:translateY(-50%);background:none;border:none;cursor:pointer;color:var(--txt3);font-size:16px;display:none;line-height:1}
#search-count{font-size:11px;color:var(--txt3);margin-top:4px;display:none}

/* ── Modo repaso ── */
.mode-bar{display:flex;gap:6px;margin-bottom:12px;align-items:center}
.mode-btn{padding:5px 12px;border:1.5px solid var(--bd2);border-radius:7px;cursor:pointer;font-size:12px;font-weight:500;background:var(--surf);color:var(--txt2);transition:all .15s}
.mode-btn:hover{border-color:#999}
.mode-btn.on{background:var(--all-bg);color:var(--all-t);border-color:var(--all-bd)}

/* ── Tabs ── */
.tabs{display:flex;gap:7px;margin-bottom:13px;flex-wrap:wrap}
.tab{padding:7px 14px;border:1.5px solid var(--tab-bd);border-radius:8px;cursor:pointer;font-size:12.5px;font-weight:500;background:var(--surf);color:var(--tab-t);transition:all .15s}
.tab:hover{border-color:#999;color:var(--txt)}
.tab.t-all.on{background:var(--all-bg);color:var(--all-t);border-color:var(--all-bd)}

/* ── Score global ── */
.ph-global{background:var(--surf);border-radius:10px;border:1px solid var(--bd);padding:10px 15px;margin-bottom:10px;display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;border-left:4px solid var(--prog-fill)}
.score-row{display:flex;gap:7px;align-items:center;flex-wrap:wrap}
.sc{font-size:12px;font-weight:600;padding:3px 9px;border-radius:6px}
.sc.ok{background:var(--sc-ok);color:var(--ok-t)}.sc.ko{background:var(--sc-ko);color:var(--ko-t)}.sc.rem{background:var(--sc-rem);color:var(--sc-rem-t)}

/* ── Acciones ── */
.global-actions{display:none;margin-bottom:10px;gap:7px;flex-wrap:wrap;align-items:center}
.container[data-tab="all"] .global-actions{display:flex}
.sec-actions{margin:6px 0 15px;display:flex;gap:7px;flex-wrap:wrap}
.reset-btn{padding:7px 14px;background:var(--fab);color:var(--fab-t);border:none;border-radius:8px;cursor:pointer;font-size:12.5px;font-weight:500;transition:opacity .15s}
.reset-btn:hover{opacity:.82}
.nota-btn{padding:7px 14px;background:var(--nota-btn-bg);color:var(--nota-btn-t);border:1.5px solid var(--nota-btn-bd);border-radius:8px;cursor:pointer;font-size:12.5px;font-weight:500;transition:background .15s}
.nota-btn:hover{background:var(--all-bg)}

/* ── Nota box ── */
.nota-box,.global-nota-box{margin-top:8px;padding:12px 15px;border-radius:10px;border:2px solid var(--bd2);font-size:13px;line-height:1.7;display:none}
.nota-box.pass,.global-nota-box.pass{background:var(--ok-bg);border-color:var(--ok-bd);color:var(--ok-t)}
.nota-box.fail,.global-nota-box.fail{background:var(--ko-bg);border-color:var(--ko-bd);color:var(--ko-t)}
.nota-score{font-size:26px;font-weight:700;display:block;margin-bottom:4px}
.nota-detail{font-size:12px;opacity:.85;font-family:monospace}

/* ── Vista revisión ── */
.review-list{margin-top:12px;border-top:1px solid var(--bd2);padding-top:10px}
.review-title{font-size:12px;font-weight:700;margin-bottom:9px;color:var(--txt)}
.review-sec-label{font-size:11.5px;font-weight:700;color:var(--txt3);margin:8px 0 5px;padding-top:6px;border-top:1px solid var(--bd)}
.review-item{background:var(--surf);border-radius:8px;border:1px solid var(--bd);margin-bottom:7px;overflow:hidden}
.review-item summary{padding:9px 12px;cursor:pointer;font-size:12.5px;color:var(--txt);list-style:none;display:flex;gap:8px;align-items:flex-start}
.review-item summary::-webkit-details-marker{display:none}
.review-item summary::before{content:'▶';font-size:9px;color:var(--txt3);flex-shrink:0;margin-top:4px;transition:transform .18s}
details[open] summary::before{transform:rotate(90deg)}
.review-body{padding:0 12px 11px}
.review-ans{font-size:12px;color:var(--ok-t);margin-bottom:7px;font-weight:500}

/* ── Estadísticas ── */
.stats-box{margin-top:8px;padding:12px 15px;border-radius:10px;border:1.5px solid var(--bd2);background:var(--surf);display:none}
.stats-box.show{display:block}
.stats-title{font-size:12px;font-weight:700;margin-bottom:10px;color:var(--txt)}
.stats-item{display:flex;align-items:center;gap:8px;padding:6px 0;border-bottom:1px solid var(--bd);font-size:12.5px}
.stats-item:last-child{border-bottom:none}
.stats-bar-wrap{flex:1;background:var(--sc-rem);border-radius:4px;height:6px;overflow:hidden}
.stats-bar{height:100%;background:var(--ko-bd);border-radius:4px;transition:width .4s}
.stats-n{font-size:11px;color:var(--txt3);white-space:nowrap}
.stats-q{flex:2;color:var(--txt);font-size:12px;line-height:1.3}

/* ── Panel secciones ── */
.sec-panel{display:none}.sec-panel.visible{display:block}
.ph{background:var(--surf);border-radius:10px;border:1px solid var(--bd);padding:10px 14px;margin-bottom:8px;display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.ph-left{flex:1;display:flex;flex-direction:column;gap:5px}
.ph-label{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;color:var(--txt3);margin-bottom:1px}
.ph-desc{font-size:12px;color:var(--txt4)}
.fbtn{padding:6px 12px;font-size:12px;font-weight:500;border:1.5px solid var(--bd2);border-radius:8px;cursor:pointer;background:var(--surf);color:var(--txt2);transition:all .15s;white-space:nowrap}
.fbtn:hover{border-color:#999;color:var(--txt)}.fbtn.on{background:var(--ko-bg);color:#b91c1c;border-color:#f87171}
.no-failed{display:none;text-align:center;padding:16px;color:var(--txt3);font-size:13px;border:1.5px dashed var(--bd2);border-radius:8px;margin-top:4px}
.no-failed.show{display:block}
.no-results{display:none;text-align:center;padding:20px;color:var(--txt3);font-size:13px;border:1.5px dashed var(--bd2);border-radius:8px;margin:8px 0}

/* ── Hint ── */
.hint{font-size:11px;color:var(--txt3);margin-bottom:15px;padding:7px 11px;background:var(--hint);border-radius:6px;border:1px solid var(--hint-bd)}

/* ── Tarjeta ── */
.qcard{background:var(--surf);border-radius:10px;border:1px solid var(--bd);margin-bottom:7px;overflow:hidden;transition:box-shadow .15s}
.qcard:hover{box-shadow:0 2px 8px rgba(0,0,0,.08)}
.qcard.kb-focus{outline:2px solid var(--prog-fill);outline-offset:-2px}
.qcard.search-hidden{display:none}
.qhead{padding:11px 13px;cursor:pointer;display:flex;align-items:flex-start;gap:9px}

/* ── Badge numérico ── */
.qnum{font-size:11px;font-weight:700;padding:3px 7px;border-radius:5px;white-space:nowrap;flex-shrink:0;margin-top:2px;background:var(--sc-rem);color:var(--sc-rem-t)}
/* En pestaña "Todos" siempre neutro; en sección aplica color de sección */
.qnum.sec-colored{background:var(--sec-dim);color:var(--sec-col)}

.qtxt{font-size:13px;line-height:1.5;flex:1}
.star-btn{background:none;border:none;cursor:pointer;font-size:15px;color:var(--star);padding:0 2px;flex-shrink:0;margin-top:2px;line-height:1;transition:color .15s,transform .15s}
.star-btn:hover{transform:scale(1.2)}
.star-btn .si{display:inline}.star-btn .sf{display:none}
.star-btn.on .si{display:none}.star-btn.on .sf{display:inline;color:var(--star-on)}
.chev{font-size:15px;color:var(--bd2);flex-shrink:0;margin-top:2px;transition:transform .2s}
.qhead.open .chev{transform:rotate(180deg)}
.qbody{display:none;padding:0 13px 13px}.qbody.open{display:block}

/* ── Imagen ── */
.clinimg-wrap{margin:9px 0 7px;background:#111;border-radius:8px;overflow:hidden;border:1px solid var(--bd2);text-align:center}
.clinimg{max-width:100%;max-height:340px;object-fit:contain;display:block;margin:0 auto}
.clinimg-cap{font-size:11px;color:var(--txt3);padding:4px 0 5px;background:var(--hint);border-top:1px solid var(--bd)}

/* ── Opciones ── */
.opts{list-style:none;margin-top:9px;display:flex;flex-direction:column;gap:5px}
.opt{padding:9px 12px;border-radius:8px;border:1.5px solid var(--bd2);cursor:pointer;display:flex;align-items:flex-start;gap:9px;color:var(--txt);font-size:13px;line-height:1.45;transition:border-color .12s,background .12s;user-select:none}
.opt:hover:not(.done){border-color:#999;background:var(--hint)}
.opt.correct{background:var(--ok-bg);border-color:var(--ok-bd);color:var(--ok-t);font-weight:500;cursor:default}
.opt.wrong{background:var(--ko-bg);border-color:var(--ko-bd);color:var(--ko-t);cursor:default}
.opt.done:not(.correct):not(.wrong){cursor:default;opacity:.7}
.onum{font-size:11px;font-weight:700;flex-shrink:0;margin-top:2px;min-width:15px}

/* ── Modo repaso rápido ── */
.quick-card{padding:9px 12px;border-radius:8px;border:1.5px solid var(--ok-bd);background:var(--ok-bg);margin-top:8px}
.quick-rc{font-size:12.5px;font-weight:600;color:var(--ok-t);margin-bottom:6px}

/* ── Explicación ── */
.expbox{margin-top:10px;padding:10px 12px;background:var(--exp);border-left:4px solid var(--exp-bd);border-radius:0 8px 8px 0;font-size:12.5px;color:var(--exp-t);line-height:1.65}
.expbox b,.expbox strong{font-weight:600}
.et{display:block;margin-bottom:4px;font-weight:600;font-size:13px}
.atag{font-size:10px;padding:2px 6px;border-radius:4px;margin-left:5px;vertical-align:middle}
.atag.ok{background:var(--sc-ok);color:var(--ok-t)}.atag.ko{background:var(--sc-ko);color:#c0392b}

/* ── All-tab CSS ── */
.container[data-tab="all"] .ph{display:none!important}
.container[data-tab="all"] .sec-actions{display:none!important}
.container[data-tab="all"] .no-failed{display:none!important}
.container[data-tab="all"] .nota-box{display:none!important}
.container:not([data-tab="all"]) .global-nota-box{display:none!important}
.container:not([data-tab="all"]) #stats-global{display:none!important}

/* ── Contadores ✓ ✗ ○ pulsables: filtran las preguntas ── */
.sc.ok,.sc.ko,.sc.rem{cursor:pointer;user-select:none;-webkit-user-select:none;transition:box-shadow .15s}
.sc.ok:hover,.sc.ko:hover,.sc.rem:hover{box-shadow:0 0 0 1px var(--bd2)}
.sc.ok.on{box-shadow:0 0 0 1.5px var(--ok-t)}
.sc.ko.on{box-shadow:0 0 0 1.5px var(--ko-t)}
.sc.rem.on{box-shadow:0 0 0 1.5px var(--sc-rem-t)}
.qcard.rem-hidden{display:none!important}
.no-rem{display:none;text-align:center;padding:16px;color:var(--txt3);font-size:13px;border:1.5px dashed var(--bd2);border-radius:8px;margin-top:4px}
</style>
</head>
<body>
<header>
  <h1 id="h-tit">Banco MIR</h1>
  <div class="hright">
    <span class="hmeta" id="h-meta"></span>
    <!-- Temporizador -->
    <div id="timer-wrap" title="Haz clic en el tiempo para editar">
      <span id="timer-display">0:00:00</span>
      <button id="btn-tplay" onclick="timerToggle()" title="Play/Pausa">▶</button>
      <button onclick="timerReset()" title="Reset">↺</button>
    </div>
    <button class="hbtn" id="btn-dark" onclick="toggleDark()" title="Modo oscuro">🌙</button>
    <span id="save-badge" class="sbadge"></span>
  </div>
</header>
<div id="prog-wrap"><div id="prog-bar"></div></div>

<div class="container" id="main-cont" data-tab="all">
  <!-- Buscador -->
  <div class="search-wrap">
    <input type="text" id="search-input" placeholder="🔍 Buscar en enunciados..." oninput="onSearch(this.value)">
    <button class="search-clear" id="search-clear" onclick="clearSearch()">✕</button>
  </div>
  <div id="search-count"></div>

  <!-- Modo -->
  <div class="mode-bar">
    <span style="font-size:11.5px;color:var(--txt3);font-weight:600">MODO:</span>
    <button class="mode-btn on" id="mode-test" onclick="setMode('test')">📝 Test</button>
    <button class="mode-btn" id="mode-quick" onclick="setMode('quick')">⚡ Repaso rápido</button>
    <button class="mode-btn" id="btn-stars" onclick="filterStarred()" style="margin-left:auto;border-color:#f59e0b;color:#b45309">⭐ Marcadas</button>
    <button class="mode-btn" id="btn-stats" onclick="toggleStats()">📊 Errores</button>
  </div>

  <!-- Stats globales -->
  <div class="stats-box" id="stats-global"></div>

  <!-- Tabs -->
  <div class="tabs" id="tabs-wrap"></div>

  <!-- Score global -->
  <div class="ph-global">
    <div class="ph-left">
      <span class="ph-desc" id="ph-gdesc"></span>
      <div class="score-row">
        <span class="sc ok" id="sc-ok-all">✓ 0</span>
        <span class="sc ko" id="sc-ko-all">✗ 0</span>
        <span class="sc rem" id="sc-rem-all">○ 0</span>
      </div>
    </div>
  </div>
  <div class="global-actions">
    <button class="reset-btn" onclick="resetAll()">↺ Reiniciar y mezclar</button>
    <button class="nota-btn" onclick="calcNotaAll()">✎ Calcular nota global</button>
  </div>
  <div class="global-nota-box" id="nota-all"></div>
  <p class="hint">💡 <b>1–5</b> responde · <b>↑↓</b> navega · <b>S</b> marca ⭐ · Progreso guardado automáticamente</p>

  <div id="panels-wrap"></div>
</div>

<script>
/* ═══════════════════════════════════════ MOTOR v10 ═══════════════════════════════════════ */

var KEY=/*__KEY__*/'trauma_examenes_reales_2021_2025_v1';
var META=/*__META_JSON__*/{"titulo": "Traumatología · Exámenes reales 2021-2025", "subtitulo": "91 preguntas de los finales de 2025 y 2024, el examen de 2022 y la recuperación de 2021 · solo temas del parcial", "examen": "Exámenes reales · las claves salen de tus apuntes de 2026", "secciones": {"f2025": {"label": "Final 2025", "emoji": "🟣", "color": "#a78bfa", "colorDim": "#a78bfa22", "desc": "23 preguntas de los temas del parcial"}, "f2024": {"label": "Final enero 2024", "emoji": "🔵", "color": "#60a5fa", "colorDim": "#60a5fa22", "desc": "22 preguntas de los temas del parcial"}, "ex2022": {"label": "Examen 2022", "emoji": "🟢", "color": "#34d399", "colorDim": "#34d39922", "desc": "21 preguntas de los temas del parcial"}, "r2021": {"label": "Recuperación 2021", "emoji": "🟠", "color": "#fb923c", "colorDim": "#fb923c22", "desc": "25 preguntas de los temas del parcial"}}};
var D=/*__D_JSON__*/{"f2025": [{"n": "1", "noShuffle": true, "img": null, "q": "Ciatalgia con reflejo rotuliano exaltado en una pierna: ¿qué significa?", "o": ["Lesión medular a la altura de L4", "Compresión de la raíz L4 en el agujero de conjunción", "Lesión central por encima del nivel L4", "Lesión medular por debajo de L4"], "c": 3, "e": "El rotuliano depende de <b>L3-L4</b>. Un reflejo <b>exaltado</b> es signo de <b>1.ª motoneurona (central)</b>: lesión de un nivel superior, que libera los mecanismos inhibidores. Una compresión de la raíz L4 en el agujero de conjunción haría lo contrario: lo <b>disminuiría o aboliría</b>. <i>· F2025, pregunta 1 · T01</i>"}, {"n": "2", "noShuffle": true, "img": null, "q": "En cirugía, la terminación «-rrafia» significa…", "o": ["Sutura", "Liberación", "Fijación", "Acción de cortar"], "c": 1, "e": "<b>-rrafia = sutura</b> (tenorrafia, capsulorrafia, neurorrafia). No la confundas con <b>-lisis</b> (liberación de adherencias), <b>-desis</b> (fusión o bloqueo) ni <b>-tomía</b> (sección, corte). <i>· F2025, pregunta 2 · T01</i>"}, {"n": "3", "noShuffle": true, "img": null, "q": "¿Qué injerto tiene mayor capacidad osteogénica?", "o": ["Aloinjerto de cadáver congelado", "BMP 7", "Injerto de hidroxiapatita", "Autoinjerto de cresta ilíaca"], "c": 4, "e": "Solo el <b>autoinjerto (cresta ilíaca)</b> es <b>osteogénico</b>: es el patrón de referencia y además osteoinduce y osteoconduce. El aloinjerto congelado y la hidroxiapatita no son osteogénicos. Las <b>BMP</b> recombinantes <b>osteoinducen</b>, pero tampoco son osteogénicas. <i>· F2025, pregunta 4 · T01</i>"}, {"n": "4", "noShuffle": true, "img": null, "q": "Síndrome de la encrucijada (intersección): señale la FALSA", "o": ["Conflicto entre radiales corto y largo y abductor largo/extensor corto del pulgar", "Tenosinovitis estenosante del 2.º compartimento palmar de la muñeca", "Mecanismo: flexoextensión repetida, fuerza y desviación radial", "Su principal DD es la tenosinovitis de De Quervain"], "c": 2, "e": "Es FALSA porque el síndrome de la intersección es una tenosinovitis del <b>2.º compartimento EXTENSOR</b> (1.er y 2.º radial), no palmar. Se debe al <b>uso repetido</b> de la muñeca y duele unos <b>4 cm proximal</b> a ella, donde se cruza con el 1.er compartimento. Por eso es la confusión típica con <b>De Quervain</b> (1.er compartimento). <i>· F2025, pregunta 5 · T26</i>"}, {"n": "5", "noShuffle": true, "img": null, "q": "Acondroplasia: afirmación INCORRECTA", "o": ["Mutación en FGFR3", "Se asocia a enanismo acromélico", "Forma más frecuente de enanismo desproporcionado", "Las alteraciones faciales ayudan al diagnóstico"], "c": 2, "e": "La acondroplasia es un enanismo <b>rizomélico</b> (segmento proximal: húmero y fémur) con tronco normal, no acromélico (distal). Lo demás es cierto: <b>FGFR3</b> con ganancia de función, es la <b>más frecuente</b> y la cara ayuda (macrocefalia, frente prominente, hipoplasia del tercio medio facial). <i>· F2025, pregunta 6 · T15</i>"}, {"n": "6", "noShuffle": true, "img": null, "q": "Mecanismos de contención de una fractura: señale la correcta", "o": ["Siempre por métodos quirúrgicos", "Al poner un yeso, apoyar solo en el punto de fractura", "Hay mecanismos de contención temporales y definitivos", "Los métodos no quirúrgicos siempre dan estabilidad"], "c": 3, "e": "La contención o estabilización <b>puede ser temporal o definitiva</b>, y quirúrgica o no quirúrgica (la <b>tracción continua</b>, por ejemplo, es temporal). Por eso falla «siempre quirúrgica». Y los métodos no quirúrgicos tienen <b>limitaciones</b>: interposición de partes blandas, fragmentos articulares, inmovilización a distancia del hueso. <i>· F2025, pregunta 9 · T09_10</i>"}, {"n": "7", "noShuffle": true, "img": null, "q": "Pseudoartrosis hipotróficas o atróficas: NO es cierto que…", "o": ["No necesitan injerto, consolidan al fijarlas", "Dan imagen en pico de flauta", "Pueden tener unión parcial por un lado", "Se deben a falta de vascularización del foco"], "c": 1, "e": "Las <b>atróficas/hipotróficas</b> son no viables por <b>falta de vascularización</b> (imagen en <b>pico de flauta</b>): el problema es biológico y necesitan <b>injerto óseo + fijación rígida</b>. Basta con fijar en la <b>hipertrófica</b> (pata de elefante), cuyo problema es mecánico. <i>· F2025, pregunta 10 · T09_10</i>"}, {"n": "8", "noShuffle": true, "img": null, "q": "Tumores óseos: un estudio anatomopatológico correcto debe…", "o": ["Hacerse de inmediato al ver el tumor en la Rx", "Recoger la menor muestra posible", "Hacerse de forma segura para evitar recidiva o diseminación", "Hacerse siempre a cielo abierto"], "c": 3, "e": "La biopsia da tipo histológico, grado y respuesta a QT/RT, y <b>debe obtener una muestra adecuada</b>, no la mínima. La abierta deja una cicatriz que hay que <b>extirpar íntegra para evitar recidivas locales</b>: hay que hacerla de forma segura. Y no siempre es abierta: la <b>cerrada (aguja/trépano) es la de elección</b> (T01). <i>· F2025, pregunta 11 · T13</i>"}, {"n": "9", "noShuffle": true, "img": null, "q": "Las metástasis óseas más frecuentes proceden de un primario de…", "o": ["Mama", "Pulmón", "Colon", "Próstata"], "c": 1, "e": "Las metástasis son el 85 % de los tumores óseos malignos (> 45 años). Orden de primarios: <b>mama (35-40 %)</b> > pulmón > próstata > riñón > tiroides. <i>· F2025, pregunta 12 · T13</i>"}, {"n": "10", "noShuffle": true, "img": null, "q": "La deformidad en cuello de cisne…", "o": ["Es la que menos afecta a la función", "Se debe a rotura de la bandeleta media", "Puede originarse en cualquiera de las tres articulaciones y el tratamiento varía según la causa", "Causa cervicobraquialgia intensa"], "c": 3, "e": "<b>Clave por descarte.</b> En tus apuntes el cuello de cisne aparece como <b>secundario</b> a un dedo en martillo (zona 1, IFD): <b>IFP en hiperextensión + IFD en flexión</b>, así que puede originarse en una articulación distinta de la que se deforma. La b describe la <b>Boutonnière</b> (rotura del tendón central). De la a y la d tus apuntes no dicen nada. <i>· F2025, pregunta 14 · T25</i>"}, {"n": "11", "noShuffle": true, "img": null, "q": "Niño 7 a, caída de columpio sobre la mano, deformidad en dorso de tenedor de la muñeca, sin lesión neurovascular: ¿qué espera en la Rx?", "o": ["Fractura-luxación de Monteggia", "Fractura de cabeza radial", "Epifisiólisis distal del radio", "Fractura en tallo verde de cúbito"], "c": 3, "e": "Es una pregunta de clase: niño que cae sobre la mano con <b>deformidad en dorso de tenedor</b> → <b>epifisiólisis distal del radio</b> (T24). Además, la epifisiólisis más frecuente es la del <b>radio distal</b>, seguida de las falanges. Es la única opción que afecta al radio distal. <i>· F2025, pregunta 15 · T11</i>"}, {"n": "12", "noShuffle": true, "img": null, "q": "Mujer 80 a, caída, fractura en 3 fragmentos de húmero proximal: sobre el tratamiento es cierto…", "o": ["El TC no aporta nada", "Nunca se tratan de forma conservadora", "Depende de las características del paciente y del tipo de fractura", "La prótesis solo se usa en secuelas"], "c": 3, "e": "En el húmero proximal el <b>80 % es conservador</b> (Velpeau + pendulares), también en la <b>edad avanzada</b>. La <b>prótesis</b> se indica en fracturas del cuello anatómico, de <b>3-4 fragmentos con hueso osteoporótico</b> o con gran afectación articular. Así que <b>depende del paciente y de la fractura</b>: ni «nunca conservador» ni «prótesis solo en secuelas». <i>· F2025, pregunta 16 · brazo</i>"}, {"n": "13", "noShuffle": true, "img": null, "q": "Mujer 65 a, luxación anterior de hombro reducida; a las 3 semanas disestesia lateral del hombro y abducción de 15º con manguito indemne en RM: diagnóstico", "o": ["Tendinopatía del redondo mayor", "Capsulitis adhesiva", "Neuropatía del supraescapular", "Lesión del nervio axilar"], "c": 4, "e": "Es la <b>MIR 2021</b> de tus diapositivas: tras una luxación anterior reducida, <b>disestesia en la cara lateral del hombro</b> (región deltoidea) y abducción de solo 15º con el <b>manguito indemne</b> → lesión del <b>nervio axilar</b> (circunflejo). Por eso en la luxación hay que explorar siempre el pulso distal y el nervio axilar. <i>· F2025, pregunta 17 · brazo</i>"}, {"n": "14", "noShuffle": true, "img": null, "q": "Niño 6 a, caída en hiperextensión, codo tumefacto, dedos pálidos y sin pulsos distales: actitud inmediata", "o": ["Llamar al cirujano vascular", "Fasciotomía por síndrome compartimental", "Observación con analgesia cada 2 h", "Reducir la fractura y explorar de nuevo"], "c": 4, "e": "Es una supracondílea infantil sin pulsos. Lo primero es <b>reducir la fractura y volver a explorar</b>, porque la ausencia de pulso radial <b>suele recuperarse tras la reducción</b>. Si es irreductible o persiste la lesión vascular → <b>reducción abierta</b>. No hay datos de síndrome compartimental que justifiquen una fasciotomía. <i>· F2025, pregunta 19 · brazo</i>"}, {"n": "15", "noShuffle": true, "img": null, "q": "Trabajador 45 a, chasquido al levantar una caja, dolor en flexión y supinación, hematoma y ascenso del vientre del bíceps: sospecha", "o": ["Rotura de la porción larga del bíceps", "Rotura del bíceps distal", "Fractura diafisaria de húmero", "Osteocondritis disecante del húmero"], "c": 2, "e": "Rotura del <b>bíceps distal</b>: edad media, ámbito laboral, fuerza excéntrica con el codo flexionado; <b>chasquido</b>, dolor con <b>flexión y supinación</b>, tumefacción y <b>ascenso del vientre muscular</b> (Popeye). La porción larga también da Popeye, pero se rompe en mayores de 40 años con tendinosis previa, duele en el hombro y apenas quita función. <i>· F2025, pregunta 20 · T23</i>"}, {"n": "16", "noShuffle": true, "img": null, "q": "Fracturas de escafoides: es cierto que…", "o": ["El polo proximal tiene más riesgo de necrosis", "En la Rx se ve el signo del escafoides en anillo", "La pseudoartrosis es infrecuente", "Se asocian a lesión del fibrocartílago triangular"], "c": 1, "e": "El <b>polo proximal</b> (20 %) está <b>mal vascularizado → tendencia a la necrosis</b>; el distal está bien vascularizado. El <b>escafoides en anillo</b> es signo de <b>disociación escafolunar</b>, no de fractura. La pseudoartrosis es una complicación típica: aumenta cuanto <b>más vertical</b> es el trazo y puede acabar en SNAC. <i>· F2025, pregunta 21 · T24</i>"}, {"n": "17", "noShuffle": true, "img": null, "q": "Cuidadora 55 a, dolor y acorchamiento palmar bilateral nocturno, más en 2.º-3.º dedos, sin clínica cervical: primera sospecha", "o": ["Espondiloartrosis cervical C5-C6", "Compresión cubital epitroclear", "Hernia discal C6-C7", "Síndrome del túnel carpiano"], "c": 4, "e": "Dolor y parestesias en los <b>3 primeros dedos</b> y el borde radial del 4.º, de <b>predominio nocturno</b>, en una mujer y sin clínica cervical → <b>síndrome del túnel carpiano</b>: compresión del mediano bajo el ligamento anular del carpo. Es el síndrome compresivo <b>más frecuente</b> y el 95 % es idiopático. <i>· F2025, pregunta 23 · T23</i>"}, {"n": "18", "noShuffle": true, "img": null, "q": "Fractura-luxación de Bennett (base del 1.er MTC): es cierto…", "o": ["Reducción cerrada con maniobra de Jahs y yeso en intrínsecos plus", "No cura porque se interpone el aductor", "Casi siempre tiene indicación de fijación quirúrgica", "Es típica de boxeadores"], "c": 3, "e": "<b>Bennett</b> (fractura-luxación simple de la base del 1.er MC) y <b>Rolando</b> (compleja) son de <b>tratamiento quirúrgico</b>. Los distractores son de otras lesiones: la <b>maniobra de Jahs</b> es del cuello del 5.º MC (fractura del boxeador) y el <b>aductor interpuesto</b> es la lesión de Stener. <i>· F2025, pregunta 25 · T25</i>"}, {"n": "19", "noShuffle": true, "img": null, "q": "Mujer 67 a, ayer reducción y yeso por fractura de radio distal; dolor insoportable que aumenta al mover los dedos, no los mueve y están muy hinchados: complicación a tratar ya", "o": ["Síndrome de dolor regional complejo", "Síndrome compartimental", "Rotura de extensores", "Desplazamiento secundario"], "c": 2, "e": "Yeso recién puesto + <b>dolor insoportable que aumenta al mover los dedos</b>, dedos muy hinchados que no puede mover → <b>síndrome compartimental</b>. Es la complicación del radio distal que hay que tratar <b>inmediatamente</b>. Las demás son complicaciones posibles de la fractura, pero no este cuadro urgente. <i>· F2025, pregunta 26 · T24</i>"}, {"n": "20", "noShuffle": true, "img": null, "q": "NO es contraindicación absoluta para el reimplante en la mano", "o": ["Automutilación", "Amputación a múltiples niveles", "Negativa a dejar de fumar 3 meses tras el reimplante", "Amputación intensamente contaminada"], "c": 4, "e": "En tus apuntes la <b>amputación intensamente contaminada</b> es una <b>indicación relativa</b> de reimplante (junto con avulsión o aplastamiento, dedo único en adulto y tabaquismo importante): no es una contraindicación absoluta. Las <b>indicaciones absolutas</b> son pulgar, polidigitales, niños y amputaciones limpias en palma, muñeca o antebrazo («PPNL»). <b>Pregunta dudosa:</b> el tabaquismo importante también figura como indicación relativa. <i>· F2025, pregunta 27 · T25</i>"}, {"n": "21", "noShuffle": true, "img": null, "q": "Recomendaciones EULAR en artrosis de cadera: todas EXCEPTO", "o": ["Paracetamol 1 g/8 h en dolor leve-moderado", "Artroplastia total al hacer el diagnóstico", "Opioides si los AINE no controlan", "Infiltraciones de hialurónico o corticoides"], "c": 2, "e": "La cirugía de la artrosis se decide <b>según la extensión de la enfermedad y los síntomas</b>, no al hacer el diagnóstico. Todo lo demás figura en el tratamiento médico de tus apuntes: <b>paracetamol, AINE, opioides</b>, viscosuplementación con <b>ácido hialurónico</b> y <b>corticoides</b> articulares. <i>· F2025, pregunta 28 · T12</i>"}, {"n": "22", "noShuffle": true, "img": null, "q": "Hernia discal posterolateral derecha L5-S1: puede dar todo EXCEPTO", "o": ["Dolor radicular hasta el tobillo y dedos", "Claudicación de puntillas", "Disestesia en dorso y dedos del pie", "Ausencia de reflejo rotuliano"], "c": 4, "e": "Una hernia <b>posterolateral L5-S1</b> comprime la raíz del número siguiente, la <b>S1</b>: dolor por la cara posterior de la pierna hasta el talón y el borde lateral del pie, <b>no camina de puntillas</b> y el <b>aquíleo</b> está abolido. El <b>rotuliano es L4</b>: una S1 nunca lo altera. Ojo: en tus apuntes el <b>dorso del pie es L5</b>, así que la disestesia en el dorso tampoco encaja con S1: hay dos opciones que no cuadran y la más clara es el rotuliano. <i>· F2025, pregunta 47 · T28</i>"}, {"n": "23", "noShuffle": true, "img": null, "q": "Varón 45 a, primer episodio de lumbalgia de 3 semanas, sin traumatismo ni déficit neurológico: prueba de imagen indicada", "o": ["Ninguna prueba de imagen", "Solo Rx simple lumbar", "RM", "TC"], "c": 1, "e": "Es una lumbalgia aguda (menos de 6 semanas) sin traumatismo ni déficit: <b>sin banderas rojas no se pide imagen</b>. El 90 % de las agudas se resuelve en menos de 6 semanas. Solo las señales de alerta justifican pruebas: <b>RM</b> si se sospecha una enfermedad grave; <b>Rx + analítica</b> con el resto de alertas. <i>· F2025, pregunta 48 · T28</i>"}], "f2024": [{"n": "1", "noShuffle": true, "img": null, "q": "Aplicaciones de la RM en el aparato locomotor: señale la MENOS apropiada", "o": ["Excelente para tejidos blandos y médula ósea", "Útil en osteonecrosis, tumores, infección y traumatología", "Técnica de elección para hueso cortical, calcificaciones y trabecular", "Técnica de elección en patología discal"], "c": 3, "e": "La <b>TC</b> es mejor que la RM para el <b>hueso complejo, los huesos finos y las calcificaciones</b>. La <b>RM</b> es de elección para <b>partes blandas y médula ósea</b>, y ve fracturas ocultas y la necrosis avascular inicial. Por eso la c es la menos apropiada. <i>· F2024, pregunta 1 · T01</i>"}, {"n": "2", "noShuffle": true, "img": null, "q": "Deportista de 8 a con dolor proximal en la cara anterior del cuádriceps tras chutar un balón: sospecha", "o": ["Fractura de cadera", "Rotura del tendón proximal del cuádriceps", "Osteopatía de pubis", "Arrancamiento óseo"], "c": 4, "e": "Niño deportista + <b>contracción muscular violenta</b> (chutar) + dolor en la inserción proximal del muslo → <b>fractura-avulsión apofisaria</b>, es decir, un arrancamiento óseo. Tus apuntes citan la EIAS, la tuberosidad isquiática, la tuberosidad tibial anterior y la epitróclea como localizaciones típicas. <i>· F2024, pregunta 3 · T11</i>"}, {"n": "3", "noShuffle": true, "img": null, "q": "¿En cuál de estas fracturas está indicado el tratamiento ortopédico?", "o": ["Pertrocantérea de cadera", "Tibia con síndrome compartimental", "Diáfisis humeral con fractura de cúbito y radio", "Tercio medio de clavícula en un niño"], "c": 4, "e": "La fractura del <b>tercio medio de la clavícula</b> (75 % de las de clavícula) es casi siempre <b>conservadora</b>: cabestrillo o vendaje en ocho 4-6 semanas, <b>sin reducción anatómica</b>, también en el niño (MIR 2010 de tus diapositivas). La tibia con síndrome compartimental necesita una <b>fasciotomía</b>. <i>· F2024, pregunta 5 · brazo</i>"}, {"n": "4", "noShuffle": true, "img": null, "q": "Las epifisiólisis tipo II de Salter y Harris…", "o": ["Se dan sobre todo en vértebras", "Siempre requieren cirugía", "Mal pronóstico con trastorno grave del crecimiento", "Buen pronóstico y trazo metafisario asociado"], "c": 4, "e": "La <b>tipo II</b> es la más frecuente (75 %) y lleva un <b>fragmento triangular metafisario</b> (Thurston-Holland). Tiene <b>buen pronóstico</b>: el periostio intacto facilita la reducción. Ojo: en el fémur distal y la tibia proximal el riesgo de alteración del crecimiento es considerable. Las que piden reducción anatómica son la III y la IV. <i>· F2024, pregunta 6 · T11</i>"}, {"n": "5", "noShuffle": true, "img": null, "q": "Imagen lítica epifisaria en un niño de 4 años probablemente corresponde a…", "o": ["Osteosarcoma", "Osteoma osteoide", "Condroblastoma", "Sarcoma de Ewing"], "c": 3, "e": "Se responde por localización: lesión <b>epifisaria → condroblastoma</b>; diafisaria → Ewing; metafisaria → osteocondroma u osteosarcoma. La edad no ayuda: tus apuntes sitúan el condroblastoma entre los <b>10 y los 25 años</b>, así que la pista de la pregunta es la <b>epífisis</b>. <i>· F2024, pregunta 8 · T13</i>"}, {"n": "6", "noShuffle": true, "img": null, "q": "Mujer 60 a, diabética insulinodependiente, omalgia nocturna de semanas sin trauma, limitación activa y pasiva de todos los arcos: primera sospecha", "o": ["Artritis séptica de hombro", "Capsulitis adhesiva", "Artrosis acromioclavicular", "Luxación recidivante"], "c": 2, "e": "Es el caso de clase: <b>mujer de 40-60 años</b>, <b>diabética</b> (la capsulitis llega al 20 % en DM) y dolor sin trauma con <b>limitación ACTIVA Y PASIVA</b> → <b>capsulitis adhesiva</b>. Primero se pierde la rotación externa. Si la pasiva estuviera conservada con la activa reducida, pensarías en el manguito o en un síndrome subacromial. <i>· F2024, pregunta 11 · T09h</i>"}, {"n": "7", "noShuffle": true, "img": null, "q": "Las radiografías dinámicas del hombro sirven para…", "o": ["Valorar inestabilidad esternoclavicular", "Valorar inestabilidad acromioclavicular", "Valorar rotura del manguito", "Valorar artrosis acromioclavicular"], "c": 2, "e": "La <b>radiología de estrés o dinámica</b> se hace con unos <b>3-5 kg en ambas manos</b> y muestra si <b>aumenta el espacio acromioclavicular</b>: sirve para valorar la <b>inestabilidad (luxación) acromioclavicular</b>. <i>· F2024, pregunta 13 · brazo</i>"}, {"n": "8", "noShuffle": true, "img": null, "q": "Ciclista 27 a, caída sobre el hombro, deformidad y signo de la tecla de piano en el extremo distal de la clavícula: diagnóstico", "o": ["Fractura de escápula", "Fractura de cabeza humeral", "Luxación escapulohumeral", "Luxación acromioclavicular"], "c": 4, "e": "Dolor localizado, prominencia del extremo distal de la clavícula y <b>signo de la tecla</b> → <b>luxación acromioclavicular</b>. Se valora con Rx de estrés (3-5 kg). Tratamiento: tipos I-II conservador, III conservador o cirugía (mismo resultado) y IV-VI cirugía. <i>· F2024, pregunta 14 · brazo</i>"}, {"n": "9", "noShuffle": true, "img": null, "q": "Las fracturas diafisarias de húmero…", "o": ["Se tratan siempre con yeso en avión", "Complicación más frecuente: parálisis del mediano y rotura de la arteria radial", "Complicaciones más frecuentes: parálisis del radial y pseudoartrosis", "Es la fractura más frecuente del anciano"], "c": 3, "e": "En la fractura diafisaria de húmero hay que <b>descartar siempre la lesión del nervio radial</b> (no extiende la muñeca ni los dedos), que es la que se repite en las MIR de tus diapositivas. No se trata «siempre con yeso en avión»: <b>férula de Sarmiento</b> si no está desplazada y cirugía si lo está. Por descarte: tus apuntes no hablan de la pseudoartrosis en este apartado. <i>· F2024, pregunta 15 · brazo</i>"}, {"n": "10", "noShuffle": true, "img": null, "q": "Niño de 6 a, caída de un columpio, dolor, deformidad e impotencia del codo: primera sospecha", "o": ["Fractura de cúbito y radio con luxación de cabeza radial", "Fractura supracondílea de húmero", "Fractura de olécranon con luxación de cabeza radial", "Fractura-epifisiólisis de epitróclea"], "c": 2, "e": "En el niño, la fractura del extremo distal del húmero más frecuente es la <b>supracondílea (65 %)</b>, casi siempre por caída sobre el codo o la mano en <b>hiperextensión (95 %)</b>. Le siguen el cóndilo humeral (20 %) y la epitróclea (10 %). <i>· F2024, pregunta 16 · brazo</i>"}, {"n": "11", "noShuffle": true, "img": null, "q": "Varón 35 a con resección de cabeza radial por fractura conminuta; a los 6 meses dolor de muñeca y debilidad de prensión: diagnóstico", "o": ["Migración proximal del radio", "Artritis postraumática del codo", "Atrapamiento del interóseo posterior", "Pseudoartrosis de escafoides"], "c": 1, "e": "Al <b>extirpar la cabeza radial</b> puede quedar una <b>inestabilidad longitudinal del antebrazo con ascenso del radio y dolor en la muñeca</b>, sobre todo si había una <b>Essex-Lopresti</b> (desgarro de la membrana interósea). Por eso, en esos casos se pone una <b>prótesis de cabeza radial</b>. <i>· F2024, pregunta 17 · brazo</i>"}, {"n": "12", "noShuffle": true, "img": null, "q": "Joven 23 a, caída, dolor a la presión en la tabaquera anatómica: señale la correcta", "o": ["Si la Rx es normal, fisioterapia", "Si la Rx es normal, férula de escafoides y nueva Rx a los 15 días", "Si la Rx es normal, cirugía", "Si la Rx es normal, vendaje compresivo"], "c": 2, "e": "Dolor en la tabaquera anatómica con Rx normal = <b>fractura clínica de escafoides</b>: <b>férula antebraquial que incluya el pulgar durante 2 semanas</b> y <b>repetir la Rx</b> sin yeso. La Rx convencional la ve mal (proyección de Schneck; si hay dudas, TC o RM). <i>· F2024, pregunta 18 · T24</i>"}, {"n": "13", "noShuffle": true, "img": null, "q": "Lesión de Stener o pulgar del esquiador: señale la INCORRECTA", "o": ["Requiere habitualmente cirugía", "Es una fractura de la base del metacarpiano", "Rotura del colateral cubital de la MCF", "Se interpone la aponeurosis del aductor y el dedo queda inestable"], "c": 2, "e": "Lo INCORRECTO es llamarla fractura. El pulgar del esquiador es una <b>lesión del ligamento colateral cubital de la MCF</b>, que se explora forzando el valgo. La <b>lesión de Stener</b> se produce cuando se interpone la <b>aponeurosis del aductor</b>, y la rotura completa necesita <b>reparación</b>. En la Rx solo pueden verse arrancamientos. <i>· F2024, pregunta 19 · T25</i>"}, {"n": "14", "noShuffle": true, "img": null, "q": "Fractura del cuello del 5.º metacarpiano", "o": ["Se reduce con la maniobra de Jahs y se inmoviliza en intrínsecos plus", "Es una fractura de sobrecarga «de los reclutas»", "Su tratamiento es siempre quirúrgico", "Es la más rara de las fracturas de mano"], "c": 1, "e": "La fractura del <b>cuello del metacarpiano</b> afecta más al <b>5.º</b> (la del <b>boxeador</b>, por un puñetazo) y tolera 30-40º en el 4.º y el 5.º. Se trata de forma <b>conservadora con la maniobra de Jahs</b>, y la mano se inmoviliza en la posición segura o de <b>intrínsecos plus</b>. Solo se opera si no corrige o se desplaza. <i>· F2024, pregunta 20 · T25</i>"}, {"n": "15", "noShuffle": true, "img": null, "q": "El signo de Terry Thomas es característico de…", "o": ["Luxación de hombro", "Fractura de escafoides", "Rizartrosis", "Disociación escafolunar"], "c": 4, "e": "<b>Terry Thomas</b> = <b>espacio escafolunar mayor de 3 mm</b> en la Rx. Es signo de <b>disociación escafolunar</b>, la inestabilidad del carpo más frecuente. La acompañan un ángulo escafolunar mayor de 60º y el escafoides en anillo. <i>· F2024, pregunta 21 · T24</i>"}, {"n": "16", "noShuffle": true, "img": null, "q": "¿Qué patrón de dolor lumbar puede NO corresponder a una causa degenerativa?", "o": ["Varón 35 a, lumbalgia con dolor radicular al tobillo", "Mujer 50 a, lumbalgia episódica al talón al estar de pie", "Mujer 65 a con AR y corticoides, lumbalgia constante que solo calma en decúbito", "Varón 65 a, dolor en pantorrillas a los 50 m que cede al sentarse"], "c": 3, "e": "La mujer con <b>AR y corticoides</b> tiene <b>banderas rojas</b>: los <b>corticoides prolongados</b> orientan a una <b>fractura</b> y la inmunosupresión, a una infección. Las otras opciones son patrones degenerativos: dolor radicular de una hernia y claudicación que <b>cede al sentarse</b> (neurógena, por estenosis de canal). <i>· F2024, pregunta 25 · T28</i>"}, {"n": "17", "noShuffle": true, "img": null, "q": "NO es indicación de cirugía de hernia discal lumbar", "o": ["Síndrome de cola de caballo", "Deterioro motor progresivo", "Fracaso del tratamiento conservador de más de dos semanas", "Déficit motor con alteración de esfínteres"], "c": 3, "e": "Indicaciones de cirugía en la hernia lumbar: <b>cola de caballo</b> (urgente, en menos de 48 h), <b>déficit motor importante o progresivo</b> (preferente) y dolor radicular incapacitante que no cede tras <b>más de 6 semanas</b> de tratamiento conservador (programada). <b>Dos semanas</b> no bastan: el 80 % mejora en 6 semanas. <i>· F2024, pregunta 26 · T28</i>"}, {"n": "18", "noShuffle": true, "img": null, "q": "Hernia discal posterolateral derecha L5-S1: puede dar todo EXCEPTO (repetida: también cayó en F2025)", "o": ["Ausencia de reflejo rotuliano", "Dolor radicular hasta el tobillo y dedos", "Claudicación de puntillas", "Disestesia en dorso y dedos del pie"], "c": 1, "e": "Una hernia <b>posterolateral L5-S1</b> comprime la raíz del número siguiente, la <b>S1</b>: dolor por la cara posterior de la pierna hasta el talón y el borde lateral del pie, <b>no camina de puntillas</b> y el <b>aquíleo</b> está abolido. El <b>rotuliano es L4</b>: una S1 nunca lo altera. Ojo: en tus apuntes el <b>dorso del pie es L5</b>, así que la disestesia en el dorso tampoco encaja con S1: hay dos opciones que no cuadran y la más clara es el rotuliano. <i>· F2024, pregunta 27 · T28</i>"}, {"n": "19", "noShuffle": true, "img": null, "q": "Criterio mayor para el diagnóstico radiológico de necrosis de la cabeza femoral", "o": ["Osteofitos", "Signo de la uña o luna creciente", "Deformidad tipo CAM", "Geodas subcondrales"], "c": 2, "e": "El <b>«crescent sign»</b> (signo de la uña o luna creciente) es la línea de <b>fractura del hueso necrótico</b>, y marca el <b>estadio III</b> de la necrosis del adulto (I: Rx normal; II: esclerosis; IV: colapso y artrosis). Es el único signo de necrosis entre las opciones. <i>· F2024, pregunta 31 · T12</i>"}, {"n": "20", "noShuffle": true, "img": null, "q": "Varón 30 a, accidente de moto, fractura abierta grado III de tibia y peroné sin lesión neurovascular: conducta", "o": ["Limpieza y osteosíntesis inmediata con placa", "Limpieza y estabilización con fijador externo", "Limpieza, tracción y yeso al curar la herida", "Limpieza, tracción y después placa"], "c": 2, "e": "Una fractura abierta grado III sin lesión vascular es una IIIA o IIIB. Tras la limpieza y el desbridamiento se estabiliza con <b>fijador externo</b>, hasta consolidar o hasta retirarlo <b>antes de 2 semanas</b> para un enclavado endomedular. La IIIC (con lesión vascular) lleva <b>fijador externo definitivo</b>. <i>· F2024, pregunta 33 · T09_10</i>"}, {"n": "21", "noShuffle": true, "img": null, "q": "Fractura diafisaria de tibia con yeso que muestra pseudoartrosis «en pata de elefante»: debe advertirle que…", "o": ["Necesita varios meses más de yeso", "Es imprescindible abordar directamente el foco", "Necesitará injerto autólogo en la cirugía", "El enclavado intramedular a foco cerrado puede ser buena solución"], "c": 4, "e": "<b>Pata de elefante</b> = pseudoartrosis <b>hipertrófica (viable)</b>. El problema es <b>mecánico</b> (exceso de movilidad), así que basta con una <b>fijación rígida</b>, preferentemente <b>endomedular</b> o con placa a compresión. No necesita injerto, que es para la atrófica. <i>· F2024, pregunta 40 · T09_10</i>"}, {"n": "22", "noShuffle": true, "img": null, "q": "Enfermedad de Müller-Weiss (más frecuente en mujeres de 50 a): ¿qué hueso del pie afecta?", "o": ["Astrágalo", "Escafoides", "Cuboides", "Metatarsiano"], "c": 2, "e": "La osteonecrosis del <b>escafoides del pie</b> en el adulto es la <b>Müller-Weiss</b>. No la confundas con la del escafoides de la muñeca (<b>Preiser</b>), la del semilunar (<b>Kienböck</b>) ni con <b>Köhler</b>, que afecta al escafoides del pie en el niño. <i>· F2024, pregunta 49 · T12</i>"}], "ex2022": [{"n": "1", "noShuffle": true, "img": null, "q": "Niña de 8 años con extremidades inferiores en forma de X: las rodillas están en", "o": ["Valgo", "Varo", "Recurvatum", "Rotadas"], "c": 1, "e": "Los ejes se describen por el <b>segmento distal</b>: <b>valgo = distal desviado hacia fuera</b>, alejándose de la línea media; el genu valgum da las <b>rodillas en X</b>. El varo es lo contrario: distal hacia dentro, piernas en paréntesis. <i>· EX2022, pregunta 1 · T01</i>"}, {"n": "2", "noShuffle": true, "img": null, "q": "Qué síntoma no se presenta en un síndrome compartimental agudo", "o": ["Ausencia de pulsos periféricos", "Trastornos sensitivos periféricos", "Dolor intenso no relacionado con el traumatismo", "Trastornos motores"], "c": 1, "e": "En el síndrome compartimental agudo los <b>pulsos están presentes al inicio</b>: la presión que lo produce está por debajo de la arterial, así que se pierde la perfusión capilar mucho antes que el pulso. Sí aparecen <b>dolor desproporcionado</b> (sobre todo al estiramiento pasivo), parestesias precoces y parálisis tardía. <i>· EX2022, pregunta 2 · T05</i>"}, {"n": "3", "noShuffle": true, "img": null, "q": "Al interpretar una Rx simple de rodilla, lo primero que hay que hacer es", "o": ["Valorar el perfil de los huesos", "Valorar el espacio articular", "Mirar si hay problema de partes blandas", "Comprobar que corresponde al paciente correcto"], "c": 4, "e": "La Rx se lee con una <b>interpretación metódica</b> que empieza por <b>el paciente</b>: comprobar la identidad del estudio y dar datos clínicos al radiólogo. Después se miran, por este orden, tejidos blandos, hueso y articulaciones. <i>· EX2022, pregunta 3 · T01</i>"}, {"n": "4", "noShuffle": true, "img": null, "q": "La TC es muy útil para", "o": ["Valorar fracturas articulares antes de la cirugía, sobre todo con reconstrucción 3D", "Valorar meniscos y ligamentos de la rodilla", "Valorar el contenido de gangliones y tumores de partes blandas", "Ya no tiene utilidad, superada por RM y eco"], "c": 1, "e": "La TC da imágenes seccionales con <b>reconstrucción multiplanar en 3D</b> y se usa en <b>luxaciones y fracturas articulares complejas</b> para planificar la cirugía, para completar el estudio de tumores y para guiar biopsias. Es peor que la RM en partes blandas: meniscos, ligamentos y gangliones son terreno de la RM. <i>· EX2022, pregunta 4 · T01</i>"}, {"n": "5", "noShuffle": true, "img": null, "q": "Señale la correcta sobre tendinitis, paratendinitis y tenosinovitis", "o": ["Tendinitis se refiere sobre todo a tendones extrasinoviales", "Paratendinitis es inflamación de tendones intrasinoviales", "La tenosinovitis seca se caracteriza por la crepitación", "Las tenosinovitis piógenas no son urgencia"], "c": 3, "e": "En la ampliación de tus apuntes, las tenosinovitis agudas se dividen en <b>seca o crepitante</b> (crepitación «como pisar nieve»), húmeda o serosa y <b>supurada o séptica</b>, que es una <b>urgencia</b>. Falla la 2: la paratenonitis es del tendón <b>extrasinovial</b>; la tenosinovitis, del intrasinovial. La 1 no se puede valorar con tus apuntes, y la clave sale de la ampliación (apuntes de otros años). <i>· EX2022, pregunta 6 · T02</i>"}, {"n": "6", "noShuffle": true, "img": null, "q": "La nutrición del cartílago articular", "o": ["Depende sobre todo del hueso subcondral", "Proviene sobre todo del líquido sinovial", "De las anastomosis que rodean las fisis", "De arterias nutricias de la cápsula"], "c": 2, "e": "El cartílago articular es <b>avascular</b> y se nutre por dos vías; la más importante es la <b>vía sinovial</b>: por la permeabilidad del tejido entran desde el líquido sinovial agua y moléculas pequeñas como la glucosa. Por ser avascular, su capacidad de reparación es reducida. <i>· EX2022, pregunta 7 · T04</i>"}, {"n": "7", "noShuffle": true, "img": null, "q": "Señale lo correcto sobre los mecanismos de contención de una fractura", "o": ["Siempre por métodos quirúrgicos", "Con un yeso, apoyo solo en el punto de la fractura", "Hay mecanismos de contención temporales y definitivos", "Los métodos no quirúrgicos siempre dan estabilidad"], "c": 3, "e": "La contención o estabilización busca reducir el dolor, consolidar en buena posición e impedir la movilidad de los extremos, y puede ser <b>temporal o definitiva</b>, <b>quirúrgica o no quirúrgica</b>. No es «siempre quirúrgica», y los métodos no quirúrgicos tienen limitaciones (interposición de partes blandas, fragmentos articulares). <i>· EX2022, pregunta 8 · T09_10</i>"}, {"n": "8", "noShuffle": true, "img": null, "q": "Qué respuesta no se refiere a una fractura típica de los niños", "o": ["Epifisiodesis", "Fractura en tallo verde", "Fractura en torus", "Epifisiólisis"], "c": 1, "e": "Fracturas propias del niño: <b>deformidad plástica, torus y tallo verde</b>, además de las <b>epifisiólisis</b> (fracturas fisarias). La <b>epifisiodesis</b> no es una fractura: es un <b>tratamiento</b> del puente óseo fisario cuando no se cumplen los criterios de Langenskiöld (menos del 50 % y más de 2 años de crecimiento). <i>· EX2022, pregunta 9 · T11</i>"}, {"n": "9", "noShuffle": true, "img": null, "q": "Cuando hablamos de reducción cerrada de una fractura", "o": ["Manipulación externa y luego escayola", "Sin abrir el foco, aunque puede fijarse por un método quirúrgico (p. ej., clavo endomedular)", "Se abre el foco y luego hay que cerrarlo", "Es la que se hace solo con tracción"], "c": 2, "e": "La reducción cerrada se hace con maniobras manuales o tracción mecánica <b>sin abrir el foco</b>, y eso no impide fijarla después con cirugía: los <b>procedimientos quirúrgicos no siempre abren el foco</b>. La 1 y la 4 se quedan cortas (yeso o tracción son solo algunas opciones), y abrir el foco es la reducción abierta. La 1 no es falsa, pero es incompleta. <i>· EX2022, pregunta 10 · T09_10</i>"}, {"n": "10", "noShuffle": true, "img": null, "q": "Qué enfermedad corresponde a una apofisitis", "o": ["Sinding-Larsen-Johansson", "Kienböck", "Scheuermann", "Freiberg"], "c": 1, "e": "<b>Apofisitis = osteocondrosis extraarticulares</b>: Osgood-Schlatter (TTA), <b>Sinding-Larsen-Johansson</b> (polo inferior de la rótula) y Sever (calcáneo). Kienböck es la necrosis del semilunar del adulto, Scheuermann es una osteocondrosis fisaria (vértebras) y Freiberg, una articular (2.º metatarsiano). <i>· EX2022, pregunta 11 · T12</i>"}, {"n": "11", "noShuffle": true, "img": null, "q": "Qué características esperaría en el líquido articular de una artritis séptica", "o": ["Claro y transparente", "Glucosa por encima del valor plasmático", "pH > 7", "50.000 células con predominio de polimorfonucleares"], "c": 4, "e": "En la artrocentesis de una artritis séptica el líquido es <b>turbio</b>, con unas <b>50.000 células (75 % PMN)</b> y <b>glucosa baja</b>. Por eso fallan «claro y transparente» y «glucosa por encima del plasma». Es una urgencia: artrocentesis y lavado. <i>· EX2022, pregunta 12 · T12</i>"}, {"n": "12", "noShuffle": true, "img": null, "q": "Tras dormir con el brazo bajo el cuello de la novia, no puede extender la mano derecha (mano péndula): primera sospecha", "o": ["Intoxicación por alcohol", "Lesión del plexo braquial", "Parálisis del nervio radial por compresión", "Cansancio muscular"], "c": 3, "e": "<b>Mano caída</b> (no extiende muñeca ni dedos) = parálisis del <b>nervio radial</b>, aquí por compresión en el brazo durante el sueño. En la lesión del radial a nivel del brazo el <b>tríceps está respetado</b>, lo que la diferencia de una lesión del plexo. La «parálisis del sábado noche» como tal no está en las diapositivas de 2026. <i>· EX2022, pregunta 13 · T23</i>"}, {"n": "13", "noShuffle": true, "img": null, "q": "Un correcto estudio anatomopatológico (biopsia) debe", "o": ["Hacerse de inmediato al ver un tumor en la Rx", "Recoger la menor cantidad de muestra posible", "Hacerse de forma segura para evitar recidivas o diseminación", "Hacerse siempre a cielo abierto"], "c": 3, "e": "La biopsia da el tipo histológico, el grado de malignidad y la respuesta a QT o RT, y debe obtener una <b>muestra adecuada</b>, no la mínima. Es de elección la <b>cerrada</b> (aguja o trépano) con trayecto extirpable; si es abierta, la <b>cicatriz se extirpa íntegra para evitar recidivas locales</b>. Por eso debe hacerse de forma segura. <i>· EX2022, pregunta 14 · T13</i>"}, {"n": "14", "noShuffle": true, "img": null, "q": "Qué característica radiológica correspondería a un tumor maligno", "o": ["Borde escleroso bien delimitado", "Reacción perióstica discontinua o heterogénea", "No afectación de partes blandas", "Lesión circunscrita"], "c": 2, "e": "Rasgos de malignidad en la Rx: <b>reacción perióstica frecuente y discontinua</b> (perpendicular, rayos de sol, capas de cebolla), bordes mal definidos, lesión no circunscrita e <b>invasión de partes blandas</b>. Borde escleroso bien delimitado, lesión circunscrita y partes blandas respetadas son rasgos de tumor benigno. <i>· EX2022, pregunta 15 · T13</i>"}, {"n": "15", "noShuffle": true, "img": null, "q": "En una osteomielitis hematógena aguda en un niño de 6 meses, el germen causal más frecuente es", "o": ["Staphylococcus aureus", "Estreptococo beta-hemolítico", "Haemophilus influenzae", "Salmonella"], "c": 3, "e": "Tus apuntes reparten los gérmenes por edad: en el <b>neonato</b>, estreptococo β-hemolítico; de <b>2 a 6 meses</b>, <b>Haemophilus influenzae</b>; en el niño mayor, <b>S. aureus</b>. Con 6 meses, la respuesta es H. influenzae. Ojo: en conjunto S. aureus causa el 50-90 % de los casos, y Salmonella es la de la anemia falciforme. <b>Pregunta dudosa:</b> 6 meses es justo el límite de la franja. <i>· EX2022, pregunta 16 · T12</i>"}, {"n": "16", "noShuffle": true, "img": null, "q": "La compresión del nervio cubital", "o": ["Solo síntomas motores, sobre todo dificultad para extender muñeca y dedos", "Puede producir atrofia de los interóseos de la mano", "Es positiva la maniobra de Durkan", "Parestesias típicas en 2.º y 3.er dedos"], "c": 2, "e": "La compresión del cubital da <b>hipoestesia dorso-cubital</b> de la mano y debilidad de la musculatura intrínseca: <b>signo de Froment</b> y <b>signo de Wartenberg</b> (no aproxima el meñique). Falla la 1 (no extender muñeca y dedos es del radial). Durkan y las parestesias en los primeros dedos son del túnel carpiano. <i>· EX2022, pregunta 17 · T23</i>"}, {"n": "17", "noShuffle": true, "img": null, "q": "En una artritis gonocócica", "o": ["El germen se aísla muy bien en el líquido sinovial", "Se aísla mejor en exudado uretral o cervical que en el líquido sinovial", "Se diagnostica por serología", "Se diagnostica solo por los contactos sexuales"], "c": 2, "e": "La artritis gonocócica da <b>lesiones pustulosas cutáneas, tenosinovitis y artritis migratoria</b>, y el germen se aísla en el <b>exudado uretral o cervical</b> (medio de cultivo de Thayer-Martin). Se trata con <b>ceftriaxona</b>. En Europa predomina S. aureus; en EE. UU., la gonocócica es más frecuente. <i>· EX2022, pregunta 18 · T12</i>"}, {"n": "18", "noShuffle": true, "img": null, "q": "Ante una lesión muscular aguda en un deportista, qué tratamiento no sería buena idea", "o": ["Hielo", "Vendaje compresivo", "Reposo deportivo", "Masaje profundo"], "c": 4, "e": "La lesión muscular aguda se trata con <b>RICE</b> (reposo, hielo, compresión y elevación) para disminuir y controlar el hematoma. El <b>masaje</b> precoz es mala idea: la <b>fisioterapia intempestiva (masajes)</b> figura entre las causas de miositis osificante. <i>· EX2022, pregunta 19 · T05</i>"}, {"n": "19", "noShuffle": true, "img": null, "q": "Qué injerto tiene mayor capacidad osteogénica", "o": ["Aloinjerto de cadáver congelado", "BMP-7", "Hidroxiapatita", "Autoinjerto de cresta ilíaca"], "c": 4, "e": "<b>Solo el autoinjerto es osteogénico</b>; por eso el autoinjerto de <b>cresta ilíaca</b> es el patrón de referencia. El aloinjerto (congelado o liofilizado) es acelular; la hidroxiapatita solo es osteoconductora, y las BMP recombinantes son osteoinductoras, pero no osteogénicas. <i>· EX2022, pregunta 20 · T01</i>"}, {"n": "20", "noShuffle": true, "img": null, "q": "Piloto del Dakar con fractura de tibia; al día siguiente confuso, disneico y con petequias: sospecha", "o": ["Embolia grasa", "Síndrome compartimental", "Neumotórax", "Hemorragia cerebral"], "c": 1, "e": "Fractura de <b>hueso largo</b> seguida de clínica <b>pulmonar</b> (disnea), <b>cerebral</b> (confusión) y <b>cutánea</b> (<b>petequias</b> en axila, pecho y conjuntiva) = <b>embolia grasa</b>. Afecta a un 10 % de los politraumas, más en la 2.ª-3.ª década. Ojo: en 2026 solo se enumera; la clínica viene de la ampliación de tus apuntes. <i>· EX2022, pregunta 22 · T09_10</i>"}, {"n": "21", "noShuffle": true, "img": null, "q": "El absceso de Brodie", "o": ["Imagen típica de tumor cartilaginoso", "Lesión típica de artritis séptica hematógena aguda", "Forma de osteomielitis subaguda hematógena", "Imagen de caderas en la displasia epifisaria múltiple"], "c": 3, "e": "El <b>absceso de Brodie</b> es una forma especialmente insidiosa de <b>osteomielitis subaguda hematógena</b> por gérmenes de baja virulencia (50 % S. aureus). Es típico de la <b>tibia</b> de adultos jóvenes: lesión lítica con <b>borde escleroso</b> que simula un tumor, y por eso se trata con biopsia y curetaje. <i>· EX2022, pregunta 23 · T12</i>"}], "r2021": [{"n": "1", "noShuffle": true, "img": null, "q": "El diagnóstico de una epicondilitis se confirma mediante", "o": ["RM", "Ecografía", "Extensión contra resistencia de muñeca y dedos con el codo en extensión", "Flexión contra resistencia de mano y dedos con el codo en flexión de 90º"], "c": 3, "e": "La epicondilitis se confirma con <b>pruebas de provocación</b>: el <b>signo de Cozen</b> (el explorador estabiliza el codo y opone resistencia a la extensión de la muñeca) y la extensión resistida de muñeca y del dedo medio. La Rx suele ser normal y la eco solo complementa. La flexión resistida es la provocación de la epitrocleítis. <i>· R2021, pregunta 2 · T23</i>"}, {"n": "2", "noShuffle": true, "img": null, "q": "La quimioterapia neoadyuvante en los tumores óseos malignos significa", "o": ["Que se usan solo fármacos de tercera generación", "Que al mes de la intervención se hacen 3 ciclos", "Que se dan ciclos antes de intervenir para reducir el tumor y luego otra vez después", "Que se da ácido fólico a la vez que radioterapia"], "c": 3, "e": "Neoadyuvante = <b>antes del tratamiento quirúrgico definitivo</b>, para <b>disminuir la masa a resecar</b> y mejorar la radicalidad (la introdujo Rosen; muy útil en osteosarcoma y Ewing). La 3 es la única opción que recoge ese «antes». La que se da solo tras la cirugía, para erradicar restos subclínicos, es la adyuvante. <i>· R2021, pregunta 6 · T13</i>"}, {"n": "3", "noShuffle": true, "img": null, "q": "En el aparato locomotor, una gran ventaja de la ecografía es", "o": ["Radiación similar a una Rx simple", "Se ven muy bien los ligamentos cruzados", "Permite exploración funcional a la vez que se obtienen las imágenes", "No depende del radiólogo que la haga"], "c": 3, "e": "La ecografía trabaja en <b>tiempo real (dinámica)</b>: permite explorar el movimiento mientras se obtienen las imágenes. Además es portátil y <b>sin radiación</b>. Fallan las demás: no irradia, es <b>muy dependiente del explorador</b> y no atraviesa hueso. <i>· R2021, pregunta 8 · T01</i>"}, {"n": "4", "noShuffle": true, "img": null, "q": "No es una indicación absoluta de tratamiento quirúrgico de las fracturas de clavícula", "o": ["Abiertas o con riesgo de perforar la piel", "Accidente laboral", "Politraumatismo con inmovilización imposible", "Floating shoulder (clavícula + escápula)"], "c": 2, "e": "Indicaciones quirúrgicas de la clavícula en tus apuntes: <b>lesión vasculonerviosa, gran desplazamiento, protrusión en piel</b> (riesgo de necrosis cutánea), <b>asociación a fractura de escápula</b> (hombro flotante) y tercio externo Neer II. El <b>accidente laboral</b> no es indicación: la gran mayoría se tratan de forma conservadora, 4-6 semanas con cabestrillo o vendaje en ocho. Ojo: el politraumatismo tampoco está en la lista de tus apuntes; la respuesta que da el examen es el accidente laboral. <i>· R2021, pregunta 9 · brazo</i>"}, {"n": "5", "noShuffle": true, "img": null, "q": "Primer episodio de lumbalgia de 3 semanas en paciente de 45 años, sin traumatismo ni déficit neurológico: qué prueba de imagen", "o": ["RM", "Rx simple de columna lumbar por ser el primer episodio", "TAC", "No hay indicación de prueba de imagen"], "c": 4, "e": "A los 45 años, sin traumatismo ni déficit neurológico, no hay banderas rojas, y <b>sin banderas rojas no se pide imagen</b>. En conjunto son muy sensibles: si no hay ninguna, se descarta con gran seguridad una enfermedad grave. La alerta de enfermedad grave lleva a <b>RM</b>; el resto de alertas, a Rx más analítica. <i>· R2021, pregunta 11 · T28</i>"}, {"n": "6", "noShuffle": true, "img": null, "q": "Tratamiento de la pseudoartrosis hipertrófica de huesos largos", "o": ["No hace falta injerto pero sí estabilizar el foco", "Siempre hay que aportar injerto", "Altas dosis de vitamina C", "Primero bisfosfonatos o magnetoterapia"], "c": 1, "e": "La pseudoartrosis <b>hipertrófica</b> (viable, «pata de elefante») tiene un problema <b>mecánico</b>, exceso de movilidad: basta con <b>fijación rígida</b>, sin injerto. El injerto se reserva para la hipotrófica o atrófica (no viable, «pico de flauta»), cuyo problema es biológico: injerto más fijación rígida. <i>· R2021, pregunta 12 · T09_10</i>"}, {"n": "7", "noShuffle": true, "img": null, "q": "Una hernia discal posterolateral derecha L5-S1 puede producir todo lo siguiente excepto", "o": ["Ausencia de reflejo rotuliano", "Dolor radicular irradiado al tobillo derecho", "Disestesia en dorso del pie derecho", "Claudicación de puntillas"], "c": 1, "e": "La hernia posterolateral comprime la raíz del número siguiente: en L5-S1, la <b>S1</b> (dolor por la cara posterior de la pierna hasta el talón, no camina de <b>puntillas</b>, aquíleo abolido). El <b>rotuliano es L4</b>: una hernia L5-S1 nunca lo afecta. Ojo: en tus apuntes el <b>dorso del pie es L5</b>, así que la disestesia en el dorso tampoco encaja con S1: hay dos opciones que no cuadran y la más clara es el rotuliano. <i>· R2021, pregunta 14 · T28</i>"}, {"n": "8", "noShuffle": true, "img": null, "q": "Principal indicación de un fijador externo", "o": ["Fracturas desplazadas en general", "Fractura abierta", "Olécranon", "Clavícula de tercio externo desplazada"], "c": 2, "e": "Tus apuntes ligan el <b>fijador externo</b> a la <b>fractura abierta</b> grave: en los tipos <b>IIIA y IIIB</b> se mantiene hasta consolidar (o se retira antes de 2 semanas para un enclavado endomedular) y en el <b>IIIC</b> es el tratamiento definitivo. Las otras opciones no aparecen como indicación del fijador. <i>· R2021, pregunta 15 · T09_10</i>"}, {"n": "9", "noShuffle": true, "img": null, "q": "Qué síntoma no se presenta en un síndrome compartimental agudo (repetida: también cayó en EX2022)", "o": ["Trastornos sensitivos periféricos", "Trastornos motores", "Dolor intenso no relacionado con el traumatismo", "Ausencia de pulsos periféricos"], "c": 4, "e": "En el síndrome compartimental agudo los <b>pulsos están presentes al inicio</b>: la presión que lo produce está por debajo de la arterial, así que se pierde la perfusión capilar mucho antes que el pulso. Sí aparecen <b>dolor desproporcionado</b> (sobre todo al estiramiento pasivo), parestesias precoces y parálisis tardía. <i>· R2021, pregunta 16 · T05</i>"}, {"n": "10", "noShuffle": true, "img": null, "q": "Qué característica radiológica corresponde a un tumor benigno", "o": ["Extensión a partes blandas", "Reacción perióstica en rayos de sol", "Bordes mal definidos", "Patrón de destrucción geográfico"], "c": 4, "e": "El patrón <b>geográfico</b> (IA-IC) es el <b>menos agresivo</b>, propio de lesiones de crecimiento lento; el permeativo es el más agresivo. La extensión a partes blandas, la reacción perióstica en <b>rayos de sol</b> y los bordes mal definidos son rasgos de <b>malignidad</b>. <i>· R2021, pregunta 17 · T13</i>"}, {"n": "11", "noShuffle": true, "img": null, "q": "Mujer de 65 años, fractura-luxación anterior de hombro reducida; al quitar el cabestrillo, disestesia en cara lateral del hombro, manguito indemne en RM: diagnóstico", "o": ["Neuropatía del supraescapular", "Tendinopatía del redondo mayor", "Lesión del nervio axilar", "Capsulitis adhesiva"], "c": 3, "e": "Hombro luxado + <b>hipoestesia en la cara lateral del hombro</b> (región deltoidea) + <b>manguito sano</b> en la RM = lesión del <b>nervio axilar</b> (circunflejo). Por eso en toda luxación de hombro hay que explorar siempre el pulso distal y el nervio axilar, con su sensibilidad deltoidea. <i>· R2021, pregunta 20 · brazo</i>"}, {"n": "12", "noShuffle": true, "img": null, "q": "Característica que no hay que valorar en la Rx simple de un tumor óseo", "o": ["Los bordes de la lesión", "La respuesta perióstica", "La extensión a partes blandas", "La acumulación de líquido"], "c": 4, "e": "En la Rx de un tumor óseo se responden las <b>4 preguntas de Enneking</b>: localización, efecto en el hueso (cortical, canal medular), <b>respuesta del hueso</b> (bordes, expansión, <b>reacción perióstica</b>) y matriz; y se mira si hay <b>invasión de partes blandas</b>. La «acumulación de líquido» no figura entre los criterios. <i>· R2021, pregunta 21 · T13</i>"}, {"n": "13", "noShuffle": true, "img": null, "q": "Las imágenes de la fase precoz de una gammagrafía con difosfonato de hidroximetileno-Tc99", "o": ["Indican el consumo local de glucosa", "Indican el grado de vascularización local", "Indican la actividad osteoclástica", "Miden la actividad osteoblástica"], "c": 2, "e": "En la <b>fase temprana</b>, poco tras la inyección, el isótopo está aún en sangre y espacio perivascular: refleja el <b>flujo local</b>, es decir, la vascularización. La <b>fase ósea retardada, a las 3 horas</b>, es la que muestra la actividad ósea. El consumo de glucosa lo mide el <b>PET</b> (18F-FDG). <i>· R2021, pregunta 24 · T01</i>"}, {"n": "14", "noShuffle": true, "img": null, "q": "El llamado síndrome de la encrucijada del antebrazo", "o": ["Conflicto mecánico en la zona de cruce del extensor largo del pulgar y los radiales", "Dolor en cara lateral del codo que aumenta con la extensión de muñeca", "Es la causa de los dedos en resorte", "Conflicto en el 1.er compartimento dorsal (extensor corto y abductor largo del pulgar)"], "c": 1, "e": "El <b>síndrome de la intersección</b> (encrucijada) es una tenosinovitis del <b>2.º compartimento</b> (1.er y 2.º radial) en el punto donde lo cruza el 1.er compartimento, unos <b>4 cm proximal a la muñeca</b>. La 1 es la única que sitúa el conflicto en el cruce con los radiales. La 4 describe De Quervain, y la 2, la epicondilitis. Ojo: en tus apuntes lo que cruza los radiales es el <b>1.er compartimento</b> (abductor largo y extensor corto), no el extensor largo: la 1 sale por descarte. <i>· R2021, pregunta 25 · T26</i>"}, {"n": "15", "noShuffle": true, "img": null, "q": "Lesión de Stener o pulgar del guardabosques: señale lo falso", "o": ["Se interpone la aponeurosis del aductor y el ligamento no cicatriza en su sitio", "Arrancamiento del colateral cubital de la MCF del pulgar", "Siempre se indica cirugía", "Se trata siempre con inmovilización unas 3 semanas"], "c": 4, "e": "Pulgar del esquiador o guardabosques = lesión del <b>colateral cubital de la MCF</b>; en la <b>lesión de Stener</b> se interpone la <b>aponeurosis del adductor</b>. Es falso que siempre baste con inmovilizar: solo las <b>parciales</b> llevan yeso 3-6 semanas; las <b>completas</b>, como el Stener, requieren reparación o reinserción del ligamento. Duda: tus apuntes no dicen que la cirugía sea «siempre». <i>· R2021, pregunta 26 · T25</i>"}, {"n": "16", "noShuffle": true, "img": null, "q": "Qué deformidad tras una fractura diafisaria en un niño se remodela peor", "o": ["Angulación anteroposterior", "Rotación", "Angulación lateral", "Desplazamiento lateral en plano frontal"], "c": 2, "e": "En el niño se corrigen sobre todo las deformidades <b>angulares</b>, mejor si son metafisarias, en el plano de movimiento y con más de 2 años de crecimiento por delante. La <b>rotación prácticamente no se corrige</b>: es la deformidad que peor remodela. <i>· R2021, pregunta 34 · T11</i>"}, {"n": "17", "noShuffle": true, "img": null, "q": "Mujer de 53 años, Colles cerrada reducida con yeso antebraquial, sin osteoporosis, tratamiento conservador: tiempo de inmovilización", "o": ["Máximo 6 semanas", "Máximo 2 semanas", "Máximo 14 semanas", "Máximo 10 semanas"], "c": 1, "e": "Una fractura de radio distal tratada de forma conservadora, no desplazada o reducida con parámetros aceptables, lleva <b>yeso 6 semanas</b>. Es el tiempo de radio distal de tus apuntes; para comparar, el escafoides no desplazado lleva 8 semanas. Dos semanas se queda corto, y 10 o 14 no aparecen. <i>· R2021, pregunta 35 · T24</i>"}, {"n": "18", "noShuffle": true, "img": null, "q": "Señale la cierta (osteocondrosis)", "o": ["Perthes afecta sobre todo a la rodilla", "Sever afecta sobre todo al 2.º metatarsiano", "Freiberg afecta sobre todo al tobillo", "Panner afecta sobre todo al codo"], "c": 4, "e": "Osteocondrosis por localización: <b>Panner = cóndilo humeral (codo)</b>, <b>Freiberg = 2.º metatarsiano</b>, <b>Perthes = cadera</b> y <b>Sever = calcáneo</b>. Las otras tres opciones tienen la localización cambiada. <i>· R2021, pregunta 37 · T12</i>"}, {"n": "19", "noShuffle": true, "img": null, "q": "Señale la falsa sobre tendinopatías", "o": ["Las llamadas tendinitis tienen poco componente inflamatorio: mejor «tendinopatía por sobrecarga»", "Las tendinopatías por sobrecarga son muy frecuentes en deportistas", "La tendinitis calcificante requiere RM; la Rx suele salir normal", "En la rotura completa del Aquiles la maniobra de Thompson suele ser positiva"], "c": 3, "e": "Es falsa porque no «requiere» RM: las pruebas de la tendinitis calcificante son <b>Rx, ecografía (la más sensible) y RM</b>, y la Rx muestra el calcio. Las demás son ciertas: es más riguroso hablar de <b>tendinosis o tendinopatía</b> que de tendinitis, y la maniobra de <b>Thompson</b> explora la rotura del Aquiles. <i>· R2021, pregunta 39 · T02</i>"}, {"n": "20", "noShuffle": t /* ── CSS dinámico ── */
function injectSecCSS(){
  var css='';
  SECS.forEach(function(s){
    var m=META.secciones[s]||{};
    var c=m.color||'#1a56db',cd=m.colorDim||'#e8f0fe';
    css+='.tab.t-'+s+'.on{background:'+cd+';color:'+c+';border-color:'+c+'}\n';
    css+='.ph.s-'+s+'{border-left:4px solid '+c+'}\n';
    // Variables CSS por sección para el badge coloreado
    css+='#panel-'+s+' .qnum.sec-colored{background:'+cd+';color:'+c+'}\n';
  });
  var st=document.createElement('style');st.textContent=css;document.head.appendChild(st);
}

function buildHeader(){

  var pt=document.getElementById('page-title');if(pt)pt.textContent=META.titulo||'Banco MIR';
