<!--
=============================================================
  MOTOR BANCO MIR — v10
  Novedades respecto a v9:
  - Numeración correlativa fija por sección (no se mezcla)
  - Badge neutro en pestaña "Todos" + mezcla real inter-secciones
  - Temporizador sticky editable en header (play/pausa/reset)
  - Buscador de texto en tiempo real
  - Modo repaso rápido (muestra RC + explicación directamente)
  - Estadísticas de errores recurrentes entre sesiones
=============================================================
-->
<!DOCTYPE html>
<html lang="es" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title id="page-title">Banco MIR</title>
<style>
:root{
  --bg:#f4f3ef;--surf:#fff;--bd:#e5e5e5;--bd2:#ddd;
  --txt:#1a1a1a;--txt2:#555;--txt3:#999;--txt4:#666;
  --hdr:#1a1a1a;--hdr-t:#fff;
  --ok-bg:#e6f9ef;--ok-t:#0b6e52;--ok-bd:#2da060;
  --ko-bg:#fdecea;--ko-t:#b91c1c;--ko-bd:#d94f45;
  --sc-ok:#dcf5ed;--sc-ko:#fdecea;--sc-rem:#f0f0f0;--sc-rem-t:#666;
  --exp:#fffbe6;--exp-bd:#f0c04a;--exp-t:#5a4500;
  --prog:#e5e5e5;--prog-fill:#1a56db;
  --star:#ccc;--star-on:#f59e0b;
  --hint:#fafafa;--hint-bd:#eee;
  --tab-bd:#ddd;--tab-t:#555;
  --all-bg:#e8f0fe;--all-t:#1a56db;--all-bd:#1a56db;
  --fab:#1a1a1a;--fab-t:#fff;
  --nota-btn-t:#1a56db;--nota-btn-bd:#1a56db;--nota-btn-bg:var(--surf);
  --timer-bg:#222;--timer-t:#fff;--timer-danger:#ef4444;
}
[data-theme="dark"]{
  --bg:#0f0f1a;--surf:#1e1e30;--bd:#2a2a45;--bd2:#333355;
  --txt:#e8e8f0;--txt2:#aaa;--txt3:#555;--txt4:#888;
  --hdr:#0a0a14;--hdr-t:#e8e8f0;
  --ok-bg:#0b3020;--ok-t:#4ade80;--ok-bd:#166534;
  --ko-bg:#2d0a0a;--ko-t:#f87171;--ko-bd:#7f1d1d;
  --sc-ok:#0b3020;--sc-ko:#2d0a0a;--sc-rem:#252540;--sc-rem-t:#aaa;
  --exp:#1a1500;--exp-bd:#a37f10;--exp-t:#d4b84a;
  --prog:#2a2a45;--prog-fill:#60a5fa;
  --star:#444;--star-on:#f59e0b;
  --hint:#1a1a2e;--hint-bd:#2a2a45;
  --tab-bd:#2a2a45;--tab-t:#aaa;
  --all-bg:#1a2a4a;--all-t:#60a5fa;--all-bd:#3b82f6;
  --fab:#2a2a50;--fab-t:#e8e8f0;
  --nota-btn-t:#60a5fa;--nota-btn-bd:#3b82f6;--nota-btn-bg:var(--surf);
  --timer-bg:#1a1a2e;--timer-t:#e8e8f0;
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:var(--bg);color:var(--txt);min-height:100vh;transition:background .25s,color .25s}

/* ── Header ── */
header{background:var(--hdr);color:var(--hdr-t);padding:9px 16px;display:flex;align-items:center;justify-content:space-between;gap:8px;flex-wrap:wrap;position:sticky;top:0;z-index:100}
header h1{font-size:13.5px;font-weight:600;white-space:nowrap}
.hright{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.hmeta{font-size:11px;color:#888}
.hbtn{background:none;border:none;cursor:pointer;font-size:16px;line-height:1;padding:3px 5px;border-radius:5px;transition:background .15s;color:var(--hdr-t)}
.hbtn:hover{background:rgba(255,255,255,.12)}
.sbadge{font-size:11px;padding:3px 9px;border-radius:5px;font-weight:500}
.sbadge.ok{background:#15803d;color:#dcfce7}.sbadge.warn{background:#92400e;color:#fef3c7}

/* ── Temporizador ── */
#timer-wrap{display:flex;align-items:center;gap:4px;background:var(--timer-bg);border-radius:7px;padding:3px 8px;border:1px solid rgba(255,255,255,.1)}
#timer-display{font-size:13px;font-weight:700;font-family:monospace;color:var(--timer-t);min-width:58px;text-align:center;cursor:pointer;border-radius:3px;padding:1px 3px}
#timer-display:hover{background:rgba(255,255,255,.08)}
#timer-display.editing{background:rgba(255,255,255,.15);outline:none;color:var(--timer-t)}
#timer-display.danger{color:var(--timer-danger)}
#timer-wrap button{background:none;border:none;cursor:pointer;color:rgba(255,255,255,.7);font-size:12px;padding:1px 3px;border-radius:3px;line-height:1}
#timer-wrap button:hover{background:rgba(255,255,255,.12);color:#fff}

/* ── Barra de progreso ── */
#prog-wrap{height:3px;background:var(--prog);position:sticky;top:40px;z-index:99}
#prog-bar{height:100%;background:var(--prog-fill);width:0%;transition:width .4s}

/* ── Contenedor ── */
.container{max-width:820px;margin:0 auto;padding:16px 12px}

/* ── Buscador ── */
.search-wrap{position:relative;margin-bottom:13px}
.search-wrap input{width:100%;padding:8px 34px 8px 12px;border:1.5px solid var(--bd2);border-radius:8px;font-size:13px;background:var(--surf);color:var(--txt);outline:none;transition:border-color .15s}
.search-wrap input:focus{border-color:var(--prog-fill)}
.search-clear{position:absolute;right:9px;top:50%;transform:translateY(-50%);background:none;border:none;cursor:pointer;color:var(--txt3);font-size:16px;display:none;line-height:1}
#search-count{font-size:11px;color:var(--txt3);margin-top:4px;display:none}

/* ── Modo repaso ── */
.mode-bar{display:flex;gap:6px;margin-bottom:12px;align-items:center}
.mode-btn{padding:5px 12px;border:1.5px solid var(--bd2);border-radius:7px;cursor:pointer;font-size:12px;font-weight:500;background:var(--surf);color:var(--txt2);transition:all .15s}
.mode-btn:hover{border-color:#999}
.mode-btn.on{background:var(--all-bg);color:var(--all-t);border-color:var(--all-bd)}

/* ── Tabs ── */
.tabs{display:flex;gap:7px;margin-bottom:13px;flex-wrap:wrap}
.tab{padding:7px 14px;border:1.5px solid var(--tab-bd);border-radius:8px;cursor:pointer;font-size:12.5px;font-weight:500;background:var(--surf);color:var(--tab-t);transition:all .15s}
.tab:hover{border-color:#999;color:var(--txt)}
.tab.t-all.on{background:var(--all-bg);color:var(--all-t);border-color:var(--all-bd)}

/* ── Score global ── */
.ph-global{background:var(--surf);border-radius:10px;border:1px solid var(--bd);padding:10px 15px;margin-bottom:10px;display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;border-left:4px solid var(--prog-fill)}
.score-row{display:flex;gap:7px;align-items:center;flex-wrap:wrap}
.sc{font-size:12px;font-weight:600;padding:3px 9px;border-radius:6px}
.sc.ok{background:var(--sc-ok);color:var(--ok-t)}.sc.ko{background:var(--sc-ko);color:var(--ko-t)}.sc.rem{background:var(--sc-rem);color:var(--sc-rem-t)}

/* ── Acciones ── */
.global-actions{display:none;margin-bottom:10px;gap:7px;flex-wrap:wrap;align-items:center}
.container[data-tab="all"] .global-actions{display:flex}
.sec-actions{margin:6px 0 15px;display:flex;gap:7px;flex-wrap:wrap}
.reset-btn{padding:7px 14px;background:var(--fab);color:var(--fab-t);border:none;border-radius:8px;cursor:pointer;font-size:12.5px;font-weight:500;transition:opacity .15s}
.reset-btn:hover{opacity:.82}
.nota-btn{padding:7px 14px;background:var(--nota-btn-bg);color:var(--nota-btn-t);border:1.5px solid var(--nota-btn-bd);border-radius:8px;cursor:pointer;font-size:12.5px;font-weight:500;transition:background .15s}
.nota-btn:hover{background:var(--all-bg)}

/* ── Nota box ── */
.nota-box,.global-nota-box{margin-top:8px;padding:12px 15px;border-radius:10px;border:2px solid var(--bd2);font-size:13px;line-height:1.7;display:none}
.nota-box.pass,.global-nota-box.pass{background:var(--ok-bg);border-color:var(--ok-bd);color:var(--ok-t)}
.nota-box.fail,.global-nota-box.fail{background:var(--ko-bg);border-color:var(--ko-bd);color:var(--ko-t)}
.nota-score{font-size:26px;font-weight:700;display:block;margin-bottom:4px}
.nota-detail{font-size:12px;opacity:.85;font-family:monospace}

/* ── Vista revisión ── */
.review-list{margin-top:12px;border-top:1px solid var(--bd2);padding-top:10px}
.review-title{font-size:12px;font-weight:700;margin-bottom:9px;color:var(--txt)}
.review-sec-label{font-size:11.5px;font-weight:700;color:var(--txt3);margin:8px 0 5px;padding-top:6px;border-top:1px solid var(--bd)}
.review-item{background:var(--surf);border-radius:8px;border:1px solid var(--bd);margin-bottom:7px;overflow:hidden}
.review-item summary{padding:9px 12px;cursor:pointer;font-size:12.5px;color:var(--txt);list-style:none;display:flex;gap:8px;align-items:flex-start}
.review-item summary::-webkit-details-marker{display:none}
.review-item summary::before{content:'▶';font-size:9px;color:var(--txt3);flex-shrink:0;margin-top:4px;transition:transform .18s}
details[open] summary::before{transform:rotate(90deg)}
.review-body{padding:0 12px 11px}
.review-ans{font-size:12px;color:var(--ok-t);margin-bottom:7px;font-weight:500}

/* ── Estadísticas ── */
.stats-box{margin-top:8px;padding:12px 15px;border-radius:10px;border:1.5px solid var(--bd2);background:var(--surf);display:none}
.stats-box.show{display:block}
.stats-title{font-size:12px;font-weight:700;margin-bottom:10px;color:var(--txt)}
.stats-item{display:flex;align-items:center;gap:8px;padding:6px 0;border-bottom:1px solid var(--bd);font-size:12.5px}
.stats-item:last-child{border-bottom:none}
.stats-bar-wrap{flex:1;background:var(--sc-rem);border-radius:4px;height:6px;overflow:hidden}
.stats-bar{height:100%;background:var(--ko-bd);border-radius:4px;transition:width .4s}
.stats-n{font-size:11px;color:var(--txt3);white-space:nowrap}
.stats-q{flex:2;color:var(--txt);font-size:12px;line-height:1.3}

/* ── Panel secciones ── */
.sec-panel{display:none}.sec-panel.visible{display:block}
.ph{background:var(--surf);border-radius:10px;border:1px solid var(--bd);padding:10px 14px;margin-bottom:8px;display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.ph-left{flex:1;display:flex;flex-direction:column;gap:5px}
.ph-label{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;color:var(--txt3);margin-bottom:1px}
.ph-desc{font-size:12px;color:var(--txt4)}
.fbtn{padding:6px 12px;font-size:12px;font-weight:500;border:1.5px solid var(--bd2);border-radius:8px;cursor:pointer;background:var(--surf);color:var(--txt2);transition:all .15s;white-space:nowrap}
.fbtn:hover{border-color:#999;color:var(--txt)}.fbtn.on{background:var(--ko-bg);color:#b91c1c;border-color:#f87171}
.no-failed{display:none;text-align:center;padding:16px;color:var(--txt3);font-size:13px;border:1.5px dashed var(--bd2);border-radius:8px;margin-top:4px}
.no-failed.show{display:block}
.no-results{display:none;text-align:center;padding:20px;color:var(--txt3);font-size:13px;border:1.5px dashed var(--bd2);border-radius:8px;margin:8px 0}

/* ── Hint ── */
.hint{font-size:11px;color:var(--txt3);margin-bottom:15px;padding:7px 11px;background:var(--hint);border-radius:6px;border:1px solid var(--hint-bd)}

/* ── Tarjeta ── */
.qcard{background:var(--surf);border-radius:10px;border:1px solid var(--bd);margin-bottom:7px;overflow:hidden;transition:box-shadow .15s}
.qcard:hover{box-shadow:0 2px 8px rgba(0,0,0,.08)}
.qcard.kb-focus{outline:2px solid var(--prog-fill);outline-offset:-2px}
.qcard.search-hidden{display:none}
.qhead{padding:11px 13px;cursor:pointer;display:flex;align-items:flex-start;gap:9px}

/* ── Badge numérico ── */
.qnum{font-size:11px;font-weight:700;padding:3px 7px;border-radius:5px;white-space:nowrap;flex-shrink:0;margin-top:2px;background:var(--sc-rem);color:var(--sc-rem-t)}
/* En pestaña "Todos" siempre neutro; en sección aplica color de sección */
.qnum.sec-colored{background:var(--sec-dim);color:var(--sec-col)}

.qtxt{font-size:13px;line-height:1.5;flex:1}
.star-btn{background:none;border:none;cursor:pointer;font-size:15px;color:var(--star);padding:0 2px;flex-shrink:0;margin-top:2px;line-height:1;transition:color .15s,transform .15s}
.star-btn:hover{transform:scale(1.2)}
.star-btn .si{display:inline}.star-btn .sf{display:none}
.star-btn.on .si{display:none}.star-btn.on .sf{display:inline;color:var(--star-on)}
.chev{font-size:15px;color:var(--bd2);flex-shrink:0;margin-top:2px;transition:transform .2s}
.qhead.open .chev{transform:rotate(180deg)}
.qbody{display:none;padding:0 13px 13px}.qbody.open{display:block}

/* ── Imagen ── */
.clinimg-wrap{margin:9px 0 7px;background:#111;border-radius:8px;overflow:hidden;border:1px solid var(--bd2);text-align:center}
.clinimg{max-width:100%;max-height:340px;object-fit:contain;display:block;margin:0 auto}
.clinimg-cap{font-size:11px;color:var(--txt3);padding:4px 0 5px;background:var(--hint);border-top:1px solid var(--bd)}

/* ── Opciones ── */
.opts{list-style:none;margin-top:9px;display:flex;flex-direction:column;gap:5px}
.opt{padding:9px 12px;border-radius:8px;border:1.5px solid var(--bd2);cursor:pointer;display:flex;align-items:flex-start;gap:9px;color:var(--txt);font-size:13px;line-height:1.45;transition:border-color .12s,background .12s;user-select:none}
.opt:hover:not(.done){border-color:#999;background:var(--hint)}
.opt.correct{background:var(--ok-bg);border-color:var(--ok-bd);color:var(--ok-t);font-weight:500;cursor:default}
.opt.wrong{background:var(--ko-bg);border-color:var(--ko-bd);color:var(--ko-t);cursor:default}
.opt.done:not(.correct):not(.wrong){cursor:default;opacity:.7}
.onum{font-size:11px;font-weight:700;flex-shrink:0;margin-top:2px;min-width:15px}

/* ── Modo repaso rápido ── */
.quick-card{padding:9px 12px;border-radius:8px;border:1.5px solid var(--ok-bd);background:var(--ok-bg);margin-top:8px}
.quick-rc{font-size:12.5px;font-weight:600;color:var(--ok-t);margin-bottom:6px}

/* ── Explicación ── */
.expbox{margin-top:10px;padding:10px 12px;background:var(--exp);border-left:4px solid var(--exp-bd);border-radius:0 8px 8px 0;font-size:12.5px;color:var(--exp-t);line-height:1.65}
.expbox b,.expbox strong{font-weight:600}
.et{display:block;margin-bottom:4px;font-weight:600;font-size:13px}
.atag{font-size:10px;padding:2px 6px;border-radius:4px;margin-left:5px;vertical-align:middle}
.atag.ok{background:var(--sc-ok);color:var(--ok-t)}.atag.ko{background:var(--sc-ko);color:#c0392b}

/* ── All-tab CSS ── */
.container[data-tab="all"] .ph{display:none!important}
.container[data-tab="all"] .sec-actions{display:none!important}
.container[data-tab="all"] .no-failed{display:none!important}
.container[data-tab="all"] .nota-box{display:none!important}
.container:not([data-tab="all"]) .global-nota-box{display:none!important}
.container:not([data-tab="all"]) #stats-global{display:none!important}

/* ── Contadores ✓ ✗ ○ pulsables: filtran las preguntas ── */
.sc.ok,.sc.ko,.sc.rem{cursor:pointer;user-select:none;-webkit-user-select:none;transition:box-shadow .15s}
.sc.ok:hover,.sc.ko:hover,.sc.rem:hover{box-shadow:0 0 0 1px var(--bd2)}
.sc.ok.on{box-shadow:0 0 0 1.5px var(--ok-t)}
.sc.ko.on{box-shadow:0 0 0 1.5px var(--ko-t)}
.sc.rem.on{box-shadow:0 0 0 1.5px var(--sc-rem-t)}
.qcard.rem-hidden{display:none!important}
.no-rem{display:none;text-align:center;padding:16px;color:var(--txt3);font-size:13px;border:1.5px dashed var(--bd2);border-radius:8px;margin-top:4px}
</style>
</head>
<body>
<header>
  <h1 id="h-tit">Banco MIR</h1>
  <div class="hright">
    <span class="hmeta" id="h-meta"></span>
    <!-- Temporizador -->
    <div id="timer-wrap" title="Haz clic en el tiempo para editar">
      <span id="timer-display">0:00:00</span>
      <button id="btn-tplay" onclick="timerToggle()" title="Play/Pausa">▶</button>
      <button onclick="timerReset()" title="Reset">↺</button>
    </div>
    <button class="hbtn" id="btn-dark" onclick="toggleDark()" title="Modo oscuro">🌙</button>
    <span id="save-badge" class="sbadge"></span>
  </div>
</header>
<div id="prog-wrap"><div id="prog-bar"></div></div>

<div class="container" id="main-cont" data-tab="all">
  <!-- Buscador -->
  <div class="search-wrap">
    <input type="text" id="search-input" placeholder="🔍 Buscar en enunciados..." oninput="onSearch(this.value)">
    <button class="search-clear" id="search-clear" onclick="clearSearch()">✕</button>
  </div>
  <div id="search-count"></div>

  <!-- Modo -->
  <div class="mode-bar">
    <span style="font-size:11.5px;color:var(--txt3);font-weight:600">MODO:</span>
    <button class="mode-btn on" id="mode-test" onclick="setMode('test')">📝 Test</button>
    <button class="mode-btn" id="mode-quick" onclick="setMode('quick')">⚡ Repaso rápido</button>
    <button class="mode-btn" id="btn-stars" onclick="filterStarred()" style="margin-left:auto;border-color:#f59e0b;color:#b45309">⭐ Marcadas</button>
    <button class="mode-btn" id="btn-stats" onclick="toggleStats()">📊 Errores</button>
  </div>

  <!-- Stats globales -->
  <div class="stats-box" id="stats-global"></div>

  <!-- Tabs -->
  <div class="tabs" id="tabs-wrap"></div>

  <!-- Score global -->
  <div class="ph-global">
    <div class="ph-left">
      <span class="ph-desc" id="ph-gdesc"></span>
      <div class="score-row">
        <span class="sc ok" id="sc-ok-all">✓ 0</span>
        <span class="sc ko" id="sc-ko-all">✗ 0</span>
        <span class="sc rem" id="sc-rem-all">○ 0</span>
      </div>
    </div>
  </div>
  <div class="global-actions">
    <button class="reset-btn" onclick="resetAll()">↺ Reiniciar y mezclar</button>
    <button class="nota-btn" onclick="calcNotaAll()">✎ Calcular nota global</button>
  </div>
  <div class="global-nota-box" id="nota-all"></div>
  <p class="hint">💡 <b>1–5</b> responde · <b>↑↓</b> navega · <b>S</b> marca ⭐ · Progreso guardado automáticamente</p>

  <div id="panels-wrap"></div>
</div>

<script>
/* ═══════════════════════════════════════ MOTOR v10 ═══════════════════════════════════════ */

var KEY=/*__KEY__*/'trauma_basico_v1';

var D=/*__D_JSON__*/{"t1":[{"n":"1","noShuffle":false,"img":null,"q":"Mujer de 45 a\u00f1os con dolor en las manos que la despierta de madrugada y rigidez matutina de una hora. \u00bfQu\u00e9 patr\u00f3n de dolor es?","o":["Irradiado radicular","Inflamatorio","Mec\u00e1nico","Referido"],"c":2,"e":"Despertar de madrugada y rigidez de <b>m\u00e1s de 30-60 min</b> definen el dolor <b>inflamatorio</b>; el mec\u00e1nico alivia con reposo y su rigidez dura menos de 30 min. Fuente: apuntes del tema \u00b7 2.1 Dolor"},{"n":"2","noShuffle":false,"img":null,"q":"Ni\u00f1o de 6 a\u00f1os que cojea y se queja de la rodilla; la exploraci\u00f3n de la rodilla es normal. \u00bfQu\u00e9 hay que explorar?","o":["La cadera homolateral","La rodilla contralateral","La columna lumbar","El tobillo homolateral"],"c":1,"e":"El dolor de cadera se <b>refiere a la rodilla</b> (Perthes, epifisi\u00f3lisis): en todo ni\u00f1o con dolor de rodilla hay que <b>explorar la cadera</b>. Fuente: apuntes del tema \u00b7 2.1 Dolor"},{"n":"3","noShuffle":false,"img":null,"q":"Var\u00f3n con lumbalgia que presenta anestesia en silla de montar y retenci\u00f3n urinaria. \u00bfQu\u00e9 actitud corresponde?","o":["Rx lumbar y revisi\u00f3n en 1 mes","Reposo y AINE una semana","Rehabilitaci\u00f3n y escuela de espalda","Cirug\u00eda descompresiva urgente"],"c":4,"e":"Anestesia en silla de montar y alteraci\u00f3n de esf\u00ednteres son bandera roja de <b>s\u00edndrome de cola de caballo</b>, que es una <b>urgencia quir\u00fargica</b>. Fuente: apuntes del tema \u00b7 2.1 Banderas rojas"},{"n":"4","noShuffle":false,"img":null,"q":"Un paciente no puede elevar activamente el brazo, pero el explorador se lo mueve pasivamente sin limitaci\u00f3n. \u00bfQu\u00e9 indica?","o":["Artrosis glenohumeral muy avanzada","Rigidez de un hombro congelado t\u00edpico","Problema articular o de la c\u00e1psula","Lesi\u00f3n del efector (tend\u00f3n o nervio)"],"c":4,"e":"Movilidad <b>pasiva conservada con activa abolida</b> = les 00f3n <b>din\u00e1mica en tiempo real</b> y <b>sin radiaci\u00f3n</b>; su pega es que depende mucho del explorador y no atraviesa hueso. Fuente: apuntes del tema \u00b7 7.2 TC, RM y ecograf\u00eda"},{"n":"9","noShuffle":false,"img":null,"q":"\u00bfQu\u00e9 informa la fase precoz (de perfusi\u00f3n) de una gammagraf\u00eda con Tc99m?","o":["Flujo sangu\u00edneo local","Densidad mineral \u00f3sea","Actividad osteobl\u00e1stica","Consumo de glucosa tumoral"],"c":1,"e":"La fase temprana muestra el is\u00f3topo en sangre y espacio perivascular: el <b>flujo local</b> (grado de vascularizaci\u00f3n). La fase \u00f3sea, a las 3 h, refleja la actividad \u00f3sea. Fuente: apuntes del tema \u00b7 7.3 Medicina nuclear"},{"n":"10","noShuffle":false,"img":null,"q":"Tras un traumatismo de rodilla, la artrocentesis obtiene sangre con gotas de grasa flotando. \u00bfQu\u00e9 indica?","o":["Fractura intraarticular","Rotura meniscal aislada","Artritis s\u00e9ptica postraum\u00e1tica","Rotura del ligamento cruzado anterior"],"c":1,"e":"Un <b>hemartros con gotas de grasa</b> indica que la m\u00e9dula \u00f3sea vierte a la articulaci\u00f3n: <b>fractura intraarticular</b>. Fuente: apuntes del tema \u00b7 8.3 L\u00edquido sinovial"},{"n":"11","noShuffle":false,"img":null,"q":"\u00bfQu\u00e9 injerto \u00f3seo es el \u00fanico con capacidad osteog\u00e9nica?","o":["Hidroxiapatita sint\u00e9tica","Aloinjerto congelado de banco","Autoinjerto de cresta il\u00edaca","Aloinjerto liofilizado"],"c":3,"e":"Solo el <b>autoinjerto</b> lleva c\u00e9lulas vivas y forma hueso propio (<b>osteog\u00e9nico</b>); aloinjertos y sustitutos solo son osteoconductores (\u00b1 osteoinductores). Fuente: apuntes del tema \u00b7 9.2 T\u00e9cnicas quir\u00fargicas"},{"n":"12","noShuffle":false,"img":null,"q":"\u00bfQu\u00e9 significa el sufijo \u00ab-desis\u00bb en una t\u00e9cnica quir\u00fargica?","o":["Reconstrucci\u00f3n","Fusi\u00f3n o bloqueo","Liberaci\u00f3n de adherencias","Sutura"],"c":2,"e":"<b>-desis = fusi\u00f3n</b> (artrodesis, tenodesis); -rrafia es sutura, -lisis liberaci\u00f3n y -plastia reconstrucci\u00f3n. Fuente: apuntes del tema \u00b7 9.1 T\u00e9cnicas ortop\u00e9dicas"}],"t2":[{"n":"1","noShuffle":false,"img":null,"q":"Mujer de 55 a\u00f1os con dolor en la base palmar del 3.er dedo, que se le queda bloqueado en flexi\u00f3n y se extiende con un chasquido. \u00bfD\u00f3nde est\u00e1 el problema?","o":["Canal de Guyon","Primer compartimento extensor","Polea A4","Polea A1"],"c":4,"e":"Es un <b>dedo en resorte</b>: el tend\u00f3n flexor se engancha en la <b>polea A1</b>, a la altura de la metacarpofal\u00e1ngica. Fuente: apuntes del tema \u00b7 15 Tenosinovitis estenosante"},{"n":"2","noShuffle":false,"img":null,"q":"\u00bfQu\u00e9 tendones se afectan en la tenosinovitis de De Quervain?","o":["Abductor largo y extensor corto del pulgar","Flexor superficial y profundo del \u00edndice","Extensores radiales largo y corto del carpo","Extensor largo del pulgar aislado"],"c":1,"e":"De Quervain afecta al <b>1.er compartimento</b> extensor: <b>abductor largo y extensor corto del pulgar</b> (\u00abALEX\u00bb), sobre la estiloides radial. Fuente: apuntes del tema \u00b7 15 Tenosinovitis estenosante"},{"n":"3","noShuffle":false,"img":null,"q":"Mujer de 40 a\u00f1os, empaquetadora, con dolor sobre la estiloides radial que se dispara al meter el pulgar en el pu\u00f1o y desviar la mu\u00f1eca a cubital. \u00bfDiagn\u00f3stico?","o":["Tenosinovitis de De Quervain","Dedo en resorte del pulgar","Artrosis trapeciometacarpiana","S\u00edndrome del t\u00fanel carpiano"],"c":1,"e":"Dolor en la estiloides radial con <b>Finkelstein</b> positivo en una trabajadora manual = <b>De Quervain</b>. Fuente: apuntes del tema \u00b7 15 Tenosinovitis estenosante"},{"n":"4","noShuffle":false,"img":null,"q":"Herida punzante en la palma; a los dos d\u00edas, dedo hinchado en flexi\u00f3n y muy doloroso al moverlo activa y pasivamente. \u00bfQu\u00e9 actitud corresponde?","o":["Infiltraci\u00f3n con corticoide en la vaina","ATB y desbridamiento quir\u00fargico precoz","Inmovilizaci\u00f3n y AINE dos semanas","Fisioterapia y ejercicios exc\u00e9ntricos"],"c":2,"e":"Es una <b>tenosinovitis infecciosa</b> de flexores (signo del crochet): exige diagn\u00f3stico y tratamiento precoz con <b>antibi\u00f3tico y desbridamiento</b> quir\u00fargico. Fuente: apuntes del tema \u00b7 14 Tenosinovitis aguda"},{"n":"5","noShuffle":false,"img":null,"q":"En una tendinopat\u00eda cr\u00f3nica del tend\u00f3n de Aquiles, \u00bfqu\u00e9 est\u00e1 contraindicado?","o":["Fisioterapia con fortalecimiento exc\u00e9ntrico","Reposo e inmovilizaci\u00f3n","Corticoide dentro del tend\u00f3n","Ondas de choque extracorp\u00f3reas"],"c":3,"e":"Las infiltraciones de corticoide est\u00e1n <b>contraindicadas intratend\u00f3n</b> (favorecen la rotura); el resto forma parte del tratamiento conservador. Fuente: apuntes del tema \u00b7 16 Tendinopat\u00edas cr\u00f3nicas"},{"n":"6","noShuffle":false,"img":null,"q":"\u00bfQu\u00e9 tipo de quiste comunica con la articulaci\u00f3n?","o":["Higroma prerrotuliano","Gangli\u00f3n dorsal de mu\u00f1eca","Quiste popl\u00edteo de Baker","Bursitis olecraniana"],"c":3,"e":"El <b>quiste sinovial verdadero</b> tiene sinoviocitos y <b>comunica con la articulaci\u00f3n</b>, como el de <b>Baker</b>; el gangli\u00f3n es degeneraci\u00f3n mucoide. Fuente: apuntes del tema \u00b7 17 Quistes y gangliones"},{"n":"7","noShuffle":false,"img":null,"q":"En la axonotmesis, \u00bfqu\u00e9 estructura del nervio se conserva?","o":["Solo la mielina","El ax\u00f3n","Ninguna capa","El endoneuro"],"c":4,"e":"En la axonotmesis se rompe el ax\u00f3n (degeneraci\u00f3n walleriana), pero el <b>endoneuro</b> queda \u00edntegro y permite la <b>regeneraci\u00f3n</b>. Fuente: apuntes del tema \u00b7 18 Clasificaci\u00f3n de Seddon"},{"n":"8","noShuffle":false,"img":null,"q":"Tras dormir con el brazo colgado del respaldo, un paciente despierta con la mano ca\u00edda, que se recupera por completo en pocas semanas. \u00bfQu\u00e9 tipo de Seddon es?","o":["Avulsi\u00f3n radicular","Axonotmesis","Neurotmesis","Neuroapraxia"],"c":4,"e":"Compresi\u00f3n con <b>desmielinizaci\u00f3n focal</b> y ax\u00f3n intacto = <b>neuroapraxia</b>, de recuperaci\u00f3n espont\u00e1nea. Fuente: apuntes del tema \u00b7 18 Clasificaci\u00f3n de Seddon"},{"n":"9","noShuffle":false,"img":null,"q":"\u00bfA qu\u00e9 velocidad aproximada crece el ax\u00f3n de un adulto tras una lesi\u00f3n nerviosa?","o":["0,1 mm/d\u00eda","1 cm/d\u00eda","1-2 mm/d\u00eda","5-10 mm/d\u00eda"],"c":3,"e":"El crecimiento axonal es de <b>1-2 mm/d\u00eda</b> en el adulto y de 3-5 mm/d\u00eda en el ni\u00f1o. Fuente: apuntes del tema \u00b7 19 Degeneraci\u00f3n y regeneraci\u00f3n"},{"n":"10","noShuffle":false,"img":null,"q":"Reci\u00e9n nacido tras distocia de hombros, con el brazo en aducci\u00f3n y rotaci\u00f3n interna, codo extendido y Moro ausente en ese lado. \u00bfQu\u00e9 ra\u00edces est\u00e1n lesionadas?","o":["C5-C6","C7","C5-T1 completo","C8-T1"],"c":1,"e":"Es la par\u00e1lisis de <b>Erb-Duchenne (C5-C6)</b>, la obst\u00e9trica m\u00e1s frecuente: \u00abpropina de camarero\u00bb, Moro ausente y prensi\u00f3n conservada. Fuente: apuntes del tema \u00b7 21 Lesiones obst\u00e9tricas"},{"n":"11","noShuffle":false,"img":null,"q":"Motorista con la mano paralizada, anestesia medial del brazo y ptosis, miosis y enoftalmos del mismo lado. \u00bfQu\u00e9 indica el Horner?","o":["Tronco superior (C5-C6)","Preganglionar, mal pron\u00f3stico","Lesi\u00f3n del cord\u00f3n posterior","Postganglionar, buen pron\u00f3stico"],"c":2,"e":"El <b>Horner (T1)</b> indica avulsi\u00f3n de ra\u00edces: lesi\u00f3n <b>preganglionar</b>, no reparable y de <b>mal pron\u00f3stico</b>. Fuente: apuntes del tema \u00b7 20 Plexo braquial del adulto"},{"n":"12","noShuffle":false,"img":null,"q":"Joven con parestesias en el borde cubital de la mano y debilidad hipotenar con reflejos normales; al girar la cabeza hacia ese lado e inspirar, se debilita el pulso radial. \u00bfDiagn\u00f3stico?","o":["Radiculopat\u00eda C6 por hernia","S\u00edndrome del t\u00fanel carpiano","Lesi\u00f3n de Erb-Duchenne","Estrecho tor\u00e1cico superior"],"c":4,"e":"Cl\u00ednica <b>C8-T1</b> con reflejos conservados y <b>Adson</b> positivo = s\u00edndrome del <b>estrecho tor\u00e1cico superior</b>. Fuente: apuntes del tema \u00b7 22 Estrecho tor\u00e1cico"}],"t4":[{"n":"1","noShuffle":false,"img":null,"q":"\u00bfA qu\u00e9 fuerzas resiste mejor el hueso esponjoso?","o":["Tracci\u00f3n y torsi\u00f3n combinadas","Torsi\u00f3n y tensi\u00f3n","Compresi\u00f3n y cizallamiento","Flexi\u00f3n pura"],"c":3,"e":"El <b>esponjoso</b> (met\u00e1fisis y ep\u00edfisis) resiste <b>compresi\u00f3n y cizallamiento</b>; el cortical, torsi\u00f3n y tensi\u00f3n. Fuente: apuntes del tema \u00b7 1.1 Estructura macrosc\u00f3pica"},{"n":"2","noShuffle":false,"img":null,"q":"El hueso laminar resiste m\u00e1s cuando la fuerza va paralela a sus fibras. \u00bfC\u00f3mo se llama esta propiedad?","o":["Plasticidad","Anisotrop\u00eda","Viscoelasticidad","Isotrop\u00eda"],"c":2,"e":"El hueso maduro es <b>anisotr\u00f3pico</b>: su resistencia depende de la direcci\u00f3n de la fuerza. El inmaduro es isotr\u00f3pico. Fuente: apuntes del tema \u00b7 1.2 Estructura microsc\u00f3pica"},{"n":"3","noShuffle":false,"img":null,"q":"\u00bfQu\u00e9 c\u00e9lula \u00f3sea tiene receptores para la calcitonina y los bifosfonatos?","o":["Osteoblasto","Osteoclasto","Condrocito","Osteocito"],"c":2,"e":"El <b>osteoclasto</b> reabsorbe hueso; calcitonina y bifosfonatos act\u00faan sobre \u00e9l e impiden que forme el borde rugoso. Fuente: apuntes del tema \u00b7 1.3 Componentes del tejido \u00f3seo"},{"n":"4","noShuffle":false,"img":null,"q":"\u00bfQu\u00e9 tipo de articulaci\u00f3n es la s\u00ednfisis del pubis?","o":["Sindesmosis","Anfiartrosis","Sincondrosis","Diartrosis"],"c":2,"e":"La s\u00ednfisis del pubis y los discos son <b>anfiartrosis</b>: <b>fibrocart\u00edlago</b> entre los huesos y movimiento m\u00ednimo. Fuente: apuntes del tema \u00b7 2 Estructura articular"},{"n":"5","noShuffle":false,"img":null,"q":"\u00bfQu\u00e9 col\u00e1geno predomina en el cart\u00edlago hialino articular?","o":["Tipo III","Tipo II","Tipo IV","Tipo I"],"c":2,"e":"El cart\u00edlago hialino es <b>col\u00e1geno tipo II</b> (90-95 %); hueso, menisco y fibrocart\u00edlago reparador son tipo I. Fuente: apuntes del tema \u00b7 3.1 Cart\u00edlago hialino"},{"n":"6","noShuffle":false,"img":null,"q":"\u00bfDe d\u00f3nde se nutre sobre todo el cart\u00edlago articular?","o":["Del l\u00edquido sinovial","De sus propios vasos","Del hueso subcondral","Del periostio vecino"],"c":1,"e":"El cart\u00edlago es avascular y se nutre sobre todo por <b>v\u00eda sinovial</b>; la movilidad articular facilita la difusi\u00f3n. Fuente: apuntes del tema \u00b7 3.1 Cart\u00edlago hialino"},{"n":"7","noShuffle":false,"img":null,"q":"Rodilla caliente; la artrocentesis da un l\u00edquido purulento con 80.000 leucocitos/\u00b5l, 90 % de PMN y glucosa muy baja. \u00bfQu\u00e9 tipo de l\u00edquido es?","o":["Normal","S\u00e9ptico","Inflamatorio","Mec\u00e1nico"],"c":2,"e":"M\u00e1s de <b>50.000 leucocitos</b>, PMN > 75 % y glucosa muy baja = l\u00edquido <b>s\u00e9ptico</b>. El inflamatorio tiene 2.000-50.000. Fuente: apuntes del tema \u00b7 3.5 L\u00edquido sinovial"},{"n":"8","noShuffle":false,"img":null,"q":"Chica de 18 a\u00f1os que se tuerce el tobillo con un chasquido; le duele m\u00e1s a las 2 horas, est\u00e1 hinchado y la Rx es normal. \u00bfDiagn\u00f3stico m\u00e1s probable?","o":["Luxaci\u00f3n de tobillo","Epifisi\u00f3lisis distal","Esguince de tobillo","Fractura de mal\u00e9olo"],"c":3,"e":"Mecanismo indirecto, chasquido, dolor que aumenta al \u00abenfriarse\u00bb y Rx normal en una adolescente = <b>esguince</b>: se conserva la relaci\u00f3n articular. Fuente: apuntes del tema \u00b7 4 Esguinces"},{"n":"9","noShuffle":false,"img":null,"q":"En un esguince, \u00bfpara qu\u00e9 sirve la radiograf\u00eda?","o":["Para graduar la rotura","Para descartar una fractura","Para confirmar el esguince","Para medir la inestabilidad"],"c":2,"e":"El diagn\u00f3stico del esguince es <b>cl\u00ednico</b>; la Rx solo sirve para <b>descartar fracturas</b>. Fuente: apuntes del tema \u00b7 4 Esguinces"},{"n":"10","noShuffle":false,"img":null,"q":"Un traumatismo que en un adulto joven produce un esguince, \u00bfqu\u00e9 lesi\u00f3n tiende a producir en un ni\u00f1o?","o":["Epifisi\u00f3lisis","Fractura conminuta","Esguince m\u00e1s grave","Luxaci\u00f3n"],"c":1,"e":"Con el mismo mecanismo, en el <b>ni\u00f1o</b> se produce una <b>epifisi\u00f3lisis</b> y en el mayor, una fractura. Fuente: apuntes del tema \u00b7 4 Esguinces"},{"n":"11","noShuffle":false,"img":null,"q":"Var\u00f3n con el hombro luxado desde una crisis epil\u00e9ptica hace 5 semanas, sin reducir. \u00bfC\u00f3mo se clasifica la luxaci\u00f3n?","o":["Inveterada","Habitual","Recidivante","Aguda"],"c":1,"e":"M\u00e1s de <b>3 semanas</b> sin reducir = luxaci\u00f3n <b>inveterada</b>; antes de 1-2 meses a\u00fan se intenta reducci\u00f3n cerrada o abierta. Fuente: apuntes del tema \u00b7 5 Luxaciones"},{"n":"12","noShuffle":false,"img":null,"q":"Ante una luxaci\u00f3n aguda, \u00bfqu\u00e9 hay que hacer antes y despu\u00e9s de reducirla?","o":["Explorar el estado neurovascular","Colocar una tracci\u00f3n cut\u00e1nea","Pedir una RM de la articulaci\u00f3n","Infiltrar anest\u00e9sico intraarticular"],"c":1,"e":"La luxaci\u00f3n puede lesionar vasos y nervios: la exploraci\u00f3n <b>neurovascular</b> se hace <b>antes y despu\u00e9s</b> de la reducci\u00f3n. Fuente: apuntes del tema \u00b7 5 Luxaciones"}],"t5":[{"n":"1","noShuffle":false,"img":null,"q":"\u00bfCu\u00e1ndo aparece el dolor de las agujetas tras un ejercicio intenso?","o":["Durante el propio ejercicio","A la semana","A las 24-48 horas","A las 2-4 semanas"],"c":3,"e":"Las agujetas duelen a las <b>24-48 h</b> del ejercicio (contracci\u00f3n exc\u00e9ntrica) y desaparecen en 5-7 d\u00edas. Fuente: apuntes del tema \u00b7 1 Lesiones funcionales"},{"n":"2","noShuffle":false,"img":null,"q":"Futbolista de 23 a\u00f1os que, al arrancar en un sprint, nota un dolor s\u00fabito en la cara posterior del muslo \u00abcomo una pedrada\u00bb y se retira. \u00bfLesi\u00f3n m\u00e1s probable?","o":["Contusi\u00f3n del vasto lateral","Desgarro fibrilar isquiotibial","S\u00edndrome compartimental cr\u00f3nico","Rotura completa del cu\u00e1driceps"],"c":2,"e":"Signo de la <b>pedrada</b> en un sprint = <b>desgarro fibrilar</b>; los <b>isquiotibiales</b> son los que m\u00e1s se desgarran (37 %). Fuente: apuntes del tema \u00b7 4 Desgarro fibrilar"},{"n":"3","noShuffle":false,"img":null,"q":"\u00bfD\u00f3nde se localiza t\u00edpicamente el desgarro fibrilar?","o":["En el vientre muscular","En la uni\u00f3n miotendinosa","En la inserci\u00f3n \u00f3sea","En la fascia superficial"],"c":2,"e":"El desgarro fibrilar asienta en la <b>uni\u00f3n miotendinosa</b> de m\u00fasculos biarticulares, por tensi\u00f3n exc\u00e9ntrica. Fuente: apuntes del tema \u00b7 4 Desgarro fibrilar"},{"n":"4","noShuffle":false,"img":null,"q":"\u00bfQu\u00e9 lesi\u00f3n muscular se asocia al signo del hachazo?","o":["Agujetas","Contusi\u00f3n muscular","Desgarro fibrilar","Rotura muscular"],"c":4,"e":"El <b>hachazo</b> (depresi\u00f3n en el contorno del m\u00fasculo) es de la <b>rotura muscular</b>; la pedrada es del desgarro fibrilar. Fuente: apuntes del tema \u00b7 5 Rotura muscular"},{"n":"5","noShuffle":false,"img":null,"q":"\u00bfCu\u00e1l es el tratamiento inicial de una lesi\u00f3n muscular aguda?","o":["Calor local y masaje descontracturante","Estiramientos intensos inmediatos","Reposo, hielo, compresi\u00f3n y elevaci\u00f3n","AINE pautados durante 6 semanas"],"c":3,"e":"Lo primero es controlar el hematoma con <b>RICE</b>; el masaje y el calor est\u00e1n contraindicados y los AINE no deben prolongarse. Fuente: apuntes del tema \u00b7 7 Tratamiento"},{"n":"6","noShuffle":false,"img":"t5_6","q":"En la imagen, Rx de un futbolista de 20 a\u00f1os que recibi\u00f3 un rodillazo en el muslo hace 2 meses y ahora nota ah\u00ed una masa dura. \u00bfDiagn\u00f3stico m\u00e1s probable?","o":["Sarcoma de partes blandas","Osteocondroma","Osteosarcoma","Miositis osificante"],"c":4,"e":"Calcificaci\u00f3n en las <b>partes blandas</b> junto al hueso tras una <b>contusi\u00f3n</b>, en un var\u00f3n joven = <b>miositis osificante</b>. Fuente: apuntes del tema \u00b7 8 Miositis osificante"},{"n":"7","noShuffle":false,"img":null,"q":"\u00bfQu\u00e9 patr\u00f3n radiol\u00f3gico es propio de la miositis osificante madura y la diferencia del osteosarcoma?","o":["Destrucci\u00f3n de la cortical","Reacci\u00f3n en capas de cebolla","Osificaci\u00f3n centr\u00edfuga","Osificaci\u00f3n centr\u00edpeta"],"c":4,"e":"La miositis osifica de fuera a dentro (<b>centr\u00edpeta</b>: c\u00e1scara y centro claro); el osteosarcoma lo hace al rev\u00e9s (centr\u00edfuga). Fuente: apuntes del tema \u00b7 8 Pruebas de imagen"},{"n":"8","noShuffle":false,"img":null,"q":"\u00bfCu\u00e1ndo se extirpa quir\u00fargicamente una miositis osificante?","o":["A las 2 semanas del golpe","Nunca, se trata con RT","De inmediato, al diagnosticarla","Cuando est\u00e1 madura (\u00abfr\u00eda\u00bb)"],"c":4,"e":"Se extirpa solo cuando la lesi\u00f3n est\u00e1 <b>madura (\u00abfr\u00eda\u00bb)</b>; en fases precoces la cirug\u00eda est\u00e1 contraindicada por el riesgo de <b>recidiva</b>. Fuente: apuntes del tema \u00b7 8 Tratamiento"},{"n":"9","noShuffle":false,"img":null,"q":"Var\u00f3n de 28 a\u00f1os con fractura de tibia y yeso; horas despu\u00e9s, dolor intenso que no cede y aumenta al estirar los dedos. Los pulsos pedios se palpan. \u00bfQu\u00e9 haces?","o":["Subir la analgesia y esperar","Descartarlo: hay pulsos","Elevar mucho la pierna y reevaluar ma\u00f1ana","Abrir el yeso; fasciotom\u00eda urgente"],"c":4,"e":"Es un <b>s\u00edndrome compartimental</b>: el pulso presente no lo descarta. Se <b>abre el yeso</b> y, ante la duda, <b>fasciotom\u00eda urgente</b>. Fuente: apuntes del tema \u00b7 10 S\u00edndrome compartimental agudo"},{"n":"10","noShuffle":false,"img":null,"q":"\u00bfCu\u00e1l es el s\u00edntoma m\u00e1s precoz e importante del s\u00edndrome compartimental agudo?","o":["Par\u00e1lisis de los dedos","Dolor al estiramiento pasivo","Palidez cut\u00e1nea","P\u00e9rdida de los pulsos distales"],"c":2,"e":"Lo m\u00e1s precoz es el <b>dolor desproporcionado</b> que aumenta con el <b>estiramiento pasivo</b>; los pulsos se conservan al inicio y la par\u00e1lisis es tard\u00eda. Fuente: apuntes del tema \u00b7 10 Las 6 P"},{"n":"11","noShuffle":false,"img":null,"q":"\u00bfA partir de qu\u00e9 presi\u00f3n intracompartimental se indica tratamiento urgente en el s\u00edndrome compartimental agudo?","o":["> 10 mmHg","> 30 mmHg","> 80 mmHg","> 15 mmHg"],"c":2,"e":"La presi\u00f3n normal es de 8-10 mmHg; por encima de <b>30 mmHg</b>, tratamiento <b>urgente</b>. 15 mmHg es el criterio de reposo del cr\u00f3nico. Fuente: apuntes del tema \u00b7 10 Diagn\u00f3stico"},{"n":"12","noShuffle":false,"img":null,"q":"Ni\u00f1o con una fractura supracond\u00edlea de h\u00famero mal vigilada que queda con el antebrazo fibrosado y los dedos en flexi\u00f3n r\u00edgida. \u00bfQu\u00e9 complicaci\u00f3n es?","o":["Lesi\u00f3n de Erb","Miositis osificante del braquial","Distrofia de Sudeck","Contractura de Volkmann"],"c":4,"e":"La necrosis del <b>compartimento flexor profundo</b> deja una <b>contractura de Volkmann</b>; su causa m\u00e1s t\u00edpica es la fractura <b>supracond\u00edlea</b> de h\u00famero. Fuente: apuntes del tema \u00b7 10 Contractura de Volkmann"}],"t910":[{"n":"1","noShuffle":false,"img":null,"q":"\u00bfCon qu\u00e9 prueba de imagen se detecta una contusi\u00f3n \u00f3sea (bone bruise)?","o":["Radiograf\u00eda simple en carga","Resonancia magn\u00e9tica","Ecograf\u00eda","Densitometr\u00eda"],"c":2,"e":"El bone bruise no interrumpe la continuidad \u00f3sea: <b>solo se ve en la RM</b> (\u2193T1, \u2191T2), nunca en la Rx. Fuente: apuntes del tema \u00b7 1 Contusi\u00f3n \u00f3sea"},{"n":"2","noShuffle":false,"img":null,"q":"\u00bfEn qu\u00e9 hueso son m\u00e1s frecuentes las fracturas por fatiga o estr\u00e9s?","o":["Calc\u00e1neo","Tibia","Metatarsianos","Cuello femoral"],"c":3,"e":"Las fracturas de estr\u00e9s asientan sobre todo en los <b>metatarsianos</b> (> 50 %), seguidos del calc\u00e1neo (25 %) y la tibia (20 %). Fuente: apuntes del tema \u00b7 2A Seg\u00fan su causa"},{"n":"3","noShuffle":false,"img":null,"q":"\u00bfQu\u00e9 mecanismo produce t\u00edpicamente una fractura espiroidea?","o":["Tracci\u00f3n tendinosa","Compresi\u00f3n en el eje","Torsi\u00f3n sobre su eje","Flexi\u00f3n pura"],"c":3,"e":"La <b>torsi\u00f3n</b> (rotaci\u00f3n con un extremo fijo) da el trazo <b>espiroideo</b>; la compresi\u00f3n, v\u00e9rtebras y meseta tibial; la tracci\u00f3n, arrancamientos. Fuente: apuntes del tema \u00b7 2B Seg\u00fan su mecanismo"},{"n":"4","noShuffle":false,"img":null,"q":"Fractura abierta de f\u00e9mur con herida de 3 cm y lesi\u00f3n de la arteria femoral superficial que precisa reparaci\u00f3n. \u00bfQu\u00e9 grado de Gustilo es?","o":["IIIC","IIIA","IIIB","II"],"c":1,"e":"Si hay <b>lesi\u00f3n vascular que necesita reparaci\u00f3n</b>, es <b>IIIC</b> sea cual sea el tama\u00f1o de la herida. Fuente: apuntes del tema \u00b7 2C Seg\u00fan las partes blandas"},{"n":"5","noShuffle":false,"img":null,"q":"Fractura abierta de tibia con herida de 15 cm y p\u00e9rdida de partes blandas que impide cubrir el hueso, sin lesi\u00f3n vascular. \u00bfQu\u00e9 grado de Gustilo es?","o":["IIIA","II","IIIC","IIIB"],"c":4,"e":"Herida > 10 cm con p\u00e9rdida de partes blandas que <b>no permite la cobertura</b> = <b>IIIB</b>; en la IIIA s\u00ed se puede cubrir. Fuente: apuntes del tema \u00b7 2C Seg\u00fan las partes blandas"},{"n":"6","noShuffle":false,"img":null,"q":"\u00bfDe qu\u00e9 depende sobre todo la estabilidad de una fractura?","o":["De la edad del paciente","Del hueso afectado","De las partes blandas","Del plano del trazo"],"c":3,"e":"Seg\u00fan la diapositiva, la estabilidad depende m\u00e1s de las <b>partes blandas</b> (tracci\u00f3n de m\u00fasculos y tendones) que del plano de fractura. Fuente: apuntes del tema \u00b7 2G Seg\u00fan la estabilidad"},{"n":"7","noShuffle":false,"img":null,"q":"Tras una ca\u00edda, aparece una equimosis en herradura por la cara interna del brazo, la axila y el lateral del t\u00f3rax. \u00bfQu\u00e9 fractura sugiere?","o":["Cuello de h\u00famero","Acet\u00e1bulo","Supracond\u00edlea","Di\u00e1fisis de clav\u00edcula"],"c":1,"e":"Es el signo de <b>Hennequin</b> (equimosis en herradura): fractura del <b>cuello de h\u00famero</b>. Destot es del acet\u00e1bulo y Kirmisson, de la supracond\u00edlea. Fuente: apuntes del tema \u00b7 4 Cl\u00ednica"},{"n":"8","noShuffle":false,"img":null,"q":"\u00bfQu\u00e9 exige la consolidaci\u00f3n primaria o directa de una fractura?","o":["Enclavado endomedular con bloqueo din\u00e1mico","Yeso cerrado durante seis semanas","Reducci\u00f3n anat\u00f3mica y estabilidad absoluta","Estabilidad relativa con formaci\u00f3n de callo"],"c":3,"e":"La consolidaci\u00f3n <b>primaria</b> necesita <b>reducci\u00f3n anat\u00f3mica y estabilidad absoluta</b> y se hace <b>sin callo</b>; el clavo endomedular da estabilidad relativa. Fuente: apuntes del tema \u00b7 6.1 Tipos de consolidaci\u00f3n"},{"n":"9","noShuffle":false,"img":null,"q":"\u00bfQu\u00e9 f\u00e1rmaco retrasa la consolidaci\u00f3n de las fracturas?","o":["Metotrexato semanal","Ibuprofeno (AINE)","Ciclosporina oral","Paracetamol oral"],"c":2,"e":"Los <b>AINE</b> inhiben la formaci\u00f3n \u00f3sea y <b>retardan la consolidaci\u00f3n</b>; metotrexato y ciclosporina no interfieren. Fuente: apuntes del tema \u00b7 6.2 Factores que influyen"},{"n":"10","noShuffle":false,"img":null,"q":"\u00bfQu\u00e9 define una reducci\u00f3n cerrada de una fractura?","o":["Nunca lleva material de osteos\u00edntesis","Se hace en quir\u00f3fano con anestesia","Solo se hace en ni\u00f1os","Se reduce sin abrir el foco"],"c":4,"e":"Reducci\u00f3n <b>cerrada</b> = <b>sin abrir el foco</b>, aunque despu\u00e9s se fije con un clavo. La abierta accede directamente al foco. Fuente: apuntes del tema \u00b7 7a Reducci\u00f3n"},{"n":"11","noShuffle":false,"img":null,"q":"Motorista con fractura abierta de tibia grado III de Gustilo, sin tierra en la herida. \u00bfQu\u00e9 profilaxis antibi\u00f3tica corresponde?","o":["Cefalosporina de 1.\u00aa G sola","Cefalosporina + aminogluc\u00f3sido","Doxiciclina + ceftazidima","Ninguna hasta tener el cultivo"],"c":2,"e":"En el grado <b>III</b> se da de inmediato <b>cefalosporina + aminogluc\u00f3sido</b> (gentamicina); en I-II basta la cefalosporina de 1.\u00aa G. Fuente: apuntes del tema \u00b7 7 Fracturas abiertas"},{"n":"12","noShuffle":false,"img":null,"q":"\u00bfQu\u00e9 estabilizaci\u00f3n lleva una fractura abierta tipo IIIC?","o":["Fijador externo definitivo","Clavo endomedular inmediato","Yeso cerrado","Placa a compresi\u00f3n"],"c":1,"e":"La <b>IIIC</b> es la \u00fanica que lleva <b>fijador externo definitivo</b>; en IIIA y IIIB el fijador puede cambiarse a clavo antes de 2 semanas. Fuente: apuntes del tema \u00b7 7 Fracturas abiertas"},{"n":"13","noShuffle":false,"img":null,"q":"Joven de 25 a\u00f1os con fractura de di\u00e1fisis femoral que, a los 2 d\u00edas, presenta confusi\u00f3n, disnea y petequias en axilas y conjuntivas. \u00bfQu\u00e9 sospechas?","o":["TEP por TVP","Shock hipovol\u00e9mico","Embolia grasa","Sepsis por la fractura"],"c":3,"e":"Fractura de hueso largo + cl\u00ednica <b>pulmonar, cerebral y petequias</b> a los 2-3 d\u00edas = <b>s\u00edndrome de embolia grasa</b>. Fuente: apuntes del tema \u00b7 8.1 Complicaciones generales"},{"n":"14","noShuffle":false,"img":null,"q":"Fractura de tibia sin consolidar a los 8 meses; en la Rx, extremos engrosados y densos en \u00abpata de elefante\u00bb. \u00bfQu\u00e9 tratamiento indicas?","o":["Yeso otros 3 meses","Injerto \u00f3seo y fijaci\u00f3n r\u00edgida","Fijaci\u00f3n r\u00edgida sin injerto","Desbridamiento radical"],"c":3,"e":"Es una pseudoartrosis <b>hipertr\u00f3fica</b> (viable): el problema es mec\u00e1nico y basta con <b>fijaci\u00f3n r\u00edgida</b>; el injerto es para la atr\u00f3fica. Fuente: apuntes del tema \u00b7 8.2 Alteraciones de la consolidaci\u00f3n"}],"t9brazo":[{"n":"1","noShuffle":false,"img":null,"q":"Var\u00f3n de 25 a\u00f1os al que se ha reducido una luxaci\u00f3n anterior de hombro. Tiene hipoestesia en la cara lateral del hombro y no consigue abducir, con el manguito \u00edntegro. \u00bfQu\u00e9 nervio est\u00e1 lesionado?","o":["Nervio axilar","Nervio radial","Nervio musculocut\u00e1neo","Nervio supraescapular"],"c":1,"e":"Anestesia de la regi\u00f3n deltoidea + no abduce con manguito sano = <b>nervio axilar</b> (circunflejo), que inerva el deltoides. Fuente: apuntes del tema \u00b7 Luxaci\u00f3n glenohumeral"},{"n":"2","noShuffle":false,"img":null,"q":"Mujer de 65 a\u00f1os con fractura de la di\u00e1fisis humeral que no puede extender la mu\u00f1eca ni los dedos. \u00bfQu\u00e9 actitud es la correcta respecto al nervio?","o":["Electromiograma y cirug\u00eda a las 2 semanas","Observar 3-6 meses, la mayor\u00eda recupera","Explorarlo y suturarlo de urgencia","Transferencia tendinosa inmediata"],"c":2,"e":"Es una lesi\u00f3n del <b>nervio radial</b>: se <b>observa 3-6 meses</b> porque la mayor\u00eda recupera; si persiste, reparaci\u00f3n. Fuente: apuntes del tema \u00b7 Fractura diafisaria de h\u00famero"},{"n":"3","noShuffle":false,"img":null,"q":"El signo de la tecla y la Rx de estr\u00e9s con 3-5 kg en cada mano sirven para diagnosticar\u2026","o":["Luxaci\u00f3n glenohumeral anterior","Fractura del tercio medio de clav\u00edcula","Luxaci\u00f3n acromioclavicular","Luxaci\u00f3n esternoclavicular"],"c":3,"e":"Signo de la tecla y Rx din\u00e1mica con peso = <b>luxaci\u00f3n acromioclavicular</b>; al cargar aumenta el espacio acromioclavicular. Fuente: apuntes del tema \u00b7 Luxaci\u00f3n acromioclavicular"},{"n":"4","noShuffle":false,"img":null,"q":"Ciclista de 30 a\u00f1os con fractura del tercio medio de la clav\u00edcula, poco desplazada y sin lesi\u00f3n neurovascular. \u00bfQu\u00e9 tratamiento indicas?","o":["Clavo intramedular de forma programada","Placa atornillada para acelerar la vuelta","Reducci\u00f3n anat\u00f3mica y yeso toracobraquial","Cabestrillo o vendaje en ocho 4-6 semanas"],"c":4,"e":"La clav\u00edcula es casi siempre <b>conservadora</b>: cabestrillo o vendaje en ocho 4-6 semanas, sin reducci\u00f3n anat\u00f3mica. Fuente: apuntes del tema \u00b7 Fracturas de clav\u00edcula"},{"n":"5","noShuffle":false,"img":null,"q":"\u00bfQu\u00e9 tipo de luxaci\u00f3n acromioclavicular tiene el mismo resultado funcional con tratamiento conservador o quir\u00fargico?","o":["Tipo III (rotura ligamentosa completa)","Tipo IV (luxaci\u00f3n posterior)","Tipo II (rotos los acromioclaviculares)","Tipo V (luxaci\u00f3n superior > 100 %)"],"c":1,"e":"I-II conservador, <b>III conservador o cirug\u00eda con el mismo resultado</b>, IV-V-VI cirug\u00eda. Fuente: apuntes del tema \u00b7 Luxaci\u00f3n acromioclavicular"},{"n":"6","noShuffle":false,"img":null,"q":"Var\u00f3n de 40 a\u00f1os que ha sufrido una electrocuci\u00f3n. Le duele el hombro, no lo rota hacia fuera y la Rx AP parece casi normal, con las corticales del h\u00famero proximal sim\u00e9tricas. \u00bfDiagn\u00f3stico?","o":["Fractura aislada del troqu\u00edter","Luxaci\u00f3n posterior de hombro","Luxaci\u00f3n anterior de hombro","Rotura masiva del manguito"],"c":2,"e":"Electrocuci\u00f3n o convulsi\u00f3n + no rota hacia fuera + <b>signo de la bombilla</b> = <b>luxaci\u00f3n posterior</b>; se confirma con axial de esc\u00e1pula o TC. Fuente: apuntes del tema \u00b7 Luxaci\u00f3n glenohumeral"},{"n":"7","noShuffle":false,"img":null,"q":"Fractura conminuta de la cabeza del radio (Mason 3) sin luxaci\u00f3n de codo ni lesi\u00f3n de Essex-Lopresti. \u00bfQu\u00e9 tratamiento corresponde?","o":["Pr\u00f3tesis de cabeza radial","F\u00e9rula 7-10 d\u00edas","Extirpar la cabeza radial","Osteos\u00edntesis con tornillos"],"c":3,"e":"Mason 3 aislada \u2192 <b>extirpar la cabeza radial</b>; la pr\u00f3tesis queda para el 3 con luxaci\u00f3n de codo o con Essex-Lopresti. Fuente: apuntes del tema \u00b7 Fracturas del codo en el adulto"},{"n":"8","noShuffle":false,"img":null,"q":"Ni\u00f1o de 6 a\u00f1os que cae sobre la mano con el codo extendido y llega con el codo deformado; la Rx muestra una fractura por encima de la interl\u00ednea con el fragmento distal hacia atr\u00e1s. \u00bfQu\u00e9 nervio se lesiona con m\u00e1s frecuencia?","o":["Musculocut\u00e1neo","Cubital","Inter\u00f3seo posterior (radial)","Inter\u00f3seo anterior (mediano)"],"c":4,"e":"Es una <b>supracond\u00edlea</b> en hiperextensi\u00f3n; el nervio m\u00e1s lesionado es el <b>inter\u00f3seo anterior</b>, rama del mediano. Fuente: apuntes del tema \u00b7 Fracturas del codo en el ni\u00f1o"},{"n":"9","noShuffle":false,"img":null,"q":"\u00bfCu\u00e1l es el tratamiento de una fractura supracond\u00edlea infantil desplazada?","o":["Reducci\u00f3n cerrada + agujas K percut\u00e1neas","Reducci\u00f3n abierta y placa atornillada medial","Tracci\u00f3n cut\u00e1nea durante 3 semanas","Yeso braquial sin reducci\u00f3n durante 6 semanas"],"c":1,"e":"Desplazada \u2192 <b>reducci\u00f3n cerrada bajo anestesia general + agujas de Kirschner percut\u00e1neas</b> y f\u00e9rula 4 semanas; abierta solo si irreductible o con lesi\u00f3n vascular. Fuente: apuntes del tema \u00b7 Fracturas del codo en el ni\u00f1o"},{"n":"10","noShuffle":false,"img":null,"q":"Fractura de la di\u00e1fisis distal del radio con luxaci\u00f3n de la articulaci\u00f3n radiocubital distal. \u00bfC\u00f3mo se llama?","o":["Essex-Lopresti","Galeazzi","Monteggia","Colles"],"c":2,"e":"<b>Galeazzi</b> = radio + radiocubital distal (mu\u00f1eca); Monteggia = c\u00fabito proximal + cabeza radial (codo). Fuente: apuntes del tema \u00b7 Galeazzi y Monteggia"},{"n":"11","noShuffle":false,"img":null,"q":"Var\u00f3n de 35 a\u00f1os con fractura del c\u00fabito proximal y luxaci\u00f3n anterior de la cabeza radial. \u00bfCu\u00e1l es el tratamiento?","o":["Extirpaci\u00f3n de la cabeza radial","Reducci\u00f3n cerrada y yeso braquial","Placa atornillada en el c\u00fabito","Agujas de Kirschner y f\u00e9rula"],"c":3,"e":"Es un <b>Monteggia</b>: en el adulto siempre quir\u00fargico, con <b>placa atornillada en el c\u00fabito</b>; vigilar el inter\u00f3seo posterior. Fuente: apuntes del tema \u00b7 Galeazzi y Monteggia"},{"n":"12","noShuffle":false,"img":null,"q":"Ni\u00f1a de 3 a\u00f1os que llora y no mueve el brazo despu\u00e9s de que la levantaran de la mano; lo mantiene en pronaci\u00f3n, sin tumefacci\u00f3n, y la Rx es normal. \u00bfQu\u00e9 haces?","o":["Cabestrillo y nueva Rx de control a la semana","Yeso braquial en flexi\u00f3n durante 3 semanas","Reducci\u00f3n bajo anestesia y aguja de Kirschner","Supinar y flexionar el codo, sin inmovilizar"],"c":4,"e":"<b>Pronaci\u00f3n dolorosa</b>: tir\u00f3n de la mano, Rx normal; se reduce con <b>tracci\u00f3n + supinaci\u00f3n y flexi\u00f3n</b>, con resultado inmediato. Fuente: apuntes del tema \u00b7 Pronaci\u00f3n dolorosa"}],"t9hombro":[{"n":"1","noShuffle":false,"img":null,"q":"\u00bfCu\u00e1l de estos m\u00fasculos no forma parte del manguito rotador?","o":["Redondo mayor","Subescapular","Infraespinoso","Redondo menor"],"c":1,"e":"El manguito lo forman supraespinoso, infraespinoso, <b>redondo menor</b> y subescapular; el <b>redondo mayor</b> no. Fuente: apuntes del tema \u00b7 Recuerdo anat\u00f3mico"},{"n":"2","noShuffle":false,"img":null,"q":"Pintor de 35 a\u00f1os con dolor de hombro al elevar el brazo, sobre todo entre 60\u00ba y 120\u00ba en el plano de la esc\u00e1pula, con Neer y Hawkins positivos. \u00bfDiagn\u00f3stico?","o":["Capsulitis adhesiva","S\u00edndrome subacromial","Artrosis glenohumeral","Luxaci\u00f3n recidivante"],"c":2,"e":"<b>Arco doloroso 60-120\u00ba</b> con pruebas de atrapamiento positivas = <b>s\u00edndrome subacromial</b>. Fuente: apuntes del tema \u00b7 S\u00edndrome subacromial"},{"n":"3","noShuffle":false,"img":null,"q":"\u00bfQu\u00e9 tipo de acromion se asocia a mayor incidencia de pinzamiento subacromial?","o":["Tipo I (plano)","Tipo II (curvo)","Tipo III (ganchoso)","Tipo IV (convexo inferior)"],"c":3,"e":"El <b>tipo III (ganchoso)</b> es el que m\u00e1s pinza; el tipo II (curvo) es el m\u00e1s frecuente. Fuente: apuntes del tema \u00b7 S\u00edndrome subacromial"},{"n":"4","noShuffle":false,"img":null,"q":"Paciente de 30 a\u00f1os con dolor nocturno cr\u00f3nico de hombro, movilidad pasiva conservada y activa reducida, por fibrosis y tendinosis. \u00bfQu\u00e9 estadio de Neer es?","o":["Estadio I","Estadio II","Estadio III","Estadio IV"],"c":2,"e":"Neer <b>II</b>: fibrosis-tendinosis, <b>25-40 a\u00f1os</b>, pasiva conservada con activa reducida; conservador \u00b1 cirug\u00eda. Fuente: apuntes del tema \u00b7 Estadios de Neer"},{"n":"5","noShuffle":false,"img":null,"q":"\u00bfQu\u00e9 tend\u00f3n explora el test de Jobe?","o":["Redondo menor","Infraespinoso","Subescapular","Supraespinoso"],"c":4,"e":"Jobe y drop arm exploran el <b>supraespinoso</b>; la demora de la RE, el infraespinoso; prensa abdominal y lift off, el subescapular. Fuente: apuntes del tema \u00b7 Lesiones del manguito rotador"},{"n":"6","noShuffle":false,"img":null,"q":"Mujer activa de 74 a\u00f1os con dolor intenso y p\u00e9rdida de movilidad; la RM muestra rotura masiva del manguito con ascenso de la cabeza humeral y acromion acetabularizado. \u00bfTratamiento?","o":["Pr\u00f3tesis invertida de hombro","Pr\u00f3tesis anat\u00f3mica total","Reparaci\u00f3n artrosc\u00f3pica en doble hilera","Acromioplastia aislada"],"c":1,"e":"Es una <b>artropat\u00eda del manguito</b>: la rotura ya no se repara y la anat\u00f3mica necesita manguito \u2192 <b>pr\u00f3tesis invertida</b>. Fuente: apuntes del tema \u00b7 Lesiones del manguito rotador"},{"n":"7","noShuffle":false,"img":null,"q":"Mujer de 45 a\u00f1os con un dep\u00f3sito c\u00e1lcico conocido en el supraespinoso que de repente tiene un dolor brutal, nocturno, y no puede mover el hombro. \u00bfEn qu\u00e9 fase est\u00e1?","o":["Precalcificante","Formaci\u00f3n","Reabsorci\u00f3n","Postcalcificante"],"c":3,"e":"La fase de <b>reabsorci\u00f3n</b> es la del dolor agudo intenso que impide el descanso nocturno. Fuente: apuntes del tema \u00b7 Tendinitis calcificante"},{"n":"8","noShuffle":false,"img":null,"q":"\u00bfQu\u00e9 prueba es la m\u00e1s sensible para la tendinitis calcificante del hombro?","o":["Resonancia magn\u00e9tica","Ecograf\u00eda de hombro","Radiograf\u00eda simple","Gammagraf\u00eda \u00f3sea"],"c":2,"e":"La calcificaci\u00f3n se ve en la Rx, pero la <b>ecograf\u00eda es la m\u00e1s sensible</b>; no hace falta RM. Fuente: apuntes del tema \u00b7 Tendinitis calcificante"},{"n":"9","noShuffle":false,"img":null,"q":"Var\u00f3n de 60 a\u00f1os con molestias en la cara anterior del hombro desde hace meses; al levantar peso nota un dolor s\u00fabito y luego un abultamiento en el brazo al flexionar el codo, sin apenas perder fuerza. \u00bfDiagn\u00f3stico?","o":["Tenosinovitis de la porci\u00f3n larga","Rotura del tend\u00f3n subescapular","Rotura de la porci\u00f3n larga del b\u00edceps","Luxaci\u00f3n de la porci\u00f3n larga del b\u00edceps"],"c":3,"e":"M\u00e1s de 40 a\u00f1os, dolor s\u00fabito, poca p\u00e9rdida funcional y <b>signo de Popeye</b> = <b>rotura de la porci\u00f3n larga del b\u00edceps</b>. Fuente: apuntes del tema \u00b7 Porci\u00f3n larga del b\u00edceps"},{"n":"10","noShuffle":false,"img":null,"q":"Mujer diab\u00e9tica de 55 a\u00f1os con dolor nocturno de hombro de semanas, sin traumatismo, y limitaci\u00f3n activa y pasiva de todos los arcos; Rx normal. \u00bfDiagn\u00f3stico m\u00e1s probable?","o":["Tendinitis calcificante","Rotura del manguito","Artrosis glenohumeral","Capsulitis adhesiva"],"c":4,"e":"Limitaci\u00f3n <b>activa y pasiva</b>, sin trauma, Rx normal, mujer diab\u00e9tica = <b>capsulitis adhesiva</b>; la rotura del manguito conserva la pasiva. Fuente: apuntes del tema \u00b7 Hombro congelado"},{"n":"11","noShuffle":false,"img":null,"q":"En la capsulitis adhesiva, \u00bfqu\u00e9 movimiento se pierde primero?","o":["Rotaci\u00f3n externa","Abducci\u00f3n","Flexi\u00f3n anterior","Rotaci\u00f3n interna"],"c":1,"e":"Primero se pierde la <b>rotaci\u00f3n externa</b> y luego la abducci\u00f3n; la movilidad escapular se conserva. Fuente: apuntes del tema \u00b7 Hombro congelado"},{"n":"12","noShuffle":false,"img":null,"q":"\u00bfQu\u00e9 es la lesi\u00f3n de Hill-Sachs?","o":["Desprendimiento anteroinferior del labrum","Fractura por compresi\u00f3n de la cabeza humeral","Lesi\u00f3n del labrum superior de delante a atr\u00e1s","Rotura del tend\u00f3n subescapular"],"c":2,"e":"<b>Hill-Sachs</b> = fractura por compresi\u00f3n de la cabeza humeral contra el borde anterior de la glena; Bankart = labrum anteroinferior. Fuente: apuntes del tema \u00b7 Luxaci\u00f3n recidivante"}],"t11":[{"n":"1","noShuffle":false,"img":null,"q":"\u00bfQu\u00e9 deformidad residual pr\u00e1cticamente no se corrige con la remodelaci\u00f3n en el ni\u00f1o?","o":["Angulaci\u00f3n en plano de movimiento","Acortamiento moderado","Deformidad rotacional","Bayoneta moderada"],"c":3,"e":"El ni\u00f1o remodela sobre todo la <b>angulaci\u00f3n</b> (Hueter-Volkmann); la <b>rotaci\u00f3n no remodela</b>. Fuente: apuntes del tema \u00b7 Remodelaci\u00f3n"},{"n":"2","noShuffle":false,"img":"t11_2","q":"Ni\u00f1o de 7 a\u00f1os que cae sobre la mano extendida. En la imagen (Rx lateral de mu\u00f1eca), \u00bfqu\u00e9 lesi\u00f3n hay y c\u00f3mo se trata?","o":["Deformidad pl\u00e1stica: fuerza mantenida","Tallo verde: reducci\u00f3n y yeso 6 semanas","Salter II: reducci\u00f3n y agujas de Kirschner","Torus: f\u00e9rula o vendaje unas 3 semanas"],"c":4,"e":"La cortical de la met\u00e1fisis distal del radio se abomba por compresi\u00f3n sin desplazamiento: <b>torus</b>, estable \u2192 <b>f\u00e9rula o vendaje 3 semanas</b>. Fuente: apuntes del tema \u00b7 Fractura en rodete o torus"},{"n":"3","noShuffle":false,"img":null,"q":"\u00bfCu\u00e1l es el tipo de Salter-Harris m\u00e1s frecuente?","o":["Tipo I","Tipo II","Tipo III","Tipo IV"],"c":2,"e":"El <b>tipo II</b> (\u2248 75 %): sale por la met\u00e1fisis con el fragmento de Thurston-Holland; buen pron\u00f3stico salvo en f\u00e9mur distal y tibia proximal. Fuente: apuntes del tema \u00b7 Salter-Harris"},{"n":"4","noShuffle":false,"img":null,"q":"Chica de 10 a\u00f1os con un \u00abesguince\u00bb de mu\u00f1eca: dolor a punta de dedo sobre la fisis distal del radio, sin deformidad, y Rx en dos proyecciones normal. \u00bfQu\u00e9 sospechas?","o":["Epifisi\u00f3lisis Salter-Harris tipo I","Fractura en rodete (torus)","Contusi\u00f3n simple de partes blandas","Esguince del ligamento radiocarpiano"],"c":1,"e":"En el ni\u00f1o la fisis es m\u00e1s d\u00e9bil que los ligamentos: dolor fisario con Rx normal = <b>epifisi\u00f3lisis tipo I</b> no desplazada (se confirma con eco o RM). Fuente: apuntes del tema \u00b7 Salter-Harris"},{"n":"5","noShuffle":false,"img":null,"q":"Epifisi\u00f3lisis cuyo trazo atraviesa ep\u00edfisis, fisis y met\u00e1fisis, t\u00edpica del c\u00f3ndilo humeral lateral. \u00bfQu\u00e9 tipo de Salter-Harris es?","o":["Tipo II","Tipo III","Tipo IV","Tipo V"],"c":3,"e":"El <b>tipo IV</b> cruza ep\u00edfisis, fisis y met\u00e1fisis; es articular y con alto riesgo de puente \u00f3seo (c\u00f3ndilo humeral lateral, mal\u00e9olo medial). Fuente: apuntes del tema \u00b7 Salter-Harris"},{"n":"6","noShuffle":false,"img":null,"q":"\u00bfC\u00f3mo se colocan los tornillos al fijar una epifisi\u00f3lisis tipo III o IV?","o":["Cruzando la fisis en diagonal","Paralelos a la fisis, sin atravesarla","Perpendiculares a la fisis, atraves\u00e1ndola","Roscados a trav\u00e9s del centro de la fisis"],"c":2,"e":"Reducci\u00f3n anat\u00f3mica y tornillos <b>paralelos a la fisis</b>, en ep\u00edfisis o met\u00e1fisis, sin cruzarla. Fuente: apuntes del tema \u00b7 Tratamiento de las epifisi\u00f3lisis"},{"n":"7","noShuffle":false,"img":null,"q":"Lactante de 5 meses al que traen porque \u00abno mueve la pierna\u00bb. La Rx muestra una fractura de f\u00e9mur y, en el t\u00f3rax, fracturas costales posteriores con callos de distinta antig\u00fcedad. \u00bfQu\u00e9 es imprescindible?","o":["Alta con yeso y control en consultas","Densitometr\u00eda y control en 6 meses","Serie \u00f3sea completa y comunicarlo","Gammagraf\u00eda y alta si es normal"],"c":3,"e":"Fracturas de distinta antig\u00fcedad y costales posteriores en un ni\u00f1o que no camina = <b>maltrato</b>: <b>serie \u00f3sea completa</b>, protegerlo y comunicarlo. Fuente: apuntes del tema \u00b7 Ni\u00f1o maltratado"},{"n":"8","noShuffle":false,"img":null,"q":"\u00bfCu\u00e1l de estas fracturas tiene alta especificidad de maltrato?","o":["Fractura lineal de cr\u00e1neo","Clav\u00edcula","Di\u00e1fisis de f\u00e9mur en ni\u00f1o que camina","Costillas posteriores"],"c":4,"e":"Alta especificidad: lesi\u00f3n metafisaria cl\u00e1sica y <b>costillas posteriores</b>; clav\u00edcula, di\u00e1fisis en ni\u00f1o que camina y lineal de cr\u00e1neo, baja. Fuente: apuntes del tema \u00b7 Ni\u00f1o maltratado"},{"n":"9","noShuffle":false,"img":null,"q":"Ni\u00f1o de 8 a\u00f1os con yeso por una fractura de antebrazo que est\u00e1 agitado, ansioso y pide cada vez m\u00e1s analgesia. \u00bfQu\u00e9 haces primero?","o":["Abrir el yeso por completo","Aumentar la analgesia","Pedir Rx de control urgente","Elevar el brazo y esperar 24 h"],"c":1,"e":"Las \u00ab3 A\u00bb (ansiedad, agitaci\u00f3n, m\u00e1s analgesia) alertan de un <b>s\u00edndrome compartimental</b>: <b>abrir el yeso</b> entero y valorar fasciotom\u00eda. Fuente: apuntes del tema \u00b7 Valoraci\u00f3n cl\u00ednica"},{"n":"10","noShuffle":false,"img":null,"q":"Ante una deformidad pl\u00e1stica del antebrazo, \u00bfqu\u00e9 lesi\u00f3n asociada hay que descartar siempre?","o":["Fractura del escafoides","Luxaci\u00f3n de la cabeza del radio","Lesi\u00f3n del nervio inter\u00f3seo anterior","Luxaci\u00f3n radiocubital distal"],"c":2,"e":"Puede asociar <b>luxaci\u00f3n de la cabeza del radio</b> (lesi\u00f3n equivalente de Monteggia). Fuente: apuntes del tema \u00b7 Deformidad pl\u00e1stica"},{"n":"11","noShuffle":false,"img":null,"q":"\u00bfCu\u00e1l es el tratamiento habitual de una fractura diafisaria de f\u00e9mur en un ni\u00f1o de 7 a\u00f1os?","o":["Yeso pelvip\u00e9dico (espica)","Arn\u00e9s de Pavlik","Enclavado intramedular el\u00e1stico","Clavo r\u00edgido de entrada lateral"],"c":3,"e":"De 5 a 11 a\u00f1os, <b>enclavado intramedular el\u00e1stico</b>; la espica es de 6 meses a 5 a\u00f1os y el clavo r\u00edgido, del adolescente. Fuente: apuntes del tema \u00b7 Tratamiento quir\u00fargico"},{"n":"12","noShuffle":false,"img":null,"q":"Ni\u00f1o de 2 a\u00f1os que llora y no mueve el brazo tras tirarle de la mano para cruzar la calle; lo lleva en pronaci\u00f3n, pegado al cuerpo, sin tumefacci\u00f3n. \u00bfQu\u00e9 haces?","o":["Cabestrillo y control en 1 semana","Rx urgente y yeso braquial 3 semanas","Reducci\u00f3n bajo sedaci\u00f3n y aguja K","Reducir con maniobra, sin inmovilizar"],"c":4,"e":"<b>Pronaci\u00f3n dolorosa</b>: se reduce con supinaci\u00f3n-flexi\u00f3n o <b>hiperpronaci\u00f3n</b> (m\u00e1s \u00e9xito al primer intento) y <b>no se inmoviliza</b>. Fuente: apuntes del tema \u00b7 Pronaci\u00f3n dolorosa"}],"t12":[{"n":"1","noShuffle":false,"img":null,"q":"\u00bfCu\u00e1l es el germen m\u00e1s frecuente de la osteomielitis aguda hemat\u00f3gena?","o":["Staphylococcus aureus","Salmonella spp.","Streptococcus pyogenes","Staphylococcus epidermidis"],"c":1,"e":"<b>S. aureus</b> causa el 50-90 %; Salmonella es la t\u00edpica de la anemia falciforme. Fuente: apuntes del tema \u00b7 Osteomielitis aguda hemat\u00f3gena"},{"n":"2","noShuffle":false,"img":null,"q":"Ni\u00f1o de 6 a\u00f1os con fiebre, cojera y dolor intenso a punta de dedo en el f\u00e9mur distal. La Rx es normal. \u00bfQu\u00e9 prueba de imagen pides primero?","o":["TC de la rodilla","Ecograf\u00eda de la zona","Gammagraf\u00eda con Tc99","Repetir Rx en un mes"],"c":2,"e":"Al inicio la Rx suele ser normal y es <b>m\u00e1s \u00fatil la ecograf\u00eda</b>; la RM queda para la duda. Fuente: apuntes del tema \u00b7 Osteomielitis aguda hemat\u00f3gena"},{"n":"3","noShuffle":false,"img":null,"q":"\u00bfCu\u00e1nto dura como m\u00ednimo la antibioterapia de una osteomielitis aguda hemat\u00f3gena?","o":["10 d\u00edas","2 semanas","6 semanas","3 meses"],"c":3,"e":"IV y luego oral, hasta normalizar VSG y PCR y <b>siempre un m\u00ednimo de 6 semanas</b>. Fuente: apuntes del tema \u00b7 Osteomielitis aguda hemat\u00f3gena"},{"n":"4","noShuffle":false,"img":null,"q":"Var\u00f3n de 22 a\u00f1os con dolor moderado en la tibia desde hace meses, sin fiebre, que tom\u00f3 antibi\u00f3tico a dosis bajas por una infecci\u00f3n. Rx: cavidad l\u00edtica metafisaria con borde escleroso. \u00bfSospecha?","o":["Osteoma osteoide","Osteosarcoma central","Absceso de Brodie","Infarto \u00f3seo diafisario"],"c":3,"e":"<b>Absceso de Brodie</b>: osteomielitis subaguda en la tibia del adulto joven, l\u00edtica con <b>borde escleroso</b> que simula un tumor \u2192 biopsia y curetaje. Fuente: apuntes del tema \u00b7 Osteomielitis subaguda"},{"n":"5","noShuffle":false,"img":null,"q":"En la osteonecrosis de la cabeza femoral del adulto, el \u00abcrescent sign\u00bb corresponde a\u2026","o":["Fase I: Rx normal","Fase II: esclerosis","Fase III: fractura subcondral","Fase IV: colapso con artrosis secundaria"],"c":3,"e":"<b>Crescent sign = fase III</b>: el hueso necr\u00f3tico se fractura; luego viene el colapso (IV) y la artrosis. Fuente: apuntes del tema \u00b7 Fases de la necrosis"},{"n":"6","noShuffle":false,"img":null,"q":"\u00bfD\u00f3nde asienta la enfermedad de Freiberg?","o":["Calc\u00e1neo","Escafoides del pie en el ni\u00f1o","C\u00f3ndilo humeral","Cabeza del 2.\u00ba metatarsiano"],"c":4,"e":"<b>Freiberg</b> = cabeza del 2.\u00ba metatarsiano; Panner, c\u00f3ndilo humeral; K\u00f6hler, escafoides; Sever, calc\u00e1neo. Fuente: apuntes del tema \u00b7 Osteocondrosis"},{"n":"7","noShuffle":false,"img":null,"q":"Ni\u00f1o de 12 a\u00f1os, futbolista, con dolor en la parte posterior del tal\u00f3n al correr. \u00bfQu\u00e9 osteocondrosis sospechas?","o":["Enfermedad de Sever","Osgood-Schlatter","Enfermedad de Freiberg","Enfermedad de K\u00f6hler"],"c":1,"e":"<b>Sever</b> es la apofisitis del <b>calc\u00e1neo</b>; Osgood-Schlatter es la de la tuberosidad tibial. Fuente: apuntes del tema \u00b7 Osteocondrosis"},{"n":"8","noShuffle":false,"img":null,"q":"Hallazgo casual en una Rx: necrosis en la di\u00e1fisis de un hueso largo, asintom\u00e1tica, con aspecto en \u00abhumo de chimenea\u00bb. \u00bfQu\u00e9 es?","o":["Osteonecrosis","Infarto \u00f3seo","Encondroma","Osteocondritis disecante"],"c":2,"e":"El <b>infarto \u00f3seo</b> es la necrosis extraarticular, diafisaria y asintom\u00e1tica, en \u00abhumo de chimenea\u00bb; la osteonecrosis es articular. Fuente: apuntes del tema \u00b7 Infartos \u00f3seos"},{"n":"9","noShuffle":false,"img":null,"q":"Var\u00f3n de 68 a\u00f1os con coxartrosis. \u00bfQu\u00e9 movimiento se limita primero?","o":["Flexi\u00f3n","Rotaci\u00f3n externa","Rotaci\u00f3n interna","Abducci\u00f3n"],"c":3,"e":"En la cadera se limita primero la <b>rotaci\u00f3n interna</b>, luego la externa y despu\u00e9s extensi\u00f3n, aducci\u00f3n y flexi\u00f3n. Fuente: apuntes del tema \u00b7 Artrosis: cl\u00ednica"},{"n":"10","noShuffle":false,"img":null,"q":"\u00bfCu\u00e1l es el factor de riesgo m\u00e1s importante de la artrosis?","o":["Traumatismo previo","Obesidad","Sexo femenino","Edad avanzada"],"c":4,"e":"El factor de riesgo m\u00e1s importante es la <b>edad avanzada</b>; la artrosis empieza en el cart\u00edlago. Fuente: apuntes del tema \u00b7 Artrosis: factores de riesgo"},{"n":"11","noShuffle":false,"img":null,"q":"Mujer de 50 a\u00f1os con fiebre alta y una rodilla caliente que mantiene en flexi\u00f3n. Artrocentesis: l\u00edquido turbio, 50.000 c\u00e9lulas (75 % PMN) y glucosa baja. \u00bfActitud?","o":["Lavado articular urgente y antibi\u00f3tico","Infiltraci\u00f3n de corticoide intraarticular","AINE, reposo y control en una semana","Pr\u00f3tesis total de rodilla programada"],"c":1,"e":"Es una <b>artritis s\u00e9ptica</b>, una <b>urgencia</b>: artrocentesis + lavado (m\u00e1ximo 48 h) y antibi\u00f3tico; el cart\u00edlago se necrosa en 2-3 d\u00edas. Fuente: apuntes del tema \u00b7 Artritis s\u00e9ptica"},{"n":"12","noShuffle":false,"img":null,"q":"Mujer con pr\u00f3tesis total de rodilla colocada hace 2 a\u00f1os, con dolor, p\u00e9rdida de movilidad y una f\u00edstula que se abre y se cierra. \u00bfTratamiento de elecci\u00f3n?","o":["Lavado y cambio del polietileno","Recambio prot\u00e9sico en dos tiempos","Antibi\u00f3tico oral de por vida","Recambio en un tiempo sin espaciador"],"c":2,"e":"Infecci\u00f3n <b>tard\u00eda</b> de pr\u00f3tesis \u2192 <b>recambio en 2 tiempos</b> (gold standard), con espaciador de cemento con antibi\u00f3tico. Fuente: apuntes del tema \u00b7 Infecciones de implantes"}],"t13":[{"n":"1","noShuffle":false,"img":null,"q":"\u00bfCu\u00e1l es el tumor \u00f3seo epifisario t\u00edpico?","o":["Sarcoma de Ewing","Osteosarcoma","Condroblastoma","Osteocondroma"],"c":3,"e":"Epifisario = <b>condroblastoma</b>; diafisario = Ewing; metafisarios = osteocondroma y osteosarcoma. Fuente: apuntes del tema \u00b7 Localizaci\u00f3n"},{"n":"2","noShuffle":false,"img":null,"q":"Ni\u00f1o de 10 a\u00f1os con dolor nocturno en el muslo y una lesi\u00f3n agresiva en la di\u00e1fisis del f\u00e9mur con reacci\u00f3n peri\u00f3stica en capas de cebolla. \u00bfDiagn\u00f3stico m\u00e1s probable?","o":["Osteocondroma","Condroblastoma","Osteosarcoma central","Sarcoma de Ewing"],"c":4,"e":"Tumor maligno de 5-15 a\u00f1os en la <b>di\u00e1fisis</b> = <b>sarcoma de Ewing</b>; el osteosarcoma es metafisario. Fuente: apuntes del tema \u00b7 Localizaci\u00f3n"},{"n":"3","noShuffle":false,"img":null,"q":"\u00bfQu\u00e9 hallazgo radiol\u00f3gico sugiere que un tumor \u00f3seo es maligno?","o":["Capas de cebolla en el periostio","Borde escleroso bien delimitado","Reacci\u00f3n peri\u00f3stica s\u00f3lida y continua","Cortical insuflada pero indemne"],"c":1,"e":"Reacci\u00f3n peri\u00f3stica <b>discontinua</b> (capas de cebolla, rayos de sol) = maligno; la s\u00f3lida y el borde escleroso son de lesi\u00f3n no agresiva. Fuente: apuntes del tema \u00b7 Radiolog\u00eda simple"},{"n":"4","noShuffle":false,"img":null,"q":"Chico de 17 a\u00f1os con dolor en la cadera desde hace meses, peor por la noche y desproporcionado, que mejora claramente con aspirina. \u00bfQu\u00e9 sospechas?","o":["Osteosarcoma","Osteoma osteoide","Sarcoma de Ewing","Condroblastoma"],"c":2,"e":"Dolor nocturno desproporcionado que <b>cede con AAS</b> = <b>osteoma osteoide</b>; se trata con radiofrecuencia. Fuente: apuntes del tema \u00b7 Osteoma osteoide"},{"n":"5","noShuffle":false,"img":null,"q":"\u00bfQu\u00e9 hay que hacer con la cicatriz de una biopsia abierta de un tumor \u00f3seo maligno?","o":["Irradiarla tras la cirug\u00eda","Dejarla: no influye en la recidiva","Extirparla entera en la cirug\u00eda","Cubrirla con un colgajo"],"c":3,"e":"La biopsia abierta deja una cicatriz que <b>se extirpa \u00edntegramente</b> para evitar recidivas locales. Fuente: apuntes del tema \u00b7 Biopsia"},{"n":"6","noShuffle":false,"img":null,"q":"\u00bfQu\u00e9 es la quimioterapia neoadyuvante en el osteosarcoma?","o":["La que se da solo con fin paliativo","La que se da tras la cirug\u00eda para restos subcl\u00ednicos","La que se da sola, sin cirug\u00eda","La que se da antes de operar para reducir la masa"],"c":4,"e":"Neoadyuvante = <b>antes de la cirug\u00eda</b>, para reducir la masa a resecar (Rosen); \u00fatil en osteosarcoma y Ewing. Fuente: apuntes del tema \u00b7 Tratamiento"},{"n":"7","noShuffle":false,"img":null,"q":"\u00bfA qu\u00e9 tumor orienta una LDH elevada?","o":["Sarcoma de Ewing","Met\u00e1stasis de pr\u00f3stata","Osteoma osteoide","Encondroma"],"c":1,"e":"<b>LDH \u2192 Ewing</b>; fosfatasa \u00e1cida \u2192 met\u00e1stasis de pr\u00f3stata; hiperproteinemia \u2192 mieloma. Fuente: apuntes del tema \u00b7 Laboratorio"},{"n":"8","noShuffle":false,"img":null,"q":"\u00bfQu\u00e9 tumor primario da con m\u00e1s frecuencia met\u00e1stasis \u00f3seas?","o":["C\u00e1ncer de pulm\u00f3n","Carcinoma de mama","C\u00e1ncer de pr\u00f3stata","C\u00e1ncer de ri\u00f1\u00f3n"],"c":2,"e":"<b>Mama (35-40 %)</b>, seguida de pulm\u00f3n, pr\u00f3stata, ri\u00f1\u00f3n y tiroides. Fuente: apuntes del tema \u00b7 Met\u00e1stasis \u00f3seas"},{"n":"9","noShuffle":false,"img":null,"q":"Osteosarcoma de alto grado que rompe la cortical y sale del compartimento, sin met\u00e1stasis. \u00bfQu\u00e9 estadio de Enneking es?","o":["IA","IB","IIA","IIB"],"c":4,"e":"Alto grado = II; extracompartimental = B; sin met\u00e1stasis \u2192 <b>IIB</b>. Fuente: apuntes del tema \u00b7 Estadiaje"},{"n":"10","noShuffle":false,"img":null,"q":"\u00bfEn cu\u00e1l de estos tumores no se usa la radioterapia seg\u00fan el tema?","o":["Mieloma","Sarcoma de Ewing","Osteosarcoma","Met\u00e1stasis \u00f3seas"],"c":3,"e":"La RT se usa en Ewing, linfoma, mieloma, met\u00e1stasis, sarcomas de partes blandas e inoperables; el <b>osteosarcoma no</b> est\u00e1 en la lista. Fuente: apuntes del tema \u00b7 Tratamiento"},{"n":"11","noShuffle":false,"img":"t13_11","q":"Chico de 15 a\u00f1os con un bulto duro e indoloro junto a la rodilla. En la imagen, \u00bfqu\u00e9 lesi\u00f3n es la m\u00e1s probable?","o":["Sarcoma de Ewing","Osteoma osteoide","Osteosarcoma","Osteocondroma"],"c":4,"e":"Proyecci\u00f3n \u00f3sea que sale de la <b>met\u00e1fisis</b> del f\u00e9mur distal = <b>osteocondroma</b>, el tumor benigno m\u00e1s frecuente (10-20 a\u00f1os). Fuente: apuntes del tema \u00b7 Osteocondroma"},{"n":"12","noShuffle":false,"img":null,"q":"\u00bfCu\u00e1l es el tumor \u00f3seo maligno primario m\u00e1s frecuente?","o":["Mieloma m\u00faltiple","Osteosarcoma","Condrosarcoma","Sarcoma de Ewing"],"c":1,"e":"Maligno primario m\u00e1s frecuente: <b>mieloma</b>, y despu\u00e9s el osteosarcoma; en conjunto, los malignos \u00f3seos m\u00e1s frecuentes son las met\u00e1stasis. Fuente: apuntes del tema \u00b7 Generalidades"}],"t15":[{"n":"1","noShuffle":false,"img":null,"q":"\u00bfCu\u00e1l es la displasia \u00f3sea m\u00e1s frecuente?","o":["Morquio","Acondroplasia","Pseudoacondroplasia","Camurati-Engelmann"],"c":2,"e":"La <b>acondroplasia</b> es la displasia \u00f3sea m\u00e1s frecuente y la causa m\u00e1s habitual de enanismo desproporcionado. Fuente: apuntes del tema \u00b7 Acondroplasia"},{"n":"2","noShuffle":false,"img":null,"q":"\u00bfQu\u00e9 gen est\u00e1 alterado en la acondroplasia?","o":["SHOX","FBN1","COL1A1","FGFR3"],"c":4,"e":"Mutaci\u00f3n con ganancia de funci\u00f3n de <b>FGFR3</b>, que frena la fisis. COL1A1 es la OI, FBN1 el Marfan y SHOX el L\u00e9ri-Weill. Fuente: apuntes del tema \u00b7 Clasificaci\u00f3n de las displasias"},{"n":"3","noShuffle":false,"img":null,"q":"Lactante con extremidades cortas a expensas de h\u00famero y f\u00e9mur, tronco normal y macrocefalia. \u00bfC\u00f3mo se llama este patr\u00f3n de acortamiento?","o":["Mesomelia","Platispondilia","Acromelia","Rizomelia"],"c":4,"e":"<b>Rizomelia</b> = acortamiento del segmento proximal (h\u00famero, f\u00e9mur), t\u00edpico de la acondroplasia. Mesomelia es el segmento medio y acromelia el distal. Fuente: apuntes del tema \u00b7 Conceptos b\u00e1sicos"},{"n":"4","noShuffle":false,"img":null,"q":"\u00bfQu\u00e9 complicaci\u00f3n hay que vigilar con RM en todo lactante con acondroplasia?","o":["Escoliosis tor\u00e1cica progresiva","Estenosis del foramen magno","Inestabilidad atloaxoidea C1-C2","Estenosis del canal lumbar"],"c":2,"e":"En el lactante, la <b>estenosis del foramen magno</b> puede dar apneas, hidrocefalia y muerte s\u00fabita: RM a todos. El canal lumbar estrecho es del adulto. Fuente: apuntes del tema \u00b7 Acondroplasia, columna"},{"n":"5","noShuffle":false,"img":"t15_5","q":"Ni\u00f1o de 6 a\u00f1os con fracturas repetidas ante traumatismos m\u00ednimos y un padre sordo. En la imagen, el aspecto de sus ojos. \u00bfDiagn\u00f3stico m\u00e1s probable?","o":["S\u00edndrome de Marfan","Raquitismo hipofosfat\u00e9mico","Acondroplasia","Osteog\u00e9nesis imperfecta"],"c":4,"e":"Fracturas de baja energ\u00eda + <b>escler\u00f3ticas azules</b> + sordera familiar = tr\u00edada de la <b>osteog\u00e9nesis imperfecta</b> (col\u00e1geno I). Fuente: apuntes del tema \u00b7 Osteog\u00e9nesis imperfecta"},{"n":"6","noShuffle":false,"img":null,"q":"\u00bfQu\u00e9 tipo de Sillence de osteog\u00e9nesis imperfecta es letal en el periodo perinatal?","o":["Tipo I","Tipo IV","Tipo II","Tipo III"],"c":3,"e":"El <b>tipo II</b> es letal perinatal (fracturas intra\u00fatero). El I es el leve y m\u00e1s frecuente; el III, grave progresivo; el IV, con escler\u00f3ticas blancas. Fuente: apuntes del tema \u00b7 Clasificaci\u00f3n de Sillence"},{"n":"7","noShuffle":false,"img":null,"q":"Mujer de 35 a\u00f1os con exostosis m\u00faltiple hereditaria: una exostosis de la pelvis ha empezado a crecer y a doler. \u00bfQu\u00e9 hay que sospechar?","o":["Osteosarcoma","Condrosarcoma","Sarcoma de Ewing","Mieloma m\u00faltiple"],"c":2,"e":"Osteocondroma que <b>crece o duele tras la madurez</b> (o cart\u00edlago > 2 cm en RM) = <b>condrosarcoma</b> secundario mientras no se demuestre lo contrario (no osteosarcoma). Fuente: apuntes del
