tema \u00b7 Exostosis m\u00faltiple hereditaria"},{"n":"8","noShuffle":false,"img":null,"q":"\u00bfQu\u00e9 hay que hacer antes de una anestesia general en un ni\u00f1o con displasia espondiloepifisaria cong\u00e9nita?","o":["Rx din\u00e1micas de columna cervical","Ecocardiograma por riesgo a\u00f3rtico","RM del foramen magno","Fondo de ojo por la retina"],"c":1,"e":"La odontoides hipopl\u00e1sica da <b>inestabilidad C1-C2</b>: antes de intubar, <b>Rx din\u00e1micas</b> en flexi\u00f3n y extensi\u00f3n. Fuente: apuntes del tema \u00b7 Espondiloepifisaria cong\u00e9nita"},{"n":"9","noShuffle":false,"img":null,"q":"Var\u00f3n de 9 a\u00f1os con dolor en ambas caderas; la Rx muestra afectaci\u00f3n sim\u00e9trica de las dos cabezas femorales y de las ep\u00edfisis de las rodillas, con columna normal. \u00bfDiagn\u00f3stico?","o":["Perthes bilateral","Epifisiolisis bilateral","Condrodisplasia metafisaria de Schmid","Displasia epifisaria m\u00faltiple"],"c":4,"e":"Afectaci\u00f3n <b>sim\u00e9trica</b> y en <b>otras ep\u00edfisis</b> con columna normal = <b>epifisaria m\u00faltiple</b>, que simula un Perthes bilateral. Fuente: apuntes del tema \u00b7 Displasia epifisaria m\u00faltiple"},{"n":"10","noShuffle":false,"img":null,"q":"Ni\u00f1a de 2 a\u00f1os con piernas arqueadas desde que empez\u00f3 a andar. Fosfato muy bajo y fosfatasa alcalina alta, con calcio, PTH y 25-OH-vitamina D normales. \u00bfDiagn\u00f3stico?","o":["Raquitismo carencial","Acondroplasia","Raquitismo hipofosfat\u00e9mico","Condrodisplasia metafisaria de Schmid"],"c":3,"e":"Fosfato bajo + FA alta con <b>Ca, PTH y 25-OH-D normales</b> = <b>raquitismo hipofosfat\u00e9mico</b> (PHEX, \u2191 FGF23). En el carencial la 25-OH-D est\u00e1 baja; la de Schmid tiene anal\u00edtica normal. Fuente: apuntes del tema \u00b7 Raquitismo hipofosfat\u00e9mico"},{"n":"11","noShuffle":false,"img":null,"q":"\u00bfHacia d\u00f3nde se luxa t\u00edpicamente el cristalino en el s\u00edndrome de Marfan?","o":["Abajo y afuera","Arriba y afuera","Abajo y adentro","Arriba y adentro"],"c":2,"e":"En el Marfan la ectopia lentis va <b>hacia arriba y afuera</b> (\u00abmira al cielo\u00bb); en la homocistinuria, hacia abajo y adentro. Fuente: apuntes del tema \u00b7 S\u00edndrome de Marfan"},{"n":"12","noShuffle":false,"img":null,"q":"\u00bfEn qu\u00e9 displasia es eficaz la hormona de crecimiento?","o":["Acondroplasia","Osteog\u00e9nesis imperfecta","Pseudoacondroplasia","S\u00edndrome de L\u00e9ri-Weill"],"c":4,"e":"El d\u00e9ficit de SHOX (<b>L\u00e9ri-Weill</b>) responde a la GH; en la <b>acondroplasia la GH no es eficaz</b>. Fuente: apuntes del tema \u00b7 Acondroplasia, tratamiento"}],"t17":[{"n":"1","noShuffle":false,"img":null,"q":"Ni\u00f1o de 4 a\u00f1os con cojera de 24 horas tras un catarro, afebril, con Rx y anal\u00edtica normales. \u00bfDiagn\u00f3stico m\u00e1s probable?","o":["Artritis s\u00e9ptica","Sinovitis transitoria","Enfermedad de Perthes","Epifisiolisis femoral"],"c":2,"e":"Edad t\u00edpica, catarro previo, <b>afebril</b> y <b>Rx y anal\u00edtica normales</b> = sinovitis transitoria; la artritis s\u00e9ptica tendr\u00eda fiebre y reactantes altos. Fuente: apuntes del tema \u00b7 Sinovitis transitoria"},{"n":"2","noShuffle":false,"img":null,"q":"\u00bfQu\u00e9 maniobra saca de su sitio la cabeza femoral de una cadera inestable en el reci\u00e9n nacido?","o":["Signo de Trendelenburg","Maniobra de Barlow","Maniobra de Ortolani","Signo de Galeazzi"],"c":2,"e":"<b>Barlow</b> = luxaci\u00f3n (OUT); <b>Ortolani</b> = reducci\u00f3n (IN). Galeazzi es el acortamiento aparente. Fuente: apuntes del tema \u00b7 DDC, cl\u00ednica antes de la marcha"},{"n":"3","noShuffle":false,"img":null,"q":"\u00bfCu\u00e1l es la prueba de imagen de elecci\u00f3n para estudiar una DDC en un lactante de 2 meses?","o":["Radiograf\u00eda de pelvis","RM de caderas","Artrograf\u00eda","Ecograf\u00eda de cadera"],"c":4,"e":"En menores de 4 meses la <b>ecograf\u00eda</b> es el m\u00e9todo de elecci\u00f3n: hay poco hueso visible en la Rx. Fuente: apuntes del tema \u00b7 DDC, pruebas de imagen"},{"n":"4","noShuffle":false,"img":null,"q":"Lactante de 1 mes con una cadera luxada. \u00bfTratamiento indicado?","o":["Osteotom\u00eda de Salter","Doble pa\u00f1al","Observaci\u00f3n","Arn\u00e9s de Pavlik"],"c":4,"e":"Antes de la marcha, la cadera luxada se trata con f\u00e9rulas en flexi\u00f3n y abducci\u00f3n: <b>arn\u00e9s de Pavlik</b>. El doble pa\u00f1al es para la inestable. Fuente: apuntes del tema \u00b7 DDC, tratamiento"},{"n":"5","noShuffle":false,"img":null,"q":"Ni\u00f1a de 3 a\u00f1os, que ya camina, con DDC no diagnosticada y marcha en Trendelenburg. \u00bfQu\u00e9 tratamiento corresponde?","o":["Arn\u00e9s de Pavlik a tiempo completo","Doble pa\u00f1al y control ecogr\u00e1fico","Reposo y AINE","Quir\u00fargico: osteotom\u00eda pelviana"],"c":4,"e":"Despu\u00e9s de la marcha ya no se remodela el cotilo de forma ortop\u00e9dica: <b>cirug\u00eda</b> (osteotom\u00eda de pelvis tipo Salter y varizaci\u00f3n-acortamiento femoral). Fuente: apuntes del tema \u00b7 DDC, tratamiento"},{"n":"6","noShuffle":false,"img":null,"q":"Ni\u00f1o de 3 a\u00f1os con 39 \u00b0C, rechazo a caminar, PCR y VSG elevadas y derrame en la cadera. \u00bfQu\u00e9 haces?","o":["Artrocentesis urgente y ATB IV","RM y descarga con muletas","Reposo, AINE y control en d\u00edas","Arn\u00e9s de Pavlik"],"c":1,"e":"Fiebre y reactantes altos con derrame = <b>artritis s\u00e9ptica</b>: artrocentesis urgente, antibi\u00f3tico IV precoz y drenaje. Fuente: apuntes del tema \u00b7 Casos de repaso"},{"n":"7","noShuffle":false,"img":null,"q":"\u00bfQu\u00e9 es la enfermedad de Perthes?","o":["Infecci\u00f3n hemat\u00f3gena de la met\u00e1fisis femoral","Sinovitis autolimitada de la cadera","Necrosis avascular de la ep\u00edfisis femoral","Deslizamiento epifisario por la fisis"],"c":3,"e":"Perthes = <b>necrosis avascular idiop\u00e1tica</b> de la ep\u00edfisis femoral proximal en ni\u00f1os de 4-10 a\u00f1os. El deslizamiento es la epifisiolisis. Fuente: apuntes del tema \u00b7 Enfermedad de Perthes"},{"n":"8","noShuffle":false,"img":null,"q":"\u00bfQu\u00e9 prueba es \u00fatil en las fases precoces de la enfermedad de Perthes?","o":["Artrograf\u00eda","Ecograf\u00eda de cadera","Resonancia magn\u00e9tica","TC de pelvis"],"c":3,"e":"La <b>RM</b> es \u00fatil en fases precoces; la Rx muestra despu\u00e9s esclerosis, fragmentaci\u00f3n y aplanamiento. Fuente: apuntes del tema \u00b7 Perthes, diagn\u00f3stico"},{"n":"9","noShuffle":false,"img":null,"q":"En la enfermedad de Perthes, \u00bfqu\u00e9 valora la clasificaci\u00f3n de Herring?","o":["El \u00e1ngulo cervicodiafisario","La altura del pilar externo","La fase evolutiva de la necrosis","El porcentaje de cabeza afectada"],"c":2,"e":"<b>Herring</b> mide la altura del <b>pilar externo</b>; Catterall, el porcentaje de cabeza afectada; Waldenstr\u00f6m, las fases. Fuente: apuntes del tema \u00b7 Catterall y Herring"},{"n":"10","noShuffle":false,"img":null,"q":"Adolescente de 13 a\u00f1os con obesidad, 3 meses de dolor en la ingle y la rodilla, pierna en rotaci\u00f3n externa y rotaci\u00f3n interna limitada. \u00bfDiagn\u00f3stico?","o":["Displasia del desarrollo de la cadera","Epifisiolisis femoral proximal","Sinovitis transitoria","Enfermedad de Perthes"],"c":2,"e":"Var\u00f3n de 10-14 a\u00f1os con sobrepeso, <b>dolor de rodilla</b> y <b>rotaci\u00f3n externa</b> = epifisiolisis de la cabeza femoral. Fuente: apuntes del tema \u00b7 Epifisiolisis"},{"n":"11","noShuffle":false,"img":null,"q":"En la Rx AP de una epifisiolisis de la cabeza femoral, \u00bfqu\u00e9 le pasa a la l\u00ednea de Klein?","o":["No corta el casquete epifisario","Se cruza con el arco de Shenton","Pasa por debajo del troc\u00e1nter menor","Corta m\u00e1s de la mitad de la ep\u00edfisis"],"c":1,"e":"En la cadera normal la l\u00ednea de Klein corta la ep\u00edfisis; en la epifisiolisis <b>no la corta</b>. Si la AP es dudosa, proyecci\u00f3n <b>axial</b>. Fuente: apuntes del tema \u00b7 Epifisiolisis, radiolog\u00eda"},{"n":"12","noShuffle":false,"img":null,"q":"\u00bfCu\u00e1l es el tratamiento de la epifisiolisis de la cabeza femoral?","o":["Fijaci\u00f3n quir\u00fargica in situ","Yeso pelvip\u00e9dico durante 6 semanas","Descarga y fisioterapia","Osteotom\u00eda de Salter"],"c":1,"e":"La epifisiolisis tiene <b>solo tratamiento quir\u00fargico</b>: <b>fijaci\u00f3n in situ</b> con agujas o tornillos para frenar el deslizamiento. Fuente: apuntes del tema \u00b7 Epifisiolisis, tratamiento"}],"t20":[{"n":"1","noShuffle":false,"img":null,"q":"\u00bfC\u00f3mo se llama la deformidad con el \u00e1ngulo cervicodiafisario disminuido?","o":["Coxa vara","Coxa valga","Coxa plana","Genu varo"],"c":1,"e":"\u00c1ngulo cervicodiafisario <b>disminuido = coxa vara</b>; aumentado = coxa valga. Fuente: apuntes del tema \u00b7 Coxa vara y coxa valga"},{"n":"2","noShuffle":false,"img":null,"q":"\u00bfA qu\u00e9 edad alcanza su m\u00e1ximo el valgo fisiol\u00f3gico de la rodilla?","o":["A los 3-4 a\u00f1os","Al nacer","A los 10-12 a\u00f1os","A los 14-16 meses"],"c":1,"e":"Varo al nacer, neutro a los 14-16 meses y <b>valgo m\u00e1ximo a los 3-4 a\u00f1os</b>; a los 7, valgo del adulto. Fuente: apuntes del tema \u00b7 Evoluci\u00f3n normal del eje"},{"n":"3","noShuffle":false,"img":null,"q":"Ni\u00f1o de 18 meses con piernas arqueadas sim\u00e9tricas y sin otros hallazgos. \u00bfActitud?","o":["Hemiepifisiodesis externa","Osteotom\u00eda valguizante tibial","Ortesis KAFO nocturna","Observaci\u00f3n: varo fisiol\u00f3gico"],"c":4,"e":"Un varo <b>sim\u00e9trico</b> en menores de 2 a\u00f1os es fisiol\u00f3gico: se observa. Patol\u00f3gico si es asim\u00e9trico o persiste <b>m\u00e1s all\u00e1 de los 2 a\u00f1os</b>. Fuente: apuntes del tema \u00b7 Genu varo"},{"n":"4","noShuffle":false,"img":null,"q":"\u00bfQu\u00e9 zona se afecta en la enfermedad de Blount?","o":["Parte medial del f\u00e9mur distal","Parte lateral del f\u00e9mur distal","Parte medial de la tibia proximal","Parte lateral de la tibia proximal"],"c":3,"e":"Blount = afectaci\u00f3n de la <b>zona medial de la ep\u00edfisis proximal de la tibia</b> (tibia vara). Fuente: apuntes del tema \u00b7 Enfermedad de Blount"},{"n":"5","noShuffle":false,"img":null,"q":"Ni\u00f1o afroamericano de 3 a\u00f1os con sobrepeso, que camin\u00f3 a los 9 meses, con piernas cada vez m\u00e1s arqueadas y \u00e1ngulo metafisario-diafisario de 18\u00ba. \u00bfDiagn\u00f3stico?","o":["Raquitismo hipofosfat\u00e9mico","Acondroplasia","Genu varo fisiol\u00f3gico","Enfermedad de Blount"],"c":4,"e":"Tiene los factores de riesgo (<b>sobrepeso, andar antes del a\u00f1o, afroamericano</b>) y un \u00e1ngulo > 16\u00ba, que predice progresi\u00f3n: <b>Blount</b>. Fuente: apuntes del tema \u00b7 Enfermedad de Blount"},{"n":"6","noShuffle":false,"img":null,"q":"\u00bfQu\u00e9 distancia intermaleolar obliga a pedir Rx en un genu valgo?","o":["M\u00e1s de 8 cm","M\u00e1s de 4 cm","M\u00e1s de 2 cm","M\u00e1s de 15 cm"],"c":1,"e":"Rx en carga si la <b>distancia intermaleolar es > 8 cm</b>, valgo > 15\u00ba, persiste > 7 a\u00f1os o es asim\u00e9trico. Fuente: apuntes del tema \u00b7 Genu valgo"},{"n":"7","noShuffle":false,"img":null,"q":"Genu valgo con fisis abiertas que precisa cirug\u00eda. \u00bfQu\u00e9 se hace?","o":["Hemiepifisiodesis medial","Hemiepifisiodesis externa","Alargamiento \u00f3seo","Osteotom\u00eda valguizante"],"c":1,"e":"Se frena el lado que sobra: en el valgo, <b>hemiepifisiodesis medial</b> (en el varo, externa). Con madurez esquel\u00e9tica, osteotom\u00eda varizante. Fuente: apuntes del tema \u00b7 Genu valgo"},{"n":"8","noShuffle":false,"img":null,"q":"Ni\u00f1a de 5 a\u00f1os que anda con los pies hacia dentro, con las r\u00f3tulas hacia dentro y que se sienta en \u00abW\u00bb. \u00bfCausa m\u00e1s probable?","o":["Anteversi\u00f3n femoral","Torsi\u00f3n tibial interna","Metatarso aducto","Retroversi\u00f3n femoral"],"c":1,"e":"In-toeing a los 3-6 a\u00f1os con <b>r\u00f3tulas hacia dentro</b> y sentarse en \u00abW\u00bb = <b>anteversi\u00f3n femoral</b>. Fuente: apuntes del tema \u00b7 Deformidades rotacionales"},{"n":"9","noShuffle":false,"img":null,"q":"\u00bfCu\u00e1l es el tratamiento habitual de la anteversi\u00f3n femoral en un ni\u00f1o de 5 a\u00f1os?","o":["Observaci\u00f3n, corrige sola","Osteotom\u00eda derrotadora femoral","Ortesis nocturna de rotaci\u00f3n","Fisioterapia y plantillas"],"c":1,"e":"La anteversi\u00f3n femoral suele <b>corregir espont\u00e1neamente</b>: observaci\u00f3n y tranquilizar; la osteotom\u00eda derrotadora es excepcional. Fuente: apuntes del tema \u00b7 Anteversi\u00f3n femoral"},{"n":"10","noShuffle":false,"img":null,"q":"Reci\u00e9n nacido con la rodilla en hiperextensi\u00f3n. \u00bfQu\u00e9 deformidad hay que buscar porque se asocia en el 50 %?","o":["Hipoplasia de peron\u00e9","Coxa vara del desarrollo","Pseudoartrosis de tibia","Displasia de cadera (DDC)"],"c":4,"e":"La luxaci\u00f3n cong\u00e9nita de rodilla asocia <b>DDC en el 50 %</b>; si coexisten, se trata <b>primero la rodilla</b>. Fuente: apuntes del tema \u00b7 Luxaci\u00f3n cong\u00e9nita de rodilla"},{"n":"11","noShuffle":false,"img":null,"q":"Lactante de 14 meses con la tibia incurvada hacia delante y afuera y varias manchas caf\u00e9 con leche. \u00bfQu\u00e9 riesgo tiene?","o":["Necrosis avascular de tibia","Coxa vara progresiva","Luxaci\u00f3n de la rodilla","Fractura y pseudoartrosis"],"c":4,"e":"Incurvaci\u00f3n <b>anterolateral</b> + NF1: alto riesgo de <b>fractura y pseudoartrosis</b>; no remodela sola. Fuente: apuntes del tema \u00b7 Incurvaciones de la tibia"},{"n":"12","noShuffle":false,"img":null,"q":"Ni\u00f1o con una dismetr\u00eda proyectada a la madurez de 3,5 cm. \u00bfQu\u00e9 tratamiento corresponde?","o":["Amputaci\u00f3n y pr\u00f3tesis","Alargamiento de la pierna corta","Epifisiodesis de la pierna larga","Alza en el calzado"],"c":3,"e":"Dismetr\u00eda proyectada de <b>2-5 cm</b>: frenar la pierna larga con <b>epifisiodesis</b>. < 2 cm alza; > 5 cm alargamiento. Fuente: apuntes del tema \u00b7 Dismetr\u00eda"}],"t22":[{"n":"1","noShuffle":false,"img":null,"q":"\u00bfQu\u00e9 tipo de Schatzker es el m\u00e1s frecuente en las fracturas de meseta tibial?","o":["Tipo VI","Tipo II","Tipo I","Tipo IV"],"c":2,"e":"El <b>Schatzker II</b> (separaci\u00f3n-hundimiento) es el m\u00e1s frecuente y se asocia a lesi\u00f3n del <b>menisco externo</b>. Fuente: apuntes del tema \u00b7 Clasificaci\u00f3n de Schatzker"},{"n":"2","noShuffle":false,"img":null,"q":"Motorista de 40 a\u00f1os con fractura Schatzker IV que, horas despu\u00e9s, no puede levantar la punta del pie. \u00bfQu\u00e9 nervio se ha lesionado?","o":["Peroneo com\u00fan","Femoral","Tibial posterior","Safeno"],"c":1,"e":"El <b>Schatzker IV</b> tiene alto riesgo de lesi\u00f3n del <b>nervio peroneo com\u00fan</b> (pie ca\u00eddo) y de la arteria popl\u00edtea. Fuente: apuntes del tema \u00b7 Meseta tibial"},{"n":"3","noShuffle":false,"img":null,"q":"\u00bfA partir de qu\u00e9 hundimiento articular se operan las fracturas de meseta tibial?","o":["1 mm","20 mm","5 mm","10 mm"],"c":3,"e":"Cirug\u00eda si <b>hundimiento > 5 mm</b>, inestabilidad varo/valgo > 10\u00ba o Schatzker IV-VI. Fuente: apuntes del tema \u00b7 Meseta tibial, tratamiento"},{"n":"4","noShuffle":false,"img":null,"q":"\u00bfCu\u00e1l es la localizaci\u00f3n anat\u00f3mica m\u00e1s frecuente del s\u00edndrome compartimental?","o":["Pierna (di\u00e1fisis tibial)","Muslo (di\u00e1fisis femoral)","Antebrazo (radio y c\u00fabito)","Pie (fractura de Lisfranc)"],"c":1,"e":"La <b>di\u00e1fisis tibial</b> es la localizaci\u00f3n anat\u00f3mica m\u00e1s frecuente del s\u00edndrome compartimental: palpar los 4 compartimentos. Fuente: apuntes del tema \u00b7 Fracturas diafisarias de tibia"},{"n":"5","noShuffle":false,"img":null,"q":"Fractura abierta de tibia con herida de 14 cm y hueso expuesto que, tras desbridar, solo se puede cubrir con colgajo; pulsos presentes. \u00bfTipo de Gustilo?","o":["IIIA","II","IIIB","IIIC"],"c":3,"e":"> 10 cm con exposici\u00f3n \u00f3sea que <b>requiere colgajo</b> = <b>IIIB</b>. El IIIA se cubre sin colgajo; el IIIC tiene lesi\u00f3n vascular. Fuente: apuntes del tema \u00b7 Gustilo-Anderson"},{"n":"6","noShuffle":false,"img":null,"q":"\u00bfQu\u00e9 antibi\u00f3tico se a\u00f1ade a la cefalosporina en una fractura abierta Gustilo III?","o":["Un aminogluc\u00f3sido","Una penicilina antipseudom\u00f3nica","Una quinolona","Un macr\u00f3lido"],"c":1,"e":"Tipos I-II: cefalosporina de 1.\u00aa generaci\u00f3n; tipo III: <b>+ aminogluc\u00f3sido</b>. Fuente: apuntes del tema \u00b7 Gustilo-Anderson"},{"n":"7","noShuffle":false,"img":null,"q":"\u00bfCu\u00e1l es la secuencia de tratamiento de una fractura de pil\u00f3n tibial con flictenas?","o":["Fijador externo y luego placas","Clavo intramedular inmediato","Placas urgentes en las primeras 6 h","Yeso cerrado durante 12 semanas"],"c":1,"e":"Manda la piel: <b>fijador externo urgente</b> y, a los 7-14 d\u00edas con el <b>signo de la arruga</b>, reducci\u00f3n abierta y placas. Fuente: apuntes del tema \u00b7 Pil\u00f3n tibial"},{"n":"8","noShuffle":false,"img":null,"q":"\u00bfQu\u00e9 ligamento se rompe primero en el esguince lateral de tobillo?","o":["Peroneoastragalino anterior","Deltoideo","Peroneocalc\u00e1neo","Peroneoastragalino posterior"],"c":1,"e":"El <b>LPAA</b> es el primero y el m\u00e1s frecuente en romperse; el LPC cae en el grado III y el LPAP es el m\u00e1s resistente. Fuente: apuntes del tema \u00b7 Esguince"},{"n":"9","noShuffle":false,"img":null,"q":"Joven con torcedura de tobillo, sin dolor \u00f3seo en los mal\u00e9olos, que camina sin ayuda. \u00bfNecesita Rx seg\u00fan las reglas de Ottawa?","o":["Solo si hay equimosis","S\u00ed, con proyecci\u00f3n de mortaja","No, el diagn\u00f3stico es cl\u00ednico","S\u00ed, siempre en todo esguince"],"c":3,"e":"Ottawa pide Rx si hay <b>dolor \u00f3seo en un mal\u00e9olo</b> o <b>no puede dar 4 pasos</b>; sin ellos, diagn\u00f3stico cl\u00ednico. Fuente: apuntes del tema \u00b7 Reglas de Ottawa"},{"n":"10","noShuffle":false,"img":null,"q":"\u00bfQu\u00e9 fractura maleolar de Danis-Weber es siempre inestable y quir\u00fargica?","o":["Weber A con deltoideo sano","Weber A, infrasindesmal","Weber C, suprasindesmal","Weber B, transindesmal"],"c":3,"e":"<b>Weber C</b> (suprasindesmal): sindesmosis rota, <b>siempre inestable</b> \u2192 cirug\u00eda. Weber A es estable; B, inestable en el 50 %. Fuente: apuntes del tema \u00b7 Danis-Weber"},{"n":"11","noShuffle":false,"img":null,"q":"Mujer de 45 a\u00f1os con torcedura de tobillo: espacio claro medial de 6 mm, peron\u00e9 distal sano y mucho dolor en la cabeza del peron\u00e9. \u00bfQu\u00e9 sospechas?","o":["Fractura de Jones","Fractura de Maisonneuve","Esguince grado III","Fractura de pil\u00f3n tibial"],"c":2,"e":"Tobillo inestable sin fractura distal del peron\u00e9 + dolor proximal = <b>Maisonneuve</b> (fractura del <b>cuello del peron\u00e9</b>): pedir tibia completa. Fuente: apuntes del tema \u00b7 Fractura de Maisonneuve"},{"n":"12","noShuffle":false,"img":null,"q":"Jugador de rugby que sufre una torsi\u00f3n con el pie en flexi\u00f3n plantar; no apoya y tiene equimosis plantar medial. \u00bfQu\u00e9 lesi\u00f3n sospechas?","o":["Fractura-luxaci\u00f3n de Lisfranc","Fractura de calc\u00e1neo","Fractura de Jones","Fractura del cuello del astr\u00e1galo"],"c":1,"e":"La <b>equimosis plantar medial</b> es muy sugestiva de <b>Lisfranc</b>; en Rx, desalineaci\u00f3n de la base del 2.\u00ba MT con la 2.\u00aa cu\u00f1a. Fuente: apuntes del tema \u00b7 Lisfranc"}],"t23":[{"n":"1","noShuffle":false,"img":null,"q":"\u00bfQu\u00e9 tend\u00f3n est\u00e1 implicado sobre todo en la epicondilitis?","o":["Extensor cubital del carpo","Pronador redondo","Extensor largo radial del carpo","Extensor corto radial del carpo"],"c":4,"e":"La epicondilitis es una sobrecarga de los extensores, sobre todo del <b>extensor corto radial del carpo</b> (segundo radial externo). Fuente: apuntes del tema \u00b7 Epicondilitis"},{"n":"2","noShuffle":false,"img":null,"q":"Auxiliar de 40 a\u00f1os con dolor en la cara lateral del codo que empeora al extender la mu\u00f1eca contra resistencia. \u00bfC\u00f3mo se confirma el diagn\u00f3stico?","o":["Ecograf\u00eda del codo","Electromiograma","Exploraci\u00f3n: maniobra de Cozen","RM del codo"],"c":3,"e":"La epicondilitis se confirma <b>explorando</b>: extensi\u00f3n resistida de la mu\u00f1eca (<b>Cozen</b>). La eco o la RM solo complementan. Fuente: apuntes del tema \u00b7 Epicondilitis, cl\u00ednica"},{"n":"3","noShuffle":false,"img":null,"q":"Seg\u00fan la Cochrane, \u00bfcu\u00e1l es la medida m\u00e1s eficaz en la epicondilitis?","o":["Infiltraci\u00f3n de corticoides","Inmovilizaci\u00f3n con yeso","Modificar actividades y esperar","Cirug\u00eda de desinserci\u00f3n"],"c":3,"e":"Lo m\u00e1s efectivo es lo m\u00e1s sencillo: <b>modificar las actividades</b> y la pol\u00edtica de <b>\u00abesperar y ver\u00bb</b>. Cirug\u00eda solo si no mejora en 1-2 a\u00f1os. Fuente: apuntes del tema \u00b7 Epicondilitis, tratamiento"},{"n":"4","noShuffle":false,"img":null,"q":"Lanzador de b\u00e9isbol con dolor en la cara medial del codo. \u00bfQu\u00e9 estructura se lesiona?","o":["Ligamento colateral medial","Ligamento colateral lateral","Tend\u00f3n del b\u00edceps distal","Nervio inter\u00f3seo posterior"],"c":1,"e":"El <b>valgo repetido</b> del lanzamiento produce microrroturas del <b>ligamento colateral medial</b>. Fuente: apuntes del tema \u00b7 Codo del lanzador"},{"n":"5","noShuffle":false,"img":null,"q":"Ni\u00f1o de 7 a\u00f1os con dolor y rigidez del codo, sin bloqueos; la Rx muestra esclerosis y rarefacci\u00f3n del c\u00f3ndilo humeral. \u00bfTratamiento?","o":["Extracci\u00f3n artrosc\u00f3pica","Osteos\u00edntesis del fragmento","Reposo y antiinflamatorios","Mosaicoplastia"],"c":3,"e":"< 10 a\u00f1os con esclerosis y rarefacci\u00f3n del c\u00f3ndilo = <b>Panner</b>: autolimitada, <b>reposo y AINE</b>, nunca cirug\u00eda. Fuente: apuntes del tema \u00b7 Enfermedad de Panner"},{"n":"6","noShuffle":false,"img":null,"q":"Gimnasta de 13 a\u00f1os con dolor de codo, bloqueos y un cuerpo libre en la Rx. \u00bfDiagn\u00f3stico?","o":["Osteocondritis disecante","Epicondilitis","Artrosis de codo","Enfermedad de Panner"],"c":1,"e":"Adolescente de 11-15 a\u00f1os con <b>bloqueos y cuerpo libre</b> en el capitellum = <b>osteocondritis disecante</b>. Fuente: apuntes del tema \u00b7 Osteocondritis disecante"},{"n":"7","noShuffle":false,"img":null,"q":"\u00bfQu\u00e9 complicaci\u00f3n tard\u00eda produce el codo valgo?","o":["Rigidez en pronaci\u00f3n","Neuritis del nervio cubital","Neuritis del nervio radial","Rotura del b\u00edceps distal"],"c":2,"e":"El codo valgo da <b>neuritis tard\u00eda del cubital</b>: osteotom\u00eda varizante \u00b1 transposici\u00f3n del nervio. El varo no da problema funcional. Fuente: apuntes del tema \u00b7 Codo valgo y varo"},{"n":"8","noShuffle":false,"img":null,"q":"\u00bfEn qu\u00e9 posici\u00f3n queda bloqueado el antebrazo en la sinostosis radiocubital cong\u00e9nita?","o":["En extensi\u00f3n","En supinaci\u00f3n","En posici\u00f3n neutra","En pronaci\u00f3n"],"c":4,"e":"El puente \u00f3seo radiocubital proximal deja el antebrazo <b>bloqueado en pronaci\u00f3n</b>; es bilateral en el 70 %. Fuente: apuntes del tema \u00b7 Malformaciones cong\u00e9nitas"},{"n":"9","noShuffle":false,"img":null,"q":"Mozo de almac\u00e9n de 48 a\u00f1os nota un chasquido al frenar una caja con el codo flexionado; el vientre del b\u00edceps queda ascendido. \u00bfDiagn\u00f3stico?","o":["Rotura del b\u00edceps distal","Bursitis olecraneana","Rotura del tend\u00f3n del tr\u00edceps","Epitrocleitis aguda"],"c":1,"e":"Fuerza <b>exc\u00e9ntrica con el codo flexionado</b>, chasquido y <b>signo de Popeye</b> = rotura del b\u00edceps distal; se confirma con eco o RM. Fuente: apuntes del tema \u00b7 Rotura del b\u00edceps distal"},{"n":"10","noShuffle":false,"img":null,"q":"Mujer de 50 a\u00f1os con parestesias nocturnas en los tres primeros dedos de la mano. \u00bfQu\u00e9 nervio est\u00e1 comprimido?","o":["Inter\u00f3seo posterior","Cubital","Radial","Mediano"],"c":4,"e":"Parestesias <b>nocturnas</b> en los 3 primeros dedos y borde radial del 4.\u00ba = <b>t\u00fanel carpiano</b> (mediano), el s\u00edndrome compresivo m\u00e1s frecuente. Fuente: apuntes del tema \u00b7 T\u00fanel carpiano"},{"n":"11","noShuffle":false,"img":null,"q":"\u00bfQu\u00e9 dato orienta a una neuropat\u00eda del cubital en el codo?","o":["Mejora al extender el codo","Mejora al flexionar el codo","Tinel en la estiloides radial","Parestesias en los 3 primeros dedos"],"c":1,"e":"La neuropat\u00eda cubital <b>mejora al extender</b> el codo y empeora al flexionarlo. Los 3 primeros dedos son del mediano. Fuente: apuntes del tema \u00b7 Neuropat\u00eda del cubital"},{"n":"12","noShuffle":false,"img":null,"q":"Paciente con debilidad para extender los dedos y sin ninguna alteraci\u00f3n sensitiva. \u00bfD\u00f3nde est\u00e1 comprimido el nervio?","o":["Canal de Guyon","T\u00fanel carpiano","Arcada de Fr\u00f6hse","Septo intermuscular del brazo"],"c":3,"e":"Radial <b>solo motor</b> = nervio <b>inter\u00f3seo posterior</b> en la <b>arcada de Fr\u00f6hse</b>. El septo del brazo dar\u00eda tambi\u00e9n d\u00e9ficit sensitivo. Fuente: apuntes del tema \u00b7 Neuropat\u00eda del radial"}],"t24":[{"n":"1","noShuffle":false,"img":null,"q":"\u00bfCu\u00e1l es el tipo m\u00e1s frecuente de fractura de radio distal?","o":["Barton","Smith","Colles","Hutchinson"],"c":3,"e":"El <b>90 %</b> de las fracturas de radio distal son de <b>Colles</b> (extraarticular con desplazamiento dorsal). Fuente: apuntes del tema \u00b7 Incidencia"},{"n":"2","noShuffle":false,"img":null,"q":"En la Rx PA de mu\u00f1eca, un espacio escafolunar mayor de 3 mm se conoce como signo de\u2026","o":["Gilula","Escafoides en anillo","Watson","Terry Thomas"],"c":4,"e":"Espacio escafolunar <b>> 3 mm</b> = signo de <b>Terry Thomas</b> (disociaci\u00f3n escafolunar). Watson es una maniobra exploratoria. Fuente: apuntes del tema \u00b7 Disociaci\u00f3n escafolunar"},{"n":"3","noShuffle":false,"img":null,"q":"Mujer de 70 a\u00f1os que cae sobre la mano en hiperflexi\u00f3n; de perfil tiene deformidad en pala de jardinero. \u00bfQu\u00e9 fractura es?","o":["Hutchinson","Goyrand-Smith","Barton dorsal","Colles"],"c":2,"e":"<b>Hiperflexi\u00f3n</b> \u2192 desplazamiento volar \u2192 <b>pala de jardinero</b> = Smith (\u00abColles invertido\u00bb). La Colles da dorso de tenedor. Fuente: apuntes del tema \u00b7 Ep\u00f3nimos"},{"n":"4","noShuffle":false,"img":null,"q":"\u00bfQu\u00e9 lesi\u00f3n ligamentosa hay que buscar en una fractura de la estiloides radial (Hutchinson)?","o":["Ligamento lunopiramidal","Ligamento escafolunar","Ligamento deltoideo","Ligamento colateral cubital"],"c":2,"e":"La fractura de <b>Hutchinson</b> (chauffeur) se asocia a rotura del <b>ligamento escafolunar</b>. Fuente: apuntes del tema \u00b7 Lesiones asociadas"},{"n":"5","noShuffle":false,"img":null,"q":"\u00bfCu\u00e1l de estos es un criterio de inestabilidad de la fractura de radio distal?","o":["Fractura extraarticular","Angulaci\u00f3n dorsal inicial > 20\u00ba","Edad menor de 30 a\u00f1os","Angulaci\u00f3n dorsal inicial > 5\u00ba"],"c":2,"e":"Criterios: intraarticular, edad avanzada, conminuci\u00f3n dorsal, fractura cubital, desplazamiento inicial (<b>acortamiento > 10 mm o angulaci\u00f3n dorsal > 20\u00ba</b>) y secundario. Fuente: apuntes del tema \u00b7 Criterios de inestabilidad"},{"n":"6","noShuffle":false,"img":null,"q":"Mujer de 82 a\u00f1os con insuficiencia cardiaca y fractura de radio distal estable, no conminuta ni intraarticular. \u00bfTratamiento?","o":["Reducci\u00f3n cerrada y yeso","Fijador externo","Agujas de Kirschner","Placa volar con tornillos bloqueados"],"c":1,"e":"Fractura <b>estable</b> en una paciente fr\u00e1gil \u2192 tratamiento <b>ortop\u00e9dico</b>: reducci\u00f3n cerrada y <b>yeso 6 semanas</b>. Fuente: apuntes del tema \u00b7 Tratamiento (pregunta de clase)"},{"n":"7","noShuffle":false,"img":null,"q":"Mujer de 67 a\u00f1os con yeso puesto ayer; dolor insoportable que aumenta al mover los dedos, que est\u00e1n muy hinchados. \u00bfQu\u00e9 sospechas?","o":["S\u00edndrome compartimental","S\u00edndrome de Sudeck","T\u00fanel carpiano agudo","Rotura del extensor largo"],"c":1,"e":"Dolor desproporcionado que <b>aumenta al mover los dedos</b> con yeso reciente = <b>s\u00edndrome compartimental</b>: se trata de inmediato. Fuente: apuntes del tema \u00b7 Complicaciones"},{"n":"8","noShuffle":false,"img":null,"q":"Ni\u00f1o de 7 a\u00f1os que cae del columpio con deformidad en dorso de tenedor y exploraci\u00f3n neurovascular normal. \u00bfDiagn\u00f3stico?","o":["Epifisiolisis del radio distal","Fractura de escafoides","Pronaci\u00f3n dolorosa","Fractura supracond\u00edlea de h\u00famero"],"c":1,"e":"En el ni\u00f1o, el dorso de tenedor corresponde a la <b>epifisiolisis distal del radio</b>, equivalente infantil de la Colles; tratamiento conservador. Fuente: apuntes del tema \u00b7 Preguntas de clase"},{"n":"9","noShuffle":false,"img":null,"q":"\u00bfD\u00f3nde duele t\u00edpicamente una fractura de escafoides?","o":["En el pliegue palmar distal","Sobre la estiloides cubital","Sobre el pisiforme","En la tabaquera anat\u00f3mica"],"c":4,"e":"Dolor y tumefacci\u00f3n en la <b>tabaquera anat\u00f3mica</b> y a la compresi\u00f3n axial del 1.\u00ba y 2.\u00ba metacarpianos. Fuente: apuntes del tema \u00b7 Fractura de escafoides"},{"n":"10","noShuffle":false,"img":null,"q":"Chico de 20 a\u00f1os con dolor en la tabaquera anat\u00f3mica tras una ca\u00edda; la Rx con proyecci\u00f3n de Schneck es normal. \u00bfQu\u00e9 haces?","o":["Tornillo de Herbert percut\u00e1neo","Alta con AINE y reposo relativo","F\u00e9rula con pulgar y Rx en 2 semanas","Yeso con pulgar 8 semanas"],"c":3,"e":"Fractura cl\u00ednica de escafoides: <b>no se da el alta</b>; <b>f\u00e9rula con pulgar 2 semanas</b> y nueva Rx (si hay duda, TC o RM). Fuente: apuntes del tema \u00b7 Escafoides, tratamiento"},{"n":"11","noShuffle":false,"img":null,"q":"En la fractura de escafoides, \u00bfqu\u00e9 fragmento tiende a necrosarse?","o":["El polo distal","El polo proximal","El tub\u00e9rculo","El tercio medio"],"c":2,"e":"La mala vascularizaci\u00f3n hace que se necrose el <b>polo proximal</b>; el distal est\u00e1 bien vascularizado. Fuente: apuntes del tema \u00b7 Escafoides, clasificaci\u00f3n"},{"n":"12","noShuffle":false,"img":null,"q":"En una disociaci\u00f3n escafolunar, \u00bfqu\u00e9 patr\u00f3n de inestabilidad aparece?","o":["VISI (semilunar a volar)","Inestabilidad cubitocarpiana","DISI (semilunar a dorsal)","Luxaci\u00f3n perilunar volar"],"c":3,"e":"Rotura <b>escafolunar \u2192 DISI</b>; rotura lunopiramidal \u2192 VISI. Fuente: apuntes del tema \u00b7 DISI y VISI"}],"t25":[{"n":"1","noShuffle":false,"img":null,"q":"\u00bfCu\u00e1l es la fractura m\u00e1s frecuente de la mano?","o":["Falange proximal (F1)","Falange distal (F3)","Falange media (F2)","Metacarpianos"],"c":2,"e":"La <b>falange distal</b> es la m\u00e1s frecuente (50 % en la diapositiva), casi siempre por aplastamiento; despu\u00e9s van los metacarpianos. Fuente: apuntes del tema \u00b7 Generalidades"},{"n":"2","noShuffle":false,"img":null,"q":"Joven que golpea un saco con el pu\u00f1o cerrado. Rx: fractura del cuello del 5.\u00ba metacarpiano con 30\u00ba de angulaci\u00f3n y sin rotaci\u00f3n. \u00bfQu\u00e9 tratamiento corresponde?","o":["Placa y tornillos de forma urgente","Reducci\u00f3n cerrada (Jahs) e inmovilizar","Sindactilia y movilizaci\u00f3n inmediata","Reducci\u00f3n abierta con agujas de Kirschner"],"c":2,"e":"El cuello del 4.\u00ba-5.\u00ba tolera <b>30-40\u00ba</b>: tratamiento <b>conservador</b> con la maniobra de Jahs(s); cirug\u00eda solo si no corrige o se redesplaza. Fuente: apuntes del tema \u00b7 Fracturas de los metacarpianos"},{"n":"3","noShuffle":false,"img":null,"q":"Las fracturas de la cabeza del metacarpiano afectan sobre todo al\u2026","o":["5.\u00ba metacarpiano","4.\u00ba metacarpiano","2.\u00ba metacarpiano","3.\u00ba metacarpiano"],"c":3,"e":"La cabeza es sobre todo del <b>2.\u00ba</b> y es intraarticular, quir\u00fargica; el que domina en el cuello es el 5.\u00ba. Fuente: apuntes del tema \u00b7 Fracturas de los metacarpianos"},{"n":"4","noShuffle":false,"img":null,"q":"\u00bfQu\u00e9 estructura se rompe siempre en la luxaci\u00f3n dorsal de la IFP?","o":["El tend\u00f3n extensor central","La placa volar de la IFP","El colateral de la IFP","El flexor superficial"],"c":2,"e":"La luxaci\u00f3n dorsal, la m\u00e1s frecuente, se produce por hiperextensi\u00f3n y rompe siempre la <b>placa volar</b>; la volar es la que rompe el tend\u00f3n central. Fuente: apuntes del tema \u00b7 Lesiones articulares de los dedos"},{"n":"5","noShuffle":false,"img":null,"q":"Meses despu\u00e9s de una luxaci\u00f3n volar de la IFP, el dedo queda con la IFP en flexi\u00f3n y la IFD en extensi\u00f3n. \u00bfQu\u00e9 deformidad tiene?","o":["Deformidad en cuello de cisne","Dedo en martillo cr\u00f3nico","Deformidad en Boutonni\u00e8re","Dedo en resorte bloqueado"],"c":3,"e":"Rotura del <b>tend\u00f3n central</b> \u2192 <b>Boutonni\u00e8re</b> (IFP en flexi\u00f3n, IFD en extensi\u00f3n), a menudo tard\u00eda y desapercibida; el cuello de cisne es al rev\u00e9s. Fuente: apuntes del tema \u00b7 Tendones extensores"},{"n":"6","noShuffle":false,"img":"t25_6","q":"En la imagen, fracturas de la base del 1.er metacarpiano. \u00bfQu\u00e9 fractura es la del dibujo de la derecha y c\u00f3mo se trata?","o":["Bennett, tratamiento conservador","Rolando, tratamiento quir\u00fargico","Extraarticular, conservador","Rolando, tratamiento conservador"],"c":2,"e":"Base del pulgar conminuta = <b>Rolando</b> (compleja, peor pron\u00f3stico); igual que la Bennett, es <b>quir\u00fargica</b>. Fuente: apuntes del tema \u00b7 Lesiones del pulgar"},{"n":"7","noShuffle":false,"img":null,"q":"Esquiador que cae con el bast\u00f3n en la mano y tiene dolor en el lado cubital de la MCF del pulgar. \u00bfC\u00f3mo se explora la lesi\u00f3n?","o":["Test de Finkelstein","Forzando el valgo de la MCF","Forzando el varo de la MCF","Flexi\u00f3n contra resistencia"],"c":2,"e":"Pulgar del esquiador = rotura del <b>colateral cubital</b> de la MCF; se explora <b>forzando el valgo</b>. Finkelstein es de De Quervain. Fuente: apuntes del tema \u00b7 Lesiones del pulgar"},{"n":"8","noShuffle":false,"img":null,"q":"En la lesi\u00f3n de Stener, \u00bfqu\u00e9 estructura queda interpuesta entre el colateral cubital del pulgar y su inserci\u00f3n?","o":["El tend\u00f3n del abductor largo","La placa volar de la MCF","La aponeurosis del adductor","El extensor corto del pulgar"],"c":3,"e":"Stener = mu\u00f1\u00f3n del colateral cubital atrapado por la <b>aponeurosis del adductor</b>; no cicatriza solo \u2192 reparaci\u00f3n. RM si hay dudas. Fuente: apuntes del tema \u00b7 Lesiones del pulgar"},{"n":"9","noShuffle":false,"img":null,"q":"\u00bfQu\u00e9 zonas de Verdan de los tendones flexores tienen peor pron\u00f3stico?","o":["Zonas III y V","Zona IV","Zonas I y II","Zonas IV y V"],"c":3,"e":"Las zonas <b>I y II</b> (dedo, con los flexores dentro de la vaina) son las de peor pron\u00f3stico; III y V, mejor; IV, intermedio. Fuente: apuntes del tema \u00b7 Tendones flexores"},{"n":"10","noShuffle":false,"img":null,"q":"Jugador de rugby que agarra la camiseta de un rival y despu\u00e9s no puede flexionar la IFD del 4.\u00ba dedo. \u00bfQu\u00e9 tend\u00f3n se ha arrancado?","o":["Flexor superficial (FDS)","Tend\u00f3n central extensor","Flexor profundo (FPD)","Extensor terminal"],"c":3,"e":"Dedo de Jersey = avulsi\u00f3n del <b>flexor profundo</b> en la base de F3, sobre todo del 4.\u00ba dedo; pasa desapercibido y se trata con reinserci\u00f3n. Fuente: apuntes del tema \u00b7 Tendones flexores"},{"n":"11","noShuffle":false,"img":null,"q":"Herida sobre el nudillo (MCF) tras dar un pu\u00f1etazo en la boca a otra persona, con el extensor seccionado. \u00bfQu\u00e9 se hace?","o":["Sutura primaria de tend\u00f3n y piel urgente","Sutura simple y f\u00e9rula de 3-4 semanas","Cierre primario de la piel y antibi\u00f3tico","Dejar abierta, antibi\u00f3tico, reparar luego"],"c":4,"e":"Mordedura humana en la zona 5: <b>dejar abierta siempre</b>, antibioterapia y reparaci\u00f3n tard\u00eda a los <b>5-7 d\u00edas</b>. Fuente: apuntes del tema \u00b7 Tendones extensores"},{"n":"12","noShuffle":false,"img":null,"q":"\u00bfCu\u00e1l de estas amputaciones es indicaci\u00f3n absoluta de reimplante?","o":["\u00cdndice limpio en un adulto","Pulgar limpio en un adulto","Anular arrancado por avulsi\u00f3n","Dedo medio en un gran fumador"],"c":2,"e":"El <b>pulgar</b> es indicaci\u00f3n absoluta aunque sea un solo dedo; dedo \u00fanico en adulto, avulsi\u00f3n y tabaquismo son relativas. Fuente: apuntes del tema \u00b7 Amputaciones digitales"}],"t26":[{"n":"1","noShuffle":false,"img":null,"q":"\u00bfQu\u00e9 tendones forman el 1.er compartimento extensor afectado en la enfermedad de De Quervain?","o":["Primer y segundo radial externo","Abductor largo y extensor corto del pulgar","Extensor largo y extensor corto del pulgar","Extensor com\u00fan y extensor propio del \u00edndice"],"c":2,"e":"De Quervain = <b>1.er compartimento</b>: <b>abductor largo + extensor corto del pulgar</b>. Los dos radiales son el 2.\u00ba compartimento (intersecci\u00f3n). Fuente: apuntes del tema \u00b7 Tendinopat\u00edas"},{"n":"2","noShuffle":false,"img":null,"q":"Mujer de 40 a\u00f1os con dolor en el borde radial de la mu\u00f1eca que aumenta al mover el pulgar; duele al cerrar el pu\u00f1o sobre el pulgar y desviar a cubital. \u00bfDiagn\u00f3stico?","o":["S\u00edndrome de la intersecci\u00f3n","Enfermedad de Kienb\u00f6ck","Tenosinovitis de De Quervain","S\u00edndrome del t\u00fanel carpiano"],"c":3,"e":"Mujer de 30-50 a\u00f1os, dolor radial con el pulgar y <b>Finkelstein</b> positivo = <b>De Quervain</b>. Fuente: apuntes del tema \u00b7 Tendinopat\u00edas"},{"n":"3","noShuffle":false,"img":null,"q":"Si una tenosinovitis de De Quervain no mejora con reposo, fisioterapia e infiltraciones, \u00bfqu\u00e9 cirug\u00eda se indica?","o":["Liberaci\u00f3n del 2.\u00ba compartimento","Tenolisis del 1.er compartimento","Estiloidectom\u00eda radial completa","Apertura de la polea A1 del pulgar"],"c":2,"e":"El tratamiento quir\u00fargico de De Quervain es la <b>tenolisis del primer compartimento</b>; liberar el 2.\u00ba es del s\u00edndrome de la intersecci\u00f3n. Fuente: apuntes del tema \u00b7 Tendinopat\u00edas"},{"n":"4","noShuffle":false,"img":null,"q":"\u00bfQu\u00e9 cuadro del diagn\u00f3stico diferencial de De Quervain corresponde a la compresi\u00f3n de la rama sensitiva del nervio radial?","o":["S\u00edndrome de Guyon","S\u00edndrome del pronador","S\u00edndrome de Wartenberg","Enfermedad de Secretan"],"c":3,"e":"El s\u00edndrome de <b>Wartenberg</b> es la compresi\u00f3n de la rama sensitiva del radial; entra en el DD de De Quervain con la fractura de escafoides, la rizartrosis y la AR. Fuente: apuntes del tema \u00b7 Tendinopat\u00edas"},{"n":"5","noShuffle":false,"img":null,"q":"Remero con dolor y edema en el dorso radial del antebrazo, unos 4 cm por encima de la mu\u00f1eca. \u00bfQu\u00e9 compartimento extensor est\u00e1 inflamado?","o":["El 1.er compartimento","El 2.\u00ba compartimento","El 4.\u00ba compartimento","El 6.\u00ba compartimento"],"c":2,"e":"S\u00edndrome de la intersecci\u00f3n: tenosinovitis del <b>2.\u00ba compartimento</b> (1.er y 2.\u00ba radial) donde lo cruza el 1.\u00ba, unos <b>4 cm proximal</b> a la mu\u00f1eca. Fuente: apuntes del tema \u00b7 Tendinopat\u00edas"},{"n":"6","noShuffle":false,"img":null,"q":"\u00bfQu\u00e9 tend\u00f3n roza sobre el tub\u00e9rculo de Lister y puede romperse tras una fractura de radio distal?","o":["Extensor corto del pulgar","Abductor largo del pulgar","Segundo radial externo","Extensor largo del pulgar"],"c":4,"e":"El <b>extensor largo del pulgar</b> roza en el <b>tub\u00e9rculo de Lister</b> y puede romperse por fractura de radio, sobreesfuerzo o mala vascularizaci\u00f3n. Fuente: apuntes del tema \u00b7 Tendinopat\u00edas"},{"n":"7","noShuffle":false,"img":null,"q":"Una inestabilidad dorsal de la articulaci\u00f3n radiocubital distal limita sobre todo\u2026","o":["La pronaci\u00f3n","La supinaci\u00f3n","La flexi\u00f3n","La desviaci\u00f3n radial"],"c":2,"e":"Inestabilidad <b>dorsal \u2192 supinaci\u00f3n</b>; volar \u2192 pronaci\u00f3n (\u00abDS y VP\u00bb). Fuente: apuntes del tema \u00b7 Radiocubital distal"},{"n":"8","noShuffle":false,"img":null,"q":"Tras una fractura de Galeazzi, dolor cubital de mu\u00f1eca; la cabeza del c\u00fabito se hunde al presionarla y vuelve a subir. \u00bfQu\u00e9 prueba valora el fibrocart\u00edlago triangular?","o":["Radiograf\u00eda simple","Gammagraf\u00eda \u00f3sea","Resonancia magn\u00e9tica","Ecograf\u00eda din\u00e1mica"],"c":3,"e":"Signo de la tecla de piano = lesi\u00f3n de la RCD. La Rx sirve poco; la <b>RM</b> permite valorar el <b>FCT</b>. Fuente: apuntes del tema \u00b7 Radiocubital distal"},{"n":"9","noShuffle":false,"img":null,"q":"La enfermedad de Kienb\u00f6ck es la osteonecrosis idiop\u00e1tica de\u2026","o":["El escafoides","El semilunar","El hueso grande","El piramidal"],"c":2,"e":"<b>Kienb\u00f6ck = semilunar</b>; la necrosis avascular del escafoides es la enfermedad de Preiser, menos frecuente. Fuente: apuntes del tema \u00b7 Necrosis del semilunar y del escafoides"},{"n":"10","noShuffle":false,"img":null,"q":"\u00bfCon qu\u00e9 varianza cubital se asocia la enfermedad de Kienb\u00f6ck?","o":["Positiva (c\u00fabito plus)","Neutra (sin diferencia)","Negativa (c\u00fabito minus)","No tiene relaci\u00f3n alguna"],"c":3,"e":"El Kienb\u00f6ck se asocia al <b>c\u00fabito minus</b> (varianza negativa: el c\u00fabito queda m\u00e1s corto que el radio). Fuente: apuntes del tema \u00b7 Necrosis del semilunar y del escafoides"},{"n":"11","noShuffle":false,"img":null,"q":"Carpintero de 30 a\u00f1os con dolor y rigidez de mu\u00f1eca y p\u00e9rdida de fuerza de garra; la Rx es normal. \u00bfQu\u00e9 prueba confirma o descarta un Kienb\u00f6ck?","o":["Gammagraf\u00eda \u00f3sea","TC de mu\u00f1eca","Resonancia magn\u00e9tica","Rx en proyecci\u00f3n de escafoides"],"c":3,"e":"En el estadio I la Rx es normal y la RM ya es positiva: la <b>RM</b> es la t\u00e9cnica de elecci\u00f3n para confirmar o descartar. Fuente: apuntes del tema \u00b7 Necrosis del semilunar y del escafoides"},{"n":"12","noShuffle":false,"img":null,"q":"Kienb\u00f6ck en estadio II (esclerosis sin colapso) en un paciente con c\u00fabito minus. \u00bfQu\u00e9 tratamiento corresponde?","o":["Acortamiento del hueso grande","Acortamiento del radio","Carpectom\u00eda de la fila proximal","Artrodesis total de mu\u00f1eca"],"c":2,"e":"Estadio II-IIIA: con <b>c\u00fabito minus</b> se <b>acorta el radio</b>; con c\u00fabito plus o neutro, el hueso grande. Carpectom\u00eda y artrodesis son del IV. Fuente: apuntes del tema \u00b7 Necrosis del semilunar y del escafoides"}],"t27bis":[{"n":"1","noShuffle":false,"img":null,"q":"Seg\u00fan la SRS, \u00bfqu\u00e9 \u00e1ngulo de Cobb m\u00ednimo define una escoliosis?","o":["5\u00b0","10\u00b0","20\u00b0","25\u00b0"],"c":2,"e":"Escoliosis = <b>Cobb \u2265 10\u00b0</b> en Rx en bipedestaci\u00f3n, con rotaci\u00f3n vertebral. Fuente: apuntes del tema \u00b7 Escoliosis: definici\u00f3n"},{"n":"2","noShuffle":false,"img":"t27bis_2","q":"En la imagen, una adolescente muestra una giba al inclinarse hacia delante. \u00bfQu\u00e9 indica?","o":["Actitud escoli\u00f3tica por dismetr\u00eda","Escoliosis estructural (rotaci\u00f3n)","Dorso redondo juvenil postural","Escoliosis anti\u00e1lgica por hernia discal"],"c":2,"e":"Adams con <b>giba</b> = escoliosis <b>estructural</b>: la giba la produce la rotaci\u00f3n vertebral. La actitud escoli\u00f3tica desaparece en flexi\u00f3n. Fuente: apuntes del tema \u00b7 Exploraci\u00f3n f\u00edsica"},{"n":"3","noShuffle":false,"img":null,"q":"\u00bfCu\u00e1l es el perfil t\u00edpico de la escoliosis idiop\u00e1tica del adolescente?","o":["Ni\u00f1o, curva tor\u00e1cica izquierda, dolorosa","Ni\u00f1a, curva tor\u00e1cica derecha, indolora","Ni\u00f1a, curva lumbar izquierda, dolorosa","Ni\u00f1o, curva tor\u00e1cica derecha, con dolor nocturno"],"c":2,"e":"EIA t\u00edpica: <b>ni\u00f1a</b>, curva <b>tor\u00e1cica derecha</b>, <b>indolora</b> y con neurolog\u00eda normal; lo dem\u00e1s es bandera roja. Fuente: apuntes del tema \u00b7 Historia natural y se\u00f1ales de alarma"},{"n":"4","noShuffle":false,"img":null,"q":"Ni\u00f1o de 2 a\u00f1os con escoliosis cong\u00e9nita por una hemiv\u00e9rtebra. Adem\u00e1s de controlar la curva, \u00bfqu\u00e9 estudios pides?","o":["Rx de control anual, sin m\u00e1s estudios","RM medular, ecograf\u00eda renal y ecocardio","Gammagraf\u00eda \u00f3sea y estudio gen\u00e9tico completo","TC de columna y pruebas respiratorias"],"c":2,"e":"La cong\u00e9nita se asocia a anomal\u00edas del <b>neuroeje</b>, <b>renales</b> y <b>card\u00edacas</b>: RM de todo el neuroeje, eco renal y ecocardiograma. Fuente: apuntes del tema \u00b7 Escoliosis cong\u00e9nita"},{"n":"5","noShuffle":false,"img":null,"q":"\u00bfQu\u00e9 v\u00e9rtebras se usan para medir el \u00e1ngulo de Cobb?","o":["La apical y la l\u00edmite inferior","Las l\u00edmite, las m\u00e1s inclinadas","Las dos vecinas del \u00e1pex","La apical, la m\u00e1s inclinada"],"c":2,"e":"Se trazan l\u00edneas por los platillos de las <b>v\u00e9rtebras l\u00edmite</b>, las m\u00e1s inclinadas; la apical es la menos inclinada. Fuente: apuntes del tema \u00b7 Estudio radiol\u00f3gico"},{"n":"6","noShuffle":false,"img":null,"q":"\u00bfQu\u00e9 valora el signo de Risser?","o":["Rotaci\u00f3n del ped\ uy apretado. Quemaz\u00f3n y hormigueo en la cara anterolateral del muslo, sin p\u00e9rdida de fuerza. \u00bfQu\u00e9 nervio est\u00e1 atrapado?","o":["Ilioinguinal","Femoral (crural)","Obturador","Femorocut\u00e1neo"],"c":4,"e":"Meralgia parest\u00e9sica: <b>femorocut\u00e1neo</b> (L2-L3), <b>puramente sensitivo</b>, comprimido junto a la EIAS. Fuente: apuntes del tema \u00b7 9. Atrapamientos nerviosos"}],"t36":[{"n":"1","noShuffle":false,"img":null,"q":"Fractura de pelvis en libro abierto, rotacionalmente inestable pero verticalmente estable. \u00bfQu\u00e9 tipo de Tile es?","o":["Tile A","Tile B","Tile C1","Tile C3"],"c":2,"e":"Tile <b>B</b> = rotacionalmente inestable y verticalmente estable (el libro abierto es B1); C es inestable tambi\u00e9n en vertical. Fuente: apuntes del tema \u00b7 1. Pelvis \u00b7 Tile"},{"n":"2","noShuffle":false,"img":null,"q":"Motorista de 32 a\u00f1os con TA 80/50 y taquicardia. La Rx muestra una di\u00e1stasis de la s\u00ednfisis de 4 cm con apertura de una sacroil\u00edaca. Tras el ABCDE, \u00bfqu\u00e9 haces primero?","o":["Tracci\u00f3n transesquel\u00e9tica","Cierre con cincha p\u00e9lvica","Osteos\u00edntesis con placa","Laparotom\u00eda exploradora"],"c":2,"e":"La hemorragia es la complicaci\u00f3n m\u00e1s frecuente: cierre precoz con <b>cincha p\u00e9lvica</b> (o fijador); si no basta, embolizaci\u00f3n o packing. Fuente: apuntes del tema \u00b7 1. Pelvis \u00b7 Lesiones asociadas"},{"n":"3","noShuffle":false,"img":null,"q":"\u00bfCu\u00e1l es la fractura de acet\u00e1bulo m\u00e1s frecuente?","o":["Pared posterior","Columna anterior","Pared anterior","Transversa"],"c":1,"e":"La de <b>pared posterior</b>; se clasifican con Judet-Letournel y se planifican con TAC. Fuente: apuntes del tema \u00b7 2. Acet\u00e1bulo"},{"n":"4","noShuffle":false,"img":null,"q":"Var\u00f3n de 27 a\u00f1os: la rodilla golpea el salpicadero con la cadera flexionada. Llega con el miembro en flexi\u00f3n, aducci\u00f3n y rotaci\u00f3n interna. \u00bfDiagn\u00f3stico?","o":["Fractura pertrocant\u00e9rea","Fractura del cuello femoral","Luxaci\u00f3n anterior de cadera","Luxaci\u00f3n posterior de cadera"],"c":4,"e":"Posici\u00f3n del <b>ba\u00f1ista sorprendido</b> (flexi\u00f3n, aducci\u00f3n, rotaci\u00f3n interna): luxaci\u00f3n <b>posterior</b>, el 90 %. Fuente: apuntes del tema \u00b7 3. Luxaciones de cadera"},{"n":"5","noShuffle":false,"img":null,"q":"\u00bfQu\u00e9 complicaci\u00f3n obliga a reducir de urgencia una luxaci\u00f3n de cadera?","o":["Artrosis postraum\u00e1tica","Necrosis de cabeza femoral","Miositis osificante del gl\u00fateo","Pseudoartrosis del cuello"],"c":2,"e":"Se reduce en las primeras 6-12 h (maniobra de Allis) para evitar la <b>necrosis de la cabeza femoral</b>. Fuente: apuntes del tema \u00b7 3. Luxaciones de cadera \u00b7 Tratamiento"},{"n":"6","noShuffle":false,"img":null,"q":"\u00bfPor qu\u00e9 las fracturas intracapsulares de cadera se consideran un problema biol\u00f3gico?","o":["Por el acortamiento que suelen causar","Por el gran sangrado que producen","Por la tracci\u00f3n de la musculatura gl\u00fatea","Por el riesgo de necrosis de la cabeza"],"c":4,"e":"Cabeza y cuello: el problema es la <b>vascularizaci\u00f3n</b> y el riesgo de <b>necrosis</b>; las extracapsulares son un problema mec\u00e1nico. Fuente: apuntes del tema \u00b7 4. Fracturas de cadera \u00b7 Clasificaci\u00f3n"},{"n":"7","noShuffle":false,"img":null,"q":"Fractura subcapital completa sin desplazamiento. \u00bfQu\u00e9 grado de Garden es?","o":["Garden I","Garden II","Garden III","Garden IV"],"c":2,"e":"Garden <b>II</b> = completa sin desplazar; I es incompleta impactada en valgo; III y IV son desplazadas. Fuente: apuntes del tema \u00b7 4. Fracturas de cadera \u00b7 Garden"},{"n":"8","noShuffle":false,"img":null,"q":"Mujer de 86 a\u00f1os con demencia que se cae en casa. La Rx muestra una fractura subcapital desplazada m\u00e1s del 50 %. \u00bfTratamiento?","o":["Pr\u00f3tesis parcial de cadera","Tornillos canulados","Tornillo-placa deslizante (DHS)","Clavo intramedular proximal"],"c":1,"e":"Garden IV en mayor de 80 a\u00f1os: <b>pr\u00f3tesis parcial</b>, en 24-48 h. Fuente: apuntes del tema \u00b7 4. Fracturas de cadera \u00b7 Tratamiento del cuello"},{"n":"9","noShuffle":false,"img":null,"q":"Var\u00f3n de 60 a\u00f1os con fractura del cuello femoral Garden I. \u00bfTratamiento?","o":["Tracci\u00f3n y reposo en cama","Tornillos canulados (o FNS)","Pr\u00f3tesis parcial de cadera","Clavo intramedular proximal"],"c":2,"e":"No desplazada en joven (< 75 a\u00f1os): fijaci\u00f3n urgente con <b>tornillos canulados o FNS</b>. Fuente: apuntes del tema \u00b7 4. Fracturas de cadera \u00b7 Tratamiento del cuello"},{"n":"10","noShuffle":false,"img":null,"q":"\u00bfQu\u00e9 fractura de cadera da acortamiento importante y rotaci\u00f3n externa marcada del miembro?","o":["Fractura de acet\u00e1bulo","Fractura pertrocant\u00e9rea","Subcapital no desplazada","Fractura de la cabeza femoral"],"c":2,"e":"La <b>pertrocant\u00e9rea</b> da acortamiento y rotaci\u00f3n externa marcados (y sangra mucho); la de cuello no suele acortar. Fuente: apuntes del tema \u00b7 4. Fracturas per y subtrocant\u00e9ricas"},{"n":"11","noShuffle":false,"img":null,"q":"\u00bfCu\u00e1l es el implante de elecci\u00f3n en una fractura pertrocant\u00e9rea inestable?","o":["Tornillo-placa deslizante (DHS)","Tornillos canulados","Clavo intramedular proximal","Pr\u00f3tesis total de cadera"],"c":3,"e":"<b>Clavo intramedular proximal</b> en las inestables; el DHS es el de elecci\u00f3n en las estables. Fuente: apuntes del tema \u00b7 4. Fracturas per y subtrocant\u00e9ricas"},{"n":"12","noShuffle":false,"img":null,"q":"\u00bfCu\u00e1l es el tratamiento de elecci\u00f3n de la fractura diafisaria de f\u00e9mur del adulto?","o":["Clavo anter\u00f3grado encerrojado","Placa de compresi\u00f3n bloqueada","Yeso pelvip\u00e9dico y tracci\u00f3n","Fijador externo definitivo"],"c":1,"e":"Gold standard: <b>clavo endomedular anter\u00f3grado, fresado y encerrojado</b>; el fijador solo en abiertas III, inestabilidad o demora. Fuente: apuntes del tema \u00b7 5. Di\u00e1fisis femoral"},{"n":"13","noShuffle":false,"img":null,"q":"Var\u00f3n de 35 a\u00f1os con fractura transversa de r\u00f3tula desplazada 5 mm; no puede extender la rodilla contra la gravedad. \u00bfTratamiento?","o":["Agujas y cerclaje (banda a tensi\u00f3n)","Patelectom\u00eda total","Rodillera articulada y RHB","Yeso isquiomaleolar 3-4 semanas en carga"],"c":1,"e":"Desplazada > 2 mm con <b>aparato extensor</b> incompetente: <b>agujas y cerclaje en banda a tensi\u00f3n</b>. Fuente: apuntes del tema \u00b7 7. Aparato extensor \u00b7 R\u00f3tula"},{"n":"14","noShuffle":false,"img":null,"q":"Motorista de 30 a\u00f1os con la rodilla muy deformada, pie fr\u00edo y sin pulso pedio. A\u00fan no tiene radiograf\u00edas. \u00bfQu\u00e9 haces primero?","o":["Inmovilizar y pedir eco-Doppler","RM urgente de la rodilla","Rx de rodilla en dos planos","Reducci\u00f3n cerrada urgente"],"c":4,"e":"Luxaci\u00f3n de rodilla = <b>urgencia vascular</b>: reducci\u00f3n cerrada urgente <b>sin esperar a las radiograf\u00edas</b>, con valoraci\u00f3n neurovascular antes y despu\u00e9s. Fuente: apuntes del tema \u00b7 8. Luxaciones de rodilla"}],"t4142":[{"n":"1","noShuffle":false,"img":null,"q":"Mujer de 19 a\u00f1os, delgada, con dolor sordo en la cara anterior de ambas rodillas que empeora al bajar escaleras y tras estar mucho tiempo sentada. Exploraci\u00f3n casi normal. \u00bfDiagn\u00f3stico m\u00e1s probable?","o":["Osteocondritis disecante","Tendinitis anserina","Condromalacia rotuliana","Rotura meniscal interna"],"c":3,"e":"Dolor femoropatelar con signo de la butaca en <b>mujer joven y delgada</b> con exploraci\u00f3n casi normal: <b>condromalacia rotuliana</b>. Fuente: apuntes del tema \u00b7 3. Condromalacia"},{"n":"2","noShuffle":false,"img":null,"q":"Un \u00edndice de Insall-Salvati de 1,4 indica...","o":["R\u00f3tula alta","Displasia troclear","Valor normal","R\u00f3tula baja"],"c":1,"e":"Insall-Salvati = tend\u00f3n rotuliano / r\u00f3tula; normal 0,8-1,2: <b>> 1,2 = r\u00f3tula alta</b>. Fuente: apuntes del tema \u00b7 2. Estudio de imagen"},{"n":"3","noShuffle":false,"img":null,"q":"Sospecha de hiperpresi\u00f3n rotuliana externa con radiograf\u00edas normales. \u00bfQu\u00e9 prueba hace el diagn\u00f3stico?","o":["RMN","Gammagraf\u00eda","TAC","Ecograf\u00eda"],"c":3,"e":"En la hiperpresi\u00f3n rotuliana externa las Rx suelen ser normales: <b>el diagn\u00f3stico se hace por TAC</b>. Fuente: apuntes del tema \u00b7 3. Hiperpresi\u00f3n rotuliana externa"},{"n":"4","noShuffle":false,"img":null,"q":"\u00bfEn qu\u00e9 consiste el tratamiento quir\u00fargico de la hiperpresi\u00f3n rotuliana externa?","o":["Patelectom\u00eda parcial","Reparar el aler\u00f3n medial","Osteotom\u00eda valguizante tibial","Liberar el aler\u00f3n externo"],"c":4,"e":"Se <b>libera el aler\u00f3n externo</b> por artroscopia; reparar el aler\u00f3n medial es la cirug\u00eda de la inestabilidad. Fuente: apuntes del tema \u00b7 3. Hiperpresi\u00f3n rotuliana externa"},{"n":"5","noShuffle":false,"img":null,"q":"Condromalacia rotuliana con fisuras que afectan a m\u00e1s del 50 % del espesor del cart\u00edlago. \u00bfQu\u00e9 grado de Outerbridge es?","o":["Grado I","Grado II","Grado III","Grado IV"],"c":3,"e":"Outerbridge: I reblandecimiento, II fisuras, <b>III fisuras > 50 %</b> del espesor, IV lesi\u00f3n osteocondral. Fuente: apuntes del tema \u00b7 3. Condromalacia \u00b7 Outerbridge"},{"n":"6","noShuffle":false,"img":null,"q":"\u00bfQu\u00e9 cuadro se conoce como rodilla del saltador?","o":["S\u00edndrome de la cintilla iliotibial","Tendinitis cuadricipital","Tendinitis anserina","Tendinitis rotuliana"],"c":4,"e":"Rodilla del saltador = <b>tendinitis rotuliana</b> (polo inferior, TTA); la cintilla iliotibial es la rodilla del corredor. Fuente: apuntes del tema \u00b7 4. Tendinitis y bursitis"},{"n":"7","noShuffle":false,"img":null,"q":"\u00bfEntre qu\u00e9 estructuras se sit\u00faa el quiste de Baker?","o":["Gemelo medial y semimembranoso","Popl\u00edteo y gemelo lateral","Gemelo lateral y b\u00edceps femoral","Sartorio y recto interno"],"c":1,"e":"El quiste popl\u00edteo o de Baker est\u00e1 entre el <b>gemelo medial y el semimembranoso</b>; solo se trata si es grande y comprime vasos. Fuente: apuntes del tema \u00b7 4. Tendinitis y bursitis"},{"n":"8","noShuffle":false,"img":null,"q":"Mujer de 67 a\u00f1os, obesa y con genu varo, con dolor brusco e intenso en la cara interna de la rodilla y derrame leve. Rx normal. \u00bfQu\u00e9 sospechas?","o":["Quiste de Baker","Condromalacia rotuliana","Osteonecrosis primaria","Osteocondritis disecante"],"c":3,"e":"Mujer > 60, obesa, varo y dolor brusco medial: <b>osteonecrosis primaria</b> del c\u00f3ndilo interno (estadio I, Rx normal). Fuente: apuntes del tema \u00b7 5. Osteonecrosis"},{"n":"9","noShuffle":false,"img":null,"q":"Chico de 13 a\u00f1os, futbolista, con dolor al extender la rodilla en rotaci\u00f3n interna. Fragmento subcondral en el c\u00f3ndilo medial, fisis abiertas y sin l\u00ednea hiperintensa en T2. \u00bfTratamiento?","o":["Mosaicoplastia","Conservador 3-4 meses","Fijaci\u00f3n artrosc\u00f3pica","Perforaciones artrosc\u00f3picas"],"c":2,"e":"Osteocondritis disecante <b>estable</b> con <b>fisis abiertas</b>: tratamiento conservador 3-4 meses; si progresa, artroscopia. Fuente: apuntes del tema \u00b7 6. Osteocondritis disecante"},{"n":"10","noShuffle":false,"img":null,"q":"\u00bfCu\u00e1l es la causa m\u00e1s frecuente de cuerpo libre intraarticular en la rodilla de un paciente joven?","o":["Fractura osteocondral de r\u00f3tula","Osteocondritis disecante","Osteonecrosis primaria","Condromatosis sinovial"],"c":2,"e":"La <b>osteocondritis disecante</b> es la causa m\u00e1s frecuente de cuerpo libre en la rodilla del joven. Fuente: apuntes del tema \u00b7 6. Osteocondritis disecante"},{"n":"11","noShuffle":false,"img":null,"q":"\u00bfQu\u00e9 estudio radiol\u00f3gico se pide para valorar una gonartrosis?","o":["Rx en dec\u00fabito AP y lateral","RMN de rodilla","Rx en carga y telemetr\u00eda","TAC con reconstrucci\u00f3n 3D"],"c":3,"e":"El diagn\u00f3stico es cl\u00ednico y radiol\u00f3gico con <b>Rx en carga y telemetr\u00eda</b>; se estadifica con Ahlb\u00e4ck. Fuente: apuntes del tema \u00b7 7. Gonartrosis"},{"n":"12","noShuffle":false,"img":null,"q":"\u00bfCu\u00e1l es el germen m\u00e1s frecuente en la infecci\u00f3n de una pr\u00f3tesis de rodilla seg\u00fan el material?","o":["Streptococcus pyogenes","S. epidermidis","S. aureus","E. coli"],"c":2,"e":"Germen m\u00e1s frecuente: <b>Staphylococcus epidermidis</b>, seguido de S. aureus (infecci\u00f3n 1-2 %). Fuente: apuntes del tema \u00b7 8. Artroplastia de rodilla"},{"n":"13","noShuffle":false,"img":null,"q":"Futbolista de 24 a\u00f1os que gira con el pie apoyado, nota un chasquido y la rodilla se hincha esa misma tarde. El Lachman es positivo. \u00bfQu\u00e9 ligamento sospechas roto?","o":["Ligamento colateral lateral","Ligamento colateral medial","Ligamento cruzado posterior","Ligamento cruzado anterior"],"c":4,"e":"Torsi\u00f3n con el pie apoyado, <b>chasquido</b>, <b>hemartros</b> precoz y <b>Lachman</b> positivo: rotura del <b>LCA</b>; se confirma con RMN. Fuente: apuntes del tema \u00b7 9. LCA"},{"n":"14","noShuffle":false,"img":null,"q":"Rotura meniscal sintom\u00e1tica en un paciente joven. \u00bfQu\u00e9 actitud quir\u00fargica es la preferente?","o":["Trasplante de aloinjerto meniscal","Sutura del menisco si es posible","Meniscectom\u00eda parcial abierta","Meniscectom\u00eda total artrosc\u00f3pica"],"c":2,"e":"Hay que <b>suturar siempre que se pueda</b>, porque quitar menisco acelera la degeneraci\u00f3n; si no, meniscectom\u00eda parcial lo m\u00e1s conservadora. Fuente: apuntes del tema \u00b7 10. Lesiones meniscales"}]};

  injectSecCSS();

  buildPanels();
  buildIdx();
  buildNums();
  buildAllOrder();

  renderAll();
  updateScores();

  applyTheme();

/* ── CSS dinámico ── */
function injectSecCSS(){
  var css='';
  SECS.forEach(function(s){
    var m=META.secciones[s]||{};
    var c=m.color||'#1a56db',cd=m.colorDim||'#e8f0fe';
    css+='.tab.t-'+s+'.on{background:'+cd+';color:'+c+';border-color:'+c+'}\n';
    css+='.ph.s-'+s+'{border-left:4px solid '+c+'}\n';
    // Variables CSS por sección para el badge coloreado
    css+='#panel-'+s+' .qnum.sec-colored{background:'+cd+';color:'+c+'}\n';
  });
  var st=document.createElement('style');st.textContent=css;document.head.appendChild(st);
}
