<!--
=============================================================
  MOTOR BANCO MIR — v10
  Novedades respecto a v9:
  - Numeración correlativa fija por sección (no se mezcla)
  - Badge neutro en pestaña "Todos" + mezcla real inter-secciones
  - Temporizador sticky editable en header (play/pausa/reset)
  - Buscador de texto en tiempo real
  - Modo repaso rápido (muestra RC + explicación directamente)
  - Estadísticas de errores recurrentes entre sesiones
=============================================================
-->
<!DOCTYPE html>
<html lang="es" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title id="page-title">Banco MIR</title>
<style>
:root{
  --bg:#f4f3ef;--surf:#fff;--bd:#e5e5e5;--bd2:#ddd;
  --txt:#1a1a1a;--txt2:#555;--txt3:#999;--txt4:#666;
  --hdr:#1a1a1a;--hdr-t:#fff;
  --ok-bg:#e6f9ef;--ok-t:#0b6e52;--ok-bd:#2da060;
  --ko-bg:#fdecea;--ko-t:#b91c1c;--ko-bd:#d94f45;
  --sc-ok:#dcf5ed;--sc-ko:#fdecea;--sc-rem:#f0f0f0;--sc-rem-t:#666;
  --exp:#fffbe6;--exp-bd:#f0c04a;--exp-t:#5a4500;
  --prog:#e5e5e5;--prog-fill:#1a56db;
  --star:#ccc;--star-on:#f59e0b;
  --hint:#fafafa;--hint-bd:#eee;
  --tab-bd:#ddd;--tab-t:#555;
  --all-bg:#e8f0fe;--all-t:#1a56db;--all-bd:#1a56db;
  --fab:#1a1a1a;--fab-t:#fff;
  --nota-btn-t:#1a56db;--nota-btn-bd:#1a56db;--nota-btn-bg:var(--surf);
  --timer-bg:#222;--timer-t:#fff;--timer-danger:#ef4444;
}
[data-theme="dark"]{
  --bg:#0f0f1a;--surf:#1e1e30;--bd:#2a2a45;--bd2:#333355;
  --txt:#e8e8f0;--txt2:#aaa;--txt3:#555;--txt4:#888;
  --hdr:#0a0a14;--hdr-t:#e8e8f0;
  --ok-bg:#0b3020;--ok-t:#4ade80;--ok-bd:#166534;
  --ko-bg:#2d0a0a;--ko-t:#f87171;--ko-bd:#7f1d1d;
  --sc-ok:#0b3020;--sc-ko:#2d0a0a;--sc-rem:#252540;--sc-rem-t:#aaa;
  --exp:#1a1500;--exp-bd:#a37f10;--exp-t:#d4b84a;
  --prog:#2a2a45;--prog-fill:#60a5fa;
  --star:#444;--star-on:#f59e0b;
  --hint:#1a1a2e;--hint-bd:#2a2a45;
  --tab-bd:#2a2a45;--tab-t:#aaa;
  --all-bg:#1a2a4a;--all-t:#60a5fa;--all-bd:#3b82f6;
  --fab:#2a2a50;--fab-t:#e8e8f0;
  --nota-btn-t:#60a5fa;--nota-btn-bd:#3b82f6;--nota-btn-bg:var(--surf);
  --timer-bg:#1a1a2e;--timer-t:#e8e8f0;
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:var(--bg);color:var(--txt);min-height:100vh;transition:background .25s,color .25s}

/* ── Header ── */
header{background:var(--hdr);color:var(--hdr-t);padding:9px 16px;display:flex;align-items:center;justify-content:space-between;gap:8px;flex-wrap:wrap;position:sticky;top:0;z-index:100}
header h1{font-size:13.5px;font-weight:600;white-space:nowrap}
.hright{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.hmeta{font-size:11px;color:#888}
.hbtn{background:none;border:none;cursor:pointer;font-size:16px;line-height:1;padding:3px 5px;border-radius:5px;transition:background .15s;color:var(--hdr-t)}
.hbtn:hover{background:rgba(255,255,255,.12)}
.sbadge{font-size:11px;padding:3px 9px;border-radius:5px;font-weight:500}
.sbadge.ok{background:#15803d;color:#dcfce7}.sbadge.warn{background:#92400e;color:#fef3c7}

/* ── Temporizador ── */
#timer-wrap{display:flex;align-items:center;gap:4px;background:var(--timer-bg);border-radius:7px;padding:3px 8px;border:1px solid rgba(255,255,255,.1)}
#timer-display{font-size:13px;font-weight:700;font-family:monospace;color:var(--timer-t);min-width:58px;text-align:center;cursor:pointer;border-radius:3px;padding:1px 3px}
#timer-display:hover{background:rgba(255,255,255,.08)}
#timer-display.editing{background:rgba(255,255,255,.15);outline:none;color:var(--timer-t)}
#timer-display.danger{color:var(--timer-danger)}
#timer-wrap button{background:none;border:none;cursor:pointer;color:rgba(255,255,255,.7);font-size:12px;padding:1px 3px;border-radius:3px;line-height:1}
#timer-wrap button:hover{background:rgba(255,255,255,.12);color:#fff}

/* ── Barra de progreso ── */
#prog-wrap{height:3px;background:var(--prog);position:sticky;top:40px;z-index:99}
#prog-bar{height:100%;background:var(--prog-fill);width:0%;transition:width .4s}

/* ── Contenedor ── */
.container{max-width:820px;margin:0 auto;padding:16px 12px}

/* ── Buscador ── */
.search-wrap{position:relative;margin-bottom:13px}
.search-wrap input{width:100%;padding:8px 34px 8px 12px;border:1.5px solid var(--bd2);border-radius:8px;font-size:13px;background:var(--surf);color:var(--txt);outline:none;transition:border-color .15s}
.search-wrap input:focus{border-color:var(--prog-fill)}
.search-clear{position:absolute;right:9px;top:50%;transform:translateY(-50%);background:none;border:none;cursor:pointer;color:var(--txt3);font-size:16px;display:none;line-height:1}
#search-count{font-size:11px;color:var(--txt3);margin-top:4px;display:none}

/* ── Modo repaso ── */
.mode-bar{display:flex;gap:6px;margin-bottom:12px;align-items:center}
.mode-btn{padding:5px 12px;border:1.5px solid var(--bd2);border-radius:7px;cursor:pointer;font-size:12px;font-weight:500;background:var(--surf);color:var(--txt2);transition:all .15s}
.mode-btn:hover{border-color:#999}
.mode-btn.on{background:var(--all-bg);color:var(--all-t);border-color:var(--all-bd)}

/* ── Tabs ── */
.tabs{display:flex;gap:7px;margin-bottom:13px;flex-wrap:wrap}
.tab{padding:7px 14px;border:1.5px solid var(--tab-bd);border-radius:8px;cursor:pointer;font-size:12.5px;font-weight:500;background:var(--surf);color:var(--tab-t);transition:all .15s}
.tab:hover{border-color:#999;color:var(--txt)}
.tab.t-all.on{background:var(--all-bg);color:var(--all-t);border-color:var(--all-bd)}

/* ── Score global ── */
.ph-global{background:var(--surf);border-radius:10px;border:1px solid var(--bd);padding:10px 15px;margin-bottom:10px;display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;border-left:4px solid var(--prog-fill)}
.score-row{display:flex;gap:7px;align-items:center;flex-wrap:wrap}
.sc{font-size:12px;font-weight:600;padding:3px 9px;border-radius:6px}
.sc.ok{background:var(--sc-ok);color:var(--ok-t)}.sc.ko{background:var(--sc-ko);color:var(--ko-t)}.sc.rem{background:var(--sc-rem);color:var(--sc-rem-t)}

/* ── Acciones ── */
.global-actions{display:none;margin-bottom:10px;gap:7px;flex-wrap:wrap;align-items:center}
.container[data-tab="all"] .global-actions{display:flex}
.sec-actions{margin:6px 0 15px;display:flex;gap:7px;flex-wrap:wrap}
.reset-btn{padding:7px 14px;background:var(--fab);color:var(--fab-t);border:none;border-radius:8px;cursor:pointer;font-size:12.5px;font-weight:500;transition:opacity .15s}
.reset-btn:hover{opacity:.82}
.nota-btn{padding:7px 14px;background:var(--nota-btn-bg);color:var(--nota-btn-t);border:1.5px solid var(--nota-btn-bd);border-radius:8px;cursor:pointer;font-size:12.5px;font-weight:500;transition:background .15s}
.nota-btn:hover{background:var(--all-bg)}

/* ── Nota box ── */
.nota-box,.global-nota-box{margin-top:8px;padding:12px 15px;border-radius:10px;border:2px solid var(--bd2);font-size:13px;line-height:1.7;display:none}
.nota-box.pass,.global-nota-box.pass{background:var(--ok-bg);border-color:var(--ok-bd);color:var(--ok-t)}
.nota-box.fail,.global-nota-box.fail{background:var(--ko-bg);border-color:var(--ko-bd);color:var(--ko-t)}
.nota-score{font-size:26px;font-weight:700;display:block;margin-bottom:4px}
.nota-detail{font-size:12px;opacity:.85;font-family:monospace}

/* ── Vista revisión ── */
.review-list{margin-top:12px;border-top:1px solid var(--bd2);padding-top:10px}
.review-title{font-size:12px;font-weight:700;margin-bottom:9px;color:var(--txt)}
.review-sec-label{font-size:11.5px;font-weight:700;color:var(--txt3);margin:8px 0 5px;padding-top:6px;border-top:1px solid var(--bd)}
.review-item{background:var(--surf);border-radius:8px;border:1px solid var(--bd);margin-bottom:7px;overflow:hidden}
.review-item summary{padding:9px 12px;cursor:pointer;font-size:12.5px;color:var(--txt);list-style:none;display:flex;gap:8px;align-items:flex-start}
.review-item summary::-webkit-details-marker{display:none}
.review-item summary::before{content:'▶';font-size:9px;color:var(--txt3);flex-shrink:0;margin-top:4px;transition:transform .18s}
details[open] summary::before{transform:rotate(90deg)}
.review-body{padding:0 12px 11px}
.review-ans{font-size:12px;color:var(--ok-t);margin-bottom:7px;font-weight:500}

/* ── Estadísticas ── */
.stats-box{margin-top:8px;padding:12px 15px;border-radius:10px;border:1.5px solid var(--bd2);background:var(--surf);display:none}
.stats-box.show{display:block}
.stats-title{font-size:12px;font-weight:700;margin-bottom:10px;color:var(--txt)}
.stats-item{display:flex;align-items:center;gap:8px;padding:6px 0;border-bottom:1px solid var(--bd);font-size:12.5px}
.stats-item:last-child{border-bottom:none}
.stats-bar-wrap{flex:1;background:var(--sc-rem);border-radius:4px;height:6px;overflow:hidden}
.stats-bar{height:100%;background:var(--ko-bd);border-radius:4px;transition:width .4s}
.stats-n{font-size:11px;color:var(--txt3);white-space:nowrap}
.stats-q{flex:2;color:var(--txt);font-size:12px;line-height:1.3}

/* ── Panel secciones ── */
.sec-panel{display:none}.sec-panel.visible{display:block}
.ph{background:var(--surf);border-radius:10px;border:1px solid var(--bd);padding:10px 14px;margin-bottom:8px;display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.ph-left{flex:1;display:flex;flex-direction:column;gap:5px}
.ph-label{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;color:var(--txt3);margin-bottom:1px}
.ph-desc{font-size:12px;color:var(--txt4)}
.fbtn{padding:6px 12px;font-size:12px;font-weight:500;border:1.5px solid var(--bd2);border-radius:8px;cursor:pointer;background:var(--surf);color:var(--txt2);transition:all .15s;white-space:nowrap}
.fbtn:hover{border-color:#999;color:var(--txt)}.fbtn.on{background:var(--ko-bg);color:#b91c1c;border-color:#f87171}
.no-failed{display:none;text-align:center;padding:16px;color:var(--txt3);font-size:13px;border:1.5px dashed var(--bd2);border-radius:8px;margin-top:4px}
.no-failed.show{display:block}
.no-results{display:none;text-align:center;padding:20px;color:var(--txt3);font-size:13px;border:1.5px dashed var(--bd2);border-radius:8px;margin:8px 0}

/* ── Hint ── */
.hint{font-size:11px;color:var(--txt3);margin-bottom:15px;padding:7px 11px;background:var(--hint);border-radius:6px;border:1px solid var(--hint-bd)}

/* ── Tarjeta ── */
.qcard{background:var(--surf);border-radius:10px;border:1px solid var(--bd);margin-bottom:7px;overflow:hidden;transition:box-shadow .15s}
.qcard:hover{box-shadow:0 2px 8px rgba(0,0,0,.08)}
.qcard.kb-focus{outline:2px solid var(--prog-fill);outline-offset:-2px}
.qcard.search-hidden{display:none}
.qhead{padding:11px 13px;cursor:pointer;display:flex;align-items:flex-start;gap:9px}

/* ── Badge numérico ── */
.qnum{font-size:11px;font-weight:700;padding:3px 7px;border-radius:5px;white-space:nowrap;flex-shrink:0;margin-top:2px;background:var(--sc-rem);color:var(--sc-rem-t)}
/* En pestaña "Todos" siempre neutro; en sección aplica color de sección */
.qnum.sec-colored{background:var(--sec-dim);color:var(--sec-col)}

.qtxt{font-size:13px;line-height:1.5;flex:1}
.star-btn{background:none;border:none;cursor:pointer;font-size:15px;color:var(--star);padding:0 2px;flex-shrink:0;margin-top:2px;line-height:1;transition:color .15s,transform .15s}
.star-btn:hover{transform:scale(1.2)}
.star-btn .si{display:inline}.star-btn .sf{display:none}
.star-btn.on .si{display:none}.star-btn.on .sf{display:inline;color:var(--star-on)}
.chev{font-size:15px;color:var(--bd2);flex-shrink:0;margin-top:2px;transition:transform .2s}
.qhead.open .chev{transform:rotate(180deg)}
.qbody{display:none;padding:0 13px 13px}.qbody.open{display:block}

/* ── Imagen ── */
.clinimg-wrap{margin:9px 0 7px;background:#111;border-radius:8px;overflow:hidden;border:1px solid var(--bd2);text-align:center}
.clinimg{max-width:100%;max-height:340px;object-fit:contain;display:block;margin:0 auto}
.clinimg-cap{font-size:11px;color:var(--txt3);padding:4px 0 5px;background:var(--hint);border-top:1px solid var(--bd)}

/* ── Opciones ── */
.opts{list-style:none;margin-top:9px;display:flex;flex-direction:column;gap:5px}
.opt{padding:9px 12px;border-radius:8px;border:1.5px solid var(--bd2);cursor:pointer;display:flex;align-items:flex-start;gap:9px;color:var(--txt);font-size:13px;line-height:1.45;transition:border-color .12s,background .12s;user-select:none}
.opt:hover:not(.done){border-color:#999;background:var(--hint)}
.opt.correct{background:var(--ok-bg);border-color:var(--ok-bd);color:var(--ok-t);font-weight:500;cursor:default}
.opt.wrong{background:var(--ko-bg);border-color:var(--ko-bd);color:var(--ko-t);cursor:default}
.opt.done:not(.correct):not(.wrong){cursor:default;opacity:.7}
.onum{font-size:11px;font-weight:700;flex-shrink:0;margin-top:2px;min-width:15px}

/* ── Modo repaso rápido ── */
.quick-card{padding:9px 12px;border-radius:8px;border:1.5px solid var(--ok-bd);background:var(--ok-bg);margin-top:8px}
.quick-rc{font-size:12.5px;font-weight:600;color:var(--ok-t);margin-bottom:6px}

/* ── Explicación ── */
.expbox{margin-top:10px;padding:10px 12px;background:var(--exp);border-left:4px solid var(--exp-bd);border-radius:0 8px 8px 0;font-size:12.5px;color:var(--exp-t);line-height:1.65}
.expbox b,.expbox strong{font-weight:600}
.et{display:block;margin-bottom:4px;font-weight:600;font-size:13px}
.atag{font-size:10px;padding:2px 6px;border-radius:4px;margin-left:5px;vertical-align:middle}
.atag.ok{background:var(--sc-ok);color:var(--ok-t)}.atag.ko{background:var(--sc-ko);color:#c0392b}

/* ── All-tab CSS ── */
.container[data-tab="all"] .ph{display:none!important}
.container[data-tab="all"] .sec-actions{display:none!important}
.container[data-tab="all"] .no-failed{display:none!important}
.container[data-tab="all"] .nota-box{display:none!important}
.container:not([data-tab="all"]) .global-nota-box{display:none!important}
.container:not([data-tab="all"]) #stats-global{display:none!important}

/* ── Contadores ✓ ✗ ○ pulsables: filtran las preguntas ── */
.sc.ok,.sc.ko,.sc.rem{cursor:pointer;user-select:none;-webkit-user-select:none;transition:box-shadow .15s}
.sc.ok:hover,.sc.ko:hover,.sc.rem:hover{box-shadow:0 0 0 1px var(--bd2)}
.sc.ok.on{box-shadow:0 0 0 1.5px var(--ok-t)}
.sc.ko.on{box-shadow:0 0 0 1.5px var(--ko-t)}
.sc.rem.on{box-shadow:0 0 0 1.5px var(--sc-rem-t)}
.qcard.rem-hidden{display:none!important}
.no-rem{display:none;text-align:center;padding:16px;color:var(--txt3);font-size:13px;border:1.5px dashed var(--bd2);border-radius:8px;margin-top:4px}
</style>
</head>
<body>
<header>
  <h1 id="h-tit">Banco MIR</h1>
  <div class="hright">
    <span class="hmeta" id="h-meta"></span>
    <!-- Temporizador -->
    <div id="timer-wrap" title="Haz clic en el tiempo para editar">
      <span id="timer-display">0:00:00</span>
      <button id="btn-tplay" onclick="timerToggle()" title="Play/Pausa">▶</button>
      <button onclick="timerReset()" title="Reset">↺</button>
    </div>
    <button class="hbtn" id="btn-dark" onclick="toggleDark()" title="Modo oscuro">🌙</button>
    <span id="save-badge" class="sbadge"></span>
  </div>
</header>
<div id="prog-wrap"><div id="prog-bar"></div></div>

<div class="container" id="main-cont" data-tab="all">
  <!-- Buscador -->
  <div class="search-wrap">
    <input type="text" id="search-input" placeholder="🔍 Buscar en enunciados..." oninput="onSearch(this.value)">
    <button class="search-clear" id="search-clear" onclick="clearSearch()">✕</button>
  </div>
  <div id="search-count"></div>

  <!-- Modo -->
  <div class="mode-bar">
    <span style="font-size:11.5px;color:var(--txt3);font-weight:600">MODO:</span>
    <button class="mode-btn on" id="mode-test" onclick="setMode('test')">📝 Test</button>
    <button class="mode-btn" id="mode-quick" onclick="setMode('quick')">⚡ Repaso rápido</button>
    <button class="mode-btn" id="btn-stars" onclick="filterStarred()" style="margin-left:auto;border-color:#f59e0b;color:#b45309">⭐ Marcadas</button>
    <button class="mode-btn" id="btn-stats" onclick="toggleStats()">📊 Errores</button>
  </div>

  <!-- Stats globales -->
  <div class="stats-box" id="stats-global"></div>

  <!-- Tabs -->
  <div class="tabs" id="tabs-wrap"></div>

  <!-- Score global -->
  <div class="ph-global">
    <div class="ph-left">
      <span class="ph-desc" id="ph-gdesc"></span>
      <div class="score-row">
        <span class="sc ok" id="sc-ok-all">✓ 0</span>
        <span class="sc ko" id="sc-ko-all">✗ 0</span>
        <span class="sc rem" id="sc-rem-all">○ 0</span>
      </div>
    </div>
  </div>
  <div class="global-actions">
    <button class="reset-btn" onclick="resetAll()">↺ Reiniciar y mezclar</button>
    <button class="nota-btn" onclick="calcNotaAll()">✎ Calcular nota global</button>
  </div>
  <div class="global-nota-box" id="nota-all"></div>
  <p class="hint">💡 <b>1–5</b> responde · <b>↑↓</b> navega · <b>S</b> marca ⭐ · Progreso guardado automáticamente</p>

  <div id="panels-wrap"></div>
</div>

<script>
/* ═══════════════════════════════════════ MOTOR v10 ═══════════════════════════════════════ */

var META=/*__META_JSON__*/{"titulo":"Inmunolog\u00eda \u00b7 T12 Autoinmunidad","subtitulo":"Tema 12 \u00b7 Microbiolog\u00eda e Inmunolog\u00eda","examen":"Tema 12 \u00b7 preguntas estilo examen","secciones":{"bases":{"label":"Concepto, gen\u00e9tica y ambiente","emoji":"\ud83e\uddec","color":"#2f80ed","colorDim":"#1b4a8a","desc":"definici\u00f3n \u00b7 HLA y riesgo relativo \u00b7 gemelos \u00b7 DM1 \u00b7 factores ambientales"},"inmuno":{"label":"Sistema inmunitario y clasificaci\u00f3n","emoji":"\ud83d\udee1\ufe0f","color":"#9b51e0","colorDim":"#5b2d87","desc":"mimetismo molecular \u00b7 ant\u00edgenos ocultos \u00b7 Treg \u00b7 clasificaci\u00f3n por \u00f3rgano y mecanismo"},"ac":{"label":"Anticuerpos e inmunocomplejos","emoji":"\ud83c\udfaf","color":"#eb5757","colorDim":"#8a2f2f","desc":"Graves \u00b7 miastenia gravis \u00b7 p\u00e9nfigo \u00b7 lupus eritematoso sist\u00e9mico"},"linfT":{"label":"Mediada por linfocitos T","emoji":"\ud83d\udd2c","color":"#27ae60","colorDim":"#16673a","desc":"artritis reumatoide \u00b7 DM1 \u00b7 esclerosis m\u00faltiple \u00b7 cel\u00edaca \u00b7 EII \u00b7 psoriasis"},"tto":{"label":"Tratamiento","emoji":"\ud83d\udc8a","color":"#f2994a","colorDim":"#8f5a2b","desc":"amplio espectro \u00b7 plasmaf\u00e9resis \u00b7 anti-citocinas \u00b7 anti-coestimulaci\u00f3n"}}};
var D=/*__D_JSON__*/{"bases":[{"n":"1","noShuffle":false,"img":null,"q":"\u00bfCu\u00e1l de las siguientes define mejor la autoinmunidad seg\u00fan el tema?","o":["Respuesta innata inespec\u00edfica frente a ant\u00edgenos propios","Respuesta adaptativa espec\u00edfica frente a un ant\u00edgeno propio","Respuesta adaptativa exagerada frente a ant\u00edgenos inocuos","Ausencia de respuesta adaptativa frente a ant\u00edgenos extra\u00f1os"],"c":2,"e":"La autoinmunidad es una <b>respuesta inmunitaria adaptativa espec\u00edfica frente a un ant\u00edgeno propio</b>, humoral o celular. La respuesta exagerada a ant\u00edgenos inocuos es hipersensibilidad/alergia, no autoinmunidad. Fuente: diapositivas del tema \u00b7 Autoinmunidad"},{"n":"2","noShuffle":false,"img":null,"q":"Respecto a la predisposici\u00f3n gen\u00e9tica a las enfermedades autoinmunes, se\u00f1ale la FALSA:","o":["Supone un incremento del riesgo seg\u00fan la carga gen\u00e9tica","Equivale a padecer la enfermedad autoinmune","Puede deberse a la herencia de SNPs","Puede deberse a la herencia de genes polim\u00f3rficos como los HLA"],"c":2,"e":"La predisposici\u00f3n es un <b>incremento del riesgo</b> que <b>no implica necesariamente</b> la enfermedad: hacen falta factores ambientales. Sus mecanismos principales son la herencia de SNPs y de genes polim\u00f3rficos como los HLA. Fuente: diapositivas del tema \u00b7 Predisposici\u00f3n gen\u00e9tica"},{"n":"3","noShuffle":false,"img":null,"q":"Seg\u00fan la diapositiva, el riesgo relativo (RR) de un alelo HLA para una enfermedad autoinmune se calcula como:","o":["Frecuencia del alelo en sanos / frecuencia del alelo en enfermos","Concordancia en gemelos monocigotos / concordancia en dicigotos","Frecuencia del alelo en enfermos / frecuencia en los sanos","Portadores enfermos / total de sanos"],"c":3,"e":"<b>RR = frecuencia del alelo en individuos con la enfermedad / frecuencia del alelo en individuos sanos</b>. Es la f\u00f3rmula simplificada del tema; los valores de la tabla son la raz\u00f3n de productos cruzados. Fuente: diapositivas del tema \u00b7 Predisposici\u00f3n gen\u00e9tica"},{"n":"4","noShuffle":false,"img":null,"q":"En la tabla de alelos HLA asociados a enfermedades autoinmunes del tema, \u00bfqu\u00e9 asociaci\u00f3n tiene el riesgo relativo m\u00e1s alto?","o":["Enfermedad cel\u00edaca y HLA-DQ2/DQ8","Artritis reumatoide y HLA-DR4","Espondilitis anquilosante y HLA-B27","Diabetes mellitus de tipo 1 y HLA-DQ8"],"c":3,"e":"La <b>espondilitis anquilosante con HLA-B27 (RR 150)</b> es la asociaci\u00f3n m\u00e1s fuerte de la tabla; cel\u00edaca-DQ2/DQ8 tiene RR 30, AR-DR4 RR 9 y DM1-DQ8 RR 14. Fuente: diapositivas del tema \u00b7 Riesgo relativo"},{"n":"5","noShuffle":false,"img":null,"q":"Que gemelos monocigotos con el mismo haplotipo HLA puedan ser discordantes para una enfermedad autoinmune indica que:","o":["El componente gen\u00e9tico es el \u00fanico determinante","Hacen falta otros factores adem\u00e1s de la gen\u00e9tica","El HLA no influye en la susceptibilidad","Los gemelos monocigotos no comparten sus alelos HLA"],"c":2,"e":"Los monocigotos comparten genoma y HLA y aun as\u00ed pueden ser <b>discordantes</b>: la gen\u00e9tica predispone, pero son enfermedades <b>multifactoriales</b> que necesitan adem\u00e1s ambiente y alteraci\u00f3n inmunitaria. Fuente: diapositivas del tema \u00b7 Predisposici\u00f3n gen\u00e9tica"},{"n":"6","noShuffle":false,"img":null,"q":"Respecto a la predisposici\u00f3n gen\u00e9tica de la diabetes mellitus tipo 1, se\u00f1ale la correcta:","o":["Solo se ha descrito una regi\u00f3n de susceptibilidad, el HLA","El HLA explica del 30 al 50 % de la segregaci\u00f3n familiar","Los alelos DR3 y DR4 aparecen en el 50 % de los diab\u00e9ticos","El HLA explica m\u00e1s del 90 % de la segregaci\u00f3n familiar"],"c":2,"e":"Hay <b>m\u00e1s de 12 regiones</b> de susceptibilidad; la principal es el MHC/HLA, que explica <b>del 30 al 50 % de la segregaci\u00f3n familiar</b>. DR3/DR4 est\u00e1n en el 95 % de los diab\u00e9ticos blancos (50 % en sanos). Fuente: diapositivas del tema \u00b7 Caso de la DM tipo 1"},{"n":"7","noShuffle":false,"img":null,"q":"Var\u00f3n de raza blanca de 14 a\u00f1os con diabetes mellitus tipo 1 reci\u00e9n diagnosticada. Seg\u00fan el tema, \u00bfcon qu\u00e9 probabilidad expresar\u00e1 al menos un alelo HLA-DR3 o HLA-DR4?","o":["La mitad","Un 30 %","Menos del 15 %","Alrededor del 95 %"],"c":4,"e":"El <b>95 %</b> de los individuos de raza blanca con DM expresan al menos un alelo HLA-DR3 o HLA-DR4, frente al <b>50 %</b> de la poblaci\u00f3n sana (locus HLA-DRB1). Fuente: diapositivas del tema \u00b7 Caso de la DM tipo 1"},{"n":"8","noShuffle":false,"img":null,"q":"Seg\u00fan el tema, los genes hormonales se relacionan con:","o":["La herencia de SNPs en el locus HLA-DRB1","Incidencia por sexo y mejor\u00eda de la AR en el embarazo","El fallo de la tolerancia central por mutaci\u00f3n de AIRE","La aparici\u00f3n del lupus inducido por f\u00e1rmacos"],"c":2,"e":"Los <b>genes hormonales</b> explican la <b>incidencia seg\u00fan el sexo</b> o la <b>mejor\u00eda de algunas enfermedades autoinmunes, como la artritis reumatoide, durante el embarazo</b>. El lupus inducido por f\u00e1rmacos es un factor ambiental. Fuente: diapositivas del tema \u00b7 Predisposici\u00f3n gen\u00e9tica"},{"n":"9","noShuffle":false,"img":null,"q":"Seg\u00fan el tema, \u00bfqu\u00e9 factor ambiental se asocia tanto al lupus eritematoso sist\u00e9mico como a la artritis reumatoide?","o":["Dieta y obesidad","S\u00edlice","Streptococcus pyogenes","Virus de la hepatitis C"],"c":2,"e":"La <b>s\u00edlice</b> se asocia a LES y AR. Dieta y obesidad se relacionan con la DM tipo I y S. pyogenes con fiebre reum\u00e1tica y glomerulonefritis; el VHC aparece solo en la tabla de mimetismo (diabetes tipo 1). Fuente: diapositivas del tema \u00b7 Factores ambientales"},{"n":"10","noShuffle":false,"img":null,"q":"En un estudio de concordancia en gemelos, \u00bfqu\u00e9 dato indica un mayor peso gen\u00e9tico de una enfermedad autoinmune?","o":["Una concordancia parecida en monocigotos y en dicigotos","Mucha diferencia entre la concordancia MZ y la DZ","Una concordancia del 100 % en los gemelos dicigotos","Una concordancia baja tanto en monocigotos como en dicigotos"],"c":2,"e":"<b>Cuanto mayor es la diferencia entre la concordancia MZ y la DZ, m\u00e1s relevante es el peso gen\u00e9tico</b>: los MZ comparten todo el genoma y los DZ se parecen como dos hermanos. Aun as\u00ed, en MZ ninguna llega al 100 % porque son multifactoriales. Fuente: notas de clase \u00b7 Estudios en gemelos"},{"n":"11","noShuffle":false,"img":null,"q":"En la tabla de gemelos del tema, la epilepsia no traum\u00e1tica tiene una concordancia del 70 % en monocigotos. Esto significa que:","o":["El 70 % de los gemelos monocigotos porta el alelo HLA de riesgo","El riesgo relativo de los monocigotos es de 70","En 70 de cada 100 parejas de monocigotos enferman los dos","El 70 % de los casos se explica solo por el ambiente"],"c":3,"e":"La concordancia es el porcentaje de parejas en las que <b>los dos gemelos sufren la patolog\u00eda</b>: 70 de cada 100 parejas MZ frente a 6 de cada 100 DZ en la epilepsia no traum\u00e1tica. No es un riesgo relativo ni una frecuencia al\u00e9lica. Fuente: notas de clase \u00b7 Estudios en gemelos"},{"n":"12","noShuffle":false,"img":null,"q":"En la tabla de alelos HLA del tema, la espondilitis anquilosante (HLA-B27) muestra 95 en pacientes y 9 en controles. Esas cifras indican:","o":["El n\u00famero de enfermos con y sin HLA-B27","El porcentaje de enfermos y de sanos que presentan HLA-B27","El riesgo relativo en varones y en mujeres","La concordancia en gemelos monocigotos y en gemelos dicigotos"],"c":2,"e":"Las columnas Pacientes y Controles son el <b>porcentaje de individuos que presentan el alelo</b>: los pacientes tienen la enfermedad y los controles presentan el alelo sin la enfermedad. Para EA\u2013B27: <b>95 % frente a 9 %</b>, con RR 150. Fuente: notas de clase \u00b7 Riesgo relativo"},{"n":"13","noShuffle":false,"img":null,"q":"\u00bfQu\u00e9 gen no relacionado con HLA codifica el factor de transcripci\u00f3n de los linfocitos T reguladores y, cuando falla, produce el s\u00edndrome IPEX?","o":["AIRE","CTLA4","C4","FoxP3"],"c":4,"e":"<b>FoxP3</b> es el factor de transcripci\u00f3n de los Treg; su deficiencia deja sin Treg funcionales y da el <b>IPEX</b>, un s\u00edndrome por alteraci\u00f3n de la inmunorregulaci\u00f3n. AIRE se asocia a APS, C4 a LES y CTLA4 a enfermedad inflamatoria sist\u00e9mica. Fuente: notas de clase \u00b7 Otros genes no relacionados con HLA"}],"inmuno":[{"n":"1","noShuffle":false,"img":null,"q":"El mimetismo molecular consiste en que:","o":["Agentes infecciosos comparten ep\u00edtopos con autoant\u00edgenos","Se liberan ant\u00edgenos de \u00f3rganos inmunoprivilegiados","Hay un d\u00e9ficit en la funci\u00f3n de los linfocitos T reguladores","Se activan en exceso las APC tras un traumatismo"],"c":1,"e":"En el <b>mimetismo molecular</b> algunos agentes infecciosos <b>comparten ep\u00edtopos con autoant\u00edgenos</b> y provocan una <b>reacci\u00f3n cruzada</b> que da\u00f1a los tejidos. Las otras opciones son ant\u00edgenos ocultos, deficiencias reguladoras y aumento del proceso inflamatorio. Fuente: diapositivas del tema \u00b7 Sistema inmunitario"},{"n":"2","noShuffle":false,"img":null,"q":"Ni\u00f1o de 9 a\u00f1os con afectaci\u00f3n cardiaca semanas despu\u00e9s de una faringoamigdalitis por Streptococcus pyogenes. Seg\u00fan los ejemplos de mimetismo molecular del tema, \u00bfqu\u00e9 mol\u00e9cula propia est\u00e1 implicada?","o":["Prote\u00edna b\u00e1sica de mielina","Receptor para acetilcolina","Miosina cardiaca","\u00c1cido glut\u00e1mico descarboxilasa 65"],"c":3,"e":"En la <b>fiebre reum\u00e1tica</b>, un ep\u00edtopo de <b>Streptococcus pyogenes</b> se parece a la <b>miosina cardiaca</b>. La mielina se relaciona con VEB y Chlamydia (EM), el receptor de ACh con poliovirus y la GAD65 con VHC. Fuente: diapositivas del tema \u00b7 Mimetismo molecular"},{"n":"3","noShuffle":false,"img":null,"q":"Var\u00f3n de 40 a\u00f1os con traumatismo penetrante en el ojo derecho que semanas despu\u00e9s presenta inflamaci\u00f3n tambi\u00e9n del ojo izquierdo. \u00bfQu\u00e9 mecanismo del tema lo explica?","o":["Mimetismo molecular con un agente infeccioso previo","Dep\u00f3sito de inmunocomplejos circulantes","Liberaci\u00f3n de ant\u00edgenos ocultos intraoculares","D\u00e9ficit gen\u00e9tico de linfocitos T reguladores"],"c":3,"e":"<b>Ant\u00edgenos ocultos</b>: el traumatismo libera ant\u00edgenos intraoculares aislados que llegan a los ganglios y activan linfocitos T; las c\u00e9lulas T efectoras vuelven por la sangre y atacan <b>ambos ojos</b>. Fuente: diapositivas del tema \u00b7 Sistema inmunitario"},{"n":"4","noShuffle":false,"img":null,"q":"\u00bfCu\u00e1l de los siguientes NO figura entre las alteraciones del sistema inmunitario que favorecen la autoinmunidad?","o":["Fallo de la tolerancia central o perif\u00e9rica","Activaci\u00f3n excesiva de APC y linfocitos T","Aumento de la funci\u00f3n de los Treg","Desequilibrio en las citocinas"],"c":3,"e":"El tema recoge <b>d\u00e9ficit o alteraci\u00f3n</b> de los Treg (no su aumento), c\u00e9lulas autorreactivas, mimetismo molecular, ant\u00edgenos ocultos, aumento del proceso inflamatorio (APC y T) y desequilibrio de citocinas. Fuente: diapositivas del tema \u00b7 Sistema inmunitario"},{"n":"5","noShuffle":false,"img":null,"q":"\u00bfCu\u00e1l de las siguientes es una enfermedad autoinmune NO \u00f3rgano-espec\u00edfica seg\u00fan la clasificaci\u00f3n del tema?","o":["Enfermedad de Graves","Miastenia gravis","S\u00edndrome de Goodpasture","Artritis reumatoide"],"c":4,"e":"La <b>artritis reumatoide</b> est\u00e1 entre las <b>no \u00f3rgano-espec\u00edficas</b> (con Sj\u00f6gren, esclerodermia, lupus\u2026). Graves (endocrino), miastenia (neuromuscular) y Goodpasture (ri\u00f1\u00f3n y pulm\u00f3n) son \u00f3rgano-espec\u00edficas. Fuente: diapositivas del tema \u00b7 Clasificaci\u00f3n"},{"n":"6","noShuffle":false,"img":null,"q":"En la clasificaci\u00f3n por \u00f3rganos del tema, la esclerosis m\u00faltiple se incluye en:","o":["\u00d3rgano-espec\u00edficas del sistema neuromuscular","\u00d3rgano-espec\u00edficas del sistema endocrino","\u00d3rgano-espec\u00edficas de ri\u00f1\u00f3n y pulm\u00f3n","Grupo de enfermedades no \u00f3rgano-espec\u00edficas"],"c":1,"e":"La <b>esclerosis m\u00faltiple</b> aparece junto a la <b>miastenia gravis</b> en el grupo \u00f3rgano-espec\u00edfico del <b>sistema neuromuscular</b>. Fuente: diapositivas del tema \u00b7 Clasificaci\u00f3n"},{"n":"7","noShuffle":false,"img":null,"q":"Seg\u00fan la clasificaci\u00f3n por mecanismo, \u00bfqu\u00e9 enfermedad est\u00e1 mediada por inmunocomplejos?","o":["Enfermedad inflamatoria intestinal","Diabetes mellitus tipo I","Lupus eritematoso sist\u00e9mico","Enfermedad de Graves"],"c":3,"e":"El <b>LES</b> es el ejemplo de autoinmunidad <b>mediada por inmunocomplejos</b> (ADN, histonas, snRNP\u2026). Graves est\u00e1 mediada por anticuerpos; EII y DM1, por linfocitos T. Fuente: diapositivas del tema \u00b7 Clasificaci\u00f3n seg\u00fan mecanismo"},{"n":"8","noShuffle":false,"img":null,"q":"En la tabla de clasificaci\u00f3n por mecanismo, \u00bfqu\u00e9 autoant\u00edgeno se asigna a la esclerosis m\u00faltiple?","o":["Ant\u00edgenos de las c\u00e9lulas \u03b2 pancre\u00e1ticas","Prote\u00edna b\u00e1sica de mielina y proteolip\u00eddica","Bacterias ent\u00e9ricas","Receptor de la acetilcolina de la placa"],"c":2,"e":"En la EM el autoant\u00edgeno es la <b>prote\u00edna b\u00e1sica de la mielina y la proteolip\u00eddica</b>, con par\u00e1lisis y ceguera como consecuencia. C\u00e9lulas \u03b2: DM1; bacterias ent\u00e9ricas: EII; receptor de ACh: miastenia. Fuente: diapositivas del tema \u00b7 Clasificaci\u00f3n seg\u00fan mecanismo"},{"n":"9","noShuffle":false,"img":null,"q":"En la tabla de mimetismo molecular del tema, \u00bfqu\u00e9 pareja microorganismo\u2013mol\u00e9cula propia corresponde a la diabetes tipo 1?","o":["Poliovirus y receptor de acetilcolina","Chlamydia pneumoniae y prote\u00edna b\u00e1sica de mielina","Streptococcus pyogenes y miosina cardiaca","Virus de la hepatitis C y \u00e1cido glut\u00e1mico descarboxilasa 65"],"c":4,"e":"En la DM1 el ejemplo es el <b>virus de la hepatitis C</b> y la <b>\u00e1cido glut\u00e1mico descarboxilasa 65</b>. Poliovirus\u2013receptor de ACh es la miastenia; Chlamydia\u2013mielina, la esclerosis m\u00faltiple; S. pyogenes\u2013miosina, la fiebre reum\u00e1tica. Fuente: notas de clase \u00b7 Ejemplos de mimetismo molecular"}],"ac":[{"n":"1","noShuffle":false,"img":null,"q":"En la enfermedad de Graves, los autoanticuerpos se dirigen contra:","o":["El receptor de ACh","El receptor de la TSH","La desmogle\u00edna 3","El ant\u00edgeno sinovial"],"c":2,"e":"Graves: <b>autoanticuerpos frente al receptor de la TSH</b>, con aumento del tama\u00f1o del tiroides, <b>hipertiroidismo</b> y <b>exoftalm\u00eda</b>. Receptor de ACh: miastenia; desmogle\u00edna 3: p\u00e9nfigo; ant\u00edgeno sinovial: AR. Fuente: diapositivas del tema \u00b7 Enfermedad de Graves"},{"n":"2","noShuffle":false,"img":null,"q":"Mujer de 35 a\u00f1os con nerviosismo, p\u00e9rdida de peso, aumento del tama\u00f1o del tiroides y exoftalm\u00eda. \u00bfQu\u00e9 mecanismo autoinmune presenta seg\u00fan el tema?","o":["Linfocitos T citot\u00f3xicos que destruyen el tiroides","Autoanticuerpos frente al receptor de la TSH","Dep\u00f3sito de inmunocomplejos en el tiroides","Anticuerpos que bloquean el receptor de ACh"],"c":2,"e":"Hipertiroidismo con bocio y exoftalm\u00eda = <b>enfermedad de Graves</b>, autoinmunidad <b>mediada por anticuerpos</b> frente al <b>receptor de la TSH</b>, que estimulan la producci\u00f3n de hormonas tiroideas. Fuente: diapositivas del tema \u00b7 Enfermedad de Graves"},{"n":"3","noShuffle":false,"img":null,"q":"Se\u00f1ale la correcta sobre la miastenia gravis:","o":["Los anticuerpos estimulan el receptor de ACh de la placa motora","Est\u00e1 mediada por linfocitos T frente a la mielina","Los anticuerpos bloquean el receptor de ACh de la placa motora","Cursa con ampollas por anticuerpos frente a desmogle\u00edna"],"c":3,"e":"En la miastenia gravis hay <b>autoanticuerpos frente al receptor de ACh de la placa motora que lo bloquean</b>, con <b>debilidad y fatiga muscular</b>. La mielina es de la esclerosis m\u00faltiple y la desmogle\u00edna del p\u00e9nfigo. Fuente: diapositivas del tema \u00b7 Miastenia gravis"},{"n":"4","noShuffle":false,"img":null,"q":"Mujer de 30 a\u00f1os, sin tratamiento, con debilidad y fatiga muscular progresivas y dificultad para tragar. \u00bfQu\u00e9 autoant\u00edgeno es el m\u00e1s probable?","o":["Receptor de la TSH","Desmogle\u00edna 3","Prote\u00edna de la mielina","Receptor de acetilcolina"],"c":4,"e":"Debilidad y fatiga muscular, con <b>problemas de degluci\u00f3n</b> en fases avanzadas sin tratamiento, orientan a <b>miastenia gravis</b>: anticuerpos frente al <b>receptor de acetilcolina</b> de la placa motora. Fuente: diapositivas del tema \u00b7 Miastenia gravis"},{"n":"5","noShuffle":false,"img":null,"q":"\u00bfFrente a qu\u00e9 mol\u00e9cula se dirigen los autoanticuerpos del p\u00e9nfigo seg\u00fan el tema?","o":["Col\u00e1geno tipo II","Desmogle\u00edna 3","Transglutaminasa tisular","Receptor de la TSH"],"c":2,"e":"P\u00e9nfigo: <b>autoanticuerpos frente a desmogle\u00edna 3</b>, una mol\u00e9cula de adhesi\u00f3n entre c\u00e9lulas epiteliales, con aparici\u00f3n de <b>ampollas</b>. El col\u00e1geno tipo II es diana en la AR y la TG2 en la cel\u00edaca. Fuente: diapositivas del tema \u00b7 P\u00e9nfigo"},{"n":"6","noShuffle":false,"img":null,"q":"En el lupus eritematoso sist\u00e9mico, los autoanticuerpos se dirigen principalmente frente a:","o":["Receptores de membrana como el de la TSH","Ant\u00edgenos solubles como el ADN e histonas","Mol\u00e9culas de adhesi\u00f3n como la desmogle\u00edna","Ant\u00edgenos sinoviales y col\u00e1geno tipo II"],"c":2,"e":"LES: <b>autoanticuerpos frente a ant\u00edgenos solubles (ADN, histonas\u2026)</b> que forman <b>inmunocomplejos</b>; al no eliminarse bien, se depositan en ri\u00f1\u00f3n, vasos y articulaciones. Fuente: diapositivas del tema \u00b7 Lupus eritematoso sist\u00e9mico"},{"n":"7","noShuffle":false,"img":null,"q":"Respecto al lupus eritematoso sist\u00e9mico, se\u00f1ale la FALSA:","o":["Los inmunocomplejos se depositan en ri\u00f1\u00f3n, vasos y articulaciones","Los fagocitos se activan por la v\u00eda DAMP/PRR","Afecta sobre todo a varones de entre 40 y 60 a\u00f1os","Cursa con fiebre, artritis y erupciones cut\u00e1neas"],"c":3,"e":"El LES afecta principalmente a <b>mujeres de entre 20 y 40 a\u00f1os</b> (mujeres de 40-60 es la AR). El resto es correcto: dep\u00f3sito de IC, activaci\u00f3n de fagocitos por <b>DAMP/PRR</b> y fiebre, debilidad, artritis, disfunci\u00f3n renal y erupciones. Fuente: diapositivas del tema \u00b7 Lupus eritematoso sist\u00e9mico"},{"n":"8","noShuffle":false,"img":null,"q":"Mujer de 26 a\u00f1os con fiebre, artritis, erupci\u00f3n cut\u00e1nea y disfunci\u00f3n renal. Seg\u00fan el tema, \u00bfcu\u00e1l es el mecanismo m\u00e1s probable del da\u00f1o renal?","o":["Anticuerpos que bloquean un receptor de membrana","Linfocitos Th17 que activan osteoclastos","Dep\u00f3sito de inmunocomplejos con ADN e histonas","Linfocitos intraepiteliales CD8+ v\u00eda NKG2D"],"c":3,"e":"Mujer joven con fiebre, artritis, erupci\u00f3n y afectaci\u00f3n renal sugiere <b>LES</b>: los <b>inmunocomplejos</b> con ADN e histonas no se eliminan bien y se <b>depositan en el ri\u00f1\u00f3n</b> (glomerulonefritis). Fuente: diapositivas del tema \u00b7 Lupus eritematoso sist\u00e9mico"},{"n":"9","noShuffle":false,"img":null,"q":"En la enfermedad de Graves, el hipertiroidismo y la exoftalm\u00eda se explican porque el autoanticuerpo:","o":["Bloquea el receptor de TSH e impide la acci\u00f3n de la TSH","Mantiene el receptor de TSH continuamente activado","Destruye las c\u00e9lulas foliculares por citotoxicidad","Forma inmunocomplejos que se depositan en la \u00f3rbita"],"c":2,"e":"El anticuerpo se une al receptor de TSH y lo deja <b>continuamente activado</b>, como una TSH sin control: de ah\u00ed el <b>hipertiroidismo y la exoftalm\u00eda</b>. El bloqueo de un receptor es lo propio de la miastenia gravis. Fuente: notas de clase \u00b7 Enfermedad de Graves"},{"n":"10","noShuffle":false,"img":null,"q":"Seg\u00fan el tema, en el lupus eritematoso sist\u00e9mico los restos apopt\u00f3ticos que no se eliminan de forma eficaz:","o":["Inducen tolerancia perif\u00e9rica frente al ADN y a las histonas","Se depositan sin anticuerpos y no causan da\u00f1o","Generan anticuerpos y se acumulan inmunocomplejos","Activan solo a los linfocitos Th17 de la piel"],"c":3,"e":"Si los <b>restos apopt\u00f3ticos</b> se quedan sin eliminar, se generan <b>anticuerpos contra ellos</b> (ADN, histonas) y se forman muchos <b>inmunocomplejos</b> que se acumulan en ri\u00f1\u00f3n, vasos y articulaciones. Fuente: notas de clase \u00b7 Lupus eritematoso sist\u00e9mico"}],"linfT":[{"n":"1","noShuffle":false,"img":null,"q":"Respecto a la artritis reumatoide, se\u00f1ale la correcta:","o":["Afecta sobre todo a mujeres de 20 a 40 a\u00f1os","Se asocia sobre todo a los alelos HLA-DQ2 y HLA-DQ8","Afecta sobre todo a mujeres de entre 40 y 60 a\u00f1os","Est\u00e1 mediada sobre todo por anticuerpos bloqueantes"],"c":3,"e":"La AR afecta principalmente a <b>mujeres de 40-60 a\u00f1os</b>, con fuerte componente gen\u00e9tico (<b>HLA-DRB1</b>) y mecanismo <b>mediado por linfocitos T</b>. Mujeres de 20-40 es el LES; DQ2/DQ8, la cel\u00edaca. Fuente: diapositivas del tema \u00b7 Artritis reumatoide"},{"n":"2","noShuffle":false,"img":null,"q":"Seg\u00fan el tema, \u00bfqu\u00e9 citocina estimula la diferenciaci\u00f3n de los osteoclastos en la artritis reumatoide?","o":["IL-15","Interfer\u00f3n \u03b3","IL-2","IL-17"],"c":4,"e":"La hiperfunci\u00f3n de <b>Th17</b> se asocia a inflamaci\u00f3n cr\u00f3nica por la <b>IL-17</b>, que adem\u00e1s <b>estimula la diferenciaci\u00f3n de los osteoclastos</b> y promueve la destrucci\u00f3n de cart\u00edlago y hueso. Fuente: diapositivas del tema \u00b7 Artritis reumatoide"},{"n":"3","noShuffle":false,"img":null,"q":"El pannus de la artritis reumatoide es:","o":["Tejido de granulaci\u00f3n formado por c\u00e9lulas sinoviales invasivas","Un dep\u00f3sito de inmunocomplejos en la membrana basal glomerular","Una placa de desmielinizaci\u00f3n rodeada de macr\u00f3fagos activados","Un ac\u00famulo de linfocitos intraepiteliales en el cart\u00edlago articular"],"c":1,"e":"El <b>pannus</b> es <b>tejido de granulaci\u00f3n por crecimiento invasivo de c\u00e9lulas sinoviales</b>; se acompa\u00f1a de infiltrado celular, IgG frente a col\u00e1geno tipo II o proteoglicano, inmunocomplejos, da\u00f1o del cart\u00edlago y resorci\u00f3n \u00f3sea. Fuente: diapositivas del tema \u00b7 Artritis reumatoide"},{"n":"4","noShuffle":false,"img":null,"q":"En la diabetes mellitus tipo 1, la destrucci\u00f3n de las c\u00e9lulas \u03b2 de los islotes est\u00e1 mediada por:","o":["Dep\u00f3sito de inmunocomplejos en el islote","Linfocitos T, con citotoxicidad por CD8 o por NK","Anticuerpos que bloquean el receptor de insulina","Linfocitos B productores de anti-desmogle\u00edna"],"c":2,"e":"En la DM1 la <b>destrucci\u00f3n de las c\u00e9lulas \u03b2 est\u00e1 mediada por linfocitos T</b>, con activaci\u00f3n de macr\u00f3fagos, citocinas proinflamatorias, autoanticuerpos y <b>citotoxicidad por linfocitos CD8 o NK</b>. Fuente: diapositivas del tema \u00b7 Diabetes mellitus tipo 1"},{"n":"5","noShuffle":false,"img":null,"q":"Mujer de 28 a\u00f1os con episodios de entumecimiento de extremidades y p\u00e9rdida de visi\u00f3n, con antecedente de infecci\u00f3n por virus de Epstein-Barr. Seg\u00fan el tema, \u00bfqu\u00e9 c\u00e9lulas espec\u00edficas frente a la mielina presenta?","o":["Linfocitos Th2 y eosin\u00f3filos","Linfocitos Th1, Th17 y linfocitos B","Linfocitos Treg y c\u00e9lulas NK","Linfocitos T CD8 citot\u00f3xicos"],"c":2,"e":"Esclerosis m\u00faltiple: <b>linfocitos Th1, Th17 y B espec\u00edficos frente a la mielina</b> \u2192 desmielinizaci\u00f3n, alteraci\u00f3n de la conducci\u00f3n y d\u00e9ficit neurol\u00f3gico. Se asocia a VEB, tabaco, obesidad, luz solar y HLA-DRB1. Fuente: diapositivas del tema \u00b7 Esclerosis m\u00faltiple"},{"n":"6","noShuffle":false,"img":null,"q":"En la enfermedad cel\u00edaca, la transglutaminasa tisular (TG2):","o":["Convierte \u00e1cido glut\u00e1mico en glutamina y reduce su uni\u00f3n al HLA","Desamida glutamina a glut\u00e1mico y eleva su afinidad por HLA-DQ2/DQ8","Degrada la gliadina en p\u00e9ptidos que no se presentan a los linfocitos T","Act\u00faa como ligando de estr\u00e9s que reconocen los LIE CD8+ v\u00eda NKG2D"],"c":2,"e":"La <b>TG2 desamida</b> los residuos de glutamina a \u00e1cido glut\u00e1mico (carga negativa) y <b>aumenta su afinidad por HLA-DQ2 y HLA-DQ8</b> de las CPA, que activan Th1 productores de IFN-\u03b3. Los ligandos de estr\u00e9s son MICA/MICB. Fuente: diapositivas del tema \u00b7 Enfermedad cel\u00edaca"},{"n":"7","noShuffle":false,"img":null,"q":"En la v\u00eda innata de la enfermedad cel\u00edaca, los linfocitos intraepiteliales CD8+ destruyen al enterocito:","o":["Al reconocer gliadina desamidada mediante su TCR espec\u00edfico","Mediante anticuerpos anti-TG2 y activaci\u00f3n del complemento","Al reconocer IL-15 y MICA/MICB a trav\u00e9s del receptor NKG2D","Tras recibir IFN-\u03b3 de los linfocitos Th2 de la l\u00e1mina propia"],"c":3,"e":"El enterocito estresado (p. ej., por p31-43 de la \u03b1-gliadina) expresa <b>IL-15</b> y <b>MICA/MICB</b>; los <b>LIE CD8+</b> los reconocen por <b>NKG2D</b> y lo matan con perforinas/granzimas y Fas/FasL, <b>independientemente de su TCR</b>. Fuente: diapositivas del tema \u00b7 Enfermedad cel\u00edaca"},{"n":"8","noShuffle":false,"img":null,"q":"Mujer de 25 a\u00f1os con diarrea y p\u00e9rdida de peso, anticuerpos anti-TG2 positivos y atrofia vellositaria en la biopsia. Seg\u00fan el tema, se\u00f1ale la correcta:","o":["Los anticuerpos anti-TG2 son los ejecutores de la atrofia","Los anticuerpos sirven al diagn\u00f3stico, no ejecutan la atrofia","La atrofia depende solo de la v\u00eda adaptativa de la l\u00e1mina propia","El principal factor gen\u00e9tico de esta enfermedad es el HLA-B27"],"c":2,"e":"Los anticuerpos (anti-TG2, antiendomisio, anti-p\u00e9ptidos desamidados) son <b>fundamentales para el diagn\u00f3stico</b> pero <b>no son los ejecutores</b> de la atrofia, que requiere <b>dos v\u00edas en paralelo</b> (Th1 y LIE CD8+). Fuente: diapositivas del tema \u00b7 Enfermedad cel\u00edaca"},{"n":"9","noShuffle":false,"img":null,"q":"En la enfermedad inflamatoria intestinal, el tema destaca:","o":["Dep\u00f3sito de inmunocomplejos con ADN en la mucosa","Hiperfunci\u00f3n de los Treg frente a la microbiota","Respuesta an\u00f3mala Th1 y Th17 con Treg defectuosos","Anticuerpos que bloquean receptores del enterocito"],"c":3,"e":"En la EII (Crohn y colitis ulcerosa) hay <b>respuesta an\u00f3mala de Th1 y Th17 y funci\u00f3n defectuosa de los Treg</b>, con mala regulaci\u00f3n frente a comensales que atraviesan una barrera epitelial disfuncional. Fuente: diapositivas del tema \u00b7 Enfermedad inflamatoria intestinal"},{"n":"10","noShuffle":false,"img":null,"q":"Seg\u00fan el tema, la psoriasis se relaciona con la activaci\u00f3n de:","o":["Linfocitos Th2 y mastocitos por al\u00e9rgenos","Linfocitos Th1 y Th17 por las dendr\u00edticas","Linfocitos B por el receptor de la TSH","Linfocitos CD8 por ligandos MICA del islote"],"c":2,"e":"La psoriasis se relaciona con la <b>activaci\u00f3n de Th1 y Th17 por c\u00e9lulas dendr\u00edticas</b> tras un traumatismo o infecci\u00f3n en los queratinocitos; produce <b>placas eritematosas descamativas</b>. Fuente: diapositivas del tema \u00b7 Psoriasis"},{"n":"11","noShuffle":false,"img":null,"q":"Respecto a la artritis reumatoide, se\u00f1ale la FALSA:","o":["Tiene un fuerte componente gen\u00e9tico ligado a alelos HLA-DRB1","Los linfocitos CD4+ Th1 y Th17 activados por APC tienen un papel central","Est\u00e1 mediada principalmente por linfocitos Th2 y eosin\u00f3filos","La IL-17 estimula la diferenciaci\u00f3n de los osteoclastos"],"c":3,"e":"En la AR se destac\u00f3 el <b>fuerte componente gen\u00e9tico (HLA-DRB1)</b> y el <b>papel central de los CD4+ Th1 y Th17 activados por APC</b>; la IL-17 de los Th17 activa los osteoclastos. Th2 y eosin\u00f3filos no son los protagonistas. Fuente: notas de clase \u00b7 Artritis reumatoide"},{"n":"12","noShuffle":false,"img":null,"q":"Respecto a la diabetes mellitus tipo 1, se\u00f1ale la correcta:","o":["Es una enfermedad mediada solo por inmunocomplejos","Los linfocitos CD4+ no participan en la lesi\u00f3n del islote","Los autoanticuerpos van dirigidos contra el receptor de TSH","Adem\u00e1s de linfocitos T autorreactivos, hay autoanticuerpos"],"c":4,"e":"En la DM1 la destrucci\u00f3n de las c\u00e9lulas \u03b2 la dirigen <b>linfocitos T autorreactivos</b>, pero <b>tambi\u00e9n hay autoanticuerpos</b>, y adem\u00e1s de CD8 y NK participan los <b>CD4+</b>. El receptor de TSH es la diana en Graves. Fuente: notas de clase \u00b7 Diabetes mellitus tipo 1"},{"n":"13","noShuffle":false,"img":null,"q":"Var\u00f3n de 24 a\u00f1os con enfermedad de Crohn. Seg\u00fan el tema, \u00bfqu\u00e9 papel tienen los microorganismos comensales en su enfermedad?","o":["Cruzan una barrera epitelial defectuosa y act\u00faan como oportunistas","Comparten ep\u00edtopos con la prote\u00edna b\u00e1sica de la mielina","Forman inmunocomplejos con ADN e histonas que se depositan en el ri\u00f1\u00f3n","Aumentan la funci\u00f3n de los Treg de la mucosa intestinal"],"c":1,"e":"En la EII hay defectos en la regulaci\u00f3n frente a los comensales, que <b>atraviesan una barrera epitelial disfuncional</b> y se comportan como <b>pat\u00f3genos oportunistas</b>; a ello se suman disbiosis, Th1/Th17 an\u00f3malos y <b>Treg defectuosos</b>. Fuente: notas de clase \u00b7 Enfermedad inflamatoria intestinal"},{"n":"14","noShuffle":false,"img":null,"q":"En la figura de la psoriasis del tema, \u00bfqu\u00e9 citocina de las c\u00e9lulas dendr\u00edticas diferencia a los linfocitos Th17?","o":["IL-4","IL-10","IL-23","IL-2"],"c":3,"e":"Las dendr\u00edticas activadas producen <b>IL-23</b>, que <b>diferencia a los Th17</b> (productores de IL-17); la IL-12 se dirige a los Th1. Por eso los anti-p40 (IL-12/IL-23) frenan las dos v\u00edas. Fuente: notas de clase \u00b7 Psoriasis"}],"tto":[{"n":"1","noShuffle":false,"img":null,"q":"\u00bfCu\u00e1l de los siguientes NO es un inmunodepresor de amplio espectro seg\u00fan el tema?","o":["Corticosteroides","Rapamicina","Plasmaf\u00e9resis","CTLA4-Ig"],"c":4,"e":"Amplio espectro: <b>corticosteroides</b>, <b>rapamicina</b> (supresi\u00f3n de linfocitos T) y <b>plasmaf\u00e9resis</b> (menos autoanticuerpos). El <b>CTLA4-Ig</b> es inmunoterapia <b>dirigida</b>: bloquea la coestimulaci\u00f3n. Fuente: diapositivas del tema \u00b7 Tratamiento"},{"n":"2","noShuffle":false,"img":null,"q":"En las enfermedades autoinmunes, la plasmaf\u00e9resis se emplea para:","o":["Bloquear la coestimulaci\u00f3n","Disminuir los autoanticuerpos","Bloquear la acci\u00f3n de la IL-17","Inhibir la ciclooxigenasa tipo 2"],"c":2,"e":"La <b>plasmaf\u00e9resis</b> es el inmunodepresor de amplio espectro cuyo objetivo es la <b>disminuci\u00f3n de autoanticuerpos</b>: se separa y retira el plasma. Fuente: diapositivas del tema \u00b7 Tratamiento"},{"n":"3","noShuffle":false,"img":null,"q":"Seg\u00fan la figura de inmunoterapia dirigida del tema, el CTLA4-Ig act\u00faa:","o":["Bloqueando la se\u00f1al del receptor de IL-2","Neutralizando el TNF de la inflamaci\u00f3n","Bloqueando la coestimulaci\u00f3n B7 y CD28","Bloqueando la adhesi\u00f3n por integrinas"],"c":3,"e":"El <b>CTLA4-Ig bloquea la coestimulaci\u00f3n</b> (B7 de la APC con CD28 del linfocito T). El anti-IL-2R bloquea la proliferaci\u00f3n del linfocito T, el anti-TNF la inflamaci\u00f3n y los anti-integrinas la adhesi\u00f3n. Fuente: diapositivas del tema \u00b7 Inmunoterapia dirigida"},{"n":"4","noShuffle":false,"img":null,"q":"Seg\u00fan el tema, los anticuerpos anti-p40 bloquean:","o":["La proliferaci\u00f3n del linfocito T v\u00eda IL-2R","Las respuestas Th1 y Th17 (de IL-12 e IL-23)","La coestimulaci\u00f3n entre la APC y el linfocito","La adhesi\u00f3n leucocitaria por las integrinas"],"c":2,"e":"La subunidad <b>p40</b> es com\u00fan a la <b>IL-12 y la IL-23</b>; bloquearla frena las <b>respuestas Th1 y Th17</b>. La proliferaci\u00f3n v\u00eda IL-2R la bloquea el anti-IL-2R y la coestimulaci\u00f3n el CTLA4-Ig. Fuente: diapositivas del tema \u00b7 Inmunoterapia dirigida"},{"n":"5","noShuffle":false,"img":null,"q":"Entre los efectos de los corticoides recogidos en el tema, NO est\u00e1:","o":["Disminuir la IL-1, el TNF-\u03b1 y el GM-CSF","Aumentar la lipocortina-1","Aumentar las mol\u00e9culas de adhesi\u00f3n","Inducir apoptosis de linfocitos"],"c":3,"e":"Los corticoides <b>disminuyen</b> las mol\u00e9culas de adhesi\u00f3n (menor salida de leucocitos de los vasos), adem\u00e1s de bajar citocinas, NOS, fosfolipasa A2 y COX-2, subir lipocortina-1 y endonucleasas e inducir apoptosis de linfocitos y eosin\u00f3filos. Fuente: diapositivas del tema \u00b7 Tratamiento"},{"n":"6","noShuffle":false,"img":null,"q":"Mujer de 45 a\u00f1os con miastenia gravis grave a la que se indica plasmaf\u00e9resis. \u00bfPor qu\u00e9 tiene sentido en su caso seg\u00fan el tema?","o":["Porque su enfermedad depende de autoanticuerpos, que el recambio de plasma elimina","Porque bloquea la coestimulaci\u00f3n entre B7 y CD28","Porque inhibe la s\u00edntesis de IL-2 en los linfocitos T","Porque destruye los linfocitos T autorreactivos del timo"],"c":1,"e":"La plasmaf\u00e9resis es un <b>recambio de plasma</b>, como una di\u00e1lisis pero con plasma, que <b>elimina los autoanticuerpos</b>; por eso se usa en enfermedades autoinmunes en las que hay autoanticuerpos, como la miastenia gravis. Fuente: notas de clase \u00b7 Tratamiento"}]};
var IMGS=/*__IMGS_JSON__*/{};

/* ── Estado ── */
var canSave=typeof localStorage!=='undefined';
var saved={};try{saved=JSON.parse(localStorage.getItem(KEY)||'null')||{};}catch(e){}
var state   =saved.state   ||{};
var qOrd    =saved.qOrd    ||{};
var oOrd    =saved.oOrd    ||{};
var starred =saved.starred ||{};
var failHist=saved.failHist||{};  // {qid: count} entre sesiones
var darkMode=saved.dark    ||false;
var timerSec=saved.timerSec||0;   // segundos configurados
var SECS=Object.keys(META.secciones||{});
var fFailed={};
var qIdx={};           // {sec: {n: q}}
var qNums={};          // {sec: {n: numero_correlativo}}
var allOrder=null;     // orden mezclado inter-secciones para pestaña Todos
var activeCid=null;
var currentTab='all';
var currentMode='test';
var saveTimer=null;
var starsFilter=false;
var statsVisible=false;
var timerRunning=false;
var timerRemaining=timerSec;
var timerInterval=null;

/* ── INIT ── */
(function init(){
  SECS.forEach(function(s){fFailed[s]=false;});
  injectSecCSS();
  buildHeader();
  buildTabs();
  buildPanels();
  buildIdx();
  buildNums();
  buildAllOrder();
  SECS.forEach(render);
  renderAll();
  updateScores();
  updateProg();
  applyTheme();
  initTimer();
  setBadge(canSave?'Guardado':'Sin guardado',canSave?'ok':'warn');
  document.addEventListener('keydown',handleKey);
  var si=document.getElementById('search-input');
  if(si)si.addEventListener('keydown',function(e){if(e.key==='Escape'){clearSearch();}});
})();

/* ── CSS dinámico ── */
function injectSecCSS(){
  var css='';
  SECS.forEach(function(s){
    var m=META.secciones[s]||{};
    var c=m.color||'#1a56db',cd=m.colorDim||'#e8f0fe';
    css+='.tab.t-'+s+'.on{background:'+cd+';color:'+c+';border-color:'+c+'}\n';
    css+='.ph.s-'+s+'{border-left:4px solid '+c+'}\n';
    // Variables CSS por sección para el badge coloreado
    css+='#panel-'+s+' .qnum.sec-colored{background:'+cd+';color:'+c+'}\n';
  });
  var st=document.createElement('style');st.textContent=css;document.head.appendChild(st);
}

/* ── Header ── */
function buildHeader(){
  var total=SECS.reduce(function(a,s){return a+(D[s]?D[s].length:0);},0);
  var t=document.getElementById('h-tit');if(t)t.textContent=META.titulo||'Banco MIR';
  var pt=document.getElementById('page-title');if(pt)pt.textContent=META.titulo||'Banco MIR';
  var m=document.getElementById('h-meta');
  if(m){var p=[];if(total)p.push(total+' preguntas');if(META.examen)p.push(META.examen);m.textContent=p.join(' · ');}
  var d=document.getElementById('ph-gdesc');if(d)d.textContent=META.subtitulo||'';
  var r=document.getElementById('sc-rem-all');if(r)r.textContent='○ '+total;
}

/* ── Tabs ── */
function buildTabs(){
  var total=SECS.reduce(function(a,s){return a+(D[s]?D[s].length:0);},0);
  var h='<button class="tab t-all on" onclick="showTab(\'all\')">📋 Todos ('+total+')</button>';
  SECS.forEach(function(s){
    var m=META.secciones[s]||{},cnt=D[s]?D[s].length:0;
    h+='<button class="tab t-'+s+'" onclick="showTab(\''+s+'\')">'+(m.emoji?m.emoji+' ':'')+escH(m.label||s)+' ('+cnt+')</button>';
  });
  var w=document.getElementById('tabs-wrap');if(w)w.innerHTML=h;
}

/* ── Paneles ── */
function buildPanels(){
  var h='<div id="panel-all" class="sec-panel visible"><div id="qs-all"></div><div class="no-results" id="nr-all">No se encontraron preguntas</div></div>';
  SECS.forEach(function(s){
    var m=META.secciones[s]||{},cnt=D[s]?D[s].length:0;
    h+='<div id="panel-'+s+'" class="sec-panel">';
    h+='<div class="ph s-'+s+'">';
    h+='<div class="ph-left">';
    h+='<span class="ph-label">'+(m.emoji?m.emoji+'&nbsp;':'')+escH(m.label||s)+'</span>';
    if(m.desc)h+='<span class="ph-desc">'+escH(m.desc)+'</span>';
    h+='<div class="score-row">';
    h+='<span class="sc ok" id="sc-ok-'+s+'">✓ 0</span>';
    h+='<span class="sc ko" id="sc-ko-'+s+'">✗ 0</span>';
    h+='<span class="sc rem" id="sc-rem-'+s+'">○ '+cnt+'</span>';
    h+='</div></div>';
    h+='<button class="fbtn" id="fb-'+s+'" onclick="toggleFail(\''+s+'\')">Solo falladas</button>';
    h+='</div>';
    h+='<div id="qs-'+s+'"></div>';
    h+='<div class="no-failed" id="nf-'+s+'">Aún no has fallado ninguna 🎉</div>';
    h+='<div class="no-results" id="nr-'+s+'">No se encontraron preguntas</div>';
    h+='<div class="sec-actions">';
    h+='<button class="reset-btn" onclick="resetSec(\''+s+'\')">↺ Reiniciar</button>';
    h+='<button class="nota-btn" onclick="calcNota(\''+s+'\')">✎ Calcular nota</button>';
    h+='</div>';
    h+='<div class="nota-box" id="nota-'+s+'"></div>';
    h+='</div>';
  });
  var pw=document.getElementById('panels-wrap');if(pw)pw.innerHTML=h;
}

/* ── Índice O(1) + numeración fija ── */
function buildIdx(){
  SECS.forEach(function(s){
    qIdx[s]={};
    if(D[s])D[s].forEach(function(q){qIdx[s][q.n]=q;});
  });
}
function buildNums(){
  // Numeración correlativa fija: 1, 2, 3... por sección
  SECS.forEach(function(s){
    qNums[s]={};
    if(D[s])D[s].forEach(function(q,i){qNums[s][q.n]=i+1;});
  });
}
function getNum(sec,n){return qNums[sec]?qNums[sec][n]||n:n;}
function findQ(qid){
  var d=qid.indexOf('-'),s=qid.substring(0,d),n=qid.substring(d+1);
  return(qIdx[s]&&qIdx[s][n])||null;
}
function getSecFromQid(qid){return qid.substring(0,qid.indexOf('-'));}
function getNFromQid(qid){return qid.substring(qid.indexOf('-')+1);}

/* ── Orden inter-secciones para Todos ── */
function buildAllOrder(){
  var all=[];
  SECS.forEach(function(s){if(D[s])D[s].forEach(function(q){all.push({sec:s,n:q.n});});});
  if(!qOrd['__all__'])qOrd['__all__']=shuffle(all.map(function(x){return x.sec+'|'+x.n;}));
  allOrder=qOrd['__all__'].map(function(key){
    var p=key.indexOf('|'),sec=key.substring(0,p),n=key.substring(p+1);
    return{sec:sec,n:n,q:qIdx[sec]&&qIdx[sec][n]};
  }).filter(function(x){return x.q;});
}

/* ── Utilidades ── */
function escH(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}
function shuffle(a){var b=a.slice();for(var i=b.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1));var t=b[i];b[i]=b[j];b[j]=t;}return b;}
function getQOrd(s,qs){if(!qOrd[s])qOrd[s]=shuffle(qs.map(function(q){return q.n;}));return qOrd[s];}
function getOOrd(qid){
  var q=findQ(qid);var n=q&&q.o?q.o.length:4;
  if(q&&q.noShuffle){var a=[];for(var i=0;i<n;i++)a.push(i);return a;}
  if(!oOrd[qid]){var a=[];for(var i=0;i<n;i++)a.push(i);oOrd[qid]=shuffle(a);}
  return oOrd[qid];
}
function imgHtml(key){
  if(!IMGS[key]){console.warn('IMGS: clave no encontrada →',key);return'';}
  return'<div class="clinimg-wrap"><img src="'+IMGS[key]+'" class="clinimg" alt="Imagen clínica" loading="lazy"><div class="clinimg-cap">Imagen clínica</div></div>';
}

/* ── localStorage debounce ── */
function saveLocal(){
  if(!canSave)return;
  if(saveTimer)clearTimeout(saveTimer);
  saveTimer=setTimeout(function(){
    try{
      localStorage.setItem(KEY,JSON.stringify({state:state,qOrd:qOrd,oOrd:oOrd,starred:starred,failHist:failHist,dark:darkMode,timerSec:timerSec}));
      setBadge('Guardado','ok');
    }catch(e){setBadge('Sin guardado','warn');}
  },300);
}
function setBadge(t,c){var b=document.getElementById('save-badge');if(b){b.textContent=t;b.className='sbadge '+c;}}

/* ── Construcción de tarjeta ── */
function buildCard(q,sec,inAll,allPos){
  var qid=sec+'-'+q.n;
  var cid=(inAll?'A-':'S-')+qid;
  var num=inAll?(allPos+1):getNum(sec,q.n);
  var oo=getOOrd(qid);
  var sOpts=oo.map(function(i){return q.o[i];});
  var nc=oo.indexOf(q.c-1)+1;
  var ans=state[qid];
  var cc=ans?(ans.r?' answered-ok':' answered-wrong'):'';
  var badgeCls='qnum'+(inAll?'':' sec-colored');
  var h='<div class="qcard s-'+sec+cc+'" id="card-'+cid+'">';
  h+='<div class="qhead" id="h-'+cid+'" data-cid="'+cid+'" data-qid="'+qid+'" data-sec="'+sec+'" onclick="tog(this.dataset.cid)">';
  h+='<span class="'+badgeCls+'">'+num+'</span>';
  h+='<span class="qtxt">'+q.q+(ans?'<span class="atag '+(ans.r?'ok':'ko')+'">'+(ans.r?'✓ acertada':'✗ fallada')+'</span>':'')+'</span>';
  h+='<button class="star-btn'+(starred[qid]?' on':'')+'\" id="star-'+cid+'" onclick="event.stopPropagation();toggleStar(\''+qid+'\')" title="Marcar (S)"><span class="si">\u2606</span><span class="sf">\u2605</span></button>';
  h+='<span class="chev">▾</span>';
  h+='</div>';
  h+='<div class="qbody" id="b-'+cid+'">';
  if(q.img)h+=imgHtml(q.img);
  if(currentMode==='quick'){
    h+='<div class="quick-card"><div class="quick-rc">✓ Respuesta correcta: opción '+nc+' — '+escH(q.o[q.c-1])+'</div><div class="expbox">'+q.e+'</div></div>';
  } else {
    h+='<ul class="opts" id="opts-'+cid+'">';
    h+=sOpts.map(function(o,i){
      var p=i+1,oc='opt';
      if(ans){oc+=' done';if(p===nc)oc+=' correct';else if(p===ans.c&&!ans.r)oc+=' wrong';}
      return'<li class="'+oc+'" data-qid="'+qid+'" data-pos="'+p+'" data-sec="'+sec+'" onclick="answer(this.dataset.qid,+this.dataset.pos,this.dataset.sec)"><span class="onum">'+p+'.</span><span>'+o+'</span></li>';
    }).join('');
    h+='</ul>';
    if(ans){h+='<div class="expbox"><span class="et">'+(ans.r?'✓ Correcto':'✗ Incorrecto — Respuesta correcta: opción '+nc)+'</span>'+q.e+'</div>';}
  }
  h+='</div></div>';
  return h;
}

/* ── Render sección ── */
function render(sec){
  var qs=D[sec];if(!qs)return;
  var ord=getQOrd(sec,qs);
  var sorted=ord.map(function(n){return qIdx[sec]&&qIdx[sec][n];}).filter(Boolean);
  var el=document.getElementById('qs-'+sec);
  if(el)el.innerHTML=sorted.map(function(q){return buildCard(q,sec,false,0);}).join('');
}

/* ── Render Todos (mezcla inter-secciones) ── */
function renderAll(){
  if(!allOrder)buildAllOrder();
  var el=document.getElementById('qs-all');
  if(el)el.innerHTML=allOrder.map(function(x,i){return buildCard(x.q,x.sec,true,i);}).join('');
}

/* ── Toggle open/close ── */
function tog(cid){
  var b=document.getElementById('b-'+cid),h=document.getElementById('h-'+cid);
  if(!b||!h)return;
  var opening=!b.classList.contains('open');
  b.classList.toggle('open');h.classList.toggle('open');
  if(opening){
    if(activeCid&&activeCid!==cid){var pc=document.getElementById('card-'+activeCid);if(pc)pc.classList.remove('kb-focus');}
    activeCid=cid;
    var card=document.getElementById('card-'+cid);if(card)card.classList.add('kb-focus');
  }else{
    if(activeCid===cid){activeCid=null;var card=document.getElementById('card-'+cid);if(card)card.classList.remove('kb-focus');}
  }
}

/* ── Responder ── */
function answer(qid,pos,sec){
  if(state[qid])return;
  var q=findQ(qid);if(!q)return;
  var oo=getOOrd(qid);
  var nc=oo.indexOf(q.c-1)+1;
  var isRight=pos===nc;
  state[qid]={c:pos,r:isRight};
  // Registro de errores
  if(!isRight){failHist[qid]=(failHist[qid]||0)+1;}
  saveLocal();
  // Actualizar todas las instancias del card (panel sección + panel all)
  // Actualizar opciones en todas las instancias del card
  ['A-'+qid,'S-'+qid].forEach(function(cid){
    var optsEl=document.querySelectorAll('#opts-'+cid+' .opt');
    optsEl.forEach(function(el,i){
      el.classList.add('done');
      if(i+1===nc)el.classList.add('correct');
      else if(i+1===pos&&!isRight)el.classList.add('wrong');
    });
    var bdy=document.getElementById('b-'+cid);
    if(bdy){
      var eb=bdy.querySelector('.expbox');
      if(!eb){eb=document.createElement('div');eb.className='expbox';bdy.appendChild(eb);}
      eb.innerHTML='<span class="et">'+(isRight?'✓ Correcto':'✗ Incorrecto — Respuesta correcta: opción '+nc)+'</span>'+q.e;
    }
    var hd=document.getElementById('h-'+cid);
    if(hd){var qt=hd.querySelector('.qtxt');if(qt&&!qt.querySelector('.atag')){var at=document.createElement('span');at.className='atag '+(isRight?'ok':'ko');at.innerHTML=isRight?'✓ acertada':'✗ fallada';qt.appendChild(at);}}
    var card=document.getElementById('card-'+cid);
    if(card)card.classList.add(isRight?'answered-ok':'answered-wrong');
  });
  updateScores();updateProg();
  if(fFailed[sec]&&isRight){
    var fcard=document.getElementById('card-S-'+qid);
    if(fcard)fcard.style.display='none';
    refreshNF(sec);
  }
}

/* ── Estrella ── */
function toggleStar(qid){
  starred[qid]=!starred[qid];
  ['A-'+qid,'S-'+qid].forEach(function(cid){
    var btn=document.getElementById('star-'+cid);
    if(btn)btn.classList.toggle('on',starred[qid]);
  });
  saveLocal();
}
function filterStarred(){
  starsFilter=!starsFilter;
  var btn=document.getElementById('btn-stars');
  if(btn){btn.style.background=starsFilter?'#fef3c7':'';btn.style.fontWeight=starsFilter?'700':'';}
  document.querySelectorAll('.qcard').forEach(function(card){
    if(starsFilter){
      var hd=card.querySelector('.qhead');
      var qid=hd?hd.dataset.qid:'';
      card.style.display=starred[qid]?'':'none';
    }else{card.style.display='';}
  });
}

/* ── Filtro falladas ── */
function refreshNF(sec){
  var c=document.getElementById('qs-'+sec);if(!c||!fFailed[sec])return;
  var n=c.querySelectorAll('.qcard.answered-wrong').length;
  var m=document.getElementById('nf-'+sec);if(m)m.classList.toggle('show',n===0);
}
function toggleFail(sec){
  fFailed[sec]=!fFailed[sec];
  var btn=document.getElementById('fb-'+sec);
  if(btn){btn.classList.toggle('on',fFailed[sec]);btn.textContent=fFailed[sec]?'← Ver todas':'Solo falladas';}
  var c=document.getElementById('qs-'+sec);if(!c)return;
  var nf=0;
  c.querySelectorAll('.qcard').forEach(function(card){
    if(fFailed[sec]){var show=card.classList.contains('answered-wrong');card.style.display=show?'':'none';if(show)nf++;}
    else{card.style.display='';}
  });
  var m=document.getElementById('nf-'+sec);if(m)m.classList.toggle('show',fFailed[sec]&&nf===0);
}

/* ── Scores y progreso ── */
function updateScores(){
  var tok=0,tok2=0,tok3=0;
  SECS.forEach(function(sec){
    var ok=0,ko=0;
    if(D[sec])D[sec].forEach(function(q){var a=state[sec+'-'+q.n];if(a){if(a.r)ok++;else ko++;}});
    var tot=D[sec]?D[sec].length:0,rem=tot-ok-ko;
    tok+=ok;tok2+=ko;tok3+=rem;
    var eok=document.getElementById('sc-ok-'+sec),eko=document.getElementById('sc-ko-'+sec),erm=document.getElementById('sc-rem-'+sec);
    if(eok)eok.textContent='✓ '+ok;if(eko)eko.textContent='✗ '+ko;if(erm)erm.textContent='○ '+rem;
  });
  var eok=document.getElementById('sc-ok-all'),eko=document.getElementById('sc-ko-all'),erm=document.getElementById('sc-rem-all');
  if(eok)eok.textContent='✓ '+tok;if(eko)eko.textContent='✗ '+tok2;if(erm)erm.textContent='○ '+tok3;
}
function updateProg(){
  var total=0,done=Object.keys(state).length;
  SECS.forEach(function(s){if(D[s])total+=D[s].length;});
  var pct=total>0?Math.round(done/total*100):0;
  var bar=document.getElementById('prog-bar');if(bar)bar.style.width=pct+'%';
}

/* ── Tabs ── */
function showTab(t){
  currentTab=t;
  document.querySelectorAll('.tab').forEach(function(b){b.classList.remove('on');});
  var tb=document.querySelector('.tab.t-'+t);if(tb)tb.classList.add('on');
  var mc=document.getElementById('main-cont');if(mc)mc.setAttribute('data-tab',t);
  var panelAll=document.getElementById('panel-all');
  if(panelAll)panelAll.classList.toggle('visible',t==='all');
  SECS.forEach(function(s){
    var p=document.getElementById('panel-'+s);
    if(p)p.classList.toggle('visible',t===s);
  });
  var gnb=document.getElementById('nota-all');if(gnb){gnb.style.display='none';gnb.className='global-nota-box';}
  clearSearch();
}

/* ── Reset ── */
function resetSec(sec){
  if(D[sec])D[sec].forEach(function(q){var qid=sec+'-'+q.n;delete state[qid];delete oOrd[qid];});
  delete qOrd[sec];fFailed[sec]=false;activeCid=null;
  var btn=document.getElementById('fb-'+sec);if(btn){btn.classList.remove('on');btn.textContent='Solo falladas';}
  var nb=document.getElementById('nota-'+sec);if(nb){nb.style.display='none';nb.className='nota-box';}
  saveLocal();render(sec);
  var m=document.getElementById('nf-'+sec);if(m)m.classList.remove('show');
  updateScores();updateProg();
  // Reconstruir panel all para reflejar cambios
  buildAllOrder();renderAll();
}
function resetAll(){
  Object.keys(state).forEach(function(k){delete state[k];});
  Object.keys(oOrd).forEach(function(k){delete oOrd[k];});
  Object.keys(qOrd).forEach(function(k){delete qOrd[k];});
  activeCid=null;starsFilter=false;allOrder=null;
  var bs=document.getElementById('btn-stars');if(bs){bs.style.background='';bs.style.fontWeight='';}
  SECS.forEach(function(s){
    fFailed[s]=false;
    var btn=document.getElementById('fb-'+s);if(btn){btn.classList.remove('on');btn.textContent='Solo falladas';}
    var nb=document.getElementById('nota-'+s);if(nb){nb.style.display='none';nb.className='nota-box';}
  });
  saveLocal();
  SECS.forEach(render);
  buildAllOrder();renderAll();
  var gnb=document.getElementById('nota-all');if(gnb){gnb.style.display='none';gnb.className='global-nota-box';}
  updateScores();updateProg();
}

/* ── Nota y revisión ── */
function buildRevList(sec){
  var qs=D[sec];if(!qs)return'';
  var failed=qs.filter(function(q){var a=state[sec+'-'+q.n];return a&&!a.r;});
  if(!failed.length)return'';
  var html='<div class="review-list"><div class="review-title">📋 '+failed.length+' pregunta'+(failed.length>1?'s':'')+' fallada'+(failed.length>1?'s':'')+' — repasa aquí:</div>';
  failed.forEach(function(q){
    var qid=sec+'-'+q.n;var oo=getOOrd(qid);var nc=oo.indexOf(q.c-1)+1;
    html+='<details class="review-item"><summary><span><b>'+getNum(sec,q.n)+'.</b> '+q.q+'</span></summary>';
    html+='<div class="review-body"><div class="review-ans">✓ Opción '+nc+': '+escH(q.o[q.c-1]||'')+'</div>';
    html+='<div class="expbox">'+q.e+'</div></div></details>';
  });
  return html+'</div>';
}
function calcNota(sec){
  var qs=D[sec];if(!qs)return;
  var total=qs.length,ok=0,ko=0,skip=0;
  qs.forEach(function(q){var a=state[sec+'-'+q.n];if(!a)skip++;else if(a.r)ok++;else ko++;});
  var nota=Math.max(0,(ok-ko/3)/total*10),str=nota.toFixed(2),pass=nota>=5;
  var box=document.getElementById('nota-'+sec);if(!box)return;
  box.className='nota-box '+(pass?'pass':'fail');
  box.innerHTML='<span class="nota-score">'+(pass?'✓':'✗')+' '+str+' / 10</span>'
    +'<div class="nota-detail">Aciertos: '+ok+' | Fallos: '+ko+' | Sin responder: '+skip+'<br>'
    +'('+ok+' − '+ko+'/3) / '+total+' × 10 = '+str+'</div>'
    +buildRevList(sec);
  box.style.display='block';
}
function calcNotaAll(){
  var total=0,ok=0,ko=0,skip=0;
  SECS.forEach(function(sec){
    var qs=D[sec];if(!qs)return;
    total+=qs.length;
    qs.forEach(function(q){var a=state[sec+'-'+q.n];if(!a)skip++;else if(a.r)ok++;else ko++;});
  });
  var nota=Math.max(0,(ok-ko/3)/total*10),str=nota.toFixed(2),pass=nota>=5;
  var box=document.getElementById('nota-all');if(!box)return;
  box.className='global-nota-box '+(pass?'pass':'fail');
  var html='<span class="nota-score">'+(pass?'✓':'✗')+' '+str+' / 10 (global)</span>'
    +'<div class="nota-detail">Aciertos: '+ok+' | Fallos: '+ko+' | Sin responder: '+skip+'<br>'
    +'('+ok+' − '+ko+'/3) / '+total+' × 10 = '+str+'</div>';
  SECS.forEach(function(sec){
    var rv=buildRevList(sec);
    if(rv){var m=META.secciones[sec]||{};html+='<div class="review-sec-label">'+(m.emoji?m.emoji+' ':'')+escH(m.label||sec)+'</div>'+rv;}
  });
  box.innerHTML=html;box.style.display='block';
}

/* ── Estadísticas de errores ── */
function toggleStats(){
  statsVisible=!statsVisible;
  var btn=document.getElementById('btn-stats');
  if(btn){btn.style.background=statsVisible?'var(--ko-bg)':'';btn.style.color=statsVisible?'var(--ko-t)':'';}
  var box=document.getElementById('stats-global');
  if(!box)return;
  if(!statsVisible){box.classList.remove('show');return;}
  var entries=Object.entries(failHist).filter(function(e){return e[1]>0;});
  if(!entries.length){box.innerHTML='<div class="stats-title">📊 Sin errores registrados todavía</div>';box.classList.add('show');return;}
  entries.sort(function(a,b){return b[1]-a[1];});
  var top=entries.slice(0,10);
  var maxV=top[0][1];
  var html='<div class="stats-title">📊 Preguntas más falladas (acumulado entre sesiones)</div>';
  top.forEach(function(e,i){
    var qid=e[0],count=e[1];
    var q=findQ(qid);if(!q)return;
    var sec=getSecFromQid(qid),n=getNFromQid(qid);
    var m=META.secciones[sec]||{};
    var pct=Math.round(count/maxV*100);
    html+='<div class="stats-item">';
    html+='<span class="stats-n" style="min-width:18px;color:var(--ko-t);font-weight:700">'+(i+1)+'.</span>';
    html+='<span class="stats-q">'+(m.emoji?m.emoji+' ':'')+getNum(sec,n)+'. '+q.q.substring(0,60)+(q.q.length>60?'…':'')+'</span>';
    html+='<div class="stats-bar-wrap"><div class="stats-bar" style="width:'+pct+'%"></div></div>';
    html+='<span class="stats-n">'+count+'✗</span>';
    html+='</div>';
  });
  box.innerHTML=html;box.classList.add('show');
}

/* ── Buscador ── */
function onSearch(val){
  var v=val.trim().toLowerCase();
  var clr=document.getElementById('search-clear');
  var cnt=document.getElementById('search-count');
  if(clr)clr.style.display=v?'block':'none';
  var found=0,total=0;
  document.querySelectorAll('.qcard').forEach(function(card){
    total++;
    if(!v){card.classList.remove('search-hidden');found++;}
    else{
      var qtxt=card.querySelector('.qtxt');
      var match=qtxt&&qtxt.textContent.toLowerCase().indexOf(v)!==-1;
      card.classList.toggle('search-hidden',!match);
      if(match)found++;
    }
  });
  if(cnt){
    if(v){cnt.textContent=found+' de '+total+' preguntas';cnt.style.display='block';}
    else{cnt.style.display='none';}
  }
  // Mostrar "sin resultados" por panel
  ['all'].concat(SECS).forEach(function(s){
    var panel=document.getElementById('panel-'+s);if(!panel||!panel.classList.contains('visible'))return;
    var cards=panel.querySelectorAll('.qcard:not(.search-hidden)');
    var nr=document.getElementById('nr-'+s);if(nr)nr.style.display=cards.length===0&&v?'block':'none';
  });
}
function clearSearch(){
  var si=document.getElementById('search-input');if(si)si.value='';
  onSearch('');
}

  document.getElementById('mode-quick').classList.toggle('on',mode==='quick');

/* ── Modo oscuro ── */
function applyTheme(){

}
