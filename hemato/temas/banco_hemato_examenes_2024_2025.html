<!--
=============================================================
  MOTOR BANCO MIR — v10
  Novedades respecto a v9:
  - Numeración correlativa fija por sección (no se mezcla)
  - Badge neutro en pestaña "Todos" + mezcla real inter-secciones
  - Temporizador sticky editable en header (play/pausa/reset)
  - Buscador de texto en tiempo real
  - Modo repaso rápido (muestra RC + explicación directamente)
  - Estadísticas de errores recurrentes entre sesiones
=============================================================
-->
<!DOCTYPE html>
<html lang="es" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title id="page-title">Banco MIR</title>
<style>
:root{
  --bg:#f4f3ef;--surf:#fff;--bd:#e5e5e5;--bd2:#ddd;
  --txt:#1a1a1a;--txt2:#555;--txt3:#999;--txt4:#666;
  --hdr:#1a1a1a;--hdr-t:#fff;
  --ok-bg:#e6f9ef;--ok-t:#0b6e52;--ok-bd:#2da060;
  --ko-bg:#fdecea;--ko-t:#b91c1c;--ko-bd:#d94f45;
  --sc-ok:#dcf5ed;--sc-ko:#fdecea;--sc-rem:#f0f0f0;--sc-rem-t:#666;
  --exp:#fffbe6;--exp-bd:#f0c04a;--exp-t:#5a4500;
  --prog:#e5e5e5;--prog-fill:#1a56db;
  --star:#ccc;--star-on:#f59e0b;
  --hint:#fafafa;--hint-bd:#eee;
  --tab-bd:#ddd;--tab-t:#555;
  --all-bg:#e8f0fe;--all-t:#1a56db;--all-bd:#1a56db;
  --fab:#1a1a1a;--fab-t:#fff;
  --nota-btn-t:#1a56db;--nota-btn-bd:#1a56db;--nota-btn-bg:var(--surf);
  --timer-bg:#222;--timer-t:#fff;--timer-danger:#ef4444;
}
[data-theme="dark"]{
  --bg:#0f0f1a;--surf:#1e1e30;--bd:#2a2a45;--bd2:#333355;
  --txt:#e8e8f0;--txt2:#aaa;--txt3:#555;--txt4:#888;
  --hdr:#0a0a14;--hdr-t:#e8e8f0;
  --ok-bg:#0b3020;--ok-t:#4ade80;--ok-bd:#166534;
  --ko-bg:#2d0a0a;--ko-t:#f87171;--ko-bd:#7f1d1d;
  --sc-ok:#0b3020;--sc-ko:#2d0a0a;--sc-rem:#252540;--sc-rem-t:#aaa;
  --exp:#1a1500;--exp-bd:#a37f10;--exp-t:#d4b84a;
  --prog:#2a2a45;--prog-fill:#60a5fa;
  --star:#444;--star-on:#f59e0b;
  --hint:#1a1a2e;--hint-bd:#2a2a45;
  --tab-bd:#2a2a45;--tab-t:#aaa;
  --all-bg:#1a2a4a;--all-t:#60a5fa;--all-bd:#3b82f6;
  --fab:#2a2a50;--fab-t:#e8e8f0;
  --nota-btn-t:#60a5fa;--nota-btn-bd:#3b82f6;--nota-btn-bg:var(--surf);
  --timer-bg:#1a1a2e;--timer-t:#e8e8f0;
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:var(--bg);color:var(--txt);min-height:100vh;transition:background .25s,color .25s}

/* ── Header ── */
header{background:var(--hdr);color:var(--hdr-t);padding:9px 16px;display:flex;align-items:center;justify-content:space-between;gap:8px;flex-wrap:wrap;position:sticky;top:0;z-index:100}
header h1{font-size:13.5px;font-weight:600;white-space:nowrap}
.hright{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.hmeta{font-size:11px;color:#888}
.hbtn{background:none;border:none;cursor:pointer;font-size:16px;line-height:1;padding:3px 5px;border-radius:5px;transition:background .15s;color:var(--hdr-t)}
.hbtn:hover{background:rgba(255,255,255,.12)}
.sbadge{font-size:11px;padding:3px 9px;border-radius:5px;font-weight:500}
.sbadge.ok{background:#15803d;color:#dcfce7}.sbadge.warn{background:#92400e;color:#fef3c7}

/* ── Temporizador ── */
#timer-wrap{display:flex;align-items:center;gap:4px;background:var(--timer-bg);border-radius:7px;padding:3px 8px;border:1px solid rgba(255,255,255,.1)}
#timer-display{font-size:13px;font-weight:700;font-family:monospace;color:var(--timer-t);min-width:58px;text-align:center;cursor:pointer;border-radius:3px;padding:1px 3px}
#timer-display:hover{background:rgba(255,255,255,.08)}
#timer-display.editing{background:rgba(255,255,255,.15);outline:none;color:var(--timer-t)}
#timer-display.danger{color:var(--timer-danger)}
#timer-wrap button{background:none;border:none;cursor:pointer;color:rgba(255,255,255,.7);font-size:12px;padding:1px 3px;border-radius:3px;line-height:1}
#timer-wrap button:hover{background:rgba(255,255,255,.12);color:#fff}

/* ── Barra de progreso ── */
#prog-wrap{height:3px;background:var(--prog);position:sticky;top:40px;z-index:99}
#prog-bar{height:100%;background:var(--prog-fill);width:0%;transition:width .4s}

/* ── Contenedor ── */
.container{max-width:820px;margin:0 auto;padding:16px 12px}

/* ── Buscador ── */
.search-wrap{position:relative;margin-bottom:13px}
.search-wrap input{width:100%;padding:8px 34px 8px 12px;border:1.5px solid var(--bd2);border-radius:8px;font-size:13px;background:var(--surf);color:var(--txt);outline:none;transition:border-color .15s}
.search-wrap input:focus{border-color:var(--prog-fill)}
.search-clear{position:absolute;right:9px;top:50%;transform:translateY(-50%);background:none;border:none;cursor:pointer;color:var(--txt3);font-size:16px;display:none;line-height:1}
#search-count{font-size:11px;color:var(--txt3);margin-top:4px;display:none}

/* ── Modo repaso ── */
.mode-bar{display:flex;gap:6px;margin-bottom:12px;align-items:center}
.mode-btn{padding:5px 12px;border:1.5px solid var(--bd2);border-radius:7px;cursor:pointer;font-size:12px;font-weight:500;background:var(--surf);color:var(--txt2);transition:all .15s}
.mode-btn:hover{border-color:#999}
.mode-btn.on{background:var(--all-bg);color:var(--all-t);border-color:var(--all-bd)}

/* ── Tabs ── */
.tabs{display:flex;gap:7px;margin-bottom:13px;flex-wrap:wrap}
.tab{padding:7px 14px;border:1.5px solid var(--tab-bd);border-radius:8px;cursor:pointer;font-size:12.5px;font-weight:500;background:var(--surf);color:var(--tab-t);transition:all .15s}
.tab:hover{border-color:#999;color:var(--txt)}
.tab.t-all.on{background:var(--all-bg);color:var(--all-t);border-color:var(--all-bd)}

/* ── Score global ── */
.ph-global{background:var(--surf);border-radius:10px;border:1px solid var(--bd);padding:10px 15px;margin-bottom:10px;display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;border-left:4px solid var(--prog-fill)}
.score-row{display:flex;gap:7px;align-items:center;flex-wrap:wrap}
.sc{font-size:12px;font-weight:600;padding:3px 9px;border-radius:6px}
.sc.ok{background:var(--sc-ok);color:var(--ok-t)}.sc.ko{background:var(--sc-ko);color:var(--ko-t)}.sc.rem{background:var(--sc-rem);color:var(--sc-rem-t)}

/* ── Acciones ── */
.global-actions{display:none;margin-bottom:10px;gap:7px;flex-wrap:wrap;align-items:center}
.container[data-tab="all"] .global-actions{display:flex}
.sec-actions{margin:6px 0 15px;display:flex;gap:7px;flex-wrap:wrap}
.reset-btn{padding:7px 14px;background:var(--fab);color:var(--fab-t);border:none;border-radius:8px;cursor:pointer;font-size:12.5px;font-weight:500;transition:opacity .15s}
.reset-btn:hover{opacity:.82}
.nota-btn{padding:7px 14px;background:var(--nota-btn-bg);color:var(--nota-btn-t);border:1.5px solid var(--nota-btn-bd);border-radius:8px;cursor:pointer;font-size:12.5px;font-weight:500;transition:background .15s}
.nota-btn:hover{background:var(--all-bg)}

/* ── Nota box ── */
.nota-box,.global-nota-box{margin-top:8px;padding:12px 15px;border-radius:10px;border:2px solid var(--bd2);font-size:13px;line-height:1.7;display:none}
.nota-box.pass,.global-nota-box.pass{background:var(--ok-bg);border-color:var(--ok-bd);color:var(--ok-t)}
.nota-box.fail,.global-nota-box.fail{background:var(--ko-bg);border-color:var(--ko-bd);color:var(--ko-t)}
.nota-score{font-size:26px;font-weight:700;display:block;margin-bottom:4px}
.nota-detail{font-size:12px;opacity:.85;font-family:monospace}

/* ── Vista revisión ── */
.review-list{margin-top:12px;border-top:1px solid var(--bd2);padding-top:10px}
.review-title{font-size:12px;font-weight:700;margin-bottom:9px;color:var(--txt)}
.review-sec-label{font-size:11.5px;font-weight:700;color:var(--txt3);margin:8px 0 5px;padding-top:6px;border-top:1px solid var(--bd)}
.review-item{background:var(--surf);border-radius:8px;border:1px solid var(--bd);margin-bottom:7px;overflow:hidden}
.review-item summary{padding:9px 12px;cursor:pointer;font-size:12.5px;color:var(--txt);list-style:none;display:flex;gap:8px;align-items:flex-start}
.review-item summary::-webkit-details-marker{display:none}
.review-item summary::before{content:'▶';font-size:9px;color:var(--txt3);flex-shrink:0;margin-top:4px;transition:transform .18s}
details[open] summary::before{transform:rotate(90deg)}
.review-body{padding:0 12px 11px}
.review-ans{font-size:12px;color:var(--ok-t);margin-bottom:7px;font-weight:500}

/* ── Estadísticas ── */
.stats-box{margin-top:8px;padding:12px 15px;border-radius:10px;border:1.5px solid var(--bd2);background:var(--surf);display:none}
.stats-box.show{display:block}
.stats-title{font-size:12px;font-weight:700;margin-bottom:10px;color:var(--txt)}
.stats-item{display:flex;align-items:center;gap:8px;padding:6px 0;border-bottom:1px solid var(--bd);font-size:12.5px}
.stats-item:last-child{border-bottom:none}
.stats-bar-wrap{flex:1;background:var(--sc-rem);border-radius:4px;height:6px;overflow:hidden}
.stats-bar{height:100%;background:var(--ko-bd);border-radius:4px;transition:width .4s}
.stats-n{font-size:11px;color:var(--txt3);white-space:nowrap}
.stats-q{flex:2;color:var(--txt);font-size:12px;line-height:1.3}

/* ── Panel secciones ── */
.sec-panel{display:none}.sec-panel.visible{display:block}
.ph{background:var(--surf);border-radius:10px;border:1px solid var(--bd);padding:10px 14px;margin-bottom:8px;display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.ph-left{flex:1;display:flex;flex-direction:column;gap:5px}
.ph-label{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;color:var(--txt3);margin-bottom:1px}
.ph-desc{font-size:12px;color:var(--txt4)}
.fbtn{padding:6px 12px;font-size:12px;font-weight:500;border:1.5px solid var(--bd2);border-radius:8px;cursor:pointer;background:var(--surf);color:var(--txt2);transition:all .15s;white-space:nowrap}
.fbtn:hover{border-color:#999;color:var(--txt)}.fbtn.on{background:var(--ko-bg);color:#b91c1c;border-color:#f87171}
.no-failed{display:none;text-align:center;padding:16px;color:var(--txt3);font-size:13px;border:1.5px dashed var(--bd2);border-radius:8px;margin-top:4px}
.no-failed.show{display:block}
.no-results{display:none;text-align:center;padding:20px;color:var(--txt3);font-size:13px;border:1.5px dashed var(--bd2);border-radius:8px;margin:8px 0}

/* ── Hint ── */
.hint{font-size:11px;color:var(--txt3);margin-bottom:15px;padding:7px 11px;background:var(--hint);border-radius:6px;border:1px solid var(--hint-bd)}

/* ── Tarjeta ── */
.qcard{background:var(--surf);border-radius:10px;border:1px solid var(--bd);margin-bottom:7px;overflow:hidden;transition:box-shadow .15s}
.qcard:hover{box-shadow:0 2px 8px rgba(0,0,0,.08)}
.qcard.kb-focus{outline:2px solid var(--prog-fill);outline-offset:-2px}
.qcard.search-hidden{display:none}
.qhead{padding:11px 13px;cursor:pointer;display:flex;align-items:flex-start;gap:9px}

/* ── Badge numérico ── */
.qnum{font-size:11px;font-weight:700;padding:3px 7px;border-radius:5px;white-space:nowrap;flex-shrink:0;margin-top:2px;background:var(--sc-rem);color:var(--sc-rem-t)}
/* En pestaña "Todos" siempre neutro; en sección aplica color de sección */
.qnum.sec-colored{background:var(--sec-dim);color:var(--sec-col)}

.qtxt{font-size:13px;line-height:1.5;flex:1}
.star-btn{background:none;border:none;cursor:pointer;font-size:15px;color:var(--star);padding:0 2px;flex-shrink:0;margin-top:2px;line-height:1;transition:color .15s,transform .15s}
.star-btn:hover{transform:scale(1.2)}
.star-btn .si{display:inline}.star-btn .sf{display:none}
.star-btn.on .si{display:none}.star-btn.on .sf{display:inline;color:var(--star-on)}
.chev{font-size:15px;color:var(--bd2);flex-shrink:0;margin-top:2px;transition:transform .2s}
.qhead.open .chev{transform:rotate(180deg)}
.qbody{display:none;padding:0 13px 13px}.qbody.open{display:block}

/* ── Imagen ── */
.clinimg-wrap{margin:9px 0 7px;background:#111;border-radius:8px;overflow:hidden;border:1px solid var(--bd2);text-align:center}
.clinimg{max-width:100%;max-height:340px;object-fit:contain;display:block;margin:0 auto}
.clinimg-cap{font-size:11px;color:var(--txt3);padding:4px 0 5px;background:var(--hint);border-top:1px solid var(--bd)}

/* ── Opciones ── */
.opts{list-style:none;margin-top:9px;display:flex;flex-direction:column;gap:5px}
.opt{padding:9px 12px;border-radius:8px;border:1.5px solid var(--bd2);cursor:pointer;display:flex;align-items:flex-start;gap:9px;color:var(--txt);font-size:13px;line-height:1.45;transition:border-color .12s,background .12s;user-select:none}
.opt:hover:not(.done){border-color:#999;background:var(--hint)}
.opt.correct{background:var(--ok-bg);border-color:var(--ok-bd);color:var(--ok-t);font-weight:500;cursor:default}
.opt.wrong{background:var(--ko-bg);border-color:var(--ko-bd);color:var(--ko-t);cursor:default}
.opt.done:not(.correct):not(.wrong){cursor:default;opacity:.7}
.onum{font-size:11px;font-weight:700;flex-shrink:0;margin-top:2px;min-width:15px}

/* ── Modo repaso rápido ── */
.quick-card{padding:9px 12px;border-radius:8px;border:1.5px solid var(--ok-bd);background:var(--ok-bg);margin-top:8px}
.quick-rc{font-size:12.5px;font-weight:600;color:var(--ok-t);margin-bottom:6px}

/* ── Explicación ── */
.expbox{margin-top:10px;padding:10px 12px;background:var(--exp);border-left:4px solid var(--exp-bd);border-radius:0 8px 8px 0;font-size:12.5px;color:var(--exp-t);line-height:1.65}
.expbox b,.expbox strong{font-weight:600}
.et{display:block;margin-bottom:4px;font-weight:600;font-size:13px}
.atag{font-size:10px;padding:2px 6px;border-radius:4px;margin-left:5px;vertical-align:middle}
.atag.ok{background:var(--sc-ok);color:var(--ok-t)}.atag.ko{background:var(--sc-ko);color:#c0392b}

/* ── All-tab CSS ── */
.container[data-tab="all"] .ph{display:none!important}
.container[data-tab="all"] .sec-actions{display:none!important}
.container[data-tab="all"] .no-failed{display:none!important}
.container[data-tab="all"] .nota-box{display:none!important}
.container:not([data-tab="all"]) .global-nota-box{display:none!important}
.container:not([data-tab="all"]) #stats-global{display:none!important}

/* ── Contadores ✓ ✗ ○ pulsables: filtran las preguntas ── */
.sc.ok,.sc.ko,.sc.rem{cursor:pointer;user-select:none;-webkit-user-select:none;transition:box-shadow .15s}
.sc.ok:hover,.sc.ko:hover,.sc.rem:hover{box-shadow:0 0 0 1px var(--bd2)}
.sc.ok.on{box-shadow:0 0 0 1.5px var(--ok-t)}
.sc.ko.on{box-shadow:0 0 0 1.5px var(--ko-t)}
.sc.rem.on{box-shadow:0 0 0 1.5px var(--sc-rem-t)}
.qcard.rem-hidden{display:none!important}
.no-rem{display:none;text-align:center;padding:16px;color:var(--txt3);font-size:13px;border:1.5px dashed var(--bd2);border-radius:8px;margin-top:4px}
</style>
</head>
<body>
<header>
  <h1 id="h-tit">Banco MIR</h1>
  <div class="hright">
    <span class="hmeta" id="h-meta"></span>
    <!-- Temporizador -->
    <div id="timer-wrap" title="Haz clic en el tiempo para editar">
      <span id="timer-display">0:00:00</span>
      <button id="btn-tplay" onclick="timerToggle()" title="Play/Pausa">▶</button>
      <button onclick="timerReset()" title="Reset">↺</button>
    </div>
    <button class="hbtn" id="btn-dark" onclick="toggleDark()" title="Modo oscuro">🌙</button>
    <span id="save-badge" class="sbadge"></span>
  </div>
</header>
<div id="prog-wrap"><div id="prog-bar"></div></div>

<div class="container" id="main-cont" data-tab="all">
  <!-- Buscador -->
  <div class="search-wrap">
    <input type="text" id="search-input" placeholder="🔍 Buscar en enunciados..." oninput="onSearch(this.value)">
    <button class="search-clear" id="search-clear" onclick="clearSearch()">✕</button>
  </div>
  <div id="search-count"></div>

  <!-- Modo -->
  <div class="mode-bar">
    <span style="font-size:11.5px;color:var(--txt3);font-weight:600">MODO:</span>
    <button class="mode-btn on" id="mode-test" onclick="setMode('test')">📝 Test</button>
    <button class="mode-btn" id="mode-quick" onclick="setMode('quick')">⚡ Repaso rápido</button>
    <button class="mode-btn" id="btn-stars" onclick="filterStarred()" style="margin-left:auto;border-color:#f59e0b;color:#b45309">⭐ Marcadas</button>
    <button class="mode-btn" id="btn-stats" onclick="toggleStats()">📊 Errores</button>
  </div>

  <!-- Stats globales -->
  <div class="stats-box" id="stats-global"></div>

  <!-- Tabs -->
  <div class="tabs" id="tabs-wrap"></div>

  <!-- Score global -->
  <div class="ph-global">
    <div class="ph-left">
      <span class="ph-desc" id="ph-gdesc"></span>
      <div class="score-row">
        <span class="sc ok" id="sc-ok-all">✓ 0</span>
        <span class="sc ko" id="sc-ko-all">✗ 0</span>
        <span class="sc rem" id="sc-rem-all">○ 0</span>
      </div>
    </div>
  </div>
  <div class="global-actions">
    <button class="reset-btn" onclick="resetAll()">↺ Reiniciar y mezclar</button>
    <button class="nota-btn" onclick="calcNotaAll()">✎ Calcular nota global</button>
  </div>
  <div class="global-nota-box" id="nota-all"></div>
  <p class="hint">💡 <b>1–5</b> responde · <b>↑↓</b> navega · <b>S</b> marca ⭐ · Progreso guardado automáticamente</p>

  <div id="panels-wrap"></div>
</div>

<script>
/* ═══════════════════════════════════════ MOTOR v10 ═══════════════════════════════════════ */

var KEY=/*__KEY__*/'hemato_examenes_2024_2025_v1';
var META=/*__META_JSON__*/{"titulo": "Hemato-Onco · Exámenes 2024 y 2025 (temario del parcial)", "subtitulo": "Preguntas reales del parcial 2024, la ordinaria 2024 y el final 2025, solo de los temas del parcial y de lo que sale en tus apuntes 2026", "examen": "Parcial Hemato-Onco 2-11-2026", "secciones": {"p24": {"label": "Parcial 2024 (18-10-2024)", "emoji": "📝", "color": "#a78bfa", "colorDim": "#a78bfa22", "desc": "20 preguntas · solo lo que entra en el parcial"}, "o24": {"label": "Ordinaria 2024 (16-01-2024)", "emoji": "📘", "color": "#38bdf8", "colorDim": "#38bdf822", "desc": "36 preguntas · solo lo que entra en el parcial"}, "f25": {"label": "Final 2025 (17-01-2025)", "emoji": "📗", "color": "#84cc16", "colorDim": "#84cc1622", "desc": "30 preguntas · solo lo que entra en el parcial"}}};
var D=/*__D_JSON__*/{"p24": [{"n": "1", "noShuffle": false, "img": null, "q": "Marque lo incorrecto:", "o": ["La FAL suele estar elevada en la fase crónica de la LMC", "La LMC cursa con una fase crónica y una crisis blástica", "La cefalea, astenia, sensación de plenitud posprandial y trastornos hemorrágicos pueden presentarse en la fase crónica de la LMC", "La esplenomegalia es muy frecuente de hallar en la LMC"], "c": 1, "e": "En la fase crónica de la LMC la <b>fosfatasa alcalina leucocitaria (FAL/FAG) está baja</b>; elevada orienta a reacción leucemoide. Las demás son ciertas: esplenomegalia frecuente (~50 %), leucostasis y hemorragias posibles, y evolución de fase crónica a crisis blástica (la fase acelerada puede faltar). <br><small>📌 Cayó en: parcial 2024.</small>"}, {"n": "2", "noShuffle": false, "img": null, "q": "En la fase crónica de la leucemia mieloide crónica no se observa una de las siguientes alteraciones", "o": ["Esplenomegalia", "Elevación de la fosfatasa alcalina leucocitaria", "Hiperuricemia", "Elevación de vitamina B12 y transcobalaminas."], "c": 2, "e": "En la fase crónica de la LMC la <b>fosfatasa alcalina leucocitaria (FAG) está BAJA</b>; alta orienta a reacción leucemoide. Esplenomegalia, hiperuricemia y aumento de B12/transcobalaminas sí aparecen por la proliferación granulocítica. <br><small>📌 Cayó en: parcial 2024.</small>"}, {"n": "3", "noShuffle": false, "img": null, "q": "En la leucemia mieloide crónica:", "o": ["El reordenamiento abl-bcr da lugar a una proteína de fusión con actividad tirosina kinasa.", "El cromosoma Filadelfia se negativiza después de un tratamiento prolongado con hidroxiurea", "La supervivencia de los pacientes es casi siempre inferior a un año.", "El IMATINIB es un citorreductor con efecto inhibidor de las bases pirimidinicas"], "c": 1, "e": "La t(9;22) genera el gen de fusión <b>BCR-ABL, cuya proteína (p210) tiene actividad tirosincinasa aumentada</b>. La hidroxiurea no negativiza el Ph (eso lo logran los ITK), la supervivencia actual se acerca a la de la población general y el imatinib es un inhibidor de tirosincinasa, no un antimetabolito. <br><small>📌 Cayó en: parcial 2024.</small>"}, {"n": "4", "noShuffle": false, "img": null, "q": "Una de las siguientes entidades no corresponde a los síndromes mieloproliferativos crónicos. Márquelo:", "o": ["Leucemia linfática crónica", "Trombocitosis esencial", "Policitemia vera", "Mielofibrosis idiopática"], "c": 1, "e": "La <b>leucemia linfática crónica es un síndrome linfoproliferativo</b>, no mieloproliferativo. Trombocitemia esencial, policitemia vera y mielofibrosis primaria (idiopática) son NMP clásicas. <br><small>📌 Cayó en: parcial 2024.</small>"}, {"n": "5", "noShuffle": false, "img": null, "q": "El cromosoma filadelfia t(9; 22) es característico de:", "o": ["Policitemia Vera", "Leucemias agudas", "Leucemia mieloide crónica", "Trombocitosis esencial"], "c": 3, "e": "El cromosoma Filadelfia, <b>t(9;22) → BCR-ABL, define la leucemia mieloide crónica</b>. PV y TE son BCR-ABL negativas (JAK2, CALR, MPL). Puede verse en algunas leucemias agudas (sobre todo LLA del adulto), pero no es lo característico de ellas. <br><small>📌 Cayó en: parcial 2024.</small>"}, {"n": "6", "noShuffle": false, "img": null, "q": "Paciente mujer de 37 años que acude a urgencias por presentar síncope durante esa misma mañana tras una semana de astenia intensa. Refiere cuadro de infección de vías respiratorias con fiebre que ya se había resuelto hace unos 10 días que se trató de forma sintomática desde MAP. En la analítica llama la atención Hb de 5.2 g/dl, VCM 108 fl, leucocitos normales y 32.000 plaquetas/microlitro. En la BQ se destaca un FG disminuido con Cr de 2.2 mg/dl, iones normales. LDH 872 (elevada), reticulocitos elevados y haptoglobina indetectable. Con el perfil hemolítico ud solicita test de coombs que sale negativo y un frotis de sangre periférica donde se observan abundantes esquistocitos. ¿Cuál de las siguientes es falsa?", "o": ["Solicitaría un estudio de ADAMTS-13", "Iniciaría plasmaféresis antes de tener resultados de ADAMTS-13", "Realizaría transfusión de CH", "Realizaría transfusión de plaquetas"], "c": 4, "e": "Cuadro de <b>PTT</b> (hemólisis Coombs negativa, esquistocitos, trombopenia, fallo renal). <b>Transfundir plaquetas está contraindicado</b> (alimenta los microtrombos) salvo hemorragia grave. Sí: pedir ADAMTS-13, iniciar plasmaféresis sin esperar el resultado y transfundir hematíes si la anemia es sintomática (Hb 5,2 con síncope). <br><small>📌 Cayó en: parcial 2024.</small>"}, {"n": "7", "noShuffle": false, "img": null, "q": "Cuál de las siguientes es FALSA:", "o": ["Las anemias hemolíticas adquiridas son anemias arregenerativas y suelen tener elevación de LDH, bilirrubina, reticulocitos y disminución de Haptoglobina.", "Las anemias ferropénicas son arregenerativas, suelen cursar con disminución de IST y de la ferritina.", "Las anemias de trastornos crónicos suelen deberse a causa multifactorial en pacientes pluripatológicos, polimedicados y se pueden tratar con EPO.", "En la anemia ferropénica la hepcidina estará disminuida y en la anemia por trastornos crónicos suele estar aumentada."], "c": 1, "e": "Las hemolíticas adquiridas son <b>regenerativas</b>: la destrucción es periférica y la médula responde (reticulocitos, LDH y bilirrubina indirecta altos, haptoglobina baja). La trampa: el resto del perfil está bien descrito. Ferropénica arregenerativa con IST y ferritina bajos, crónicos tratables con EPO y hepcidina baja/alta son ciertas. <br><small>📌 Cayó en: parcial 2024.</small>"}, {"n": "8", "noShuffle": true, "img": null, "q": "Paciente de 18 años que a raíz de un ingreso por pancitopenia se diagnostica de aplasia medular muy grave con alta dependencia transfusional. El paciente tiene 2 hermanos varones de 22 y 25 años ¿Cuál es el tratamiento de elección?", "o": ["En caso de tener un hermano compatible HLA idéntico proceder a trasplante alogénico en primera línea.", "Siempre iniciar terapia inmunosupresora con ciclosporina y globulina antitimocítica y proceder al trasplante de hermano posteriormente.", "Solo se procederá a trasplante alogénico en caso de tener un hermano compatible", "Todas son ciertas."], "c": 1, "e": "Aplasia grave/muy grave en <b>menor de 20 años</b>: de elección, <b>trasplante alogénico</b> de hermano HLA idéntico (si no lo hay, en <20 años vale un donante no emparentado). La inmunosupresión (ATG + ciclosporina) es para quien no tiene donante o es >50 años. Por eso c es falsa. <br><small>📌 Cayó en: parcial 2024.</small>"}, {"n": "9", "noShuffle": false, "img": null, "q": "Señale la afirmación correcta en relación con el proceso de carcinogénesis", "o": ["Las células tumorales adquieren durante el proceso de carcinogénesis la capacidad de proliferar de forma descontrolada, así como de desplazarse sobre el tejido de origen hacia otros tejidos y órganos.", "Es un proceso con dos etapas que implican cambios dinámicos en el genoma celular.", "Las células tumorales adquieren características que las asemejan a las células sanas que les confieren una ventaja proliferativa.", "Los mecanismos moleculares que desencadenan la proliferación incontrolada de las células tumorales se pueden agrupar en dos grandes grupos: la activación de genes antiproliferativos (genes supresores) o la inactivación de genes proliferativos (oncogenes)."], "c": 1, "e": "Correcta la a: proliferación descontrolada e <b>invasión/metástasis</b> definen al cáncer. Falsas: la carcinogénesis tiene <b>varias etapas</b> (iniciación, promoción, progresión), no dos; las células tumorales se <b>diferencian</b> de las sanas; y el mecanismo es activación de oncogenes e inactivación de supresores (la d lo dice al revés). <br><small>📌 Cayó en: parcial 2024.</small>"}, {"n": "10", "noShuffle": false, "img": null, "q": "Señale la afirmación incorrecta en relación con los oncogenes", "o": ["Es un gen que codifica una proteína con capacidad para estimular la proliferación tumoral.", "Cuando estos genes sufren una inhibición anormal dan lugar a la proliferación descontrolada.", "Generalmente precisan para ser inactivados alteraciones moleculares en forma de mutaciones puntuales monoalélicas", "P53 es el oncogén más frecuente en los cánceres humanos."], "c": 4, "e": "<b>p53 es un gen supresor</b>, no un oncogén: la d es falsa. Pregunta defectuosa: la b también es falsa (los oncogenes causan proliferación por <b>activación</b>, no por inhibición) y la c está mal redactada (se activan con una alteración monoalélica, no se «inactivan»). Se elige d como la más probable; impugnable. <br><small>📌 Cayó en: parcial 2024.</small>"}, {"n": "11", "noShuffle": false, "img": null, "q": "Señale la afirmación falsa en relación con los genes supresores de tumores", "o": ["El gen del Retinoblastoma Rb1 regula la progresión de las células de la fase G1 del ciclo celular a la fase S", "Las mutaciones de los genes BRCA-1 y BRCA-2 son responsables de hasta el 80% de los casos de cáncer de mama hereditario y familiar.", "Los genes codificantes de Receptores de factor de crecimiento como EGFR o RET son los genes supresores de tumores más frecuentemente involucrados en la carcinogénesis", "El gen APC se encuentra mutado en el 70-80% de los cánceres de colon esporádicos"], "c": 3, "e": "Falsa la c: <b>EGFR y RET son oncogenes</b> (receptores de factores de crecimiento que estimulan la proliferación), no supresores. Ciertas: Rb controla el paso G1→S; BRCA1 (≈45 %) + BRCA2 (≈35 %) explican hasta el 80 % del cáncer de mama familiar; APC está mutado en la mayoría de CCR esporádicos. <br><small>📌 Cayó en: parcial 2024, parcial 2023, final 2022, final 2020, recopilación 1.</small>"}, {"n": "12", "noShuffle": true, "img": null, "q": "Existen al menos 10 características o alteraciones de la fisiología celular que son compartidas por todos los tipos celulares tumorales. Respecto a estas características moleculares del cáncer, señale la afirmación CORRECTA.", "o": ["Las células tumorales son sensibles a las señales inhibidoras del crecimiento", "Las células tumorales poseen un potencial de replicación limitado", "Las células tumorales adquieren la capacidad para generar nuevos vasos sanguíneos en un fenómeno conocido como angiogénesis sostenida", "Todas las anteriores son correctas."], "c": 3, "e": "Rasgo del cáncer: <b>angiogénesis sostenida</b> (VEGF). Las otras son al revés: las células tumorales son <b>insensibles</b> a las señales inhibidoras y tienen <b>potencial replicativo ilimitado</b> (telomerasa, hTERT); por tanto, d es falsa. Ojo: en el parcial 2024 el enunciado pedía la «incorrecta» (a, b y d falsas): defectuosa; la buscada es c. <br><small>📌 Cayó en: parcial 2024, final 2022, ordinaria 2024, recopilación 1.</small>"}, {"n": "13", "noShuffle": true, "img": null, "q": "Señale cuál de las siguientes es la localización más frecuente del cáncer de mama", "o": ["Cuadrantes inferiores", "Retroareolar", "Cuadrante supero-externo", "Ninguna de las anteriores"], "c": 3, "e": "<b>Cuadrante supero-externo (≈48 %)</b>, donde hay más tejido glandular. Le siguen retroareolar (17 %), cuadrantes inferiores (17 %) y supero-interno (15 %). Trampa: el supero-interno es de los menos frecuentes. <br><small>📌 Cayó en: parcial 2024.</small>"}, {"n": "14", "noShuffle": true, "img": null, "q": "La biopsia selectiva del ganglio centinela (BSGC), señale la CORRECTA:", "o": ["Debe realizarse en aquellas pacientes con cáncer de mama y axila clínicamente negativa.", "Es el primer ganglio al que drena el tumor primario dentro de la cadena linfática regional.", "Se realiza mediante la inyección intra o peri tumoral de colorante o radioisótopo dependiendo del centro donde se realice.", "Todas las respuestas anteriores son correctas."], "c": 4, "e": "Las tres son ciertas: la BSGC se hace con <b>axila clínicamente negativa</b>; el centinela es el <b>primer ganglio</b> al que drena el tumor dentro de la cadena regional; se localiza inyectando <b>colorante o radioisótopo</b> (intra/peritumoral o retroareolar). Con axila clínicamente positiva → linfadenectomía. <br><small>📌 Cayó en: parcial 2024.</small>"}, {"n": "15", "noShuffle": false, "img": null, "q": "Una de estas cifras de supervivencia es incorrecta en el cáncer de páncreas:", "o": ["En estadios I y II resecados, la mediana de supervivencia es de 18 meses.", "En estadios III, la mediana de supervivencia es de 6-10 meses.", "En estadios IV, la mediana de supervivencia es de 4-8 meses.", "En estadios IV, la probabilidad de supervivencia a 1 año es del 50%."], "c": 4, "e": "Irresecables/metastásicos: mediana <b>4-8 meses y menos del 20 % vivos al año</b>, no el 50 %. Las otras cifras son las de los apuntes: resecados (I-II) mediana 18 meses y 20 % a 5 años; estadio III, 6-10 meses. <br><small>📌 Cayó en: parcial 2024, parcial 2023.</small>"}, {"n": "16", "noShuffle": false, "img": null, "q": "En el tratamiento sistémico del hepatocarcinoma, uno de estos grupos farmacológicos NO se utiliza habitualmente:", "o": ["Quimioterapia", "Inmunoterapia", "Antiangiogénicos", "Inhibidores múltiples de tirosin quinasa"], "c": 1, "e": "La <b>quimioterapia clásica no se usa</b> en el tratamiento sistémico del HCC. 1.ª línea estándar: atezolizumab (inmunoterapia) + bevacizumab (antiangiogénico); alternativas sorafenib o lenvatinib (inhibidores multicinasa); 2.ª línea regorafenib, cabozantinib, ramucirumab o anti-PD-1. <br><small>📌 Cayó en: parcial 2024.</small>"}, {"n": "17", "noShuffle": false, "img": null, "q": "¿Cuál es la localización más frecuente de los tumores del estroma gastrointestinal (GIST)?", "o": ["Intestino delgado", "Colon", "Estómago", "Recto"], "c": 3, "e": "El GIST asienta sobre todo en el <b>estómago</b> (50-60 %), seguido del intestino delgado; recto, esófago y colon son raros. Además, a igual tamaño y mitosis, el gástrico tiene mejor pronóstico. <br><small>📌 Cayó en: parcial 2024, parcial 2023.</small>"}, {"n": "18", "noShuffle": false, "img": null, "q": "En relación con el tratamiento adyuvante del cáncer de páncreas, sólo una respuesta es correcta:", "o": ["La radioterapia adyuvante mejora la supervivencia", "La quimioterapia adyuvante debe comenzar en las 4-6 semanas siguientes a la cirugía.", "La quimioterapia adyuvante puede posponerse hasta 12 semanas para permitir la recuperación funcional.", "Debe emplearse siempre el triplete FOLFIRINOX"], "c": 3, "e": "ESPAC-3: <b>completar los 6 ciclos importa más que empezar pronto</b>; retrasar la QT hasta 12 semanas no empeora el resultado. La RT adyuvante no ha demostrado beneficio, y FOLFIRINOX no es obligatorio: en mayores de 70 años o pacientes frágiles se usa gemcitabina + capecitabina. <br><small>📌 Cayó en: parcial 2024.</small>"}, {"n": "19", "noShuffle": false, "img": null, "q": "Entre los tratamientos posibles para un hepatocarcinoma, uno de los siguientes NO está indicado en los estadios precoces (0 y A) de la clasificación de Barcelona (BCLC):", "o": ["Resección (hepatectomía)", "Ablación percutánea", "Trasplante hepático", "Quimioembolización"], "c": 4, "e": "BCLC 0-A → <b>resección, ablación o trasplante</b> (intención curativa). La <b>quimioembolización (TACE)</b> es el tratamiento del estadio B (intermedio, multinodular); el C recibe tratamiento sistémico y el D, solo soporte. <br><small>📌 Cayó en: parcial 2024, final 2025.</small>"}, {"n": "20", "noShuffle": false, "img": null, "q": "Paciente, varón de 56 años. En analítica de rutina solicitada por MAP se objetivan cifras de PSA de 12,2 ng/mL y el tacto rectal es normal. Se realiza biopsia transrectal y se confirma un adenocarcinoma acinar de próstata gleason 7 (4+3). En resonancia de estadiaje el tumor afecta a la zona periférica del lóbulo prostático izquierdo (T2b). ¿Cuál de las siguientes sería una opción de tratamiento válida en este paciente?", "o": ["Prostatectomía radical +- linfadenectomía pélvica", "Radioterapia externa con terapia de deprivación androgénica durante 2 años", "Vigilancia activa", "Terapia de deprivación androgénica exclusiva"], "c": 1, "e": "PSA 10-20, Gleason 4+3 y T2b = <b>riesgo intermedio desfavorable</b>: prostatectomía radical (± linfadenectomía) o RT con TDA de 6 meses. La vigilancia activa solo vale en bajo riesgo e intermedio favorable (3+4); la TDA de 2-3 años con RT es del alto riesgo y la TDA exclusiva es paliativa (pacientes frágiles). <br><small>📌 Cayó en: parcial 2024.</small>"}], "o24": [{"n": "1", "noShuffle": false, "img": null, "q": "La Policitemia Vera (PV) presenta en la mayoría de los casos la mutación JAK2:", "o": ["V617F.", "V607F.", "V617A.", "V627F"], "c": 1, "e": "La mutación de la PV es <b>JAK2 V617F</b> (valina → fenilalanina en el codón 617, exón 14), presente en más del 95 %. Las demás variantes no existen como mutaciones típicas. <br><small>📌 Cayó en: ordinaria 2024.</small>"}, {"n": "2", "noShuffle": false, "img": null, "q": "¿Cuál de las siguientes características no espera encontrar en un paciente con Policitemia vera?", "o": ["Masa eritrocitaria aumentada", "Hepatomegalia", "Esplenomegalia", "Saturación arterial mayor o igual a 92%"], "c": 2, "e": "Masa eritrocitaria aumentada, esplenomegalia y SatO2 ≥92 % (sin hipoxia) son los <b>criterios mayores clásicos (PVSG) de la PV</b>; la <b>hepatomegalia</b> no es criterio y es lo menos esperable. Ojo: puede aparecer en un 20-50 %. <br><small>📌 Cayó en: ordinaria 2024.</small>"}, {"n": "3", "noShuffle": false, "img": null, "q": "Respecto a la hepcidina, señale la respuesta falsa:", "o": ["Inactiva la ferroportina de la membrana del enterocito", "Impide el paso de hierro a la circulación", "Bloquea la liberación de hierro en macrófagos", "Disminuye en la anemia de trastorno crónico"], "c": 4, "e": "La hepcidina inactiva la ferroportina (enterocito y macrófago) e impide el paso de hierro a la sangre; la inflamación la <b>AUMENTA en la anemia de trastornos crónicos</b>. Está baja en la ferropenia. <br><small>📌 Cayó en: ordinaria 2024.</small>"}, {"n": "4", "noShuffle": false, "img": null, "q": "En la anemia por déficit de hierro son síntomas atribuidos al déficit de hierro, excepto:", "o": ["Palpitaciones", "Coiloniquia", "Estomatitis angular", "Síndrome de piernas inquietas"], "c": 1, "e": "Las <b>palpitaciones son del síndrome anémico</b> (taquicardia compensadora), no del déficit de hierro en sí. Coiloniquia, estomatitis angular (rágades) y síndrome de piernas inquietas son clínica propia de la ferropenia y aparecen aunque no haya anemia. <br><small>📌 Cayó en: ordinaria 2024.</small>"}, {"n": "5", "noShuffle": false, "img": null, "q": "En el diagnóstico de la anemia perniciosa, señale la respuesta incorrecta:", "o": ["El hemograma y el análisis bioquímico pueden mostrar: anemia hiporregenerativa macrocítica, leucopenia, trombocitopenia, aumento de LDH y de bilirrubina indirecta.", "Se observa un déficit de ácido fólico que se pone de manifiesto mediante su determinación en suero.", "Anticuerpos frente al factor intrínseco, dada su especificidad, corroborará el diagnóstico.", "Anticuerpos frente a células parietales y antibomba de protones (anti-ATPasa H+/K+) son más sensibles, pero menos específicos."], "c": 2, "e": "En la anemia perniciosa lo que se demuestra en suero es el <b>déficit de vitamina B12</b>, no de ácido fólico. Anemia macrocítica hiporregenerativa con citopenias y patrón de hemólisis, anti-FI muy específicos y anti-células parietales más sensibles pero menos específicos son ciertos. <br><small>📌 Cayó en: ordinaria 2024.</small>"}, {"n": "6", "noShuffle": false, "img": null, "q": "Respecto a la betatalasemia, señale la respuesta falsa:", "o": ["β-talasemia menor o rasgo-talasémico, cursa con anemia leve microcítica, ADE normal. Hematíes elevados. Electroforesis de hemoglobina: Hb A2 elevada/ Hb F normal o alta.", "β-talasemia intermedia: Anemia más intensa, hepatoesplenomegalia, síndrome hemolítico crónico. Electroforesis de hemoglobina: Hb A2 elevada/ Hb F alta.", "β-talasemia mayor: en la mayoría de los casos es incompatible con la vida y suele producir muerte intrauterina.", "Los portadores silentes son asintomáticos y se suelen diagnosticar en estudios familiares."], "c": 3, "e": "La <b>β-talasemia mayor no es incompatible con la vida</b>: los síntomas empiezan en la lactancia (al sustituirse la HbF) y sobreviven con transfusiones y quelación. La muerte intrauterina corresponde a la hidropesía fetal de la α-talasemia. Minor, intermedia y portadores silentes están bien descritos. <br><small>📌 Cayó en: ordinaria 2024.</small>"}, {"n": "7", "noShuffle": false, "img": null, "q": "Nos planteamos tratar con hierro parenteral en un paciente con anemia por déficit de hierro, excepto:", "o": ["Necesidad de aporte rápido", "Intolerancia gastrointestinal", "En los pacientes con hemoglobina < 9 g /dl", "Malabsorción"], "c": 3, "e": "Una <b>Hb <9 g/dL no es por sí sola indicación de hierro intravenoso</b>. La vía parenteral se usa si hay malabsorción, intolerancia digestiva al hierro oral o necesidad de reponer rápido (anemia muy severa). <br><small>📌 Cayó en: ordinaria 2024.</small>"}, {"n": "8", "noShuffle": false, "img": null, "q": "La hemoglobinuria paroxística nocturna cursa con las siguientes manifestaciones clínicas, excepto:", "o": ["Deterioro de función renal", "Malformaciones óseas (cráneo en cepillo)", "Anemia aplásica, hasta 25%", "Fenómenos tromboembólicos"], "c": 2, "e": "El <b>cráneo en cepillo</b> es una deformidad ósea por expansión medular de las <b>talasemias</b> (y otras hemolíticas congénitas graves), no de la HPN. La HPN (PIG-A → sin CD55/CD59) da hemólisis intravascular, <b>trombosis</b> en territorios atípicos y daño renal, y se asocia a <b>aplasia medular</b>. <br><small>📌 Cayó en: ordinaria 2024.</small>"}, {"n": "9", "noShuffle": false, "img": null, "q": "Señale la asociación falsa:", "o": ["Anemia hemolítica por anticuerpos calientes: idiopática", "Anemia hemolítica por anticuerpos fríos: mycoplasma pneumoniae", "Anemia hemolítica a frigore: sífilis", "Hemoglobinuria paroxística nocturna: herencia autosómica dominante"], "c": 4, "e": "La <b>HPN es adquirida</b> (mutación somática de PIG-A en la célula madre), no hereditaria. AHAI caliente mayoritariamente idiopática, fría asociada a Mycoplasma y a frigore (Donath-Landsteiner) asociada a sífilis son asociaciones clásicas. <br><small>📌 Cayó en: ordinaria 2024.</small>"}, {"n": "10", "noShuffle": false, "img": null, "q": "No es un criterio diagnóstico de aplasia medular:", "o": ["Presencia de citopenias (≥ 2): Hb < 10 g/dl, Neutrófilos < 1.500/mm3, Plaquetas < 50.000/mm3.", "Médula ósea hipocelular: < 25%", "Presencia de fibrosis medular", "Ausencia de mielodisplasia"], "c": 3, "e": "La <b>fibrosis medular no es criterio de aplasia</b>: orienta a mielofibrosis u otra neoplasia. La aplasia exige citopenias (al menos 2 de: Hb <10, neutrófilos <1.500, plaquetas <50.000), médula hipocelular (<25 %, grasa) y ausencia de displasia y de blastos. <br><small>📌 Cayó en: ordinaria 2024.</small>"}, {"n": "11", "noShuffle": false, "img": null, "q": "¿Cuál es la reacción adversa frecuentemente en el tratamiento con heparina?", "o": ["Leucopenia", "Agranulocitosis", "Trombocitopenia", "Anemia aplásica"], "c": 3, "e": "La reacción adversa hematológica típica de la heparina es la <b>trombocitopenia inducida por heparina (HIT)</b>, por anticuerpos IgG anti-heparina-PF4 a los 5-10 días, y paradójicamente produce trombosis. Leucopenia, agranulocitosis y aplasia no son efectos característicos. <br><small>📌 Cayó en: ordinaria 2024.</small>"}, {"n": "12", "noShuffle": true, "img": null, "q": "Un varón de 32 años sin ningún antecedente de importancia que desarrolla una trombosis portal, niega episodios trombóticos previos, refiere que padre y hermano presentaron también episodios trombóticos. De los siguientes enunciados, ¿Cuál o cuáles son los enunciados correctos?", "o": ["Se debe descartar trombofilia primaria", "Una etiología probable es la Deficiencia de Proteína C", "La Mutación de Factor V de Leyden es la trombofilia hereditaria más infrecuente", "a y b son correctos"], "c": 4, "e": "Trombosis en <b>localización inusual (portal)</b>, en un joven y con <b>historia familiar</b> → hay que descartar trombofilia hereditaria, y el déficit de proteína C es una causa posible: a y b son ciertas. La c es falsa: el <b>factor V Leiden es la trombofilia hereditaria más frecuente</b> en caucásicos. <br><small>📌 Cayó en: ordinaria 2024.</small>"}, {"n": "13", "noShuffle": false, "img": null, "q": "¿Cuál es el tratamiento inicial de la TVP actualmente más extendido?", "o": ["Anticoagulantes orales exclusivamente", "Heparina endovenosa o subcutánea más anticoagulantes orales", "Antiagregación con aspirina", "Vendas elásticas y drenaje postural"], "c": 2, "e": "Esquema clásico y más extendido: <b>heparina</b> (HBPM SC o HNF IV) 5-10 días <b>solapada con anticoagulante oral</b> hasta INR 2-3. Ojo: con <b>apixabán o rivaroxabán</b> la monoterapia oral desde el inicio también es válida (apuntes 2026). Ni la aspirina ni las medidas físicas tratan la TVP. <br><small>📌 Cayó en: ordinaria 2024.</small>"}, {"n": "14", "noShuffle": false, "img": null, "q": "Paciente de 50 años en tratamiento anticoagulante con dicumarínicos, ¿Cuál de las siguientes pruebas pediría para medir la actividad de anticoagulante?", "o": ["Tiempo de ecarina", "INR", "TTPA", "Fibrinógeno"], "c": 2, "e": "Los dicumarínicos (acenocumarol, warfarina) se monitorizan con el <b>INR</b> (TP estandarizado), porque deprimen el factor VII, que explora el TP. El TTPa controla la HNF y el tiempo de ecarina sirve para los inhibidores directos de trombina (dabigatrán). <br><small>📌 Cayó en: ordinaria 2024.</small>"}, {"n": "15", "noShuffle": false, "img": null, "q": "La actividad biológica de heparina depende principalmente de:", "o": ["Antitrombina III", "Fibrinógeno", "Complejo Proteína C activada- FXIII", "Colágeno"], "c": 1, "e": "La heparina actúa de forma indirecta: se une a la <b>antitrombina III</b> y potencia su capacidad de inhibir trombina (IIa) y Xa. Por eso el <b>déficit de antitrombina</b> causa resistencia a la heparina. <br><small>📌 Cayó en: ordinaria 2024.</small>"}, {"n": "16", "noShuffle": false, "img": null, "q": "Uno de los factores de la coagulación sanguínea, dependiente de la vitamina K, es", "o": ["XI", "V", "X", "VIII"], "c": 3, "e": "Factores dependientes de la vitamina K: <b>II, VII, IX y X</b> (más proteínas C y S). El <b>X</b> es el único de la lista; V, VIII y XI no requieren γ-carboxilación. <br><small>📌 Cayó en: ordinaria 2024.</small>"}, {"n": "17", "noShuffle": false, "img": null, "q": "Un paciente de 65 años padece de fibrilación auricular crónica, con historia de embolia cerebral un año antes. Esta anticoagulado con acenocumarol oral. ¿Qué actitud, entre las siguientes, es la más adecuada?", "o": ["Mantener el cociente internacional normalizado (INR) entre 2 y 3", "Mantener el INR entre 3 y 4, y añadir 200mg de aspirina al día", "Mantener el INR entre 4 y 5", "Suprimir la anticoagulación y administrar 300mg de aspirina oral al día"], "c": 1, "e": "FA con ictus embólico previo anticoagulada con AVK: <b>INR 2-3</b>. Rangos más altos (3-4, 4-5) aumentan el sangrado sin más beneficio, y añadir aspirina o sustituir la anticoagulación por ella no está indicado: la aspirina no previene eficazmente el ictus cardioembólico. <br><small>📌 Cayó en: ordinaria 2024.</small>"}, {"n": "18", "noShuffle": false, "img": null, "q": "En relación con la Hormonoterapia, indique la afirmación FALSA.", "o": ["Es una forma de tratamiento médico del cáncer que utiliza fármacos que actúan modificando el ambiente hormonal, evitando la síntesis de hormonas o alterando sus efectos sobre determinadas células.", "Las hormonas son proteínas que actúan como mensajeros modificando el comportamiento, metabolismo y crecimiento de muchas células normales.", "Los receptores hormonales que algunas células expresan en su superficie pueden ser activados por hormonas normales que funcionan como estimulantes del crecimiento tumoral.", "El uso de la hormonoterapia se restringe al tratamiento de Cáncer de Mama y Cáncer de próstata."], "c": 4, "e": "Falsa la d: la hormonoterapia se usa también en <b>endometrio, ovario y tumores neuroendocrinos</b> (y el megestrol en el renal), no solo en mama y próstata. Ojo: b es inexacta (las hormonas sexuales son esteroides, no proteínas) y los receptores de estrógenos son intracelulares, pero la intencionada es d. <br><small>📌 Cayó en: final 2022, ordinaria 2024, recopilación 1.</small>"}, {"n": "19", "noShuffle": false, "img": null, "q": "¿Cuál de estos tumores es más frecuente (mayor incidencia) a nivel mundial?", "o": ["Cáncer colorrectal", "Cáncer gástrico", "Cáncer de esófago", "Cáncer de páncreas"], "c": 1, "e": "A nivel mundial el <b>colorrectal</b> es el 3.er tumor más incidente (≈10 %, tras pulmón y mama), muy por delante de gástrico, esófago y páncreas. En España es directamente el más frecuente (SEOM 2025). <br><small>📌 Cayó en: ordinaria 2024.</small>"}, {"n": "20", "noShuffle": false, "img": null, "q": "¿Cuál es el fármaco más importante en el tratamiento de los tumores germinales?", "o": ["Bleomicina", "Etopósido", "Paclitaxel", "Cisplatino"], "c": 4, "e": "El <b>cisplatino</b> es el fármaco clave en los <b>tumores germinales</b>: los convirtió en curables (>90 %). Esquemas BEP (bleomicina, etopósido, cisplatino), EP o VIP: etopósido y bleomicina acompañan al cisplatino; el paclitaxel no es de primera línea. <br><small>📌 Cayó en: ordinaria 2024. Enunciado reconstruido (del final 2025 solo se conserva un resumen).</small>"}, {"n": "21", "noShuffle": false, "img": null, "q": "En relación con el tratamiento del cáncer de mama, señale cuál de las siguientes afirmaciones es INCORRECTA:", "o": ["El tamaño tumoral y la afectación ganglionar son factores pronósticos en el cáncer de mama.", "El fenotipo molecular HER-2 positivo se caracteriza por presentar buena respuesta a la quimioterapia.", "La cirugía conservadora estaría indicada en tumores multicéntricos.", "El esquema de quimioterapia utilizado en el tratamiento del cáncer de mama incluye la combinación de antraciclinas y taxanos administrados de forma secuencial."], "c": 3, "e": "Falsa la c: los tumores <b>multicéntricos</b> (focos en distintos cuadrantes) son indicación de <b>mastectomía</b>; la conservadora admite multifocales en un mismo cuadrante. Ciertas: tamaño y ganglios son pronósticos; HER2+ responde bien a la QT; el esquema estándar es antraciclinas → taxanos secuencial. <br><small>📌 Cayó en: final 2022, ordinaria 2024.</small>"}, {"n": "22", "noShuffle": false, "img": null, "q": "Una de las siguientes respuestas es FALSA respecto al cáncer de mama.", "o": ["La mayoría de los tumores (70%) tienen receptores para hormonas.", "El estadio medido según el sistema TNM es uno de los factores pronóstico de la enfermedad.", "La presencia de adenopatías axilares contraindica la cirugía.", "Las antraciclinas y los taxanos son los quimioterápicos más empleados en el tratamiento adyuvante."], "c": 3, "e": "Falsa la c: las adenopatías axilares <b>no contraindican la cirugía</b>: se operan con <b>linfadenectomía axilar</b> (≥10 ganglios, niveles I-II). Ciertas: ≈70 % son RH+ (luminales); el estadio TNM es pronóstico; antraciclinas y taxanos son la base de la QT adyuvante. <br><small>📌 Cayó en: ordinaria 2024.</small>"}, {"n": "23", "noShuffle": false, "img": null, "q": "La radioterapia en el cáncer de mama NO está indicada en:", "o": ["Carcinoma in situ post-tumorectomía.", "Estadio I post-mastectomía.", "Estadios localmente avanzados.", "Enfermedad metastásica sintomática."], "c": 2, "e": "Tras mastectomía, la RT solo se indica si <b>tumor >5 cm, ganglios positivos o bordes afectos</b>: en el <b>estadio I</b> no. Sí se irradia tras tumorectomía (también en el in situ) y en los localmente avanzados. En las metástasis sintomáticas se usa RT paliativa. <i>(Enunciado sin «adyuvante» para que no haya dos válidas.)</i> <br><small>📌 Cayó en: ordinaria 2024.</small>"}, {"n": "24", "noShuffle": false, "img": null, "q": "Sólo uno de estos grupos moleculares de cáncer colorrectal metastásico se beneficia de la adición de agentes anti-EGFR (receptor del factor de crecimiento epidérmico) como panitumumab o cetuximab a la quimioterapia:", "o": ["RAS mutado", "RAS y BRAF nativos", "BRAF mutado", "Inestabilidad de microsatélites"], "c": 2, "e": "Los anti-EGFR (cetuximab, panitumumab) solo benefician a los tumores <b>RAS y BRAF nativos</b> (wild type), mejor si el primario es de colon izquierdo. Con RAS o BRAF mutado la vía sigue activada por debajo del receptor y no responden; con inestabilidad de microsatélites → inmunoterapia (pembrolizumab). <br><small>📌 Cayó en: ordinaria 2024.</small>"}, {"n": "25", "noShuffle": false, "img": null, "q": "En relación con la cirugía del cáncer de esófago, sólo una de estas afirmaciones es correcta:", "o": ["La cirugía inicial es el tratamiento de elección en la enfermedad localmente avanzada (estadios II y III)", "Generalmente se excluye el tercio inferior por su complejidad anatómica", "Sólo la resección con márgenes libres (R0) es potencialmente curativa", "Es una cirugía convencional, cualquier cirujano puede realizarla"], "c": 3, "e": "Solo la <b>resección R0</b> es potencialmente curativa; las R1/R2 aportan poco. La cirugía de inicio es para la enfermedad precoz (T1-T2 N0); la localmente avanzada recibe neoadyuvancia. Se excluye el <b>tercio superior</b>, no el inferior, y es una cirugía compleja, de alta morbimortalidad, que exige cirujanos expertos. <br><small>📌 Cayó en: ordinaria 2024.</small>"}, {"n": "26", "noShuffle": false, "img": null, "q": "En el tratamiento del cáncer gástrico irresecable o metastásico, ¿qué afirmación es correcta?", "o": ["La quimioterapia que se utiliza como primera línea de tratamiento es un triplete de platino, fluoropirimidinas y un fármaco antiangiogénico.", "En los tumores que expresan HER-2 (Her-2 positivos) está indicado añadir trastuzumab a la quimioterapia.", "En los casos con carcinomatosis peritoneal están indicadas la cirugía reductora y quimioterapia posterior para eliminar el tumor no resecado.", "En los tumores que expresan PDL-1 positivo está indicado añadir trastuzumab más nivolumab."], "c": 2, "e": "En el gástrico avanzado HER2+ se añade <b>trastuzumab</b> a platino + fluoropirimidina (ToGA); si es PD-L1+, se añade <b>nivolumab</b> (CheckMate 649), no trastuzumab. La 1.ª línea es un doblete, no un triplete con antiangiogénico, y en la carcinomatosis el tratamiento local es solo paliativo. <br><small>📌 Cayó en: ordinaria 2024, final 2025.</small>"}, {"n": "27", "noShuffle": false, "img": null, "q": "Con respecto al tratamiento adyuvante del cáncer de colon, sólo una de estas afirmaciones es falsa:", "o": ["El incremento en la supervivencia se estima en un 15-20%", "Deben tratarse todos los pacientes con estadio III (ganglios positivos)", "Deben tratarse sólo los estadios II (ganglios negativos) con criterios de riesgo", "El tratamiento debe durar siempre 6 meses"], "c": 4, "e": "La duración no es siempre 6 meses: según IDEA, <b>XELOX 3 meses no es inferior</b> a 6 meses en el estadio III de bajo riesgo (T1-3 N1) y reduce la neurotoxicidad del oxaliplatino. Ciertas: se trata todo estadio III y, del estadio II, solo el de alto riesgo. <br><small>📌 Cayó en: ordinaria 2024, final 2025.</small>"}, {"n": "28", "noShuffle": false, "img": null, "q": "El tratamiento estándar del cáncer de recto localmente avanzado (estadios II y III) consiste en:", "o": ["Cirugía (escisión total del mesorrecto)", "Cirugía (EMT) seguida de quimioterapia adyuvante", "Cirugía (EMT) seguida de quimiorradioterapia adyuvante", "Quimiorradioterapia neoadyuvante seguida de cirugía (EMT)"], "c": 4, "e": "Recto II-III: <b>neoadyuvancia (QT-RT larga con fluoropirimidinas, RT corta 5×5 o TNT) seguida de escisión total del mesorrecto</b>. Reduce el tumor, facilita conservar el esfínter y baja la recidiva local. El recto no se opera de entrada salvo tumores muy precoces; la QT-RT postoperatoria controla peor y es más tóxica. <br><small>📌 Cayó en: ordinaria 2024, final 2025.</small>"}, {"n": "29", "noShuffle": false, "img": null, "q": "Uno de los siguientes factores no tiene influencia en la decisión de tratamiento en el cáncer colorrectal metastásico:", "o": ["Estado general (performance status)", "Perfil molecular", "Clasificación TNM", "Resecabilidad de las metástasis"], "c": 3, "e": "En el CCR metastásico todos son estadio IV (M1): el <b>TNM no cambia la decisión</b>. Sí pesan el <b>estado general</b> y la comorbilidad, el <b>perfil molecular</b> (RAS, BRAF, MSI), la localización del primario y la <b>resecabilidad de las metástasis</b> (resección hepática R0: supervivencia a 5 años del 55 %). <br><small>📌 Cayó en: ordinaria 2024, final 2025.</small>"}, {"n": "30", "noShuffle": false, "img": null, "q": "Una de estas terapias sistémicas no está indicada en el tratamiento del cáncer renal", "o": ["Quimioterapia", "Inmunoterapia", "Inhibidores de tirosina quinasa con efecto antiangiogénico", "Inmunoterapia adyuvante"], "c": 1, "e": "El carcinoma renal es <b>quimiorresistente</b>: la <b>quimioterapia no está indicada</b>. Sí lo están los TKI antiangiogénicos (sunitinib, cabozantinib, axitinib…), la inmunoterapia (anti-PD-1 ± anti-CTLA-4) en enfermedad avanzada y el <b>pembrolizumab adyuvante</b> tras nefrectomía en riesgo intermedio/alto. <br><small>📌 Cayó en: ordinaria 2024.</small>"}, {"n": "31", "noShuffle": false, "img": null, "q": "¿Cuál es la presentación clínica más frecuente del cáncer renal?", "o": ["Asintomático, como hallazgo radiológico incidental", "Tríada de dolor lumbar, hematuria y masa abdominal", "Síndromes paraneoplásicos (hipercalcemia, fiebre…)", "Manifestaciones de enfermedad metastásica (disnea, dolor óseo)"], "c": 1, "e": "Hoy más del 60 % de los cánceres renales se diagnostican de forma <b>incidental</b> en una prueba de imagen. La tríada dolor-hematuria-masa aparece en < 10 % (y sugiere enfermedad avanzada); síndromes paraneoplásicos (~30 %) y metástasis son formas de debut menos habituales. <br><small>📌 Cayó en: ordinaria 2024.</small>"}, {"n": "32", "noShuffle": true, "img": null, "q": "Sobre el cáncer de próstata, ¿cuál de las afirmaciones es CORRECTA?", "o": ["Es el cáncer más frecuente en varones y representa la segunda causa de muerte tras el cáncer de pulmón.", "El tipo histológico más frecuente es el adenocarcinoma de tipo acinar.", "En el cáncer de próstata localizado la cirugía, la radioterapia o la vigilancia activa pueden ser opciones de tratamiento válidas.", "Todas las respuestas anteriores son correctas."], "c": 4, "e": "Las tres afirmaciones son ciertas según los apuntes: el cáncer de próstata es el <b>más frecuente en varones</b> y la 2.ª causa de muerte por cáncer (dato de las diapositivas); el <b>adenocarcinoma acinar</b> es el tipo habitual (95 %); en enfermedad localizada valen <b>cirugía, RT o vigilancia activa</b>. → <b>Todas</b>. <i>Dato de tus diapositivas de próstata; la SEOM (T29) lo sitúa 3.º en España.</i> <br><small>📌 Cayó en: ordinaria 2024.</small>"}, {"n": "33", "noShuffle": false, "img": null, "q": "Una de estas afirmaciones sobre los sarcomas es falsa:", "o": ["Son tumores poco frecuentes", "Tienen tendencia a la recidiva local", "Tienen tendencia a la afectación ganglionar", "Tienen tendencia al desarrollo de metástasis"], "c": 3, "e": "Los sarcomas dan <b>metástasis ganglionares raras</b> (excepciones: epitelioide, células claras, angiosarcoma y rabdomiosarcoma). Son ciertas: tumores poco frecuentes (0,5-1 %), gran tendencia a la recidiva local y a las metástasis a distancia (10 % al diagnóstico, hasta el 50 % en la evolución), sobre todo pulmonares o hepáticas. <br><small>📌 Cayó en: ordinaria 2024, final 2025.</small>"}, {"n": "34", "noShuffle": false, "img": null, "q": "Una de estas características del osteosarcoma es falsa:", "o": ["Se localiza más frecuentemente en las metáfisis de los huesos largos (rodilla)", "Se caracteriza por la formación de hueso y presencia de matriz osteoide", "El tratamiento de elección es la cirugía, pero precisa siempre tratamiento quimioterápico adyuvante y/o neoadyuvante", "Se diagnostica mediante la traslocación EWSR1-FLI1 t(11;22)"], "c": 4, "e": "<b>EWSR1-FLI1 t(11;22) es la translocación del sarcoma de Ewing</b>; el osteosarcoma tiene genética compleja (TP53, RB1, CDKN2A/B) y se diagnostica por la <b>presencia de osteoide</b>. La localización en metáfisis de huesos largos (rodilla) es cierta. Ojo con c: el de bajo grado se trata solo con cirugía. <br><small>📌 Cayó en: ordinaria 2024, final 2025.</small>"}, {"n": "35", "noShuffle": false, "img": null, "q": "Una de estas características del sarcoma de Ewing es falsa:", "o": ["Se localiza más frecuentemente en huesos planos (pelvis) y diáfisis de huesos largos", "Se caracteriza por lesiones osteolíticas, con reacción perióstica y presencia de masa de partes blandas", "Presenta 2 picos de incidencia: 0-19 años y más de 60 años", "Es muy sensible a la quimioterapia y radioterapia"], "c": 3, "e": "El Ewing tiene un <b>único pico en la adolescencia</b> (mediana 15 años) y es casi inexistente en adultos; el <b>segundo pico en mayores es del osteosarcoma</b>. Ciertas: pelvis/huesos planos y diáfisis, lesión lítica con reacción perióstica en capas de cebolla y masa de partes blandas, y gran radio- y quimiosensibilidad. <br><small>📌 Cayó en: ordinaria 2024, final 2025.</small>"}, {"n": "36", "noShuffle": false, "img": null, "q": "Sólo uno de estos tumores es curable con quimioterapia en fase metastásica:", "o": ["Cáncer renal", "Cáncer de testículo", "Sarcomas de partes blandas", "Osteosarcoma"], "c": 2, "e": "El <b>cáncer de testículo</b> es el modelo de tumor curable con QT incluso metastásico (> 90 % de curación gracias al cisplatino, esquema BEP). El renal es quimiorresistente; en los sarcomas de partes blandas metastásicos la QT es paliativa, y el osteosarcoma metastásico solo se cura si además se resecan las metástasis. <br><small>📌 Cayó en: ordinaria 2024, final 2025.</small>"}], "f25": [{"n": "1", "noShuffle": false, "img": null, "q": "¿Cuál de los siguientes NO es un criterio mayor en el diagnóstico de la policitemia vera?", "o": ["Eritropoyetina sérica disminuida", "Mutación de JAK2", "Incremento de la masa eritrocitaria", "Biopsia de médula ósea compatible"], "c": 1, "e": "Criterios mayores OMS 2016 de PV: Hb/Hto o masa eritrocitaria elevados, biopsia medular compatible (panmielosis) y mutación de JAK2. La <b>EPO sérica disminuida es el criterio MENOR</b>. <br><small>📌 Cayó en: final 2025. Enunciado reconstruido (del final 2025 solo se conserva un resumen).</small>"}, {"n": "2", "noShuffle": false, "img": null, "q": "Respecto al espectro mutacional de la trombocitemia esencial, señale la afirmación INCORRECTA:", "o": ["Aproximadamente el 60 % presenta la mutación JAK2 V617F", "El 50 % presenta mutaciones del exón 9 de CALR", "Alrededor del 5 % presenta mutaciones de MPL", "Alrededor del 10 % son triple negativas"], "c": 2, "e": "Espectro mutacional de la TE: JAK2 V617F ~60 %, <b>CALR exón 9 ~20-25 % (no 50 %)</b>, MPL ~3-5 % y triple negativa ~10 %. <br><small>📌 Cayó en: final 2025. Enunciado reconstruido (del final 2025 solo se conserva un resumen).</small>"}, {"n": "3", "noShuffle": false, "img": null, "q": "En los criterios diagnósticos de consenso internacional de la leucemia neutrofílica crónica, ¿qué mutación constituye la mutación driver o firma genética de la enfermedad?", "o": ["Mutación de TET2", "Mutación de SRSF2", "Mutación de CSF3R", "Mutación de ASXL1"], "c": 3, "e": "La <b>mutación de CSF3R</b> (receptor del G-CSF) es la firma genética o mutación driver de la leucemia neutrofílica crónica en los criterios de consenso internacional. TET2, SRSF2 y ASXL1 son mutaciones acompañantes inespecíficas de las neoplasias mieloides. <br><small>📌 Cayó en: final 2025. Enunciado reconstruido (del final 2025 solo se conserva un resumen).</small>"}, {"n": "4", "noShuffle": false, "img": null, "q": "¿Cuál es la mutación característica de la leucemia neutrofílica crónica?", "o": ["EZH2", "JAK2 V617F", "MPL", "CSF3R"], "c": 4, "e": "<b>Leucemia neutrofílica crónica → CSF3R</b> (receptor del G-CSF). JAK2 V617F y MPL son las mutaciones de PV, TE y mielofibrosis; EZH2 es una mutación molecular de alto riesgo en la mielofibrosis. <br><small>📌 Cayó en: final 2025. Enunciado reconstruido (del final 2025 solo se conserva un resumen).</small>"}, {"n": "5", "noShuffle": false, "img": null, "q": "Mujer de 21 años, hemodinámicamente estable, con Hb 6,1 g/dL, VCM 71 fL, IST 11 % y ferritina 8 ng/mL. ¿Cuál es la actitud más adecuada?", "o": ["Transfusión de dos concentrados de hematíes", "Hierro oral, sin transfusión", "Vitamina B12 intramuscular", "Eritropoyetina subcutánea"], "c": 2, "e": "Ferropenia grave (microcitosis, IST y ferritina bajas) en una joven <b>estable</b>: <b>hierro oral</b> y buscar la causa (menstruación, digestiva). La transfusión se evita en mujeres jóvenes sin síndrome anémico grave (riesgo de aloinmunización). Hierro IV si malabsorción o necesidad de reposición rápida. B12 y EPO no corrigen una ferropenia. <br><small>📌 Cayó en: final 2025. Enunciado reconstruido (del final 2025 solo se conserva un resumen).</small>"}, {"n": "6", "noShuffle": false, "img": null, "q": "Paciente de 61 años con diabetes, obesidad e infarto agudo de miocardio portador de stents, que presenta pérdida de 11 kg de peso y una anemia macrocítica con Hb de 7,2 g/dL y déficit importante de vitamina B12. ¿Cuál es la actitud más adecuada?", "o": ["Vitamina B12 oral y control analítico en 3 meses", "Ácido fólico oral y control analítico en 3 meses", "Vitamina B12 intramuscular, sin transfusión ni otros estudios", "Soporte transfusional, vitamina B12 parenteral y estudio con TAC y gastroscopia/colonoscopia"], "c": 4, "e": "Hb 7,2 en un cardiópata (IAM con stents) → <b>transfusión</b>; déficit importante de B12 → reposición <b>parenteral</b>; y la <b>pérdida de 11 kg</b> obliga a descartar una neoplasia digestiva (TAC y gastroscopia/colonoscopia). Las demás opciones dejan sin estudiar el síndrome constitucional. <br><small>📌 Cayó en: final 2025. Enunciado reconstruido (del final 2025 solo se conserva un resumen).</small>"}, {"n": "7", "noShuffle": false, "img": null, "q": "Varón de 67 años, gastrectomizado, con Hb 8,8 g/dl, VCM 120 fl, reticulocitos bajos y, en el frotis, megaloblastos y neutrófilos hipersegmentados. Señale la afirmación correcta:", "o": ["Anemia arregenerativa macrocítica cuya causa más frecuente es la megaloblástica; hay que solicitar estudio de carenciales (B12 y ácido fólico)", "Anemia regenerativa de origen hemolítico; la prueba indicada es el test de Coombs directo", "Anemia microcítica ferropénica; debe iniciarse hierro oral sin más estudios", "Anemia de trastornos crónicos; no precisa más estudios"], "c": 1, "e": "VCM 120 + reticulocitos bajos + neutrófilos hipersegmentados = <b>anemia megaloblástica</b> (arregenerativa macrocítica). La gastrectomía elimina el factor intrínseco: <b>déficit de B12</b>; se piden B12 y fólico. No es hemolítica (reticulocitos bajos), ni ferropénica (VCM alto), ni de trastornos crónicos (normocítica). <br><small>📌 Cayó en: final 2025. Enunciado reconstruido (del final 2025 solo se conserva un resumen).</small>"}, {"n": "8", "noShuffle": true, "img": null, "q": "Paciente joven con pancitopenia de nueva aparición. ¿Qué estudio inicial está indicado?", "o": ["Frotis de sangre periférica y estudio de médula ósea", "Iniciar G-CSF y eritropoyetina y repetir el hemograma en un mes, sin más estudios", "Serologías víricas, estudio de autoinmunidad y de factores carenciales (hierro, B12, ácido fólico)", "a y c son correctas"], "c": 4, "e": "Ante una pancitopenia nueva en un joven hay que hacer las dos cosas: <b>frotis y estudio medular</b> (descartar SMD o leucemia, valorar la celularidad) <b>y buscar causas secundarias</b> (serologías, autoinmunidad, B12, fólico, hierro), porque la aplasia es un diagnóstico de exclusión. No se dan G-CSF ni EPO a ciegas. <br><small>📌 Cayó en: final 2025. Enunciado reconstruido (del final 2025 solo se conserva un resumen).</small>"}, {"n": "9", "noShuffle": false, "img": null, "q": "¿Cuál es el fármaco de elección en la profilaxis y el tratamiento de la enfermedad tromboembólica venosa asociada al cáncer?", "o": ["Antagonistas de la vitamina K (acenocumarol)", "Heparina de bajo peso molecular (enoxaparina, tinzaparina)", "Heparina no fraccionada intravenosa", "Ácido acetilsalicílico"], "c": 2, "e": "En la ETV asociada al cáncer se prefiere la <b>HBPM</b> (enoxaparina, tinzaparina; más eficaz que los AVK). Los apuntes 2026 sitúan al mismo nivel los <b>ACOD anti-Xa</b> (apixabán, edoxabán, rivaroxabán); los AVK quedan como 3.ª opción. La aspirina no trata la ETV y la HNF IV se reserva para casos concretos (p. ej., ERC grave). <br><small>📌 Cayó en: final 2025. Enunciado reconstruido (del final 2025 solo se conserva un resumen).</small>"}, {"n": "10", "noShuffle": false, "img": null, "q": "¿Cuál es el mecanismo de acción del cetuximab?", "o": ["Bloqueo del receptor del EGFR", "Bloqueo del dominio tirosina cinasa del EGFR", "Inhibición de BRAF", "Inhibición de MEK"], "c": 1, "e": "El cetuximab es un <b>anticuerpo monoclonal anti-EGFR</b> que bloquea el <b>receptor</b> desde fuera de la célula. Bloquear el dominio tirosina cinasa es lo que hacen los TKI (erlotinib, gefitinib, osimertinib); BRAF y MEK se inhiben con otros fármacos (dabrafenib/vemurafenib y trametinib). <br><small>📌 Cayó en: final 2025. Enunciado reconstruido (del final 2025 solo se conserva un resumen).</small>"}, {"n": "11", "noShuffle": false, "img": null, "q": "¿Cuál es el mecanismo de acción del pazopanib?", "o": ["Bloqueo del VEGF soluble", "Bloqueo del receptor VEGFR", "Activación de BCL-2", "Inhibición de HER2"], "c": 2, "e": "Pazopanib es un <b>inhibidor de tirosina cinasa del receptor VEGFR</b> (antiangiogénico; cáncer renal, sarcomas). Bloquear el VEGF soluble es el mecanismo del bevacizumab; BCL-2 es antiapoptótico y se inhibe (venetoclax), no se activa; HER2 se bloquea con trastuzumab o pertuzumab. <br><small>📌 Cayó en: final 2025. Enunciado reconstruido (del final 2025 solo se conserva un resumen).</small>"}, {"n": "12", "noShuffle": true, "img": null, "q": "¿Cuál de los siguientes es un factor de riesgo de cáncer de mama?", "o": ["Menarquia precoz", "Menopausia tardía", "Nuliparidad", "Todas las anteriores"], "c": 4, "e": "Todos son factores de riesgo por <b>mayor exposición a estrógenos</b>: menarquia precoz, menopausia tardía y nuliparidad (también primer embarazo tardío, no lactancia, THS y anticonceptivos orales). <br><small>📌 Cayó en: final 2025. Enunciado reconstruido (del final 2025 solo se conserva un resumen).</small>"}, {"n": "13", "noShuffle": false, "img": null, "q": "Respecto al diagnóstico del cáncer de mama, señale la afirmación INCORRECTA:", "o": ["La forma de presentación más frecuente es el nódulo mamario palpable.", "La resonancia magnética es imprescindible en el diagnóstico.", "La resonancia magnética permite evaluar la respuesta al tratamiento neoadyuvante.", "Ante una lesión BI-RADS 4 debe realizarse una biopsia con aguja gruesa (BAG)."], "c": 2, "e": "Falsa la b: la <b>RM no es imprescindible</b>; la prueba de referencia es la <b>mamografía</b> (+ ecografía). La RM tiene indicaciones concretas (mamas densas, lobulillar, primario oculto, respuesta a neoadyuvancia). El nódulo es la presentación más frecuente y BI-RADS ≥4 obliga a biopsia (BAG). <br><small>📌 Cayó en: final 2025. Enunciado reconstruido (del final 2025 solo se conserva un resumen).</small>"}, {"n": "14", "noShuffle": true, "img": null, "q": "Respecto al cáncer de mama triple negativo, señale la afirmación correcta:", "o": ["No expresa receptores hormonales ni HER2.", "Tiene mayor tendencia a desarrollar metástasis a distancia.", "Representa el 10-15 % de los cánceres de mama.", "Todas las anteriores son correctas."], "c": 4, "e": "Todas ciertas: triple negativo = <b>RE−, RP− y HER2−</b>; supone el <b>10-15 %</b>; es el subtipo más agresivo, con mayor tendencia a metástasis a distancia y peor pronóstico, aunque muy sensible a la QT. <br><small>📌 Cayó en: final 2025. Enunciado reconstruido (del final 2025 solo se conserva un resumen).</small>"}, {"n": "15", "noShuffle": false, "img": null, "q": "Varón de 66 años diagnosticado de carcinoma epidermoide de pulmón que se presenta como un nódulo de 1 cm. El PET-TC no muestra otras captaciones. ¿Cuál es su estadificación TNM?", "o": ["TisN0M0", "T1N0M0", "T2N0M0", "T1N1M0"], "c": 2, "e": "Nódulo de <b>1 cm = T1</b> (T1a ≤1 cm en la TNM-9) y PET-TC sin otras captaciones → N0 y M0: <b>T1N0M0</b> (estadio IA). T2 empieza por encima de 3 cm, N1 exigiría ganglios hiliares o peribronquiales y Tis es el carcinoma in situ. <br><small>📌 Cayó en: final 2025. Enunciado reconstruido (del final 2025 solo se conserva un resumen).</small>"}, {"n": "16", "noShuffle": false, "img": null, "q": "Salvo uno, todos los siguientes se consideran factores de riesgo para desarrollar un cáncer de páncreas. Señale el factor no asociado:", "o": ["Tabaco", "Edad", "Pancreatitis crónica", "Desnutrición crónica"], "c": 4, "e": "Factores de riesgo del cáncer de páncreas: edad (mediana 71 años), tabaco, DM de larga evolución, <b>obesidad</b>, alcohol (a través de la pancreatitis crónica) y genética. La <b>desnutrición no es factor de riesgo</b>: lo que cuenta es el exceso de peso. <br><small>📌 Cayó en: parcial 2023, final 2025.</small>"}, {"n": "17", "noShuffle": false, "img": null, "q": "Entre las manifestaciones clínicas de los tumores malignos de la vía biliar, una de estas es poco frecuente:", "o": ["Ictericia indolora", "Rectorragia", "Dolor abdominal", "Astenia, anorexia y adelgazamiento"], "c": 2, "e": "Clínica típica: <b>ictericia obstructiva indolora (80 %)</b>, prurito, pérdida de peso (50 %) y dolor abdominal sordo (40 %). La <b>rectorragia</b> no forma parte del cuadro: orienta a tumores de colon izquierdo o recto. <br><small>📌 Cayó en: parcial 2023, final 2025.</small>"}, {"n": "18", "noShuffle": false, "img": null, "q": "En relación con la cirugía del cáncer de páncreas localizado, señale la afirmación INCORRECTA:", "o": ["El objetivo es la resección del tumor, independientemente del estado de los márgenes", "El atrapamiento de la arteria mesentérica superior hace que el tumor sea irresecable", "El atrapamiento del tronco celíaco hace que el tumor sea irresecable", "Aproximadamente un 15 % de los pacientes son resecables al diagnóstico"], "c": 1, "e": "El objetivo es la <b>resección completa con márgenes libres (R0)</b>, principal factor pronóstico; resecar dejando márgenes afectos no cura. Son ciertas: el atrapamiento de la AMS o del tronco celíaco define la irresecabilidad, y solo un 10-15 % es resecable al diagnóstico. <br><small>📌 Cayó en: final 2025. Enunciado reconstruido (del final 2025 solo se conserva un resumen).</small>"}, {"n": "19", "noShuffle": false, "img": null, "q": "Señale la asociación INCORRECTA entre tumor neuroendocrino pancreático y su manifestación clínica:", "o": ["VIPoma – diarrea acuosa", "Somatostatinoma – úlceras gástricas", "Insulinoma – hipoglucemia", "Glucagonoma – erupciones cutáneas"], "c": 2, "e": "Las <b>úlceras gástricas son del gastrinoma</b> (Zollinger-Ellison). El <b>somatostatinoma</b> da hiperglucemia, diarrea con esteatorrea, cálculos biliares e ictericia. VIPoma = diarrea acuosa con hipopotasemia; insulinoma = hipoglucemia; glucagonoma = erupciones cutáneas e hiperglucemia. <br><small>📌 Cayó en: final 2025. Enunciado reconstruido (del final 2025 solo se conserva un resumen).</small>"}, {"n": "20", "noShuffle": false, "img": null, "q": "¿En cuál de los siguientes tumores de la vía biliar son más frecuentes las alteraciones moleculares tratables con terapia dirigida?", "o": ["Carcinoma de vesícula biliar", "Colangiocarcinoma extrahepático distal", "Colangiocarcinoma intrahepático", "Colangiocarcinoma perihiliar (tumor de Klatskin)"], "c": 3, "e": "El <b>colangiocarcinoma intrahepático</b> concentra las dianas: <b>mutación de IDH1</b> (ivosidenib), <b>fusiones de FGFR2</b> (pemigatinib, futibatinib), NTRK y BRAF V600E. Vesícula y extrahepático tienen sobre todo amplificación de HER2, con menos variedad de dianas. El perfil molecular es obligado en la enfermedad avanzada. <br><small>📌 Cayó en: final 2025. Enunciado reconstruido (del final 2025 solo se conserva un resumen).</small>"}, {"n": "21", "noShuffle": false, "img": null, "q": "¿Cuál es el tratamiento de elección del GIST diseminado (metastásico)?", "o": ["Quimioterapia basada en doxorrubicina", "Imatinib", "Sunitinib", "Cirugía citorreductora sola"], "c": 2, "e": "El <b>imatinib</b> (inhibidor de KIT/PDGFRA) es la 1.ª línea del GIST avanzado: llevó la mediana de supervivencia de menos de 2 a más de 5 años y supera claramente a la QT con doxorrubicina. El <b>sunitinib es la 2.ª línea</b>, tras la resistencia secundaria al imatinib. <br><small>📌 Cayó en: final 2025. Enunciado reconstruido (del final 2025 solo se conserva un resumen).</small>"}, {"n": "22", "noShuffle": false, "img": null, "q": "Señale la afirmación FALSA sobre el carcinoma epidermoide de esófago:", "o": ["Es más frecuente en países subdesarrollados", "Predomina en el tercio inferior del esófago", "Sus principales factores de riesgo son el tabaco y el alcohol", "Su incidencia ha disminuido en las últimas décadas"], "c": 2, "e": "El epidermoide predomina en los <b>tercios superior y medio</b>; el <b>tercio inferior y la unión esofagogástrica son del adenocarcinoma</b> (Barrett, ERGE, obesidad). Las demás son ciertas: epidermoide = tabaco + alcohol, países subdesarrollados e incidencia en descenso. <br><small>📌 Cayó en: final 2025. Enunciado reconstruido (del final 2025 solo se conserva un resumen).</small>"}, {"n": "23", "noShuffle": f var canSave=typeof localStorage!=='undefined';

/* ── INIT ── */
(function init(){
  SECS.forEach(function(s){fFailed[s]=false;});
  injectSecCSS();
  buildHeader();
  buildTabs();
  buildPanels();
  buildIdx();
  buildNums();
  buildAllOrder();
  SECS.forEach(render);
  renderAll();
  updateScores();
  updateProg();
  applyTheme();
  initTimer();
  setBadge(canSave?'Guardado':'Sin guardado',canSave?'ok':'warn');
  document.addEventListener('keydown',handleKey);

})();

/* ── CSS dinámico ── */
function injectSecCSS(){
  var css='';
  SECS.forEach(function(s){
    var m=META.secciones[s]||{};
    var c=m.color||'#1a56db',cd=m.colorDim||'#e8f0fe';
    css+='.tab.t-'+s+'.on{background:'+cd+';color:'+c+';border-color:'+c+'}\n';
    css+='.ph.s-'+s+'{border-left:4px solid '+c+'}\n';
    // Variables CSS por sección para el badge coloreado
    css+='#panel-'+s+' .qnum.sec-colored{background:'+cd+';color:'+c+'}\n';
  });
  var st=document.createElement('style');st.textContent=css;document.head.appendChild(st);
}

/* ── Header ── */
function buildHeader(){
  var total=SECS.reduce(function(a,s){return a+(D[s]?D[s].length:0);},0);
  var t=document.getElementById('h-tit');if(t)t.textContent=META.titulo||'Banco MIR';
  var pt=document.getElementById('page-title');if(pt)pt.textContent=META.titulo||'Banco MIR';
  var m=document.getElementById('h-meta');
  if(m){var p=[];if(total)p.push(total+' preguntas');if(META.examen)p.push(META.examen);m.textContent=p.join(' · ');}
  var d=document.getElementById('ph-gdesc');if(d)d.textContent=META.subtitulo||'';
  var r=document.getElementById('sc-rem-all');if(r)r.textContent='○ '+total;
}

/* ── Tabs ── */
function buildTabs(){
  var total=SECS.reduce(function(a,s){return a+(D[s]?D[s].length:0);},0);
  var h='<button class="tab t-all on" onclick="showTab(\'all\')">📋 Todos ('+total+')</button>';

  });
  var w=document.getElementById('tabs-wrap');if(w)w.innerHTML=h;
}

    h+='<div class="score-row">';

    h+='<span class="sc ko" id="sc-ko-'+s+'">✗ 0</span>';
