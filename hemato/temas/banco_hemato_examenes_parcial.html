 eso la falsa es la a. <br><small>📌 Cayó en: final 2018.</small>"}, {"n": "31", "noShuffle": false, "img": null, "q": "Es falso respecto a la anemia de células falciformes:", "o": ["Es típico las crisis vasooclusivas que producen isquemia en múltiples órganos.", "Se diagnostica mediante electroforesis de hemoglobinas y el test de falciformacion.", "Tienen una predisposición a las infecciones por gérmenes encapsulados.", "El tratamiento de elección es la esplenectomía."], "c": 4, "e": "La <b>esplenectomía no es el tratamiento de la drepanocitosis</b> (de hecho desarrollan asplenia funcional): se usan hidroxiurea (sube la HbF), transfusión en la anemia aguda, analgesia en las crisis y profilaxis antibiótica. Crisis vasooclusivas, diagnóstico por electroforesis y gérmenes encapsulados son ciertos. <br><small>📌 Cayó en: final 2018.</small>"}, {"n": "32", "noShuffle": false, "img": null, "q": "Paciente de 75 años consulta por astenia. En el hemograma realizado se observa Hb: 9.5 g/dl, VCM: 99 fL, reticulocitos: 25 mil/mm3, leucocitos: 3.0 mil/mm3, neutrófilos: 1.5 mil/mm3, plaquetas: 100.0 mil/mm3. ¿La anemia que presenta el paciente es?:", "o": ["Microcítica regenerativa", "Normocítica arregenerativa", "Macrocítica arregenerativa", "Normocítica regenerativa"], "c": 3, "e": "Con el corte de los apuntes (<b>VCM >97 fL = macrocítica</b>), 99 fL es macrocitosis, y <b>25.000 reticulocitos/mm³ son bajos → arregenerativa</b>. Además hay leucopenia y trombopenia: en un anciano orienta a causa central (megaloblástica, SMD). <i>Depende del corte: tus diapositivas ponen macrocitosis > 97 fL; con el corte clásico (≥ 100) sería normocítica.</i> <br><small>📌 Cayó en: final 2018.</small>"}, {"n": "33", "noShuffle": false, "img": null, "q": "Una mujer de 72 años acude a su médico de Asistencia Primaria refiriendo astenia progresiva, disnea a moderados esfuerzos y cefalea. La analítica realizada muestra una hemoglobina de 9,6 g/dL, VCM 85 fL, sideremia 27 mcg/dL y ferritina de 450 ng/mL. ¿Cuál de estas sospechas diagnósticas es la más probable? Señálela", "o": ["Pérdida de sangre reciente por el aparato digestivo.", "Polimialgia reumática", "Malabsorción intestinal", "Talasemia minor"], "c": 2, "e": "Sideremia baja con <b>ferritina alta (450) = anemia de trastornos crónicos</b>, aquí por una enfermedad inflamatoria (polimialgia reumática). La hemorragia digestiva y la malabsorción darían ferropenia (ferritina baja) y la talasemia minor sería microcítica con hierro normal. <br><small>📌 Cayó en: final 2018.</small>"}, {"n": "34", "noShuffle": false, "img": null, "q": "Las anemias hemolíticas congénitas se clasifican en tres grandes grupos, dependiendo de donde se encuentre la alteración: en la membrana, en las enzimas o en la hemoglobina. En cada una de las respuestas siguientes hay una anemia de cada grupo. De ellas, señale cuál contiene el tipo más frecuente de cada grupo en España", "o": ["Eliptocitosis, déficit de G6P-deshidrogenasa, beta-talasemia minor", "Esferocitosis, déficit de G6P-deshidrogenasa, beta-talasemia minor", "Drepanocitosis, déficit de piruvatoquinasa, alfa-talasemia", "Eliptocitosis, déficit de piruvatoquinasa, beta-talasemia minor"], "c": 2, "e": "Lo más frecuente en España de cada grupo: membrana → <b>esferocitosis hereditaria</b>; enzimas → <b>déficit de G6PD</b>; hemoglobina → <b>β-talasemia minor</b>. La eliptocitosis y el déficit de piruvato quinasa son menos frecuentes, y la drepanocitosis no es una membranopatía. <br><small>📌 Cayó en: final 2018.</small>"}, {"n": "35", "noShuffle": false, "img": null, "q": "Varón de 37 años, con antecedentes de enfermedad de Crohn y resección de íleon terminal hace 5 años, presenta astenia intensa y palidez cutáneo-mucosa. El hemograma muestra 900 leucocitos/mm³ con un recuento diferencial normal, hemoglobina 6,5 g/dL, hematocrito 20%, VCM 135 fL y 80.000 plaquetas/mm³. En la bioquímica destaca LDH 2730 UI/L y bilirrubina 1,7 mg/dL. El recuento de reticulocitos es 1% y en el frotis de sangre periférica se observan abundantes neutrófilos hipersegmentados. ¿Cuál sería su juicio diagnóstico más probable y la actitud terapéutica inicial?", "o": ["Anemia de probable origen inflamatorio. Transfundir concentrado de hematíes.", "Anemia hemolítica. Iniciar corticoides.", "Anemia megaloblástica por déficit de vitamina B12. Iniciar vitamina B12 parenteral y ácido fólico oral.", "Aplasia medular adquirida. Trasplante alogénico directo si dispone de un hermano compatible."], "c": 3, "e": "Resección ileal (sin absorción del complejo B12-FI) + macrocitosis + pancitopenia + LDH muy alta + reticulocitos bajos + <b>neutrófilos hipersegmentados = megaloblástica por déficit de B12</b> → B12 parenteral. Dar fólico junto con la B12 no es problema; lo peligroso es darlo solo. Con reticulocitos bajos no es una hemólisis periférica. <br><small>📌 Cayó en: final 2018.</small>"}, {"n": "36", "noShuffle": true, "img": null, "q": "¿Cuál de las siguientes afirmaciones con respecto a la alfa talasemia es correcta?", "o": ["La hemoglobinopatía H es frecuente en España e Italia", "En la hidropesía fetal las manifestaciones clínicas aparecen a partir de los 4-5 meses de edad", "Todas las formas clínicas de alfa talasemia cursan con anemia \"hemolítica crónica intensa o moderada, con microcitosis (VCM 55-65 fL) ictericia y esplenomegalia.", "Constituye la alteración genética más frecuente en la población mundial"], "c": 4, "e": "La α-talasemia es la <b>alteración monogénica más frecuente en la población mundial</b>. La enfermedad por Hb H es rara en España (más propia del Sudeste asiático), la hidropesía fetal se manifiesta intraútero y los portadores y rasgos no tienen anemia hemolítica intensa. <br><small>📌 Cayó en: final 2018. ⚠️ No sale tal cual en tus apuntes 2026.</small>"}, {"n": "37", "noShuffle": false, "img": null, "q": "En relación con la esferocitosis hereditaria ¿Cuál de las siguientes afirmaciones es correcta?", "o": ["Es una anemia hemolítica congénita de herencia ligada al cromosoma X que ocasiona anemia severa", "Se caracteriza por una disminución de la fragilidad osmótica", "El tratamiento de elección en los casos sintomáticos es la esplenectomía", "Se manifiesta como episodios de anemia aguda medicamentosa"], "c": 3, "e": "En la esferocitosis hereditaria con anemia grave sintomática el tratamiento de elección es la <b>esplenectomía</b> (con vacunación), además de ácido fólico. Es sobre todo autosómica dominante y leve-moderada, tiene la <b>fragilidad osmótica aumentada</b> y las crisis por fármacos son propias del déficit de G6PD. <br><small>📌 Cayó en: final 2018.</small>"}], "insuf": [{"n": "1", "noShuffle": true, "img": null, "q": "Paciente de 18 años que a raíz de un ingreso por pancitopenia se diagnostica de aplasia medular muy grave con alta dependencia transfusional. El paciente tiene 2 hermanos varones de 22 y 25 años ¿Cuál es el tratamiento de elección?", "o": ["En caso de tener un hermano compatible HLA idéntico proceder a trasplante alogénico en primera línea.", "Siempre iniciar terapia inmunosupresora con ciclosporina y globulina antitimocítica y proceder al trasplante de hermano posteriormente.", "Solo se procederá a trasplante alogénico en caso de tener un hermano compatible", "Todas son ciertas."], "c": 1, "e": "Aplasia grave/muy grave en <b>menor de 20 años</b>: de elección, <b>trasplante alogénico</b> de hermano HLA idéntico (si no lo hay, en <20 años vale un donante no emparentado). La inmunosupresión (ATG + ciclosporina) es para quien no tiene donante o es >50 años. Por eso c es falsa. <br><small>📌 Cayó en: parcial 2024.</small>"}, {"n": "2", "noShuffle": false, "img": null, "q": "Hombre de 71 años de edad que presenta analítica con pancitopenia severa sin presencia de células inmaduras y con estudio medular sugestivo de anemia aplásica grave. ¿Cuál sería el abordaje terapéutico fundamental?", "o": ["Tratamiento con metilprednisolona a dosis de 1 g/Kg/día durante 5 días", "Quimioterapia y si respuesta trasplante autólogo de progenitores hematopoyéticos", "Terapia inmunosupresora con ciclosporina e inmunoglobulina antitimocítica.", "Estudio de hermanos y si alguno es HLA compatible, trasplante alogénico de progenitores hematopoyéticos"], "c": 3, "e": "Aplasia grave en <b>mayor de 50 años</b>: tratamiento inmunosupresor con <b>ATG + ciclosporina</b> (el enunciado dice «inmunoglobulina»: es la globulina antitimocítica). El trasplante alogénico de hermano se reserva a ≤50 años; la quimioterapia y el autotrasplante no tienen papel en la aplasia. <br><small>📌 Cayó en: recopilación 1.</small>"}, {"n": "3", "noShuffle": false, "img": null, "q": "Paciente de 38 años de edad que consulta por astenia y orinas oscuras. A la exploración se objetiva una ictericia y la analítica muestra una Hb 6 g/dL (V. normales 13,5-17,5), leucocitos 3200/mm3 (V. normales 4,000 -11,500), plaquetas 87.000/mm3 (V. normales 125.000 -450.000), aumento de reticulocitos y LDH con haptoglobina baja. Los hematíes carecían de proteínas de membrana CD55/CD59 y el estudio molecular muestra alteraciones del gen PIG-A. ¿Cuál le parece el diagnóstico más correcto?", "o": ["Anemia hemolítica por anticuerpos calientes.", "Anemia hemolítica por anticuerpos frios", "Hemoglobinuria paroxística “a frigore”", "Hemoglobinuria paroxística nocturna"], "c": 4, "e": "Pancitopenia + hemólisis (reticulocitos y LDH altos, haptoglobina baja) + <b>ausencia de CD55/CD59 y mutación de PIG-A</b> = <b>hemoglobinuria paroxística nocturna</b>: sin anclaje GPI los hematíes quedan expuestos al complemento. Las autoinmunes darían Coombs positivo y no explican la pancitopenia ni el PIG-A. <br><small>📌 Cayó en: recopilación 1.</small>"}, {"n": "4", "noShuffle": false, "img": null, "q": "La hemoglobinuria paroxística nocturna cursa con las siguientes manifestaciones clínicas, excepto:", "o": ["Deterioro de función renal", "Malformaciones óseas (cráneo en cepillo)", "Anemia aplásica, hasta 25%", "Fenómenos tromboembólicos"], "c": 2, "e": "El <b>cráneo en cepillo</b> es una deformidad ósea por expansión medular de las <b>talasemias</b> (y otras hemolíticas congénitas graves), no de la HPN. La HPN (PIG-A → sin CD55/CD59) da hemólisis intravascular, <b>trombosis</b> en territorios atípicos y daño renal, y se asocia a <b>aplasia medular</b>. <br><small>📌 Cayó en: ordinaria 2024.</small>"}, {"n": "5", "noShuffle": false, "img": null, "q": "En relación con la hemoglobinuria paroxística nocturna, ¿Cuál de las siguientes afirmaciones es falsa?", "o": ["Se acompaña de un aumento de la frecuencia de trombosis venosas", "Es un defecto adquirido", "Presenta a menudo leucopenia y trombopenia", "Cursa con un aumento de la resistencia del hematíe a la lisis por el complemento"], "c": 4, "e": "En la HPN, la falta de CD55/CD59 (sin anclaje GPI) hace al hematíe <b>más sensible, no más resistente, a la lisis por complemento</b>. Es adquirida (mutación somática de PIG-A), produce trombosis venosas y a menudo leucopenia y trombopenia por el fallo medular de base. <br><small>📌 Cayó en: recopilación 1.</small>"}, {"n": "6", "noShuffle": false, "img": null, "q": "Nos consultan por lactante de 3 meses de edad con antecedente de diarrea en la semana previa. Presenta palidez a la exploración. En la analítica destaca una hemoglobina de 8 g/dL, plaquetas bajas (50.000/mm3) y niveles altos de bilirrubina, potasio y urea. En el examen microscópico de sangre periférica se encuentran esquistocitos. ¿qué diagnóstico es más probable?", "o": ["Coagulación Intravascular Diseminada", "Síndrome Hemolítico Urémico", "Leucemia aguda secundaria a Sd 5q-", "Anemia Aplásica"], "c": 2, "e": "Lactante con diarrea previa y anemia hemolítica con <b>esquistocitos, trombopenia e insuficiencia renal (urea y potasio altos) = síndrome hemolítico urémico típico</b> (E. coli productor de toxina Shiga). La CID cursaría con coagulopatía de consumo y la aplasia no produce hemólisis ni esquistocitos. <br><small>📌 Cayó en: recopilación 1.</small>"}, {"n": "7", "noShuffle": false, "img": null, "q": "Paciente de 28 años, sin antecedentes de haber recibido quimioterapia ni radioterapia previamente, consulta por presentar en el hemograma 1.300 leucocitos/mm3 (V. normales 4,000 -11,500), Hb 7 g/dl (V. normales 13,5-17,5) y plaquetas 25.000/mm3 (V. normales 125.000 -450.000) sin blastos en sangre periférica y con aspirado de médula ósea muy hipocelular. Señale qué prueba de confirmación está indicada y cuál es el diagnóstico más probable:", "o": ["Estudio citogenético para descartar la invasión medular por células linfomatosas", "Biopsia de médula ósea y aplasia medular", "Estudio citoquímico para descartar una leucemia aguda", "Estudio HLA para descartar la presencia de una leucemia pauciblastica"], "c": 2, "e": "Pancitopenia sin blastos y aspirado muy hipocelular en un joven sin QT ni RT previas: se confirma con <b>biopsia de médula ósea (celularidad <25 %, grasa >75 %) = aplasia medular</b>. El aspirado no valora bien la celularidad; el HLA se pide después, pensando en el trasplante, no para diagnosticar. <br><small>📌 Cayó en: recopilación 1.</small>"}, {"n": "8", "noShuffle": true, "img": null, "q": "Paciente joven con pancitopenia de nueva aparición. ¿Qué estudio inicial está indicado?", "o": ["Frotis de sangre periférica y estudio de médula ósea", "Iniciar G-CSF y eritropoyetina y repetir el hemograma en un mes, sin más estudios", "Serologías víricas, estudio de autoinmunidad y de factores carenciales (hierro, B12, ácido fólico)", "a y c son correctas"], "c": 4, "e": "Ante una pancitopenia nueva en un joven hay que hacer las dos cosas: <b>frotis y estudio medular</b> (descartar SMD o leucemia, valorar la celularidad) <b>y buscar causas secundarias</b> (serologías, autoinmunidad, B12, fólico, hierro), porque la aplasia es un diagnóstico de exclusión. No se dan G-CSF ni EPO a ciegas. <br><small>📌 Cayó en: final 2025. Enunciado reconstruido (del final 2025 solo se conserva un resumen).</small>"}, {"n": "9", "noShuffle": false, "img": null, "q": "Paciente de 65 años que en analítica de rutina se observa pancitopenia: Hb: 6 g/dl, Leucocitos: 500/µL, plaquetas: 5.000/µL, ¿Cuál cree que es el diagnóstico menos probable?:", "o": ["Anemia megaloblástica por déficit de ácido fólico", "Aplasia medular", "Leucemia linfática crónica B", "Leucemia mieloide aguda"], "c": 3, "e": "Con 500 leucocitos/µL la <b>LLC-B es la menos probable</b>: suele cursar con leucocitosis por linfocitosis y solo da citopenias en fases avanzadas. El déficit de fólico (megaloblástica), la aplasia medular y la LMA (médula ocupada por blastos) explican una pancitopenia grave. <br><small>📌 Cayó en: final 2022. ⚠️ No sale tal cual en tus apuntes 2026.</small>"}, {"n": "10", "noShuffle": false, "img": null, "q": "Señale la afirmación INCORRECTA con relación a las infecciones en el paciente oncológico:", "o": ["Se define neutropenia febril grado IV en aquellos casos en los que se observa un recuento de neutrófilos < 500 con temperatura corporal > 38,5 ºC.", "La etiología más frecuente es la bacteriana (microorganismos gram positivos).", "Aquellas infecciones que se prolongan durante más de 7 días a pesar del tratamiento antibiótico debe sospecharse sobreinfección por hongos.", "Debe utilizarse siempre tratamiento antibiótico en monoterapia."], "c": 4, "e": "En la neutropenia febril <b>no siempre se usa monoterapia</b>: se adapta al riesgo, al foco y a las resistencias (asociaciones si hay inestabilidad, sospecha de Gram positivos o multirresistentes). Lo constante es cubrir gramnegativos, incluida Pseudomonas. La fiebre que persiste más de una semana con antibiótico orienta a hongos. <br><small>📌 Cayó en: final 2022. ⚠️ No sale tal cual en tus apuntes 2026.</small>"}, {"n": "11", "noShuffle": false, "img": null, "q": "Respecto a un paciente de 56 años que es diagnosticado de hemoglobinuria paroxística nocturna, ¿cuál de las siguientes afirmaciones es falsa?", "o": ["El paciente puede debutar con un cuadro de aplasia medular", "Para confirmar el diagnóstico se utiliza la citometría de flujo", "Este paciente tiene un riesgo incrementado para sufrir segundas neoplasias, siendo las mas frecuentes los tumores gastrointestinales y SNC", "Se trata de una enfermedad rara, que acorta la supervivencia media de este paciente"], "c": 3, "e": "La HPN se relaciona con <b>aplasia medular, SMD y leucemia aguda</b>, no con más tumores sólidos digestivos o del SNC. Es cierto que puede debutar como aplasia, que se confirma por citometría de flujo (CD55/CD59) y que es una enfermedad rara que acorta la supervivencia. <br><small>📌 Cayó en: final 2022. ⚠️ No sale tal cual en tus apuntes 2026.</small>"}, {"n": "12", "noShuffle": false, "img": null, "q": "Respecto a la etiología de la aplasia medular, señale la respuesta incorrecta:", "o": ["En una minoría de casos se desconoce la causa", "Entre las causas secundarias se encuentra la exposición a radiaciones ionizantes", "Se asocia a agentes químicos como los derivados del benceno", "Los virus como el VIH o VEB también se han asociado con la aparición de aplasia medular"], "c": 1, "e": "En la aplasia medular adquirida la <b>mayoría de los casos son idiopáticos</b> (mecanismo inmune), no una minoría. Las radiaciones ionizantes, el benceno y algunos virus (VIH, VEB, hepatitis, parvovirus B19) son causas secundarias reconocidas. <br><small>📌 Cayó en: final 2022. ⚠️ No sale tal cual en tus apuntes 2026.</small>"}, {"n": "13", "noShuffle": false, "img": null, "q": "En la clasificación de anemias hemolíticas se consideran anemias extracorpusculares, excepto:", "o": ["Anemia hemolítica microangiopática", "Hemoglobinuria paroxística nocturna", "Infección por Clostridium", "Hemolisis por mordedura de serpiente"], "c": 2, "e": "La <b>HPN es una hemólisis intracorpuscular</b> (defecto de membrana del hematíe por falta de anclaje GPI) aunque sea adquirida: es la excepción a «adquirida = extracorpuscular». Microangiopatía, Clostridium y veneno de serpiente son agentes externos al hematíe. <br><small>📌 Cayó en: ordinaria 2024. ⚠️ No sale tal cual en tus apuntes 2026.</small>"}, {"n": "14", "noShuffle": false, "img": null, "q": "Señale la asociación falsa:", "o": ["Anemia hemolítica por anticuerpos calientes: idiopática", "Anemia hemolítica por anticuerpos fríos: mycoplasma pneumoniae", "Anemia hemolítica a frigore: sífilis", "Hemoglobinuria paroxística nocturna: herencia autosómica dominante"], "c": 4, "e": "La <b>HPN es adquirida</b> (mutación somática de PIG-A en la célula madre), no hereditaria. AHAI caliente mayoritariamente idiopática, fría asociada a Mycoplasma y a frigore (Donath-Landsteiner) asociada a sífilis son asociaciones clásicas. <br><small>📌 Cayó en: ordinaria 2024.</small>"}, {"n": "15", "noShuffle": false, "img": null, "q": "No es un criterio diagnóstico de aplasia medular:", "o": ["Presencia de citopenias (≥ 2): Hb < 10 g/dl, Neutrófilos < 1.500/mm3, Plaquetas < 50.000/mm3.", "Médula ósea hipocelular: < 25%", "Presencia de fibrosis medular", "Ausencia de mielodisplasia"], "c": 3, "e": "La <b>fibrosis medular no es criterio de aplasia</b>: orienta a mielofibrosis u otra neoplasia. La aplasia exige citopenias (al menos 2 de: Hb <10, neutrófilos <1.500, plaquetas <50.000), médula hipocelular (<25 %, grasa) y ausencia de displasia y de blastos. <br><small>📌 Cayó en: ordinaria 2024.</small>"}, {"n": "16", "noShuffle": false, "img": null, "q": "¿Cuál es la reacción adversa frecuentemente en el tratamiento con heparina?", "o": ["Leucopenia", "Agranulocitosis", "Trombocitopenia", "Anemia aplásica"], "c": 3, "e": "La reacción adversa hematológica típica de la heparina es la <b>trombocitopenia inducida por heparina (HIT)</b>, por anticuerpos IgG anti-heparina-PF4 a los 5-10 días, y paradójicamente produce trombosis. Leucopenia, agranulocitosis y aplasia no son efectos característicos. <br><small>📌 Cayó en: ordinaria 2024.</small>"}, {"n": "17", "noShuffle": false, "img": null, "q": "En la insuficiencia medular global, no esperaría encontrar:", "o": ["Astenia y palidez cutánea", "Infecciones y aftas bucales", "Hemorragias cutáneo-mucosas", "Sudoración y pérdida de peso"], "c": 4, "e": "La insuficiencia medular global da anemia (astenia, palidez), neutropenia (infecciones, aftas) y trombopenia (hemorragias cutáneo-mucosas). <b>Sudoración y pérdida de peso son síntomas constitucionales</b>, propios de neoplasias como linfomas o NMP, no de la aplasia. <br><small>📌 Cayó en: final 2018.</small>"}, {"n": "18", "noShuffle": false, "img": null, "q": "¿Cuál de los siguientes síntomas/signos sería característico de una aplasia medular?", "o": ["Sd anémico", "Sd constitucional", "Dolor óseo", "Esplenomegalia"], "c": 1, "e": "La aplasia medular produce <b>síndrome anémico</b> (junto con infecciones y hemorragias). No da síndrome constitucional, dolor óseo ni esplenomegalia: la médula está vacía, no infiltrada; si aparecen, piensa en leucemia, linfoma o NMP. <br><small>📌 Cayó en: final 2018c.</small>"}, {"n": "19", "noShuffle": false, "img": null, "q": "Señale cuál de los siguientes anticuerpos monoclonales es eficaz en el tratamiento de la hemoglobinuria paroxística nocturna:", "o": ["Rituximab", "Alemtuzumab", "Ofatumumab", "Eculizumab"], "c": 4, "e": "El <b>eculizumab</b> (como el ravulizumab) es un anticuerpo anti-C5: bloquea el complemento terminal y frena la hemólisis y las trombosis de la HPN. Rituximab y ofatumumab son anti-CD20 y alemtuzumab es anti-CD52. <br><small>📌 Cayó en: final 2018.</small>"}], "trombo": [{"n": "1", "noShuffle": false, "img": null, "q": "El objetivo del tratamiento anticoagulante de la trombosis venosa profunda NO es:", "o": ["Recanalizar la vena afectada", "Disminuir el fenómeno postflebítico", "Prevenir la progresión del trombo", "Prevenir la embolia de pulmón"], "c": 1, "e": "La anticoagulación <b>no disuelve el trombo</b> (no recanaliza): eso lo hacen la fibrinólisis endógena o la trombólisis. Sus objetivos son <b>evitar la progresión</b> del trombo, la <b>embolia pulmonar</b> y la recurrencia, y reducir el síndrome postrombótico. <br><small>📌 Cayó en: ordinaria 2024. ⚠️ No sale tal cual en tus apuntes 2026.</small>"}, {"n": "2", "noShuffle": false, "img": null, "q": "Una paciente de 60 años, en tratamiento con heparina no fraccionada en perfusión intravenosa por tromboembolismo pulmonar múltiple, con buena evolución hemodinámica y respiratoria, presenta al octavo día de tratamiento una disminución de la cifra de plaquetas. Se confirma además la presencia de anticuerpos IgG contra el complejo heparina-factor 4 plaquetario. ¿Cuál es el tratamiento más adecuado?", "o": ["Reducir la dosis de heparina", "Cambiar a una heparina de bajo peso molecular", "Cambiar a fondaparinux", "Nada, hasta que no se complique la situación"], "c": 3, "e": "Trombopenia al 8.º día de HNF + anticuerpos anti-heparina-PF4 = <b>HIT</b>: suspender <b>toda heparina</b> (también la HBPM, por reactividad cruzada) y anticoagular con argatrobán o <b>fondaparinux</b>, un pentasacárido anti-Xa sin reactividad cruzada relevante con los anticuerpos de la HIT. La HIT trombosa: no se reduce dosis ni se espera. <br><small>📌 Cayó en: ordinaria 2024. ⚠️ No sale tal cual en tus apuntes 2026.</small>"}, {"n": "3", "noShuffle": true, "img": null, "q": "Un varón de 32 años sin ningún antecedente de importancia que desarrolla una trombosis portal, niega episodios trombóticos previos, refiere que padre y hermano presentaron también episodios trombóticos. De los siguientes enunciados, ¿Cuál o cuáles son los enunciados correctos?", "o": ["Se debe descartar trombofilia primaria", "Una etiología probable es la Deficiencia de Proteína C", "La Mutación de Factor V de Leyden es la trombofilia hereditaria más infrecuente", "a y b son correctos"], "c": 4, "e": "Trombosis en <b>localización inusual (portal)</b>, en un joven y con <b>historia familiar</b> → hay que descartar trombofilia hereditaria, y el déficit de proteína C es una causa posible: a y b son ciertas. La c es falsa: el <b>factor V Leiden es la trombofilia hereditaria más frecuente</b> en caucásicos. <br><small>📌 Cayó en: ordinaria 2024.</small>"}, {"n": "4", "noShuffle": false, "img": null, "q": "En relación con las heparinas es falsa una de las siguientes afirmaciones", "o": ["El fondaparinux es útil en el manejo de la trombocitopenia inducida por heparina", "El sulfato de protamina es menos eficaz para neutralizar el efecto de las heparinas de bajo peso molecular que el de la heparina no fraccionada", "La trombocitopenia inmune aparece tras 5-10 días de tratamiento con heparina", "Las heparinas de bajo peso molecular no precisan control analítico en ningún paciente"], "c": 4, "e": "Falsa la d: las HBPM no necesitan control <b>rutinario</b>, pero sí <b>niveles anti-Xa</b> en insuficiencia renal, embarazo y pesos extremos. Ciertas: la protamina neutraliza peor la HBPM; la HIT aparece a los 5-10 días; el fondaparinux se acepta como alternativa en la HIT, aunque los apuntes citan argatrobán. <br><small>📌 Cayó en: recopilación 1.</small>"}, {"n": "5", "noShuffle": false, "img": null, "q": "Diga en qué valores debe mantenerse el INR para que se considere eficaz la anticoagulación en pacientes con fibrilación auricular no valvular:", "o": ["<1", "1-2", "2-3", ">3"], "c": 3, "e": "En la fibrilación auricular no valvular con AVK el objetivo es <b>INR 2-3</b> (normal ≤ 1,1). Por debajo de 2 no protege del ictus y por encima de 3 aumenta el sangrado. El rango 2,5-3,5 se reserva para válvula mecánica mitral y SAF. <br><small>📌 Cayó en: recopilación 1.</small>"}, {"n": "6", "noShuffle": false, "img": null, "q": "En la infección por Coronavirus SARS-CoV-2 es cierta la siguiente opción:", "o": ["Es frecuente observar un alargamiento del TTPA junto con un aumento de dímeros D y trombopenia, además el desarrollo de fenómenos trombóticos se ha asociado a estancia en unidades de cuidados críticos y dímero D elevado.", "Los pacientes muestran un estado de hipercoagulabilidad que no se asocia clínicamente a un aumento de patología trombótica", "El desarrollo de fenómenos trombóticos se ha asociado a estancia en unidades de cuidados críticos y dímero D elevado.", "Es frecuente observar un alargamiento del TTPA junto con un aumento de dímeros D y trombopenia."], "c": 1, "e": "La COVID-19 grave produce <b>hipercoagulabilidad con más trombosis</b>, sobre todo en UCI y con <b>dímero D elevado</b>. Son frecuentes el aumento del dímero D y una trombopenia leve, y puede alargarse el TTPa (a menudo por anticoagulante lúpico). La a reúne c y d; la b es falsa porque sí hay más trombosis. <br><small>📌 Cayó en: recopilación 1. ⚠️ No sale tal cual en tus apuntes 2026.</small>"}, {"n": "7", "noShuffle": false, "img": null, "q": "Los anticoagulantes orales que son antagonistas de la vitamina K no alteran la síntesis de:", "o": ["Proteína C", "Fibrinógeno", "Factor VII", "Factor IX"], "c": 2, "e": "Los AVK impiden la γ-carboxilación de los factores <b>II, VII, IX y X</b> y de las <b>proteínas C y S</b>. El <b>fibrinógeno</b> (factor I) no depende de la vitamina K, así que su síntesis no se altera. <br><small>📌 Cayó en: recopilación 1.</small>"}, {"n": "8", "noShuffle": false, "img": null, "q": "¿Cuál es el tratamiento de elección de la púrpura trombocitopénica trombótica?", "o": ["Antifibrinolíticos", "Anticoagulantes", "Plasmaféresis con recambio plasmático", "Antibióticos"], "c": 3, "e": "La PTT (déficit de ADAMTS-13 por autoanticuerpos) es una urgencia: sin tratamiento, mortalidad ~90 %. Elección: <b>plasmaféresis con recambio plasmático</b> (retira el anticuerpo y repone ADAMTS-13), con corticoides y caplacizumab. Ni anticoagulantes ni antifibrinolíticos, y no se transfunden plaquetas. <br><small>📌 Cayó en: recopilación 1.</small>"}, {"n": "9", "noShuffle": false, "img": null, "q": "¿Cuál es el fármaco de elección en la profilaxis y el tratamiento de la enfermedad tromboembólica venosa asociada al cáncer?", "o": ["Antagonistas de la vitamina K (acenocumarol)", "Heparina de bajo peso molecular (enoxaparina, tinzaparina)", "Heparina no fraccionada intravenosa", "Ácido acetilsalicílico"], "c": 2, "e": "En la ETV asociada al cáncer se prefiere la <b>HBPM</b> (enoxaparina, tinzaparina; más eficaz que los AVK). Los apuntes 2026 sitúan al mismo nivel los <b>ACOD anti-Xa</b> (apixabán, edoxabán, rivaroxabán); los AVK quedan como 3.ª opción. La aspirina no trata la ETV y la HNF IV se reserva para casos concretos (p. ej., ERC grave). <br><small>📌 Cayó en: final 2025. Enunciado reconstruido (del final 2025 solo se conserva un resumen).</small>"}, {"n": "10", "noShuffle": false, "img": null, "q": "¿En cuál de los siguientes pacientes NO está indicada la profilaxis sistemática de la enfermedad tromboembólica venosa?", "o": ["Paciente oncológico hospitalizado por un proceso médico agudo", "Paciente oncológico sometido a cirugía mayor", "Paciente oncológico portador de un catéter venoso central (Port-A-Cath)", "Paciente oncológico ambulatorio en quimioterapia con alto riesgo trombótico (escala de Khorana ≥ 2)"], "c": 3, "e": "No se recomienda profilaxis rutinaria por llevar un <b>catéter venoso central</b> (Port-A-Cath). Sí está indicada en el oncológico <b>hospitalizado</b> por un proceso agudo y en la <b>cirugía mayor</b>, y puede ofrecerse al ambulatorio en QT con <b>Khorana ≥ 2</b> (apixabán, rivaroxabán o HBPM). <i>Fuera de tus apuntes: las guías dicen que en ambulatorios con Khorana ≥ 2 la profilaxis «puede ofrecerse».</i> <br><small>📌 Cayó en: final 2025. ⚠️ No sale tal cual en tus apuntes 2026. Enunciado reconstruido (del final 2025 solo se conserva un resumen).</small>"}, {"n": "11", "noShuffle": false, "img": null, "q": "¿Cuál es el tratamiento inicial de la TVP actualmente más extendido?", "o": ["Anticoagulantes orales exclusivamente", "Heparina endovenosa o subcutánea más anticoagulantes orales", "Antiagregación con aspirina", "Vendas elásticas y drenaje postural"], "c": 2, "e": "Esquema clásico y más extendido: <b>heparina</b> (HBPM SC o HNF IV) 5-10 días <b>solapada con anticoagulante oral</b> hasta INR 2-3. Ojo: con <b>apixabán o rivaroxabán</b> la monoterapia oral desde el inicio también es válida (apuntes 2026). Ni la aspirina ni las medidas físicas tratan la TVP. <br><small>📌 Cayó en: ordinaria 2024.</small>"}, {"n": "12", "noShuffle": false, "img": null, "q": "Paciente de 50 años en tratamiento anticoagulante con dicumarínicos, ¿Cuál de las siguientes pruebas pediría para medir la actividad de anticoagulante?", "o": ["Tiempo de ecarina", "INR", "TTPA", "Fibrinógeno"], "c": 2, "e": "Los dicumarínicos (acenocumarol, warfarina) se monitorizan con el <b>INR</b> (TP estandarizado), porque deprimen el factor VII, que explora el TP. El TTPa controla la HNF y el tiempo de ecarina sirve para los inhibidores directos de trombina (dabigatrán). <br><small>📌 Cayó en: ordinaria 2024.</small>"}, {"n": "13", "noShuffle": false, "img": null, "q": "La actividad biológica de heparina depende principalmente de:", "o": ["Antitrombina III", "Fibrinógeno", "Complejo Proteína C activada- FXIII", "Colágeno"], "c": 1, "e": "La heparina actúa de forma indirecta: se une a la <b>antitrombina III</b> y potencia su capacidad de inhibir trombina (IIa) y Xa. Por eso el <b>déficit de antitrombina</b> causa resistencia a la heparina. <br><small>📌 Cayó en: ordinaria 2024.</small>"}, {"n": "14", "noShuffle": false, "img": null, "q": "Uno de los factores de la coagulación sanguínea, dependiente de la vitamina K, es", "o": ["XI", "V", "X", "VIII"], "c": 3, "e": "Factores dependientes de la vitamina K: <b>II, VII, IX y X</b> (más proteínas C y S). El <b>X</b> es el único de la lista; V, VIII y XI no requieren γ-carboxilación. <br><small>📌 Cayó en: ordinaria 2024.</small>"}, {"n": "15", "noShuffle": false, "img": null, "q": "Un paciente de 65 años padece de fibrilación auricular crónica, con historia de embolia cerebral un año antes. Esta anticoagulado con acenocumarol oral. ¿Qué actitud, entre las siguientes, es la más adecuada?", "o": ["Mantener el cociente internacional normalizado (INR) entre 2 y 3", "Mantener el INR entre 3 y 4, y añadir 200mg de aspirina al día", "Mantener el INR entre 4 y 5", "Suprimir la anticoagulación y administrar 300mg de aspirina oral al día"], "c": 1, "e": "FA con ictus embólico previo anticoagulada con AVK: <b>INR 2-3</b>. Rangos más altos (3-4, 4-5) aumentan el sangrado sin más beneficio, y añadir aspirina o sustituir la anticoagulación por ella no está indicado: la aspirina no previene eficazmente el ictus cardioembólico. <br><small>📌 Cayó en: ordinaria 2024.</small>"}, {"n": "16", "noShuffle": false, "img": null, "q": "Con respecto a la trombofilia indique la respuesta CORRECTA:", "o": ["Se trata de una predisposición al tromboembolismo con presencia de marcador genético hasta en el 80% de los casos.", "El embarazo y la toma de anticonceptivos aumentan el riesgo de trombosis en pacientes con trombofilia", "El trastorno con mayor riesgo relativo de trombosis es la mutación de la protrombina", "No se han descrito casos de deficiencia de proteína C de adquiridos"], "c": 2, "e": "Cierta la b: <b>embarazo y anticonceptivos</b> suman riesgo a la trombofilia (la trombosis suele necesitar un desencadenante). Falsas: un 80 % de marcador genético es exagerado (en muchos pacientes no se identifica); el mayor riesgo relativo lo da el <b>déficit de antitrombina</b>, no la mutación de la protrombina; y existe déficit <b>adquirido</b> de proteína C (hepatopatía, warfarina, CID). <br><small>📌 Cayó en: final 2018.</small>"}, {"n": "17", "noShuffle": false, "img": null, "q": "El factor V Leiden es un factor de riesgo trombótico consecuencia de:", "o": ["Deficiencia asociada de antitrombina III", "Disfunción asociada de fibrinógeno", "Resistencia a la proteína C", "Hiperhomocisteinemia"], "c": 3, "e": "El <b>factor V Leiden</b> (mutación puntual del gen del FV) hace que el FVa sea <b>resistente a la inactivación por la proteína C activada</b>. Es la trombofilia hereditaria más frecuente en caucásicos. No implica déficit de antitrombina, disfibrinogenemia ni hiperhomocisteinemia. <br><small>📌 Cayó en: final 2018.</small>"}, {"n": "18", "noShuffle": false, "img": null, "q": "Dentro de las causas más frecuentes de trombofilia adquirida se encuentra:", "o": ["El síndrome antifosfolípido", "La hemoglobinuria paroxística nocturna", "La policitemia vera", "El síndrome nefrótico"], "c": 1, "e": "El <b>síndrome antifosfolípido</b> es la causa adquirida más frecuente de trombofilia (trombosis venosa y arterial, abortos). HPN, policitemia vera y síndrome nefrótico también son estados protrombóticos adquiridos, pero mucho menos frecuentes. <br><small>📌 Cayó en: final 2018.</small>"}], "gen": [{"n": "1", "noShuffle": false, "img": null, "q": "Señale la afirmación correcta en relación con el proceso de carcinogénesis", "o": ["Las células tumorales adquieren durante el proceso de carcinogénesis la capacidad de proliferar de forma descontrolada, así como de desplazarse sobre el tejido de origen hacia otros tejidos y órganos.", "Es un proceso con dos etapas que implican cambios dinámicos en el genoma celular.", "Las células tumorales adquieren características que las asemejan a las células sanas que les confieren una ventaja proliferativa.", "Los mecanismos moleculares que desencadenan la proliferación incontrolada de las células tumorales se pueden agrupar en dos grandes grupos: la activación de genes antiproliferativos (genes supresores) o la inactivación de genes proliferativos (oncogenes)."], "c": 1, "e": "Correcta la a: proliferación descontrolada e <b>invasión/metástasis</b> definen al cáncer. Falsas: la carcinogénesis tiene <b>varias etapas</b> (iniciación, promoción, progresión), no dos; las células tumorales se <b>diferencian</b> de las sanas; y el mecanismo es activación de oncogenes e inactivación de supresores (la d lo dice al revés). <br><small>📌 Cayó en: parcial 2024.</small>"}, {"n": "2", "noShuffle": false, "img": null, "q": "Señale la afirmación incorrecta en relación con los oncogenes", "o": ["Es un gen que codifica una proteína con capacidad para estimular la proliferación tumoral.", "Cuando estos genes sufren una inhibición anormal dan lugar a la proliferación descontrolada.", "Generalmente precisan para ser inactivados alteraciones moleculares en forma de mutaciones puntuales monoalélicas", "P53 es el oncogén más frecuente en los cánceres humanos."], "c": 4, "e": "<b>p53 es un gen supresor</b>, no un oncogén: la d es falsa. Pregunta defectuosa: la b también es falsa (los oncogenes causan proliferación por <b>activación</b>, no por inhibición) y la c está mal redactada (se activan con una alteración monoalélica, no se «inactivan»). Se elige d como la más probable; impugnable. <br><small>📌 Cayó en: parcial 2024.</small>"}, {"n": "3", "noShuffle": false, "img": null, "q": "Señale la afirmación falsa en relación con los genes supresores de tumores", "o": ["El gen del Retinoblastoma Rb1 regula la progresión de las células de la fase G1 del ciclo celular a la fase S", "Las mutaciones de los genes BRCA-1 y BRCA-2 son responsables de hasta el 80% de los casos de cáncer de mama hereditario y familiar.", "Los genes codificantes de Receptores de factor de crecimiento como EGFR o RET son los genes supresores de tumores más frecuentemente involucrados en la carcinogénesis", "El gen APC se encuentra mutado en el 70-80% de los cánceres de colon esporádicos"], "c": 3, "e": "Falsa la c: <b>EGFR y RET son oncogenes</b> (receptores de factores de crecimiento que estimulan la proliferación), no supresores. Ciertas: Rb controla el paso G1→S; BRCA1 (≈45 %) + BRCA2 (≈35 %) explican hasta el 80 % del cáncer de mama familiar; APC está mutado en la mayoría de CCR esporádicos. <br><small>📌 Cayó en: parcial 2024, parcial 2023, final 2022, final 2020, recopilación 1.</small>"}, {"n": "4", "noShuffle": true, "img": null, "q": "Existen al menos 10 características o alteraciones de la fisiología celular que son compartidas por todos los tipos celulares tumorales. Respecto a estas características moleculares del cáncer, señale la afirmación CORRECTA.", "o": ["Las células tumorales son sensibles a las señales inhibidoras del crecimiento", "Las células tumorales poseen un potencial de replicación limitado", "Las células tumorales adquieren la capacidad para generar nuevos vasos sanguíneos en un fenómeno conocido como angiogénesis sostenida", "Todas las anteriores son correctas."], "c": 3, "e": "Rasgo del cáncer: <b>angiogénesis sostenida</b> (VEGF). Las otras son al revés: las células tumorales son <b>insensibles</b> a las señales inhibidoras y tienen <b>potencial replicativo ilimitado</b> (telomerasa, hTERT); por tanto, d es falsa. Ojo: en el parcial 2024 el enunciado pedía la «incorrecta» (a, b y d falsas): defectuosa; la buscada es c. <br><small>📌 Cayó en: parcial 2024, final 2022, ordinaria 2024, recopilación 1.</small>"}, {"n": "5", "noShuffle": false, "img": null, "q": "Señale la afirmación FALSA en relación con el proceso de Carcinogénesis.", "o": ["Las células tumorales adquieren durante el proceso de carcinogénesis la capacidad de proliferar de forma descontrolada, así como de desplazarse sobre el tejido de origen hacia otros tejidos y órganos.", "Es un proceso con varias etapas que implican cambios dinámicos en el genoma celular.", "Las células tumorales adquieren características que las diferencian respecto a las células normales y les confieren una ventaja proliferativa.", "Los mecanismos moleculares que desencadenan la proliferación incontrolada de las células tumorales se pueden agrupar en dos grandes grupos: la activación de genes antiproliferativos (genes supresores) o la inactivación de genes proliferativos (oncogenes)."], "c": 4, "e": "Falsa la d: lo invierte. La proliferación descontrolada se debe a la <b>activación de oncogenes</b> (proliferativos) y la <b>inactivación de genes supresores</b> (antiproliferativos). <i>(Errata del original corregida en la c: decía «respecto a las células tumorales».)</i> <br><small>📌 Cayó en: parcial 2023, final 2022, recopilación 1, final 2020.</small>"}, {"n": "6", "noShuffle": false, "img": null, "q": "Señale la afirmación CORRECTA en relación con los Oncogenes.", "o": ["Es un gen que codifica una proteína con capacidad para estimular la proliferación tumoral", "Cuando estos genes sufren una inhibición anormal dan lugar a la proliferación descontrolada.", "Generalmente precisan para ser inactivados alteraciones bialélicas en forma de mutaciones puntuales combinadas con deleciones o hipermetilación de los promotores encargados de su transcripción.", "P53 es oncogén más frecuente en los cánceres humanos"], "c": 1, "e": "Un oncogén codifica una proteína que <b>estimula la proliferación</b> (versión alterada del protooncogén). Falsas: actúa por <b>activación</b>, no por inhibición; las alteraciones bialélicas (mutación + deleción o hipermetilación) describen a los <b>supresores</b>; y p53 es supresor, no oncogén. <br><small>📌 Cayó en: parcial 2023, final 2022, recopilación 1, final 2020.</small>"}, {"n": "7", "noShuffle": true, "img": null, "q": "En relación con la quimioterapia señale la afirmación CORRECTA", "o": ["El término quimioterapia se reserva para los fármacos empleados en el tratamiento de las enfermedades neoplásicas y que se administran por vía intravenosa", "La inhibición del crecimiento celular por parte de todos los fármacos quimioterápicos tiene lugar interrumpiendo la organización citoplasmática.", "La quimioterapia se distribuye de forma sistémica y actúa en todas las zonas del organismo, pudiendo destruir células malignas situadas a distancia del tumor primario", "La administración de quimioterapia se reserva para pacientes con enfermedad avanzada, no subsidiarios de tratamientos curativos con intención radical (Cirugía o Radioterapia)."], "c": 3, "e": "La QT es un <b>tratamiento sistémico</b>: alcanza todo el organismo y destruye células a distancia (micrometástasis). Falsas: también hay QT oral; no todos actúan sobre la organización citoplasmática (hay 4 niveles de acción); y se usa también con intención curativa (adyuvante, neoadyuvante, concomitante). <br><small>📌 Cayó en: parcial 2023, final 2022, recopilación 1, final 2020.</small>"}, {"n": "8", "noShuffle": false, "img": null, "q": "Señale la afirmación FALSA en relación con la Intención de Tratamiento.", "o": ["La quimioterapia adyuvante: consiste en la administración de quimioterapia después de un tratamiento principal como la cirugía para disminuir el riesgo de recidivas locales y de diseminación a distancia. Dada su escasa eficacia y elevada toxicidad su uso se ha abandonado en la última década.", "La quimioterapia de inducción o conversión se administra con la intención de reducir la cantidad de enfermedad para lograr convertir en operable un tumor que inicialmente no lo era.", "La quimioterapia neoadyuvante se indica antes de un tratamiento quirúrgico o de radioterapia y uno de sus objetivos es evaluar la efectividad in vivo del tratamiento.", "La administración de quimioterapia y radioterapia de forma concomitante aumenta el efecto local de la radioterapia y se administra con intención radical en algunas indicaciones como los Carcinomas de Cabeza y Cuello."], "c": 1, "e": "Falsa la a: la <b>QT adyuvante</b> (tras la cirugía, contra la enfermedad micrometastásica) sigue siendo un estándar; no se ha abandonado. Ciertas: la de inducción/conversión busca hacer operable un tumor; la neoadyuvante permite ver la respuesta in vivo; y la concomitante potencia la RT (p. ej., cabeza y cuello). <br><small>📌 Cayó en: parcial 2023, final 2022, recopilación 1, final 2020.</small>"}, {"n": "9", "noShuffle": false, "img": null, "q": "En relación con las Terapias Dirigidas, indique cual de las siguientes afirmaciones es CORRECTA", "o": ["Se incluyen en este grupo de fármacos aquellos medicamentos que dentro del tratamiento sistémico del cáncer, disponen de un mecanismo de acción diseñado para bloquear de forma específica algún aspecto concreto de la biología celular o tumoral.", "Tienen menor selectividad por las células tumorales respecto al resto de células del organismo, lo que les confiere, en general, mayor eficacia asociada a mayores efectos secundarios", "Los inhibidores de generación y transmisión de señales de crecimiento intracelular se están estudiando como posibles dianas terapéuticas, aunque por el momento no hay ningún fármaco de esta familia aprobado para su uso", "Trastuzumab (Herceptin) es un anticuerpo monoclonal con actividad antiangiogénica, aprobado para el tratamiento del Carcinoma de Colon y Carcinoma de Pulmón"], "c": 1, "e": "Las terapias dirigidas bloquean de forma <b>específica</b> una diana de la biología tumoral. Falsas: tienen <b>mayor</b> selectividad, no menor; ya hay muchos inhibidores de señales intracelulares aprobados (p. ej., inhibidores de tirosina cinasa como osimertinib); y trastuzumab es <b>anti-HER2</b> (mama, gástrico), no antiangiogénico. <br><small>📌 Cayó en: parcial 2023, final 2022, recopilación 1, recopilación 2. ⚠️ No sale tal cual en tus apuntes 2026.</small>"}, {"n": "10", "noShuffle": false, "img": null, "q": "En relación con la Inmunoterapia, indique cuál de las siguientes afirmaciones es la INCORRECTA", "o": ["El sistema inmunitario es capaz de detectar y destruir células anormales y por tanto de prevenir la formación de neoplasias", "Las diferentes estrategias de inmunoterapia han fracasado en el tratamiento del cáncer, no existiendo en este momento ningún fármaco aprobado para su uso en Oncología", "El bloqueo de proteínas reguladoras del sistema inmunitario como CTLA4 o PDL1 permite restaurar la respuesta inmunitaria y habilitar al sistema inmune para la destrucción de células cancerosas.", "El primer fármaco con actividad anti-CTLA4 aprobado en el tratamiento del Melanoma fue el Ipilimumab."], "c": 2, "e": "Falsa la b: la inmunoterapia funciona y hay muchos fármacos aprobados, p. ej. <b>anti-PD-1</b> (nivolumab, pembrolizumab) y <b>anti-PD-L1</b> (atezolizumab, durvalumab). Ciertas: inmunovigilancia; el bloqueo de CTLA-4/PD-L1 restaura la respuesta inmune; e ipilimumab fue el primer anti-CTLA-4 aprobado (melanoma). <br><small>📌 Cayó en: parcial 2023, final 2022, final 2020.</small>"}, {"n": "11", "noShuffle": false, "img": null, "q": "En relación con la Hormonoterapia, indique la afirmación FALSA.", "o": ["Es una forma de tratamiento médico del cáncer que utiliza fármacos que actúan modificando el ambiente hormonal, evitando la síntesis de hormonas o alterando sus efectos sobre determinadas células.", "Las hormonas son proteínas que actúan como mensajeros modificando el comportamiento, metabolismo y crecimiento de muchas células normales.", "Los receptores hormonales que algunas células expresan en su superficie pueden ser activados por hormonas normales que funcionan como estimulantes del crecimiento tumoral.", "El uso de la hormonoterapia se restringe al tratamiento de Cáncer de Mama y Cáncer de próstata."], "c": 4, "e": "Falsa la d: la hormonoterapia se usa también en <b>endometrio, ovario y tumores neuroendocrinos</b> (y el megestrol en el renal), no solo en mama y próstata. Ojo: b es inexacta (las hormonas sexuales son esteroides, no proteínas) y los receptores de estrógenos son intracelulares, pero la intencionada es d. <br><small>📌 Cayó en: final 2022, ordinaria 2024, recopilación 1.</small>"}, {"n": "12", "noShuffle": false, "img": null, "q": "Uno de los siguientes fármacos NO es de la familia de los Antimetabolitos. Señálelo.", "o": ["Pemetrexed", "Ciclofosfamida", "5-Fluorouracilo.", "Fluoropirimidina oral (Capecitabina)"], "c": 2, "e": "La <b>ciclofosfamida es un agente alquilante</b> (cistitis hemorrágica → hidratación ± MESNA). Pemetrexed (antifólico), 5-FU y capecitabina (antipirimidínicos que inhiben la timidilato sintetasa) son antimetabolitos. <br><small>📌 Cayó en: final 2022, recopilación 1.</small>"}, {"n": "13", "noShuffle": false, "img": null, "q": "¿Cuál de las siguientes no es una herramienta de prevención primaria?", "o": ["Evitar tabaco", "Realizar mamografías", "Evitar alcohol", "Evitar obesidad"], "c": 2, "e": "La <b>mamografía de cribado es prevención secundaria</b> (diagnóstico precoz en fase preclínica). Evitar tabaco, alcohol y obesidad actúa sobre factores de riesgo en personas sanas: prevención primaria (Código Europeo contra el Cáncer). <br><small>📌 Cayó en: recopilación 1.</small>"}, {"n": "14", "noShuffle": false, "img": null, "q": "¿Cuál es el mecanismo de acción del cetuximab?", "o": ["Bloqueo del receptor del EGFR", "Bloqueo del dominio tirosina cinasa del EGFR", "Inhibición de BRAF", "Inhibición de MEK"], "c": 1, "e": "El cetuximab es un <b>anticuerpo monoclonal anti-EGFR</b> que bloquea el <b>receptor</b> desde fuera de la célula. Bloquear el dominio tirosina cinasa es lo que hacen los TKI (erlotinib, gefitinib, osimertinib); BRAF y MEK se inhiben con otros fármacos (dabrafenib/vemurafenib y trametinib). <br><small>📌 Cayó en: final 2025. Enunciado reconstruido (del final 2025 solo se conserva un resumen).</small>"}, {"n": "15", "noShuffle": false, "img": null, "q": "¿Cuál es el mecanismo de acción del pazopanib?", "o": ["Bloqueo del VEGF soluble", "Bloqueo del receptor VEGFR", "Activación de BCL-2", "Inhibición de HER2"], "c": 2, "e": "Pazopanib es un <b>inhibidor de tirosina cinasa del receptor VEGFR</b> (antiangiogénico; cáncer renal, sarcomas). Bloquear el VEGF soluble es el mecanismo del bevacizumab; BCL-2 es antiapoptótico y se inhibe (venetoclax), no se activa; HER2 se bloquea con trastuzumab o pertuzumab. <br><small>📌 Cayó en: final 2025. Enunciado reconstruido (del final 2025 solo se conserva un resumen).</small>"}, {"n": "16", "noShuffle": false, "img": null, "q": "En relación con la obesidad y el cáncer, señale la afirmación INCORRECTA:", "o": ["La obesidad abdominal se asocia a mayor riesgo de cáncer de colon.", "El tejido adiposo produce estrógenos, lo que se relaciona con el cáncer de mama y de endometrio.", "La hiperinsulinemia y el aumento de IGF-1 favorecen la proliferación tumoral.", "No hay un claro beneficio en la disminución del riesgo de cáncer tras la pérdida de tejido adiposo."], "c": 4, "e": "Falsa la d: la <b>pérdida de peso sí reduce el riesgo</b> de los cánceres asociados a obesidad (p. ej., tras cirugía bariátrica). Ciertas: obesidad abdominal ↔ colon; el tejido adiposo produce <b>estrógenos</b> (mama, endometrio); y la hiperinsulinemia y el IGF-1 favorecen la proliferación tumoral. <br><small>📌 Cayó en: final 2025. ⚠️ No sale tal cual en tus apuntes 2026. Enunciado reconstruido (del final 2025 solo se conserva un resumen).</small>"}, {"n": "17", "noShuffle": false, "img": null, "q": "Respecto a los factores de riesgo de cáncer, señale la afirmación INCORRECTA:", "o": ["La infección por VIH se asocia a linfoma no Hodgkin y sarcoma de Kaposi.", "La obesidad se relaciona con un aumento del cáncer de colon, de endometrio y de mama premenopáusico.", "La radiación ultravioleta B es oncogénica.", "La radioterapia se asocia a la aparición de segundas neoplasias."], "c": 2, "e": "Falsa la b: la obesidad aumenta el cáncer de mama <b>postmenopáusico</b> (estrógenos del tejido adiposo), no el premenopáusico. Ciertas: VIH → linfoma no Hodgkin y sarcoma de Kaposi; la radiación UVB es oncogénica; y la radioterapia puede causar segundas neoplasias. <br><small>📌 Cayó en: final 2025. ⚠️ No sale tal cual en tus apuntes 2026. Enunciado reconstruido (del final 2025 solo se conserva un resumen).</small>"}, {"n": "18", "noShuffle": true, "img": null, "q": "En relación con la emesis en pacientes oncológicos, señale la afirmación CORRECTA:", "o": ["Puede ser producida por los tratamientos recibidos (cirugía, radioterapia y quimioterapia).", "Se define emesis retardada o diferida aquella que aparece a partir de las 24 horas.", "El cisplatino a dosis altas tiene alto potencial emético.", "Todas las respuestas anteriores son correctas."], "c": 4, "e": "Todas ciertas: la emesis puede deberse a los tratamientos (QT, RT, cirugía/anestesia); la <b>retardada</b> aparece <b>a partir de las 24 h</b> (la aguda, en las primeras 24 h); y el <b>cisplatino</b> a dosis altas es altamente emetógeno. <br><small>📌 Cayó en: final 2022. ⚠️ No sale tal cual en tus apuntes 2026.</small>"}, {"n": "19", "noShuffle": false, "img": null, "q": "¿Cuál de estos tumores es más frecuente (mayor incidencia) a nivel mundial?", "o": ["Cáncer colorrectal", "Cáncer gástrico", "Cáncer de esófago", "Cáncer de páncreas"], "c": 1, "e": "A nivel mundial el <b>colorrectal</b> es el 3.er tumor más incidente (≈10 %, tras pulmón y mama), muy por delante de gástrico, esófago y páncreas. En España es directamente el más frecuente (SEOM 2025). <br><small>📌 Cayó en: ordinaria 2024.</small>"}, {"n": "20", "noShuffle": false, "img": null, "q": "¿Cuál es el fármaco más importante en el tratamiento de los tumores germinales?", "o": ["Bleomicina", "Etopósido", "Paclitaxel", "Cisplatino"], "c": 4, "e": "El <b>cisplatino</b> es el fármaco clave en los <b>tumores germinales</b>: los convirtió en curables (>90 %). Esquemas BEP (bleomicina, etopósido, cisplatino), EP o VIP: etopósido y bleomicina acompañan al cisplatino; el paclitaxel no es de primera línea. <br><small>📌 Cayó en: ordinaria 2024. Enunciado reconstruido (del final 2025 solo se conserva un resumen).</small>"}, {"n": "21", "noShuffle": false, "img": null, "q": "Respecto al origen del cáncer es cierto, excepto:", "o": ["Casi todos los cánceres surgen de una sola célula, lo que se conoce como el origen clonal", "Habitualmente se precisa una única mutación, a lo sumo dos o tres, para que se desarrolle un cáncer", "Existen diferentes teorías sobre el desarrollo del cáncer: la viral, inflamatoria, oncogenes, genes supresores...", "Tras una mutación, se requiere, además, una alteración en los checkpoints y en los mecanismos de reparación del daño de ADN"], "c": 2, "e": "Falsa la b: el cáncer requiere la <b>acumulación de mutaciones en varios genes</b> a lo largo de años, no una sola. Ciertas: origen <b>clonal</b> (hipótesis monoclonal); hay varias teorías (viral, inflamatoria, oncogenes, supresores); y además deben fallar los checkpoints y la reparación del ADN. <br><small>📌 Cayó en: final 2018.</small>"}, {"n": "22", "noShuffle": false, "img": null, "q": "Respecto a la carcinogénesis es falso:", "o": ["Las mutaciones en la línea germinal suponen entre el 5-10% de los casos y se asocian a síndromes neoplásicos familiares, siendo predominantemente autosómicos dominantes", "Las alteraciones en los telómeros son trastornos frecuentes detectados en la mayoría de los cánceres", "Las principales vías de apoptosis son la vía intrínseca, la vía extrínseca y la vía de la perforina-granzima", "Las amplificaciones son los principales daños somáticos responsables de las mutaciones en los genes supresores."], "c": 4, "e": "Falsa la d: las <b>amplificaciones activan oncogenes</b> (p. ej., HER2, N-myc); los supresores se inactivan por mutaciones puntuales, <b>deleciones</b> o hipermetilación. Ciertas: la línea germinal explica el 5-10 % (síndromes familiares, sobre todo AD); las alteraciones teloméricas son frecuentes; y hay vías de apoptosis intrínseca, extrínseca y perforina-granzima. <br><small>📌 Cayó en: final 2018.</small>"}], "mama": [{"n": "1", "noShuffle": true, "img": null, "q": "Señale cuál de las siguientes es la localización más frecuente del cáncer de mama", "o": ["Cuadrantes inferiores", "Retroareolar", "Cuadrante supero-externo", "Ninguna de las anteriores"], "c": 3, "e": "<b>Cuadrante supero-externo (≈48 %)</b>, donde hay más tejido glandular. Le siguen retroareolar (17 %), cuadrantes inferiores (17 %) y supero-interno (15 %). Trampa: el supero-interno es de los menos frecuentes. <br><small>📌 Cayó en: parcial 2024.</small>"}, {"n": "2", "noShuffle": true, "img": null, "q": "La biopsia selectiva del ganglio centinela (BSGC), señale la CORRECTA:", "o": ["Debe realizarse en aquellas pacientes con cáncer de mama y axila clínicamente negativa.", "Es el primer ganglio al que drena el tumor primario dentro de la cadena linfática regional.", "Se realiza mediante la inyección intra o peri tumoral de colorante o radioisótopo dependiendo del centro donde se realice.", "Todas las respuestas anteriores son correctas."], "c": 4, "e": "Las tres son ciertas: la BSGC se hace con <b>axila clínicamente negativa</b>; el centinela es el <b>primer ganglio</b> al que drena el tumor dentro de la cadena regional; se localiza inyectando <b>colorante o radioisótopo</b> (intra/peritumoral o retroareolar). Con axila clínicamente positiva → linfadenectomía. <br><small>📌 Cayó en: parcial 2024.</small>"}, {"n": "3", "noShuffle": false, "img": null, "q": "Señale la afirmación INCORRECTA respecto al cáncer de mama:", "o": ["Es el tumor maligno más frecuente en las mujeres.", "La nuliparidad es uno de los factores de riesgo que aumentan la probabilidad de desarrollar un cáncer de mama.", "La mayor parte de los tumores se localizan en el cuadrante supero-interno.", "El lugar más frecuente de metástasis a distancia son los huesos."], "c": 3, "e": "Falsa la c: la localización más frecuente es el <b>cuadrante supero-externo</b> (48 %). <i>(Opción d corregida: en el parcial 2023 decía «los pulmones», que también era falsa, porque la metástasis más frecuente es la <b>ósea</b>: hueso > hígado > pulmón.)</i> <br><small>📌 Cayó en: parcial 2023.</small>"}, {"n": "4", "noShuffle": false, "img": null, "q": "¿Cuál de las siguientes NO es una forma de presentación clínica del cáncer de mama?", "o": ["Eczema del complejo areola-pezón.", "Nódulo mamario.", "Adenopatía axilar.", "Microcalcificaciones en la mamografía."], "c": 4, "e": "Las <b>microcalcificaciones</b> son un hallazgo de la <b>mamografía</b> (típicas del CDIS, que en un 80 % se diagnostica así), no una manifestación clínica. Sí son formas de presentación: nódulo mamario (la más frecuente), adenopatía axilar y eccema del complejo areola-pezón (enfermedad de Paget). <br><small>📌 Cayó en: parcial 2023.</small>"}, {"n": "5", "noShuffle": false, "img": null, "q": "¿Cuál de las siguientes, relacionadas con el cáncer de mama, es verdadera?", "o": ["Tras una mastectomía con ganglios axilares positivos (infiltración tumoral) no hay que administrar radioterapia adyuvante", "Tras una cirugía conservadora nunca hemos de dar radioterapia adyuvante", "La radioterapia adyuvante solo se emplea tras vaciamiento axilar", "Tras una mastectomía con tumores mayores de 5 cm hay que administrar radioterapia adyuvante"], "c": 4, "e": "Tras mastectomía, la RT de pared torácica está indicada si <b>tumor >5 cm</b>, ganglios positivos o bordes afectos. Falsas: con ganglios positivos sí hay RT; tras cirugía conservadora la RT es <b>siempre</b> obligatoria; y no depende de haber hecho vaciamiento axilar. <br><small>📌 Cayó en: recopilación 1.</small>"}, {"n": "6", "noShuffle": false, "img": null, "q": "Cuando un cáncer de mama presenta ausencia de expresión de receptores hormonales y HER2 hablamos de:", "o": ["Ninguno de ellos", "HER2 positivo", "Luminal (receptor hormonal positivo)", "Triple negativo"], "c": 4, "e": "Sin RE, RP ni HER2 = <b>triple negativo</b> (10-15 %; basal-like, grado 3, p53 mutado, asociado a BRCA1, peor pronóstico pero muy quimiosensible). Luminal = receptores hormonales positivos; HER2 positivo = sobreexpresión de HER2. <br><small>📌 Cayó en: recopilación 1.</small>"}, {"n": "7", "noShuffle": false, "img": null, "q": "En una paciente de 70 años intervenida mediante cirugía mastectomía y exéresis del ganglio centinela axilar derecho por carcinoma ductal infiltrante grado 1, receptores hormonales positivos, HER2 negativo, Ki67 5 %. Tamaño 1 cm y no afectación tumoral del ganglio centinela resecado. ¿Qué tratamiento adyuvante le propondrías?", "o": ["Quimioterapia adyuvante", "Hormonoterapia adyuvante y radioterapia adyuvante", "Hormonoterapia adyuvante", "Quimioterapia adyuvante y radioterapia adyuvante"], "c": 3, "e": "Luminal A de bajo riesgo (1 cm, N0, G1, RH+, HER2−, Ki67 5 %): solo <b>hormonoterapia</b>, sin beneficio de QT. Tras <b>mastectomía</b> la RT solo se da si tumor >5 cm, ganglios positivos o bordes afectos; aquí no. La RT obligatoria es la de la cirugía conservadora. <br><small>📌 Cayó en: recopilación 1.</small>"}, {"n": "8", "noShuffle": false, "img": null, "q": "¿Qué debemos hacer ante un resultado inmunohistoquímico de HER2 +++/+++?", "o": ["Nada, es negativo", "Realizar una determinación para conocer si el gen HER2 está amplificado", "Repetir la inmunohistoquímica", "Nada, es positivo"], "c": 4, "e": "HER2 <b>3+ por IHQ = positivo</b>: no hace falta más estudio. La determinación de amplificación del gen (FISH/ISH) se reserva a los resultados <b>no concluyentes (2+)</b>; 0 y 1+ se consideran negativos. <br><small>📌 Cayó en: recopilación 1.</small>"}, {"n": "9", "noShuffle": true, "img": null, "q": "¿Cuál de los siguientes es un factor de riesgo de cáncer de mama?", "o": ["Menarquia precoz", "Menopausia tardía", "Nuliparidad", "Todas las anteriores"], "c": 4, "e": "Todos son factores de riesgo por <b>mayor exposición a estrógenos</b>: menarquia precoz, menopausia tardía y nuliparidad (también primer embarazo tardío, no lactancia, THS y anticonceptivos orales). <br><small>📌 Cayó en: final 2025. Enunciado reconstruido (del final 2025 solo se conserva un resumen).</small>"}, {"n": "10", "noShuffle": false, "img": null, "q": "Respecto al diagnóstico del cáncer de mama, señale la afirmación INCORRECTA:", "o": ["La forma de presentación más frecuente es el nódulo mamario palpable.", "La resonancia magnética es imprescindible en el diagnóstico.", "La resonancia magnética permite evaluar la respuesta al tratamiento neoadyuvante.", "Ante una lesión BI-RADS 4 debe realizarse una biopsia con aguja gruesa (BAG)."], "c": 2, "e": "Falsa la b: la <b>RM no es imprescindible</b>; la prueba de referencia es la <b>mamografía</b> (+ ecografía). La RM tiene indicaciones concretas (mamas densas, lobulillar, primario oculto, respuesta a neoadyuvancia). El nódulo es la presentación más frecuente y BI-RADS ≥4 obliga a biopsia (BAG). <br><small>📌 Cayó en: final 2025. Enunciado reconstruido (del final 2025 solo se conserva un resumen).</small>"}, {"n": "11", "noShuffle": true, "img": null, "q": "Respecto al cáncer de mama triple negativo, señale la afirmación correcta:", "o": ["No expresa receptores hormonales ni HER2.", "Tiene mayor tendencia a desarrollar metástasis a distancia.", "Representa el 10-15 % de los cánceres de mama.", "Todas las anteriores son correctas."], "c": 4, "e": "Todas ciertas: triple negativo = <b>RE−, RP− y HER2−</b>; supone el <b>10-15 %</b>; es el subtipo más agresivo, con mayor tendencia a metástasis a distancia y peor pronóstico, aunque muy sensible a la QT. <br><small>📌 Cayó en: final 2025. Enunciado reconstruido (del final 2025 solo se conserva un resumen).</small>"}, {"n": "12", "noShuffle": true, "img": null, "q": "Señale la afirmación CORRECTA respecto al cáncer de mama:", "o": ["Es el tumor maligno más frecuente en las mujeres.", "El cáncer de mama hereditario representa entre el 5 y el 10% de todos los cánceres de mama.", "La mayor parte de los tumores se localizan en el cuadrante supero-externo.", "Todas las respuestas anteriores son correctas."], "c": 4, "e": "Las tres son ciertas: es el <b>tumor maligno más frecuente en la mujer</b>; el hereditario supone el <b>5-10 %</b> (BRCA1/2, autosómico dominante con penetrancia incompleta); y la localización más frecuente es el <b>cuadrante supero-externo</b> (48 %). <br><small>📌 Cayó en: final 2022.</small>"}, {"n": "13", "noShuffle": false, "img": null, "q": "En relación con el tratamiento del cáncer de mama, señale cuál de las siguientes afirmaciones es INCORRECTA:", "o": ["El tamaño tumoral y la afectación ganglionar son factores pronósticos en el cáncer de mama.", "El fenotipo molecular HER-2 positivo se caracteriza por presentar buena respuesta a la quimioterapia.", "La cirugía conservadora estaría indicada en tumores multicéntricos.", "El esquema de quimioterapia utilizado en el tratamiento del cáncer de mama incluye la combinación de antraciclinas y taxanos administrados de forma secuencial."], "c": 3, "e": "Falsa la c: los tumores <b>multicéntricos</b> (focos en distintos cuadrantes) son indicación de <b>mastectomía</b>; la conservadora admite multifocales en un mismo cuadrante. Ciertas: tamaño y ganglios son pronósticos; HER2+ responde bien a la QT; el esquema estándar es antraciclinas → taxanos secuencial. <br><small>📌 Cayó en: final 2022, ordinaria 2024.</small>"}, {"n": "14", "noShuffle": false, "img": null, "q": "Una de las siguientes respuestas es FALSA respecto al cáncer de mama.", "o": ["La mayoría de los tumores (70%) tienen receptores para hormonas.", "El estadio medido según el sistema TNM es uno de los factores pronóstico de la enfermedad.", "La presencia de adenopatías axilares contraindica la cirugía.", "Las antraciclinas y los taxanos son los quimioterápicos más empleados en el tratamiento adyuvante."], "c": 3, "e": "Falsa la c: las adenopatías axilares <b>no contraindican la cirugía</b>: se operan con <b>linfadenectomía axilar</b> (≥10 ganglios, niveles I-II). Ciertas: ≈70 % son RH+ (luminales); el estadio TNM es pronóstico; antraciclinas y taxanos son la base de la QT adyuvante. <br><small>📌 Cayó en: ordinaria 2024.</small>"}, {"n": "15", "noShuffle": false, "img": null, "q": "La radioterapia en el cáncer de mama NO está indicada en:", "o": ["Carcinoma in situ post-tumorectomía.", "Estadio I post-mastectomía.", "Estadios localmente avanzados.", "Enfermedad metastásica sintomática."], "c": 2, "e": "Tras mastectomía, la RT solo se indica si <b>tumor >5 cm, ganglios positivos o bordes afectos</b>: en el <b>estadio I</b> no. Sí se irradia tras tumorectomía (también en el in situ) y en los localmente avanzados. En las metástasis sintomáticas se usa RT paliativa. <i>(Enunciado sin «adyuvante» para que no haya dos válidas.)</i> <br><small>📌 Cayó en: ordinaria 2024.</small>"}, {"n": "16", "noShuffle": true, "img": null, "q": "Respecto a la prevención primaria y secundaria es falso:", "o": ["La prevención primaria son medidas encaminadas a diagnosticar el cáncer de mama en estados iniciales", "La prevención primaria son medidas encaminadas a evitar la aparición del cáncer", "Las unidades de diagnóstico precoz son medidas de prevención secundaria", "A y C son falsas"], "c": 1, "e": "Falsa la a: diagnosticar el cáncer en fases iniciales es <b>prevención secundaria</b>. La <b>primaria</b> evita su aparición actuando sobre factores de riesgo en personas sanas. Las unidades de diagnóstico precoz son prevención secundaria (c es cierta), por eso «A y C son falsas» no vale. <br><small>📌 Cayó en: final 2020.</small>"}, {"n": "17", "noShuffle": false, "img": null, "q": "En una paciente de 70 años intervenida mediante mastectomía y exéresis del ganglio centinela axilar derecho por carcinoma ductal infiltrante de tamaño 1,5 cm y no afectación neoplásica del ganglio centinela resecado. Grado 1, receptores hormonales positivos, HER2 negativo, Ki67 9 %. ¿Qué tratamiento adyuvante le propondrías?", "o": ["QT adyuvante", "QT adyuvante y RT adyuvante", "HT adyuvante y RT adyuvante", "Hormonoterapia adyuvante"], "c": 4, "e": "Luminal A de bajo riesgo (1,5 cm, N0, G1, RH+, HER2−, Ki67 9 %): solo <b>hormonoterapia</b>, sin QT. Tras <b>mastectomía</b> no hay RT salvo tumor >5 cm, ganglios positivos o bordes afectos. La RT obligatoria es la de la cirugía conservadora. <br><small>📌 Cayó en: final 2020.</small>"}, {"n": "18", "noShuffle": false, "img": null, "q": "En una paciente de 30 años intervenida mediante mastectomía y vaciamiento axilar derecho por carcinoma ductal infiltrante. Grado 3, receptores hormonales positivos, HER2 negativo, Ki67 45 %, tamaño 6 cm y afectación axilar metastásica en 4 de los 20 ganglios resecados. ¿Qué tratamiento adyuvante le propondrías?", "o": ["QT y HT adyuvante", "QT, HT y RT adyuvante", "HT adyuvante, RT adyuvante", "HT adyuvante"], "c": 2, "e": "Alto riesgo: G3 y Ki67 45 % (luminal B) → <b>QT + HT</b> (RH+); y tras mastectomía, <b>tumor >5 cm (6 cm) y 4 ganglios positivos</b> → RT de pared torácica y áreas ganglionares. Por eso: QT + HT + RT. <br><small>📌 Cayó en: final 2018.</small>"}, {"n": "19", "noShuffle": false, "img": null, "q": "Mujer de 68 años, que fue operada a los 52 de un carcinoma ductal infiltrante pT2 pN1 M0, estadio IIB. Recibió quimioterapia con antraciclinas y hormonoterapia con tamoxifeno. Actualmente presenta exclusivamente una metástasis ósea. Se confirma la recaída mediante biopsia, que informa de carcinoma ductal de probable origen mamario, con amplia expresión de receptores hormonales, HER2 no amplificado y Ki67 bajo del 5 %. No presenta antecedentes familiares de cáncer de mama de 1.er grado. Indique cuál de los siguientes no es factor pronóstico favorable en el momento de la recaída:", "o": ["El largo intervalo a la recaída (16 años)", "La ausencia de antecedentes familiares", "La enfermedad oligometastásica", "La alta expresión de receptores hormonales."], "c": 2, "e": "Los <b>antecedentes familiares no son un factor pronóstico</b> de la recaída. Sí son favorables: intervalo libre largo (16 años), enfermedad oligometastásica (metástasis ósea única) y alta expresión de receptores hormonales (tumor hormonosensible). <br><small>📌 Cayó en: final 2018. ⚠️ No sale tal cual en tus apuntes 2026.</small>"}, {"n": "20", "noShuffle": false, "img": null, "q": "Respecto al cáncer de mama, señale la cierta", "o": ["El subtipo molecular basal-like o triple negativo es el asociado a mejor pronóstico.", "Los marcadores tumorales séricos CEA y CA 15.3 son altamente sensibles y específicos.", "La aparición de una tumoración mamaria durante el embarazo o la lactancia debe atribuirse a cambios hormonales.", "El tratamiento de la enfermedad luminal está basado en los tratamientos antiestrogénicos, reservando y añadiendo la quimioterapia sólo en los pacientes de riesgo."], "c": 4, "e": "En la enfermedad luminal la base es la <b>hormonoterapia</b>, añadiendo QT solo si hay riesgo (p. ej., luminal B). Falsas: el triple negativo tiene el <b>peor</b> pronóstico; CEA y CA 15.3 tienen baja sensibilidad y especificidad; una tumoración en el embarazo o la lactancia debe estudiarse siempre. <br><small>📌 Cayó en: final 2018.</small>"}, {"n": "21", "noShuffle": false, "img": null, "q": "De los siguientes, señale cuál NO es factor pronóstico en cáncer de mama localizado", "o": ["El tamaño tumoral", "El número de ganglios axilares invadidos", "Elevación de LDH en sangre", "El grado histológico"], "c": 3, "e": "La <b>LDH no es factor pronóstico</b> del cáncer de mama localizado. Sí lo son el tamaño tumoral, el número de ganglios axilares afectos y el grado histológico, además de RH, HER2, Ki67 e invasión linfovascular. <br><small>📌 Cayó en: final 2018.</small>"}, {"n": "22", "noShuffle": false, "img": null, "q": "¿Cuál de las siguientes relacionadas con el cáncer de mama es Verdadera?", "o": ["Tras una tumorectomía sin afectación metastásica en los ganglios axilares hay que administrar radioterapia adyuvante", "Después de una mastectomía hemos de dar radioterapia adyuvante", "Tras una mastectomía con tumores mayores de 5 cm y sin afectación metastásica ganglionar no hay que administrar radioterapia adyuvante", "La radioterapia adyuvante solo se emplea en cirugías conservadoras"], "c": 1, "e": "Tras <b>cirugía conservadora</b> (tumorectomía) la RT de la mama es <b>siempre</b> obligatoria, con o sin ganglios. Falsas: tras mastectomía no siempre (solo si >5 cm, ganglios positivos o bordes afectos), así que con tumor >5 cm sí hay RT aunque sea N0; y la RT no se limita a la cirugía conservadora. <br><small>📌 Cayó en: final 2018.</small>"}, {"n": "23", "noShuffle": true, "img": null, "q": "Respecto al cáncer de mama cual de las siguientes afirmaciones es verdadera", "o": ["Todas son correctas", "En España afecta aproximadamente a 1 de cada 8 mujeres", "Suele diagnosticarse con afectación metastásica a distancia", "Es una enfermedad que afecta sólo a las mujeres"], "c": 2, "e": "En España afecta a <b>1 de cada 8 mujeres</b>. Falsas: solo un 5-6 % es metastásico al diagnóstico (muchos se detectan por cribado) y también afecta a varones (≈1 % de los casos). Por tanto, «Todas son correctas» es falsa. <br><small>📌 Cayó en: final 2020.</small>"}, {"n": "24", "noShuffle": false, "img": null, "q": "¿Cuál es el subtipo de cáncer de mama más frecuente?", "o": ["Triple negativo", "normal", "HER2 positivo", "Luminal (receptor hormonal positivo)"], "c": 4, "e": "El subtipo más frecuente es el <b>luminal (RH+)</b>: luminal A ≈58 % + luminal B ≈16 %. Triple negativo 10-15 %; HER2 positivo puro ≈7 %. <br><small>📌 Cayó en: final 2020.</small>"}, {"n": "25", "noShuffle": false, "img": null, "q": "¿Cuál de las siguientes, relacionadas con el cáncer de mama, NO es verdadera?", "o": ["La radioterapia adyuvante solo se emplea en cirugías conservadoras", "Tras una mastectomía con tumores mayores de 5 cm hay que administrar radioterapia adyuvante", "Después de una cirugía conservadora hemos de dar radioterapia adyuvante", "Tras una mastectomía con ganglios axilares positivos (infiltración tumoral) hay que administrar radioterapia adyuvante"], "c": 1, "e": "La falsa es la a: la RT adyuvante <b>no se limita a la cirugía conservadora</b>; tras mastectomía se indica si tumor >5 cm, ganglios positivos o bordes afectos. Las otras tres son ciertas (tras cirugía conservadora la RT es siempre obligatoria). <br><small>📌 Cayó en: final 2020.</small>"}, {"n": "26", "noShuffle": true, "img": null, "q": "Sobre el tratamiento neoadyuvante del cáncer de mama, cuál de las siguientes es falsa.", "o": ["En pacientes HER2 positivas se puede emplear la doble combinación de trastuzumab y pertuzumab.", "Todas son correctas", "El tratamiento hormonoterápico neoadyuvante lo aplicamos generalmente en pacientes ancianas.", "La quimioterapia debe ser parte del tratamiento neoadyuvante en todos los casos"], "c": 4, "e": "Falsa la d: la QT <b>no es obligatoria</b> en toda neoadyuvancia; en pacientes <b>ancianas con tumores RH+</b> puede usarse hormonoterapia neoadyuvante. Cierto: en HER2+ se emplea el doble bloqueo trastuzumab + pertuzumab. «Todas son correctas» no vale porque d es falsa. <br><small>📌 Cayó en: final 2020.</small>"}, {"n": "27", "noShuffle": false, "img": null, "q": "¿Cuándo usaremos trastuzumab (Herceptin)?", "o": ["En la leucemia mieloide crónica", "En el cáncer de mama triple negativo", "En el cáncer microcítico de pulmón", "En el cáncer de mama HER2 positivo"], "c": 4, "e": "Trastuzumab = anticuerpo monoclonal <b>anti-HER2</b> → cáncer de mama <b>HER2 positivo</b> (también gástrico HER2+). No sirve en el triple negativo (HER2−); en la LMC se usan inhibidores de BCR-ABL (imatinib); el microcítico se trata con platino-etopósido ± inmunoterapia. <br><small>📌 Cayó en: final 2020.</small>"}], "pulmon": [{"n": "1", "noShuffle": false, "img": null, "q": "¿Qué podemos sospechar en un paciente varón de 60 años con carcinoma microcítico de pulmón que refiere debilidad muscular proximal que mejora tras el ejercicio?", "o": ["Miastenia gravis", "Metástasis cerebral frontal derecha", "Síndrome de Eaton Lambert", "Trombosis venosa profunda"], "c": 3, "e": "Debilidad proximal que <b>mejora con el ejercicio</b> en un microcítico = <b>síndrome de Lambert-Eaton</b> (autoanticuerpos contra canales de calcio). La miastenia gravis empeora con el ejercicio y se asocia a timoma. Tratamiento: tratar el tumor + piridostigmina, prednisona, IgIV. <br><small>📌 Cayó en: recopilación 1.</small>"}, {"n": "2", "noShuffle": false, "img": null, "q": "Varón de 66 años diagnosticado de carcinoma epidermoide de pulmón que se presenta como un nódulo de 1 cm. El PET-TC no muestra otras captaciones. ¿Cuál es su estadificación TNM?", "o": ["TisN0M0", "T1N0M0", "T2N0M0", "T1N1M0"], "c": 2, "e": "Nódulo de <b>1 cm = T1</b> (T1a ≤1 cm en la TNM-9) y PET-TC sin otras captaciones → N0 y M0: <b>T1N0M0</b> (estadio IA). T2 empieza por encima de 3 cm, N1 exigiría ganglios hiliares o peribronquiales y Tis es el carcinoma in situ. <br><small>📌 Cayó en: final 2025. Enunciado reconstruido (del final 2025 solo se conserva un resumen).</small>"}, {"n": "3", "noShuffle": false, "img": null, "q": "El marcador tumoral más específico del carcinoma microcítico de pulmón es:", "o": ["Enolasa neuroespecífica (ENA o NSE).", "Ag carcinoembrionario CEA", "Ag carbohidrato ca 15-3", "Ag carbohidrato CA 12-5"], "c": 1, "e": "El microcítico es un tumor <b>neuroendocrino</b>: su marcador más específico es la <b>enolasa neuroespecífica (NSE)</b>. CEA = colorrectal; CA 15-3 = mama; CA 125 = ovario. <br><small>📌 Cayó en: final 2018.</small>"}, {"n": "4", "noShuffle": false, "img": null, "q": "¿Cuál de las siguientes afirmaciones sobre el tratamiento de los carcinomas pulmonares es FALSA?", "o": ["Tras la resección quirúrgica está indicado el tratamiento adyuvante con 4 ciclos de quimioterapia basada en platino independientemente del estadio de la enfermedad.", "El tratamiento con Radioterapia Holocraneal Profiláctica para reducir el riesgo de metástasis cerebrales está indicado en los pacientes con Carcinoma Microcítico de Pulmón tras completar tratamiento con quimio-radioterapia concomitante sobre el tumor primario y mediastino.", "En los estadios III por afectación ganglionar mediastínica o supraclavicular (localmente avanzados), el tratamiento de elección es la combinación de quimioterapia y radioterapia concomitante, seguido de inmunoterapia de mantenimiento durante un año.", "En los estadios iniciales I y II, la cirugía es el tratamiento de elección. En caso de contraindicación, la radioterapia es una alternativa de tratamiento con intención radical."], "c": 1, "e": "Falsa la a: la QT adyuvante (4 ciclos de doblete de platino) <b>depende del estadio</b>: no se da en el estadio I, sí en los resecados más avanzados (II-III). Ciertas: PCI en microcítico que responde a QT-RT; estadio III irresecable → QT-RT concomitante + durvalumab 1 año; estadios I-II → cirugía o, si inoperable, RT radical (SBRT). <br><small>📌 Cayó en: final 2020.</small>"}, {"n": "5", "noShuffle": false, "img": null, "q": "Paciente de 70 años diagnosticado de carcinoma de pulmón estadio IV (afectación hepática y ósea). Acude a Puertas de Urgencia por dolor en zona lumbar de 10 días de evolución sin mejora tras tratamiento analgésico y con parestesias en miembros inferiores en las últimas 24 horas ¿qué exploración complementaria solicitarías en primer lugar?", "o": ["RM Cerebral", "RM columna", "Radiografía de Tórax", "TAC Tórax-Abdomen-Pelvis"], "c": 2, "e": "Dolor lumbar persistente + <b>parestesias en miembros inferiores</b> en un paciente con metástasis óseas = sospecha de <b>compresión medular</b>, urgencia oncológica: la prueba de elección es la <b>RM de columna</b> (y corticoides precoces). Las demás pruebas no valoran la médula. <br><small>📌 Cayó en: final 2020. ⚠️ No sale tal cual en tus apuntes 2026.</small>"}], "digest": [{"n": "1", "noShuffle": false, "img": null, "q": "Sólo uno de estos grupos moleculares de cáncer colorrectal metastásico se beneficia de la adición de agentes anti-EGFR (receptor del factor de crecimiento epidérmico) como panitumumab o cetuximab a la quimioterapia:", "o": ["RAS mutado", "RAS y BRAF nativos", "BRAF mutado", "Inestabilidad de microsatélites"], "c": 2, "e": "Los anti-EGFR (cetuximab, panitumumab) solo benefician a los tumores <b>RAS y BRAF nativos</b> (wild type), mejor si el primario es de colon izquierdo. Con RAS o BRAF mutado la vía sigue activada por debajo del receptor y no responden; con inestabilidad de microsatélites → inmunoterapia (pembrolizumab). <br><small>📌 Cayó en: ordinaria 2024.</small>"}, {"n": "2", "noShuffle": false, "img": null, "q": "Una de estas cifras de supervivencia es i
