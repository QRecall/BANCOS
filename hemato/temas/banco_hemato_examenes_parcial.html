<!--
=============================================================
  MOTOR BANCO MIR — v10
  Novedades respecto a v9:
  - Numeración correlativa fija por sección (no se mezcla)
  - Badge neutro en pestaña "Todos" + mezcla real inter-secciones
  - Temporizador sticky editable en header (play/pausa/reset)
  - Buscador de texto en tiempo real
  - Modo repaso rápido (muestra RC + explicación directamente)
  - Estadísticas de errores recurrentes entre sesiones
=============================================================
-->
<!DOCTYPE html>
<html lang="es" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title id="page-title">Banco MIR</title>
<style>
:root{
  --bg:#f4f3ef;--surf:#fff;--bd:#e5e5e5;--bd2:#ddd;
  --txt:#1a1a1a;--txt2:#555;--txt3:#999;--txt4:#666;
  --hdr:#1a1a1a;--hdr-t:#fff;
  --ok-bg:#e6f9ef;--ok-t:#0b6e52;--ok-bd:#2da060;
  --ko-bg:#fdecea;--ko-t:#b91c1c;--ko-bd:#d94f45;
  --sc-ok:#dcf5ed;--sc-ko:#fdecea;--sc-rem:#f0f0f0;--sc-rem-t:#666;
  --exp:#fffbe6;--exp-bd:#f0c04a;--exp-t:#5a4500;
  --prog:#e5e5e5;--prog-fill:#1a56db;
  --star:#ccc;--star-on:#f59e0b;
  --hint:#fafafa;--hint-bd:#eee;
  --tab-bd:#ddd;--tab-t:#555;
  --all-bg:#e8f0fe;--all-t:#1a56db;--all-bd:#1a56db;
  --fab:#1a1a1a;--fab-t:#fff;
  --nota-btn-t:#1a56db;--nota-btn-bd:#1a56db;--nota-btn-bg:var(--surf);
  --timer-bg:#222;--timer-t:#fff;--timer-danger:#ef4444;
}
[data-theme="dark"]{
  --bg:#0f0f1a;--surf:#1e1e30;--bd:#2a2a45;--bd2:#333355;
  --txt:#e8e8f0;--txt2:#aaa;--txt3:#555;--txt4:#888;
  --hdr:#0a0a14;--hdr-t:#e8e8f0;
  --ok-bg:#0b3020;--ok-t:#4ade80;--ok-bd:#166534;
  --ko-bg:#2d0a0a;--ko-t:#f87171;--ko-bd:#7f1d1d;
  --sc-ok:#0b3020;--sc-ko:#2d0a0a;--sc-rem:#252540;--sc-rem-t:#aaa;
  --exp:#1a1500;--exp-bd:#a37f10;--exp-t:#d4b84a;
  --prog:#2a2a45;--prog-fill:#60a5fa;
  --star:#444;--star-on:#f59e0b;
  --hint:#1a1a2e;--hint-bd:#2a2a45;
  --tab-bd:#2a2a45;--tab-t:#aaa;
  --all-bg:#1a2a4a;--all-t:#60a5fa;--all-bd:#3b82f6;
  --fab:#2a2a50;--fab-t:#e8e8f0;
  --nota-btn-t:#60a5fa;--nota-btn-bd:#3b82f6;--nota-btn-bg:var(--surf);
  --timer-bg:#1a1a2e;--timer-t:#e8e8f0;
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:var(--bg);color:var(--txt);min-height:100vh;transition:background .25s,color .25s}

/* ── Header ── */
header{background:var(--hdr);color:var(--hdr-t);padding:9px 16px;display:flex;align-items:center;justify-content:space-between;gap:8px;flex-wrap:wrap;position:sticky;top:0;z-index:100}
header h1{font-size:13.5px;font-weight:600;white-space:nowrap}
.hright{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.hmeta{font-size:11px;color:#888}
.hbtn{background:none;border:none;cursor:pointer;font-size:16px;line-height:1;padding:3px 5px;border-radius:5px;transition:background .15s;color:var(--hdr-t)}
.hbtn:hover{background:rgba(255,255,255,.12)}
.sbadge{font-size:11px;padding:3px 9px;border-radius:5px;font-weight:500}
.sbadge.ok{background:#15803d;color:#dcfce7}.sbadge.warn{background:#92400e;color:#fef3c7}

/* ── Temporizador ── */
#timer-wrap{display:flex;align-items:center;gap:4px;background:var(--timer-bg);border-radius:7px;padding:3px 8px;border:1px solid rgba(255,255,255,.1)}
#timer-display{font-size:13px;font-weight:700;font-family:monospace;color:var(--timer-t);min-width:58px;text-align:center;cursor:pointer;border-radius:3px;padding:1px 3px}
#timer-display:hover{background:rgba(255,255,255,.08)}
#timer-display.editing{background:rgba(255,255,255,.15);outline:none;color:var(--timer-t)}
#timer-display.danger{color:var(--timer-danger)}
#timer-wrap button{background:none;border:none;cursor:pointer;color:rgba(255,255,255,.7);font-size:12px;padding:1px 3px;border-radius:3px;line-height:1}
#timer-wrap button:hover{background:rgba(255,255,255,.12);color:#fff}

/* ── Barra de progreso ── */
#prog-wrap{height:3px;background:var(--prog);position:sticky;top:40px;z-index:99}
#prog-bar{height:100%;background:var(--prog-fill);width:0%;transition:width .4s}

/* ── Contenedor ── */
.container{max-width:820px;margin:0 auto;padding:16px 12px}

/* ── Buscador ── */
.search-wrap{position:relative;margin-bottom:13px}
.search-wrap input{width:100%;padding:8px 34px 8px 12px;border:1.5px solid var(--bd2);border-radius:8px;font-size:13px;background:var(--surf);color:var(--txt);outline:none;transition:border-color .15s}
.search-wrap input:focus{border-color:var(--prog-fill)}
.search-clear{position:absolute;right:9px;top:50%;transform:translateY(-50%);background:none;border:none;cursor:pointer;color:var(--txt3);font-size:16px;display:none;line-height:1}
#search-count{font-size:11px;color:var(--txt3);margin-top:4px;display:none}

/* ── Modo repaso ── */
.mode-bar{display:flex;gap:6px;margin-bottom:12px;align-items:center}
.mode-btn{padding:5px 12px;border:1.5px solid var(--bd2);border-radius:7px;cursor:pointer;font-size:12px;font-weight:500;background:var(--surf);color:var(--txt2);transition:all .15s}
.mode-btn:hover{border-color:#999}
.mode-btn.on{background:var(--all-bg);color:var(--all-t);border-color:var(--all-bd)}

/* ── Tabs ── */
.tabs{display:flex;gap:7px;margin-bottom:13px;flex-wrap:wrap}
.tab{padding:7px 14px;border:1.5px solid var(--tab-bd);border-radius:8px;cursor:pointer;font-size:12.5px;font-weight:500;background:var(--surf);color:var(--tab-t);transition:all .15s}
.tab:hover{border-color:#999;color:var(--txt)}
.tab.t-all.on{background:var(--all-bg);color:var(--all-t);border-color:var(--all-bd)}

/* ── Score global ── */
.ph-global{background:var(--surf);border-radius:10px;border:1px solid var(--bd);padding:10px 15px;margin-bottom:10px;display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;border-left:4px solid var(--prog-fill)}
.score-row{display:flex;gap:7px;align-items:center;flex-wrap:wrap}
.sc{font-size:12px;font-weight:600;padding:3px 9px;border-radius:6px}
.sc.ok{background:var(--sc-ok);color:var(--ok-t)}.sc.ko{background:var(--sc-ko);color:var(--ko-t)}.sc.rem{background:var(--sc-rem);color:var(--sc-rem-t)}

/* ── Acciones ── */
.global-actions{display:none;margin-bottom:10px;gap:7px;flex-wrap:wrap;align-items:center}
.container[data-tab="all"] .global-actions{display:flex}
.sec-actions{margin:6px 0 15px;display:flex;gap:7px;flex-wrap:wrap}
.reset-btn{padding:7px 14px;background:var(--fab);color:var(--fab-t);border:none;border-radius:8px;cursor:pointer;font-size:12.5px;font-weight:500;transition:opacity .15s}
.reset-btn:hover{opacity:.82}
.nota-btn{padding:7px 14px;background:var(--nota-btn-bg);color:var(--nota-btn-t);border:1.5px solid var(--nota-btn-bd);border-radius:8px;cursor:pointer;font-size:12.5px;font-weight:500;transition:background .15s}
.nota-btn:hover{background:var(--all-bg)}

/* ── Nota box ── */
.nota-box,.global-nota-box{margin-top:8px;padding:12px 15px;border-radius:10px;border:2px solid var(--bd2);font-size:13px;line-height:1.7;display:none}
.nota-box.pass,.global-nota-box.pass{background:var(--ok-bg);border-color:var(--ok-bd);color:var(--ok-t)}
.nota-box.fail,.global-nota-box.fail{background:var(--ko-bg);border-color:var(--ko-bd);color:var(--ko-t)}
.nota-score{font-size:26px;font-weight:700;display:block;margin-bottom:4px}
.nota-detail{font-size:12px;opacity:.85;font-family:monospace}

/* ── Vista revisión ── */
.review-list{margin-top:12px;border-top:1px solid var(--bd2);padding-top:10px}
.review-title{font-size:12px;font-weight:700;margin-bottom:9px;color:var(--txt)}
.review-sec-label{font-size:11.5px;font-weight:700;color:var(--txt3);margin:8px 0 5px;padding-top:6px;border-top:1px solid var(--bd)}
.review-item{background:var(--surf);border-radius:8px;border:1px solid var(--bd);margin-bottom:7px;overflow:hidden}
.review-item summary{padding:9px 12px;cursor:pointer;font-size:12.5px;color:var(--txt);list-style:none;display:flex;gap:8px;align-items:flex-start}
.review-item summary::-webkit-details-marker{display:none}
.review-item summary::before{content:'▶';font-size:9px;color:var(--txt3);flex-shrink:0;margin-top:4px;transition:transform .18s}
details[open] summary::before{transform:rotate(90deg)}
.review-body{padding:0 12px 11px}
.review-ans{font-size:12px;color:var(--ok-t);margin-bottom:7px;font-weight:500}

/* ── Estadísticas ── */
.stats-box{margin-top:8px;padding:12px 15px;border-radius:10px;border:1.5px solid var(--bd2);background:var(--surf);display:none}
.stats-box.show{display:block}
.stats-title{font-size:12px;font-weight:700;margin-bottom:10px;color:var(--txt)}
.stats-item{display:flex;align-items:center;gap:8px;padding:6px 0;border-bottom:1px solid var(--bd);font-size:12.5px}
.stats-item:last-child{border-bottom:none}
.stats-bar-wrap{flex:1;background:var(--sc-rem);border-radius:4px;height:6px;overflow:hidden}
.stats-bar{height:100%;background:var(--ko-bd);border-radius:4px;transition:width .4s}
.stats-n{font-size:11px;color:var(--txt3);white-space:nowrap}
.stats-q{flex:2;color:var(--txt);font-size:12px;line-height:1.3}

/* ── Panel secciones ── */
.sec-panel{display:none}.sec-panel.visible{display:block}
.ph{background:var(--surf);border-radius:10px;border:1px solid var(--bd);padding:10px 14px;margin-bottom:8px;display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.ph-left{flex:1;display:flex;flex-direction:column;gap:5px}
.ph-label{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;color:var(--txt3);margin-bottom:1px}
.ph-desc{font-size:12px;color:var(--txt4)}
.fbtn{padding:6px 12px;font-size:12px;font-weight:500;border:1.5px solid var(--bd2);border-radius:8px;cursor:pointer;background:var(--surf);color:var(--txt2);transition:all .15s;white-space:nowrap}
.fbtn:hover{border-color:#999;color:var(--txt)}.fbtn.on{background:var(--ko-bg);color:#b91c1c;border-color:#f87171}
.no-failed{display:none;text-align:center;padding:16px;color:var(--txt3);font-size:13px;border:1.5px dashed var(--bd2);border-radius:8px;margin-top:4px}
.no-failed.show{display:block}
.no-results{display:none;text-align:center;padding:20px;color:var(--txt3);font-size:13px;border:1.5px dashed var(--bd2);border-radius:8px;margin:8px 0}

/* ── Hint ── */
.hint{font-size:11px;color:var(--txt3);margin-bottom:15px;padding:7px 11px;background:var(--hint);border-radius:6px;border:1px solid var(--hint-bd)}

/* ── Tarjeta ── */
.qcard{background:var(--surf);border-radius:10px;border:1px solid var(--bd);margin-bottom:7px;overflow:hidden;transition:box-shadow .15s}
.qcard:hover{box-shadow:0 2px 8px rgba(0,0,0,.08)}
.qcard.kb-focus{outline:2px solid var(--prog-fill);outline-offset:-2px}
.qcard.search-hidden{display:none}
.qhead{padding:11px 13px;cursor:pointer;display:flex;align-items:flex-start;gap:9px}

/* ── Badge numérico ── */
.qnum{font-size:11px;font-weight:700;padding:3px 7px;border-radius:5px;white-space:nowrap;flex-shrink:0;margin-top:2px;background:var(--sc-rem);color:var(--sc-rem-t)}
/* En pestaña "Todos" siempre neutro; en sección aplica color de sección */
.qnum.sec-colored{background:var(--sec-dim);color:var(--sec-col)}

.qtxt{font-size:13px;line-height:1.5;flex:1}
.star-btn{background:none;border:none;cursor:pointer;font-size:15px;color:var(--star);padding:0 2px;flex-shrink:0;margin-top:2px;line-height:1;transition:color .15s,transform .15s}
.star-btn:hover{transform:scale(1.2)}
.star-btn .si{display:inline}.star-btn .sf{display:none}
.star-btn.on .si{display:none}.star-btn.on .sf{display:inline;color:var(--star-on)}
.chev{font-size:15px;color:var(--bd2);flex-shrink:0;margin-top:2px;transition:transform .2s}
.qhead.open .chev{transform:rotate(180deg)}
.qbody{display:none;padding:0 13px 13px}.qbody.open{display:block}

/* ── Imagen ── */
.clinimg-wrap{margin:9px 0 7px;background:#111;border-radius:8px;overflow:hidden;border:1px solid var(--bd2);text-align:center}
.clinimg{max-width:100%;max-height:340px;object-fit:contain;display:block;margin:0 auto}
.clinimg-cap{font-size:11px;color:var(--txt3);padding:4px 0 5px;background:var(--hint);border-top:1px solid var(--bd)}

/* ── Opciones ── */
.opts{list-style:none;margin-top:9px;display:flex;flex-direction:column;gap:5px}
.opt{padding:9px 12px;border-radius:8px;border:1.5px solid var(--bd2);cursor:pointer;display:flex;align-items:flex-start;gap:9px;color:var(--txt);font-size:13px;line-height:1.45;transition:border-color .12s,background .12s;user-select:none}
.opt:hover:not(.done){border-color:#999;background:var(--hint)}
.opt.correct{background:var(--ok-bg);border-color:var(--ok-bd);color:var(--ok-t);font-weight:500;cursor:default}
.opt.wrong{background:var(--ko-bg);border-color:var(--ko-bd);color:var(--ko-t);cursor:default}
.opt.done:not(.correct):not(.wrong){cursor:default;opacity:.7}
.onum{font-size:11px;font-weight:700;flex-shrink:0;margin-top:2px;min-width:15px}

/* ── Modo repaso rápido ── */
.quick-card{padding:9px 12px;border-radius:8px;border:1.5px solid var(--ok-bd);background:var(--ok-bg);margin-top:8px}
.quick-rc{font-size:12.5px;font-weight:600;color:var(--ok-t);margin-bottom:6px}

/* ── Explicación ── */
.expbox{margin-top:10px;padding:10px 12px;background:var(--exp);border-left:4px solid var(--exp-bd);border-radius:0 8px 8px 0;font-size:12.5px;color:var(--exp-t);line-height:1.65}
.expbox b,.expbox strong{font-weight:600}
.et{display:block;margin-bottom:4px;font-weight:600;font-size:13px}
.atag{font-size:10px;padding:2px 6px;border-radius:4px;margin-left:5px;vertical-align:middle}
.atag.ok{background:var(--sc-ok);color:var(--ok-t)}.atag.ko{background:var(--sc-ko);color:#c0392b}

/* ── All-tab CSS ── */
.container[data-tab="all"] .ph{display:none!important}
.container[data-tab="all"] .sec-actions{display:none!important}
.container[data-tab="all"] .no-failed{display:none!important}
.container[data-tab="all"] .nota-box{display:none!important}
.container:not([data-tab="all"]) .global-nota-box{display:none!important}
.container:not([data-tab="all"]) #stats-global{display:none!important}

/* ── Contadores ✓ ✗ ○ pulsables: filtran las preguntas ── */
.sc.ok,.sc.ko,.sc.rem{cursor:pointer;user-select:none;-webkit-user-select:none;transition:box-shadow .15s}
.sc.ok:hover,.sc.ko:hover,.sc.rem:hover{box-shadow:0 0 0 1px var(--bd2)}
.sc.ok.on{box-shadow:0 0 0 1.5px var(--ok-t)}
.sc.ko.on{box-shadow:0 0 0 1.5px var(--ko-t)}
.sc.rem.on{box-shadow:0 0 0 1.5px var(--sc-rem-t)}
.qcard.rem-hidden{display:none!important}
.no-rem{display:none;text-align:center;padding:16px;color:var(--txt3);font-size:13px;border:1.5px dashed var(--bd2);border-radius:8px;margin-top:4px}
</style>
</head>
<body>
<header>
  <h1 id="h-tit">Banco MIR</h1>
  <div class="hright">
    <span class="hmeta" id="h-meta"></span>
    <!-- Temporizador -->
    <div id="timer-wrap" title="Haz clic en el tiempo para editar">
      <span id="timer-display">0:00:00</span>
      <button id="btn-tplay" onclick="timerToggle()" title="Play/Pausa">▶</button>
      <button onclick="timerReset()" title="Reset">↺</button>
    </div>
    <button class="hbtn" id="btn-dark" onclick="toggleDark()" title="Modo oscuro">🌙</button>
    <span id="save-badge" class="sbadge"></span>
  </div>
</header>
<div id="prog-wrap"><div id="prog-bar"></div></div>

<div class="container" id="main-cont" data-tab="all">
  <!-- Buscador -->
  <div class="search-wrap">
    <input type="text" id="search-input" placeholder="🔍 Buscar en enunciados..." oninput="onSearch(this.value)">
    <button class="search-clear" id="search-clear" onclick="clearSearch()">✕</button>
  </div>
  <div id="search-count"></div>

  <!-- Modo -->
  <div class="mode-bar">
    <span style="font-size:11.5px;color:var(--txt3);font-weight:600">MODO:</span>
    <button class="mode-btn on" id="mode-test" onclick="setMode('test')">📝 Test</button>
    <button class="mode-btn" id="mode-quick" onclick="setMode('quick')">⚡ Repaso rápido</button>
    <button class="mode-btn" id="btn-stars" onclick="filterStarred()" style="margin-left:auto;border-color:#f59e0b;color:#b45309">⭐ Marcadas</button>
    <button class="mode-btn" id="btn-stats" onclick="toggleStats()">📊 Errores</button>
  </div>

  <!-- Stats globales -->
  <div class="stats-box" id="stats-global"></div>

  <!-- Tabs -->
  <div class="tabs" id="tabs-wrap"></div>

  <!-- Score global -->
  <div class="ph-global">
    <div class="ph-left">
      <span class="ph-desc" id="ph-gdesc"></span>
      <div class="score-row">
        <span class="sc ok" id="sc-ok-all">✓ 0</span>
        <span class="sc ko" id="sc-ko-all">✗ 0</span>
        <span class="sc rem" id="sc-rem-all">○ 0</span>
      </div>
    </div>
  </div>
  <div class="global-actions">
    <button class="reset-btn" onclick="resetAll()">↺ Reiniciar y mezclar</button>
    <button class="nota-btn" onclick="calcNotaAll()">✎ Calcular nota global</button>
  </div>
  <div class="global-nota-box" id="nota-all"></div>
  <p class="hint">💡 <b>1–5</b> responde · <b>↑↓</b> navega · <b>S</b> marca ⭐ · Progreso guardado automáticamente</p>

  <div id="panels-wrap"></div>
</div>

<script>
/* ═══════════════════════════════════════ MOTOR v10 ═══════════════════════════════════════ */

var KEY=/*__KEY__*/'hemato_examenes_parcial_v1';
var META=/*__META_JSON__*/{"titulo": "Hemato-Onco · Exámenes anteriores (parcial)", "subtitulo": "Preguntas reales de 2018-2025 del temario del parcial, sin repetidas, con claves comprobadas con tus apuntes 2026", "examen": "Parcial Hemato-Onco 2-11-2026", "secciones": {"nmp": {"label": "Hemato · NMP crónicas (T1)", "emoji": "🧬", "color": "#f472b6", "colorDim": "#f472b622", "desc": "36 preguntas de exámenes reales"}, "transf": {"label": "Hemato · Transfusión (T2)", "emoji": "🩸", "color": "#ef4444", "colorDim": "#ef444422", "desc": "9 preguntas de exámenes reales"}, "anem": {"label": "Hemato · Anemias (T3)", "emoji": "🔴", "color": "#fb7185", "colorDim": "#fb718522", "desc": "37 preguntas de exámenes reales"}, "insuf": {"label": "Hemato · Insuficiencias medulares (T4)", "emoji": "🦴", "color": "#f59e0b", "colorDim": "#f59e0b22", "desc": "19 preguntas de exámenes reales"}, "trombo": {"label": "Hemato · Trombosis y anticoagulación (M10)", "emoji": "🧊", "color": "#38bdf8", "colorDim": "#38bdf822", "desc": "18 preguntas de exámenes reales"}, "gen": {"label": "Onco · Generalidades y fármacos (T27-31)", "emoji": "🔬", "color": "#a78bfa", "colorDim": "#a78bfa22", "desc": "22 preguntas de exámenes reales"}, "mama": {"label": "Onco · Mama (T32)", "emoji": "🎗️", "color": "#ec4899", "colorDim": "#ec489922", "desc": "27 preguntas de exámenes reales"}, "pulmon": {"label": "Onco · Pulmón (T35)", "emoji": "🫁", "color": "#22d3ee", "colorDim": "#22d3ee22", "desc": "5 preguntas de exámenes reales"}, "digest": {"label": "Onco · Páncreas, hígado, GIST y digestivo (T36-38)", "emoji": "🫃", "color": "#84cc16", "colorDim": "#84cc1622", "desc": "33 preguntas de exámenes reales"}, "uro": {"label": "Onco · Testículo, riñón y próstata (T39-40)", "emoji": "🫘", "color": "#eab308", "colorDim": "#eab30822", "desc": "28 preguntas de exámenes reales"}, "sarc": {"label": "Onco · Sarcomas y tumores óseos (T43-44)", "emoji": "🦿", "color": "#fb923c", "colorDim": "#fb923c22", "desc": "10 preguntas de exámenes reales"}}};
var D=/*__D_JSON__*/{"nmp": [{"n": "1", "noShuffle": false, "img": null, "q": "Un varón de 62 años con historia de cefaleas frecuentes en los cuatro últimos meses acude al hospital por aparición de dolor brusco en hipocondrio derecho y distensión abdominal de 48 horas de evolución. A la exploración se objetiva hepatomegalia dolorosa, esplenomegalia y ascitis y el resultado de su hemograma es el siguiente: leucocitos 12.000/mm3, hemoglobina 22 gr/dL, plaquetas 425.000/mm3. ¿Cuál es la explicación más probable del proceso?", "o": ["Linfoma hepatoesplénico", "Síndrome de Budd-Chiari", "Tricoleucemia", "Cirrosis hepática descompensada"], "c": 2, "e": "Hb 22 g/dL + leucocitosis + plaquetas en el límite alto + esplenomegalia = <b>policitemia vera</b>; dolor brusco en hipocondrio derecho, hepatomegalia dolorosa y ascitis = trombosis de las suprahepáticas, <b>síndrome de Budd-Chiari</b>, complicación trombótica típica de las NMP. Las cefaleas encajan con la hiperviscosidad. <br><small>📌 Cayó en: recopilación 1.</small>"}, {"n": "2", "noShuffle": false, "img": null, "q": "Marque lo incorrecto:", "o": ["La FAL suele estar elevada en la fase crónica de la LMC", "La LMC cursa con una fase crónica y una crisis blástica", "La cefalea, astenia, sensación de plenitud posprandial y trastornos hemorrágicos pueden presentarse en la fase crónica de la LMC", "La esplenomegalia es muy frecuente de hallar en la LMC"], "c": 1, "e": "En la fase crónica de la LMC la <b>fosfatasa alcalina leucocitaria (FAL/FAG) está baja</b>; elevada orienta a reacción leucemoide. Las demás son ciertas: esplenomegalia frecuente (~50 %), leucostasis y hemorragias posibles, y evolución de fase crónica a crisis blástica (la fase acelerada puede faltar). <br><small>📌 Cayó en: parcial 2024.</small>"}, {"n": "3", "noShuffle": false, "img": null, "q": "En la fase crónica de la leucemia mieloide crónica no se observa una de las siguientes alteraciones", "o": ["Esplenomegalia", "Elevación de la fosfatasa alcalina leucocitaria", "Hiperuricemia", "Elevación de vitamina B12 y transcobalaminas."], "c": 2, "e": "En la fase crónica de la LMC la <b>fosfatasa alcalina leucocitaria (FAG) está BAJA</b>; alta orienta a reacción leucemoide. Esplenomegalia, hiperuricemia y aumento de B12/transcobalaminas sí aparecen por la proliferación granulocítica. <br><small>📌 Cayó en: parcial 2024.</small>"}, {"n": "4", "noShuffle": false, "img": null, "q": "En la leucemia mieloide crónica:", "o": ["El reordenamiento abl-bcr da lugar a una proteína de fusión con actividad tirosina kinasa.", "El cromosoma Filadelfia se negativiza después de un tratamiento prolongado con hidroxiurea", "La supervivencia de los pacientes es casi siempre inferior a un año.", "El IMATINIB es un citorreductor con efecto inhibidor de las bases pirimidinicas"], "c": 1, "e": "La t(9;22) genera el gen de fusión <b>BCR-ABL, cuya proteína (p210) tiene actividad tirosincinasa aumentada</b>. La hidroxiurea no negativiza el Ph (eso lo logran los ITK), la supervivencia actual se acerca a la de la población general y el imatinib es un inhibidor de tirosincinasa, no un antimetabolito. <br><small>📌 Cayó en: parcial 2024.</small>"}, {"n": "5", "noShuffle": false, "img": null, "q": "Una de las siguientes entidades no corresponde a los síndromes mieloproliferativos crónicos. Márquelo:", "o": ["Leucemia linfática crónica", "Trombocitosis esencial", "Policitemia vera", "Mielofibrosis idiopática"], "c": 1, "e": "La <b>leucemia linfática crónica es un síndrome linfoproliferativo</b>, no mieloproliferativo. Trombocitemia esencial, policitemia vera y mielofibrosis primaria (idiopática) son NMP clásicas. <br><small>📌 Cayó en: parcial 2024.</small>"}, {"n": "6", "noShuffle": false, "img": null, "q": "El cromosoma filadelfia t(9; 22) es característico de:", "o": ["Policitemia Vera", "Leucemias agudas", "Leucemia mieloide crónica", "Trombocitosis esencial"], "c": 3, "e": "El cromosoma Filadelfia, <b>t(9;22) → BCR-ABL, define la leucemia mieloide crónica</b>. PV y TE son BCR-ABL negativas (JAK2, CALR, MPL). Puede verse en algunas leucemias agudas (sobre todo LLA del adulto), pero no es lo característico de ellas. <br><small>📌 Cayó en: parcial 2024.</small>"}, {"n": "7", "noShuffle": false, "img": null, "q": "Un paciente de 53 años asintomático presenta un hemograma con leucocitos 17.000/mm3, hematíes 6.200.000 /mm3, hemoglobina 20 g/dL y plaquetas 650.000 /mm3. En la exploración física se aprecia una esplenomegalia de 5 cm. ¿Cuál de las siguientes determinaciones será positiva con más probabilidad en este paciente?", "o": ["Mutación CALR", "Mutación JAK2 V617F", "Reordenamiento BCR/ABL", "Mutación JAK2 exón 12"], "c": 2, "e": "Hb 20 g/dL con leucocitosis, trombocitosis y esplenomegalia = <b>policitemia vera: JAK2 V617F (más del 95 %)</b>. El exón 12 de JAK2 es solo ~5 %; CALR no aparece en la PV; BCR/ABL es de la LMC. <br><small>📌 Cayó en: recopilación 1.</small>"}, {"n": "8", "noShuffle": false, "img": null, "q": "Respecto a la leucemia mieloide crónica (LMC) ¿Cuál de las siguientes afirmaciones es falsa?", "o": ["El único tratamiento curativo de la LMC es el trasplante alogénico de progenitores hematopoyéticos", "La fase blástica de la enfermedad viene definida por la presencia de >20% de blastos en médula ósea o sangre periférica", "En el estudio de médula ósea podemos encontrar la traslocación típica en las células de otras líneas hematopoyéticas 9;22", "Al diagnóstico el 95% de los pacientes presentan la translocación típica (9;21) que da lugar al gen de fusión BCR/ABL"], "c": 4, "e": "La translocación de la LMC es <b>t(9;22)</b>, no (9;21): esa es la falsa. Alo-TPH como único tratamiento curativo, fase blástica con ≥20 % de blastos y Ph presente en otras líneas (origen en la célula madre) son ciertas. <br><small>📌 Cayó en: recopilación 1.</small>"}, {"n": "9", "noShuffle": false, "img": null, "q": "Desde el punto de vista clínico (signos y síntomas) en la LMC lo más frecuente al diagnóstico es:", "o": ["La existencia de un Síndrome constitucional.", "La existencia de un Síndrome anémico.", "La ausencia de clínica (paciente asintomático).", "La presencia de esplenomegalia."], "c": 3, "e": "Según los apuntes, el <b>60 % de las LMC están asintomáticas al diagnóstico</b> (hallazgo en una analítica de rutina); la esplenomegalia aparece en ~50 % y el síndrome constitucional y el anémico son menos frecuentes. <br><small>📌 Cayó en: recopilación 1.</small>"}, {"n": "10", "noShuffle": false, "img": null, "q": "En el tratamiento de la trombocitemia esencial es verdadero que:", "o": ["La hidroxiurea es el tratamiento de elección en primera línea", "Nunca se emplea aspirina por el riesgo hemorrágico", "Se utiliza interferón como tratamiento de elección en primera línea", "El imatinib es el tratamiento de elección en primera línea"], "c": 1, "e": "En la TE de alto riesgo la <b>hidroxiurea es el citorreductor de primera línea</b> (junto con AAS). La aspirina sí se usa (se evita en trombocitosis extremas), el interferón es alternativa (gestación, jóvenes) y el imatinib no tiene papel en la TE. <br><small>📌 Cayó en: recopilación 1.</small>"}, {"n": "11", "noShuffle": false, "img": null, "q": "Es cierto que en la clasificación revisada de las neoplasias hematológicas de la OMS de 2016", "o": ["Los principales criterios diagnósticos son las mutaciones somáticas en 3 genes (JAK2, CALR y MPL) junto con las alteraciones hematológicas y morfológicas.", "Los principales criterios diagnósticos son las mutaciones somáticas en 3 genes (JAK2, PML/RARA y MPL) junto con las alteraciones hematológicas y morfológicas.", "Los principales criterios diagnósticos son sólo las mutaciones somáticas en 3 genes (JAK2, CALR y AML1/ETO).", "Los principales criterios diagnósticos son sólo las alteraciones hematológicas y morfológicas de la línea megacariocítica."], "c": 1, "e": "La OMS 2016 basa el diagnóstico de las NMP BCR-ABL negativas en las <b>mutaciones driver JAK2, CALR y MPL junto con los datos hematológicos y morfológicos</b>. PML/RARA y AML1/ETO son de leucemias agudas, y no basta solo con la genética ni solo con la morfología. <br><small>📌 Cayó en: recopilación 1.</small>"}, {"n": "12", "noShuffle": false, "img": null, "q": "Es un hallazgo característico de la sangre periférica en la Mielofibrosis Primaria:", "o": ["La presencia de microcitosis", "La presencia de dianocitos", "La presencia de dacriocitos", "La presencia de esquistocitos y LDH alta"], "c": 3, "e": "La <b>mielofibrosis primaria da dacriocitos</b> (hematíes en lágrima) con cuadro leucoeritroblástico. La microcitosis es típica de la ferropenia, los dianocitos de talasemias y hepatopatías, y los esquistocitos con LDH alta de las microangiopatías trombóticas. <br><small>📌 Cayó en: recopilación 1.</small>"}, {"n": "13", "noShuffle": false, "img": null, "q": "La alteración citogenética característica de la leucemia mieloide crónica es:", "o": ["isocromosoma 6", "t(11;14)", "t(9;22)", "t(15;18)"], "c": 3, "e": "<b>t(9;22) = cromosoma Filadelfia → BCR-ABL</b>, definitoria de la LMC. La t(11;14) es del linfoma del manto; la t(15;18) no es ninguna de estas (la promielocítica es la t(15;17) PML-RARA y el folicular la t(14;18)). <br><small>📌 Cayó en: recopilación 1.</small>"}, {"n": "14", "noShuffle": true, "img": null, "q": "Para hacer el diagnóstico diferencial con otras eritrocitosis, es cierto que en la Policitemia Vera se observa:", "o": ["Hemoglobinas patológicas en la electroforesis", "Niveles altos de Eritropoyetina (EPO)", "Gasometría arterial normal", "\"a\" y \"c\" son ciertas"], "c": 3, "e": "La PV es una eritrocitosis primaria con <b>saturación arterial de O2 normal</b> (no hay hipoxia) y EPO baja. La EPO alta es de las secundarias y las hemoglobinas patológicas (de alta afinidad) se buscan en otras eritrocitosis; por eso «a y c» es falsa. <br><small>📌 Cayó en: recopilación 1. Enunciado reconstruido (del final 2025 solo se conserva un resumen).</small>"}, {"n": "15", "noShuffle": false, "img": null, "q": "Respecto a la Leucemia Neutrofílica Crónica es cierto que:", "o": ["Los neutrófilos en sangre periférica están en el rango de la normalidad.", "En el 50% se detectan mutaciones en el gen CSF3R", "Es una enfermedad relacionada con el virus de Ebstein Barr.", "Tiene una elevada frecuencia."], "c": 2, "e": "En la leucemia neutrofílica crónica se detecta <b>mutación de CSF3R en ~50 %</b> (cifra de los apuntes). Cursa con neutrofilia ≥25.000/µL (no normal), no se relaciona con el VEB y es muy infrecuente. <br><small>📌 Cayó en: recopilación 1.</small>"}, {"n": "16", "noShuffle": false, "img": null, "q": "Respecto a los factores pronósticos de Leucemia Mieloide Crónica no es cierto que:", "o": ["La cifra de plaquetas al diagnóstico influye en el pronóstico.", "La respuesta al tratamiento es un factor pronóstico menor.", "Se agrupan en índices pronósticos como el de Sokal, Hasford o EUTOS.", "La presencia de anomalías citogenéticas adicionales es desfavorable."], "c": 2, "e": "En la LMC la <b>respuesta al tratamiento es el factor pronóstico MÁS importante</b> (respuesta óptima a 3, 6 y 12 meses), no uno menor. Las plaquetas entran en Sokal y Hasford, los índices son Sokal, Hasford y EUTOS, y las anomalías citogenéticas adicionales son desfavorables. <br><small>📌 Cayó en: recopilación 1.</small>"}, {"n": "17", "noShuffle": false, "img": null, "q": "Respecto al tratamiento de la Policitemia Vera la siguiente afirmación es cierta:", "o": ["Paciente varón y sin historia previa de trombosis no necesitará tratamiento.", "Independientemente de la edad estará indicado el tratamiento citorreductor en los pacientes con antecedente de trombosis.", "En caso de trombosis previa habrá que dar aspirina y tratamiento anticoagulante sin tratamiento citorreductor.", "Paciente varón mayor y sin historia previa de trombosis no necesitará tratamiento."], "c": 2, "e": "En la PV, <b>trombosis previa (o edad ≥60) = alto riesgo → citorreducción</b> (hidroxiurea) además de flebotomías y AAS, sea cual sea la edad. Todo paciente necesita tratamiento (flebotomías para Hto <45 % + AAS) aunque no haya trombosis, y tras una trombosis no basta con antitrombóticos. <br><small>📌 Cayó en: recopilación 1. Enunciado reconstruido (del final 2025 solo se conserva un resumen).</small>"}, {"n": "18", "noShuffle": false, "img": null, "q": "Si tuviera que asociar una mutación genética a la Policitemia Vera (PV), ¿cuál sería?", "o": ["bcr-abl +.", "CALR exón 9.", "Mutaciones del exón 10 de MPL.", "JAK2 (V617F)."], "c": 4, "e": "La mutación asociada a la PV es <b>JAK2 V617F (más del 95 %)</b>. bcr-abl es de la LMC; CALR exón 9 y MPL exón 10 aparecen en TE y mielofibrosis, no en la PV. <br><small>📌 Cayó en: recopilación 1.</small>"}, {"n": "19", "noShuffle": false, "img": null, "q": "¿Cuál de los siguientes NO es un criterio mayor en el diagnóstico de la policitemia vera?", "o": ["Eritropoyetina sérica disminuida", "Mutación de JAK2", "Incremento de la masa eritrocitaria", "Biopsia de médula ósea compatible"], "c": 1, "e": "Criterios mayores OMS 2016 de PV: Hb/Hto o masa eritrocitaria elevados, biopsia medular compatible (panmielosis) y mutación de JAK2. La <b>EPO sérica disminuida es el criterio MENOR</b>. <br><small>📌 Cayó en: final 2025. Enunciado reconstruido (del final 2025 solo se conserva un resumen).</small>"}, {"n": "20", "noShuffle": false, "img": null, "q": "Respecto al espectro mutacional de la trombocitemia esencial, señale la afirmación INCORRECTA:", "o": ["Aproximadamente el 60 % presenta la mutación JAK2 V617F", "El 50 % presenta mutaciones del exón 9 de CALR", "Alrededor del 5 % presenta mutaciones de MPL", "Alrededor del 10 % son triple negativas"], "c": 2, "e": "Espectro mutacional de la TE: JAK2 V617F ~60 %, <b>CALR exón 9 ~20-25 % (no 50 %)</b>, MPL ~3-5 % y triple negativa ~10 %. <br><small>📌 Cayó en: final 2025. Enunciado reconstruido (del final 2025 solo se conserva un resumen).</small>"}, {"n": "21", "noShuffle": false, "img": null, "q": "En los criterios diagnósticos de consenso internacional de la leucemia neutrofílica crónica, ¿qué mutación constituye la mutación driver o firma genética de la enfermedad?", "o": ["Mutación de TET2", "Mutación de SRSF2", "Mutación de CSF3R", "Mutación de ASXL1"], "c": 3, "e": "La <b>mutación de CSF3R</b> (receptor del G-CSF) es la firma genética o mutación driver de la leucemia neutrofílica crónica en los criterios de consenso internacional. TET2, SRSF2 y ASXL1 son mutaciones acompañantes inespecíficas de las neoplasias mieloides. <br><small>📌 Cayó en: final 2025. Enunciado reconstruido (del final 2025 solo se conserva un resumen).</small>"}, {"n": "22", "noShuffle": false, "img": null, "q": "¿Cuál es la mutación característica de la leucemia neutrofílica crónica?", "o": ["EZH2", "JAK2 V617F", "MPL", "CSF3R"], "c": 4, "e": "<b>Leucemia neutrofílica crónica → CSF3R</b> (receptor del G-CSF). JAK2 V617F y MPL son las mutaciones de PV, TE y mielofibrosis; EZH2 es una mutación molecular de alto riesgo en la mielofibrosis. <br><small>📌 Cayó en: final 2025. Enunciado reconstruido (del final 2025 solo se conserva un resumen).</small>"}, {"n": "23", "noShuffle": false, "img": null, "q": "Respecto al tratamiento en la trombocitemia esencial indique la respuesta FALSA:", "o": ["La anagrelida es el tratamiento indicado en menores de 60 años pero contraindicado si hay antecedentes de cardiopatía", "El interferón recombinante es el tratamiento indicado durante la gestación", "El AAS no debe administrarse en casos de trombocitosis extrema ( > 1.000.000 µl) por el riesgo de Sdr de Von Willebrand adquirido", "La trombocitemia esencial es un síndrome mieloproliferativo crónico que siempre requiere tratamiento"], "c": 4, "e": "La TE <b>no siempre requiere tratamiento</b>: en muy bajo riesgo (≤60 años, sin trombosis, JAK2 negativo) basta la observación. El interferón en la gestación y evitar AAS con plaquetas >1.000.000/µL (Von Willebrand adquirido) son ciertas. <i>Ojo: en tus apuntes 2026 la 1.ª línea es la hidroxiurea a cualquier edad y la anagrelida una alternativa, así que la a también es discutible; la buscada es d.</i> <br><small>📌 Cayó en: final 2022.</small>"}, {"n": "24", "noShuffle": false, "img": null, "q": "Indique la respuesta CORRECTA:", "o": ["En la leucemia neutrofílica crónica hay leucocitosis sin mielemia y sin esplenomegalia", "En el síndrome hipereosinofílico existe lesión orgánica por infiltración de basófilos", "En la mastocitosis cutánea son muy frecuentes los síntomas digestivos", "En la mastocitosis sistémica se observa infiltración de tejidos por mastocitos"], "c": 4, "e": "La <b>mastocitosis sistémica se define por la infiltración de tejidos (médula ósea y otros órganos) por mastocitos</b>. La LNC sí tiene hepatoesplenomegalia, el síndrome hipereosinofílico lesiona por eosinófilos (no basófilos) y la mastocitosis cutánea se limita a la piel. <br><small>📌 Cayó en: final 2022. ⚠️ No sale tal cual en tus apuntes 2026.</small>"}, {"n": "25", "noShuffle": false, "img": null, "q": "Paciente de 58 años que en analítica por control rutinario de dislipemia se objetiva Leucocitos 116.000 / µL ( N 92% L 6% M 1%), Hg 15.6 Hto 49.7% Plaquetas 412.000/ µL. El frotis de sangre periférica muestra mielemia con basofilia y en la bioquímica sólo destaca incremento del ac úrico y de la LDH. A la exploración se palpa esplenomegalia que se confirma mediante la ecografía abdominal. A estas alturas, usted ya tiene una sospecha diagnóstica que debe confirmar solicitando:", "o": ["Un aspirado de médula ósea", "Una biopsia de médula ósea", "Reordenamiento bcr/abl", "Un TAC abdominal"], "c": 3, "e": "Leucocitosis con mielemia y basofilia, esplenomegalia, úrico y LDH altos = sospecha de <b>LMC: se confirma con el reordenamiento BCR-ABL</b> (PCR o FISH en sangre periférica). El aspirado sirve para la fase y la citogenética, pero no es lo pedido; biopsia y TAC no confirman el diagnóstico. <br><small>📌 Cayó en: final 2022.</small>"}, {"n": "26", "noShuffle": false, "img": null, "q": "La Policitemia Vera (PV) presenta en la mayoría de los casos la mutación JAK2:", "o": ["V617F.", "V607F.", "V617A.", "V627F"], "c": 1, "e": "La mutación de la PV es <b>JAK2 V617F</b> (valina → fenilalanina en el codón 617, exón 14), presente en más del 95 %. Las demás variantes no existen como mutaciones típicas. <br><small>📌 Cayó en: ordinaria 2024.</small>"}, {"n": "27", "noShuffle": false, "img": null, "q": "¿Cuál de las siguientes características no espera encontrar en un paciente con Policitemia vera?", "o": ["Masa eritrocitaria aumentada", "Hepatomegalia", "Esplenomegalia", "Saturación arterial mayor o igual a 92%"], "c": 2, "e": "Masa eritrocitaria aumentada, esplenomegalia y SatO2 ≥92 % (sin hipoxia) son los <b>criterios mayores clásicos (PVSG) de la PV</b>; la <b>hepatomegalia</b> no es criterio y es lo menos esperable. Ojo: puede aparecer en un 20-50 %. <br><small>📌 Cayó en: ordinaria 2024.</small>"}, {"n": "28", "noShuffle": true, "img": null, "q": "La mutación CSF3R se asocia a:", "o": ["La leucemia eosinofílica crónica", "La leucemia neutrofílica crónica", "Policitemia Vera (PV)", "Ninguna de las anteriores"], "c": 2, "e": "<b>CSF3R</b> (receptor del G-CSF) es la mutación característica de la <b>leucemia neutrofílica crónica</b>. La leucemia eosinofílica crónica se asocia a PDGFRA/PDGFRB o FGFR1 y la PV a JAK2. <br><small>📌 Cayó en: final 2018.</small>"}, {"n": "29", "noShuffle": true, "img": null, "q": "Con respecto a la Leucemia Mieloide Crónica (LMC) cuál de las siguientes afirmaciones es correcta:", "o": ["El cromosoma Filadelfia (Ph) es resultado de una traslocación recíproca entre los cromosomas 9 y 20", "El reordenamiento BCR/ABL está presente en aproximadamente un 50-60% de los casos", "El tratamiento de elección son los inhibidores tirosinkinasa (imatinib, dasatinib, nilotinib)", "\"a\" y \"c\" son correctas"], "c": 3, "e": "El tratamiento de elección de la LMC son los <b>inhibidores de tirosincinasa</b> (imatinib, dasatinib, nilotinib). El Ph es t(9;22), no 9;20, y el BCR-ABL está en prácticamente el 100 % (el Ph se ve en el cariotipo en ~90-95 %), no en el 50-60 %; por eso «a y c» es falsa. <br><small>📌 Cayó en: final 2018.</small>"}, {"n": "30", "noShuffle": false, "img": null, "q": "Señale la opción falsa de las siguientes opciones:", "o": ["Policitemia vera - JAK2", "Mielofibrosis - PDGFR-alfa", "Leucemia mieloide crónica - Bcr / abl", "Trombocitemia esencial - calreticulina (CALR)"], "c": 2, "e": "Los reordenamientos de <b>PDGFR-α son de las neoplasias eosinofílicas (SHE/LEC, sensibles a imatinib)</b>, no de la mielofibrosis (JAK2, CALR, MPL). PV-JAK2, LMC-BCR/ABL y TE-calreticulina son asociaciones correctas. <br><small>📌 Cayó en: final 2018.</small>"}, {"n": "31", "noShuffle": false, "img": null, "q": "Con respecto a las eritrocitosis, una de las siguientes afirmaciones no es correcta:", "o": ["La Policitemia Vera es una eritrocitosis primaria, independiente de la producción de eritropoyetina", "En las cardiopatías congénitas cianosantes con cortocircuito derecha-izquierda existe una hiperproducción adecuada de eritropoyetina", "El Síndrome de Gaisböck es una causa de pseudoeritrocitosis", "La Beta-talasemia minor es una de las causa de eritrocitosis primaria"], "c": 4, "e": "La <b>β-talasemia minor no es una eritrocitosis primaria</b>: tiene hematíes elevados pero microcíticos, con Hb normal o baja. Primaria es la PV (independiente de la EPO) y el síndrome de Gaisböck es una pseudoeritrocitosis. <i>(Opción b corregida: en la recopilación ponía «izquierda-derecha», que también sería falsa.)</i> <br><small>📌 Cayó en: final 2018.</small>"}, {"n": "32", "noShuffle": false, "img": null, "q": "¿Cuál de las siguientes opciones es incorrecta respecto a las neoplasias mieloproliferativas crónicas?", "o": ["Esplenomegalia, aumento de LDH y frotis sanguíneo con reacción leucoeritroblástica y dacriocitos: sugestivo de mielofibrosis", "La opción terapéutica del trasplante alogénico, hoy día, no es la primera en la mayoría de pacientes con leucemia mieloide crónica", "El tratamiento citorreductor con hidroxiurea es una opción terapéutica en pacientes con policitemia vera y trombocitemia esencial", "El tratamiento de primera línea en la leucemia mieloide crónica es ruxolitinib"], "c": 4, "e": "La primera línea de la LMC son los <b>inhibidores de tirosincinasa</b> (imatinib, dasatinib, nilotinib, bosutinib); el <b>ruxolitinib es un inhibidor de JAK</b> para mielofibrosis y PV resistente o intolerante a hidroxiurea. Las otras tres opciones son ciertas. <br><small>📌 Cayó en: final 2018.</small>"}, {"n": "33", "noShuffle": false, "img": null, "q": "¿Cuál de las siguientes entidades no pertenece a las neoplasias mieloproliferativas según la clasificación de la OMS de 2016?", "o": ["Leucemia neutrofílica crónica", "Mastocitosis", "Trombocitemia esencial", "Mielofibrosis primaria"], "c": 2, "e": "Desde la OMS 2016 la <b>mastocitosis es una categoría propia</b>, fuera de las neoplasias mieloproliferativas. La leucemia neutrofílica crónica, la trombocitemia esencial y la mielofibrosis primaria siguen siendo NMP. <br><small>📌 Cayó en: final 2018.</small>"}, {"n": "34", "noShuffle": false, "img": null, "q": "¿Qué mutación nos encontraremos más frecuentemente tanto en la TE como en la MFP?", "o": ["CALR exón 9", "JAK2 (V617F)", "MPL exón 10", "No suele haber mutaciones en estas dos entidades"], "c": 2, "e": "<b>JAK2 V617F</b> es la mutación más frecuente tanto en la TE como en la mielofibrosis primaria (~60 %); CALR es la segunda (20-25 %) y MPL la tercera. La mayoría de los pacientes tiene alguna mutación driver. <br><small>📌 Cayó en: final 2018.</small>"}, {"n": "35", "noShuffle": false, "img": null, "q": "No es un criterio mayor diagnóstico de PV", "o": ["Hematocrito superior a 49% en hombres y 48% en mujeres", "Presencia de la mutación V617F del gen JAK2 o mutación del exón 12 del gen JAK2", "Presencia de niveles de EPO normales", "Biopsia de médula ósea hipercelular con proliferación trilineal con megacariocitos maduros pleomorfos (diferentes tamaños)"], "c": 3, "e": "Criterios mayores OMS 2016 de PV: Hb/Hto elevados, biopsia con panmielosis y JAK2 V617F o exón 12. La EPO es el criterio menor y debe estar <b>baja</b>: unos <b>niveles normales de EPO no son criterio mayor</b> (ni siquiera menor). <br><small>📌 Cayó en: final 2018.</small>"}, {"n": "36", "noShuffle": false, "img": null, "q": "No forma parte del tratamiento de la MFP", "o": ["Las flebotomías para el control de la serie roja", "Los esteroides para el tratamiento de la anemia", "La hidroxiurea para la leucocitosis", "El ruxolitinib"], "c": 1, "e": "En la mielofibrosis el problema es la <b>anemia</b>, así que <b>no se hacen flebotomías</b> (son de la PV). Sí se usan tratamientos de la anemia (EPO, transfusiones, esteroides), hidroxiurea para la leucocitosis y ruxolitinib para la esplenomegalia y los síntomas. <br><small>📌 Cayó en: recopilación 2. ⚠️ No sale tal cual en tus apuntes 2026.</small>"}], "transf": [{"n": "1", "noShuffle": false, "img": null, "q": "Paciente mujer de 37 años que acude a urgencias por presentar síncope durante esa misma mañana tras una semana de astenia intensa. Refiere cuadro de infección de vías respiratorias con fiebre que ya se había resuelto hace unos 10 días que se trató de forma sintomática desde MAP. En la analítica llama la atención Hb de 5.2 g/dl, VCM 108 fl, leucocitos normales y 32.000 plaquetas/microlitro. En la BQ se destaca un FG disminuido con Cr de 2.2 mg/dl, iones normales. LDH 872 (elevada), reticulocitos elevados y haptoglobina indetectable. Con el perfil hemolítico ud solicita test de coombs que sale negativo y un frotis de sangre periférica donde se observan abundantes esquistocitos. ¿Cuál de las siguientes es falsa?", "o": ["Solicitaría un estudio de ADAMTS-13", "Iniciaría plasmaféresis antes de tener resultados de ADAMTS-13", "Realizaría transfusión de CH", "Realizaría transfusión de plaquetas"], "c": 4, "e": "Cuadro de <b>PTT</b> (hemólisis Coombs negativa, esquistocitos, trombopenia, fallo renal). <b>Transfundir plaquetas está contraindicado</b> (alimenta los microtrombos) salvo hemorragia grave. Sí: pedir ADAMTS-13, iniciar plasmaféresis sin esperar el resultado y transfundir hematíes si la anemia es sintomática (Hb 5,2 con síncope). <br><small>📌 Cayó en: parcial 2024.</small>"}, {"n": "2", "noShuffle": false, "img": null, "q": "Un paciente afecto de linfoma de Hodgkin en curso de quimioterapia con ABVD acude a urgencias por astenia. Se evidencia un valor de Hb de 6,5 g/dL y se decide transfundir 2 concentrados de hematíes. A las 72h tras el ingreso el paciente tiene fiebre con escalofríos, diarrea, un exantema macular en tronco y extremidades y la analítica muestra alteración de la bioquímica hepática (elevación de GGT y FA). ¿Cuál es su sospecha diagnóstica?", "o": ["Reacción hemolítica aguda post-transfusional", "Reacción injerto contra huésped post-transfusional", "Probable progresión hepática del linfoma de Hodgkin", "Infección por VHC post-transfusional"], "c": 2, "e": "Fiebre, exantema, diarrea y alteración hepática días después de transfundir a un inmunodeprimido (Hodgkin en QT) = <b>enfermedad injerto contra huésped asociada a transfusión</b>: linfocitos T del donante atacan al receptor; casi siempre mortal. Se previene <b>irradiando</b> los componentes. La hemolítica aguda es inmediata (minutos-horas) y el VHC no da este cuadro. <br><small>📌 Cayó en: recopilación 1. ⚠️ No sale tal cual en tus apuntes 2026.</small>"}, {"n": "3", "noShuffle": false, "img": null, "q": "Mujer de 35 años sin antecedentes previos relevantes. Acude a urgencias por cefalea y parestesias en hemicuerpo derecho. Se realiza una analítica que muestra Hb 7,5 g/dL, reticulocitos 10% (VN 0,5-2%), leucocitos 6.500/ mm3 con recuento leucocitario diferencial normal, plaquetas 3.000/ mm3. La bioquímica sérica muestra creatinina 1,5 mg/dL, bilirubina total 3 mg/dL (directa 0,7 mg/dL: normal), LDH 1000 UI/L y haptoglobina indetectable. En frotis de sangre periférica se observan abundantes esquistocitos. ¿Cuál es el tratamiento de elección en esta paciente?", "o": ["Recambio plasmático", "Corticosteroides endovenosos", "Gammaglobulinas endovenosas", "Transfusión de plaquetas"], "c": 1, "e": "Hemólisis con esquistocitos, trombopenia grave y daño renal y neurológico = <b>PTT</b> (déficit de ADAMTS-13). Tratamiento de elección: <b>recambio plasmático (plasmaféresis)</b> urgente, con corticoides y caplacizumab. Las gammaglobulinas son de la PTI y las <b>plaquetas están contraindicadas</b> (empeoran la trombosis). <br><small>📌 Cayó en: recopilación 1.</small>"}, {"n": "4", "noShuffle": false, "img": null, "q": "Mujer de 37 años que acude al servicio de urgencias por astenia ligera e ictericia mucocutánea. Se realiza una analítica que muestra una hemoglobina de 6,8 gr/dL (V. normales 13,5-17,5), VCM 92 fL (VN 80-100), LDH 1980 UI/L (VN 0,0-250) y una bilirrubina indirecta de 2,5 mg/dL (VN 0,0-0,9). ¿Cuál consideraría la actitud más adecuada?", "o": ["Realizar un aspirado de médula lo antes posible para averiguar la etiología de la anemia", "Iniciar tratamiento con hierro oral y remitir a consulta externa de hematología para seguimiento.", "Transfundir dos concentrados de hematíes ya que la paciente presenta un síndrome anémico franco", "Realizar un test de Coombs, recuento de reticulocitos y haptoglobina e iniciar tratamiento con corticosteroides"], "c": 4, "e": "Anemia normocítica con LDH muy alta e hiperbilirrubinemia indirecta = <b>patrón hemolítico</b>; en una adulta lo más probable es una AHAI. Se confirma con <b>Coombs directo</b>, reticulocitos y haptoglobina, y se inician corticoides. Con astenia ligera <b>no se transfunde</b>; tampoco hierro ni aspirado medular de entrada. <br><small>📌 Cayó en: recopilación 1, final 2018.</small>"}, {"n": "5", "noShuffle": false, "img": null, "q": "Una mujer de 89 años ingresa por urgencias con una hemorragia digestiva alta secundaria a ingesta de cáusticos. A su llegada la paciente se encuentra estable hemodinámicamente. Entre sus antecedentes personales figura un infarto de miocardio hace dos años. En la analítica destaca una cifra de hemoglobina de 6 g/dL y un alargamiento de todos los tiempos de la coagulación. Por ello se decide transfundir. Se hace grupo sanguíneo y en dicha determinación se comprueba que la paciente es A negativo. ¿Qué opción es más correcta?", "o": ["Concentrado de hematíes AB negativo y plasma AB", "Concentrado de hematíes A negativo y plasma A", "Concentrado de hematíes O negativo y plasma O", "No transfundir"], "c": 2, "e": "Paciente A negativo: lo ideal es <b>isogrupo</b>, hematíes A− y plasma A. Los hematíes AB llevan antígeno B (ella tiene anti-B) y el <b>plasma O</b> contiene anti-A y anti-B, que atacarían sus hematíes. Hb 6 con cardiopatía isquémica y coagulopatía obligan a transfundir hematíes y plasma. <br><small>📌 Cayó en: recopilación 1.</small>"}, {"n": "6", "noShuffle": false, "img": null, "q": "Mujer de 21 años, hemodinámicamente estable, con Hb 6,1 g/dL, VCM 71 fL, IST 11 % y ferritina 8 ng/mL. ¿Cuál es la actitud más adecuada?", "o": ["Transfusión de dos concentrados de hematíes", "Hierro oral, sin transfusión", "Vitamina B12 intramuscular", "Eritropoyetina subcutánea"], "c": 2, "e": "Ferropenia grave (microcitosis, IST y ferritina bajas) en una joven <b>estable</b>: <b>hierro oral</b> y buscar la causa (menstruación, digestiva). La transfusión se evita en mujeres jóvenes sin síndrome anémico grave (riesgo de aloinmunización). Hierro IV si malabsorción o necesidad de reposición rápida. B12 y EPO no corrigen una ferropenia. <br><small>📌 Cayó en: final 2025. Enunciado reconstruido (del final 2025 solo se conserva un resumen).</small>"}, {"n": "7", "noShuffle": false, "img": null, "q": "Mujer de 35 años que consulta por astenia de meses de evolución. El médico de atención primaria le solicita una analítica: Hb: 8 g/dl, VCM: 65 fl, reticulocitos: 25.000/µL, hierro sérico: 30 microg/dl, transferrina: 350mg/dl ferritina: 4 ng/ml, IST: 8%. Con estos resultados cual cree que es la opción menos correcta:", "o": ["Remitiría a la paciente a urgencias para ingreso y soporte transfusional.", "Iniciaría estudio de la causa: examen ginecológico, enfermedad celiaca, etc.", "Iniciaría tratamiento con sales ferrosas vía oral", "Solicitaría un frotis de sangre periférica en el que se observaría microcitosis, hipocromía y anisocitosis."], "c": 1, "e": "Ferropenia (VCM 65, ferritina 4, IST 8 %) con Hb 8 de instauración lenta y bien tolerada: tratamiento ambulatorio con <b>hierro oral</b>, estudio de la causa y frotis (microcitosis, hipocromía, anisocitosis). Lo <b>menos correcto</b> es <b>ingresar y transfundir</b>: no hay inestabilidad ni síndrome anémico grave. <br><small>📌 Cayó en: final 2022.</small>"}, {"n": "8", "noShuffle": true, "img": null, "q": "La inmunoprofilaxis con anticuerpos anti-D se administra", "o": ["En las semanas 28 y 34 del embarazo", "Así como dentro de las 72h posteriores al parto o cesárea", "En caso de aborto, maniobras obstétricas asociadas a hemorragia transplacentaria o traumatismo abdominal", "Todas las anteriores"], "c": 4, "e": "La gammaglobulina anti-D se da a la gestante <b>Rh negativa</b> no sensibilizada: <b>prenatal en la semana 28</b> (dosis única; en algunos protocolos, 28 y 34), en las <b>72 h posparto</b> si el recién nacido es Rh+, y tras <b>aborto, maniobras o traumatismos</b> con posible hemorragia transplacentaria. → Todas. <br><small>📌 Cayó en: final 2018. ⚠️ No sale tal cual en tus apuntes 2026.</small>"}, {"n": "9", "noShuffle": false, "img": null, "q": "Tras un accidente de tráfico, llega a urgencias un varón de 35 años. Se decide realizar pruebas cruzadas ante la posibilidad de necesitar transfusiones. Su grupo sanguíneo es B+. ¿Cuál de las siguientes es la combinación de sangre y plasma que el paciente podría recibir?", "o": ["Sangre del grupo B+ y Plasma del grupo A", "Sangre del grupo B- y Plasma del grupo O +.", "Sangre del grupo O+ y Plasma del grupo AB+.", "Sangre del grupo A- y Plasma del grupo B -"], "c": 3, "e": "Receptor B: hematíes <b>B u O</b> (sin antígeno A) y plasma <b>B o AB</b> (sin anti-B). Solo la c cumple: hematíes O+ y plasma AB (sin anticuerpos, plasma universal). El plasma A u O lleva anti-B, y los hematíes A llevan antígeno A frente al anti-A del receptor. <br><small>📌 Cayó en: final 2018.</small>"}], "anem": [{"n": "1", "noShuffle": false, "img": null, "q": "Paciente de 61 años con diabetes, obesidad e infarto agudo de miocardio portador de stents, que presenta pérdida de 11 kg de peso y una anemia macrocítica con Hb de 7,2 g/dL y déficit importante de vitamina B12. ¿Cuál es la actitud más adecuada?", "o": ["Vitamina B12 oral y control analítico en 3 meses", "Ácido fólico oral y control analítico en 3 meses", "Vitamina B12 intramuscular, sin transfusión ni otros estudios", "Soporte transfusional, vitamina B12 parenteral y estudio con TAC y gastroscopia/colonoscopia"], "c": 4, "e": "Hb 7,2 en un cardiópata (IAM con stents) → <b>transfusión</b>; déficit importante de B12 → reposición <b>parenteral</b>; y la <b>pérdida de 11 kg</b> obliga a descartar una neoplasia digestiva (TAC y gastroscopia/colonoscopia). Las demás opciones dejan sin estudiar el síndrome constitucional. <br><small>📌 Cayó en: final 2025. Enunciado reconstruido (del final 2025 solo se conserva un resumen).</small>"}, {"n": "2", "noShuffle": false, "img": null, "q": "A una mujer de 30 años, asintomática, en un examen rutinario se le detecta anemia. En la exploración física tiene subictericia conjuntival y mínima esplenomegalia. Historia familiar de litiasis biliar en edades tempranas. Todo ello sugiere el diagnóstico de:", "o": ["Déficit de vitamina B12 y/o ácido fólico", "Esferocitosis hereditaria", "Talasemia minor", "Hemoglobinuria paroxística nocturna"], "c": 2, "e": "Anemia + subictericia + esplenomegalia + litiasis biliar precoz en la familia = hemólisis extravascular congénita: <b>esferocitosis hereditaria</b>, la membranopatía más frecuente. La talasemia minor suele ser asintomática, sin hemólisis relevante; la HPN es adquirida, y la megaloblástica no explica la litiasis familiar precoz. <br><small>📌 Cayó en: recopilación 1.</small>"}, {"n": "3", "noShuffle": false, "img": null, "q": "Paciente de 64 años de edad diagnosticado de leucemia linfática crónica en estadio A desde hace 6 meses, acude a urgencias por un cuadro de astenia e ictericia de 48 h de evolución. La exploración física revela adenopatías cervicales y un soplo sistólico panfocal. El hemograma muestra 46.000 leucocitos/mm3 (V. normales 4.000-11.500) con un 87% de linfocitos, Hb 6,8 g/dl (V. normales 13,5-17,5), VCM 105 fl (V. normales 80-100) y 217.000 plaquetas/mm3 (V. normales 125.000-450.000), bilirrubina total 4,9 mg/dl (VN 0,0-1,2), bilirrubina directa 0,7 mg/dl (VN 0,0-0,9), LDH 1278 U/l (VN 0,0-250), GOT 38 U/l (VN 0-40), GGT 39 U/l (VN 0-59) y fosfatasas alcalinas 179 U/l (VN 40-130). Indique cuál de las siguientes pruebas o combinación de pruebas será de mayor utilidad diagnóstica.", "o": ["Ecografía hepática", "Sideremia, ferritina, B12 y ácido fólico", "Test de Coombs directo", "Niveles de reticulocitos"], "c": 3, "e": "LLC + anemia brusca con <b>hiperbilirrubinemia indirecta y LDH muy alta</b> (VCM alto por reticulocitosis) = hemólisis. La complicación típica de la LLC es la <b>anemia hemolítica autoinmune por anticuerpos calientes</b>, que se confirma con el <b>Coombs directo</b>. Los reticulocitos solo confirmarían que es regenerativa. <br><small>📌 Cayó en: recopilación 1.</small>"}, {"n": "4", "noShuffle": false, "img": null, "q": "Varón de 67 años, gastrectomizado, con Hb 8,8 g/dl, VCM 120 fl, reticulocitos bajos y, en el frotis, megaloblastos y neutrófilos hipersegmentados. Señale la afirmación correcta:", "o": ["Anemia arregenerativa macrocítica cuya causa más frecuente es la megaloblástica; hay que solicitar estudio de carenciales (B12 y ácido fólico)", "Anemia regenerativa de origen hemolítico; la prueba indicada es el test de Coombs directo", "Anemia microcítica ferropénica; debe iniciarse hierro oral sin más estudios", "Anemia de trastornos crónicos; no precisa más estudios"], "c": 1, "e": "VCM 120 + reticulocitos bajos + neutrófilos hipersegmentados = <b>anemia megaloblástica</b> (arregenerativa macrocítica). La gastrectomía elimina el factor intrínseco: <b>déficit de B12</b>; se piden B12 y fólico. No es hemolítica (reticulocitos bajos), ni ferropénica (VCM alto), ni de trastornos crónicos (normocítica). <br><small>📌 Cayó en: final 2025. Enunciado reconstruido (del final 2025 solo se conserva un resumen).</small>"}, {"n": "5", "noShuffle": false, "img": null, "q": "Varón de 65 años que es remitido a urgencias desde atención primaria por cuadro de astenia, dolor abdominal y vómitos. En el estudio realizado en urgencias se observa: Hb: 5,5 g/dl, VCM: 120 fl, leucocitos: 1.500/ µL, Neutrófilos: 800/ µL, plaquetas 45.000/ µL. Reticulocitos: 15.000/ µL. Frotis: anisocitosis marcada con ovalocitos y pleocariocitos. En la bioquímica destaca un aumento de LDH y bilirrubina indirecta. Señale la afirmación correcta respecto a las pruebas diagnósticas que solicitaría para confirmar la sospecha diagnóstica:", "o": ["Anemia hemolítica autoinmune-Coombs directo", "Anemia megaloblástica-niveles de vitamina B12 y ácido fólico", "Déficit de G6PDH-niveles de G6PDH", "Anemia drepanocítica-electroforesis de hemoglobinas"], "c": 2, "e": "Pancitopenia macrocítica (VCM 120) con <b>reticulocitos bajos</b>, macroovalocitos, <b>neutrófilos hipersegmentados</b> (pleocariocitos) y LDH y bilirrubina indirecta altas por hemólisis intramedular = <b>anemia megaloblástica</b> → niveles de B12 y fólico. Las hemolíticas periféricas (AHAI, G6PD, drepanocitosis) cursarían con reticulocitosis. <br><small>📌 Cayó en: final 2022.</small>"}, {"n": "6", "noShuffle": false, "img": null, "q": "¿En cuál de las siguientes situaciones no veremos esquistocitos?", "o": ["Anemia hemolítica autoinmune", "Anemia hemolítica por prótesis mecánica aórtica", "Síndrome hemolítico urémico", "Coagulación intravascular diseminada"], "c": 1, "e": "En la AHAI la destrucción es inmunitaria (extravascular, bazo) y el frotis muestra <b>esferocitos</b>, no esquistocitos. Los <b>esquistocitos</b> son fragmentos por daño mecánico: prótesis valvulares y microangiopatías trombóticas (SHU, PTT, CID). <br><small>📌 Cayó en: recopilación 1.</small>"}, {"n": "7", "noShuffle": false, "img": null, "q": "Señale la asociación incorrecta:", "o": ["Esquistocitos: púrpura trombótica trombocitopénica", "Equinocitos: insuficiencia renal crónica", "Acantocitos: cirrosis hepática", "Queratocitos: trombocitopenia inmune primaria"], "c": 4, "e": "Los <b>queratocitos</b> (hematíes «con cuernos», por fragmentación) aparecen en la hemólisis mecánica (microangiopatías, CID, prótesis), no en la <b>PTI</b>, que no altera los hematíes. Correctas: esquistocitos en PTT, equinocitos en uremia (IRC) y acantocitos en hepatopatía grave/cirrosis. <br><small>📌 Cayó en: ordinaria 2024. ⚠️ No sale tal cual en tus apuntes 2026.</small>"}, {"n": "8", "noShuffle": false, "img": null, "q": "Marque la respuesta incorrecta con respecto al Síndrome hemolítico urémico.", "o": ["Se asocia a una infección por una cepa de E. Coli.", "Se caracteriza por anemia hemolítica, trombocitopenia e insuficiencia renal aguda oligoanúrica.", "Generalmente tiene mal pronóstico, especialmente en chicos.", "Dentro del tratamiento conservador, pueden requerir diálisis."], "c": 3, "e": "Falsa la c: el <b>SHU típico</b> (E. coli productor de toxina Shiga, O157:H7) predomina en <b>niños</b> y suele tener <b>buen pronóstico</b> con tratamiento de soporte. Ciertas: anemia hemolítica + trombopenia + fracaso renal agudo, y algunos precisan diálisis. No se dan antibióticos. <br><small>📌 Cayó en: ordinaria 2024. ⚠️ No sale tal cual en tus apuntes 2026.</small>"}, {"n": "9", "noShuffle": false, "img": null, "q": "Cuál de las siguientes es FALSA:", "o": ["Las anemias hemolíticas adquiridas son anemias arregenerativas y suelen tener elevación de LDH, bilirrubina, reticulocitos y disminución de Haptoglobina.", "Las anemias ferropénicas son arregenerativas, suelen cursar con disminución de IST y de la ferritina.", "Las anemias de trastornos crónicos suelen deberse a causa multifactorial en pacientes pluripatológicos, polimedicados y se pueden tratar con EPO.", "En la anemia ferropénica la hepcidina estará disminuida y en la anemia por trastornos crónicos suele estar aumentada."], "c": 1, "e": "Las hemolíticas adquiridas son <b>regenerativas</b>: la destrucción es periférica y la médula responde (reticulocitos, LDH y bilirrubina indirecta altos, haptoglobina baja). La trampa: el resto del perfil está bien descrito. Ferropénica arregenerativa con IST y ferritina bajos, crónicos tratables con EPO y hepcidina baja/alta son ciertas. <br><small>📌 Cayó en: parcial 2024.</small>"}, {"n": "10", "noShuffle": false, "img": null, "q": "Mujer de 40 años sin antecedentes de interés, consulta en atención primaria por astenia y palidez cutánea, sin otra sintomatología. Se realiza una analítica en la que se observa una hemoglobina de 7,0 g/dl, VCM: 75 fl, reticulocitos bajos. Se realiza un metabolismo Fe en el que se observa aumento de ferritina, transferrina baja y un IST normal ¿Cuál de las siguientes afirmaciones es verdadera:", "o": ["Ante la sospecha de anemia de trastorno crónico se debe realizar una biopsia de médula ósea en primer lugar", "Pautaría sales ferrosas vía oral", "Es importante el estudio etiológico y el tratamiento será el de la enfermedad de base.", "La causa más frecuente probablemente será por pérdidas ginecológicas."], "c": 3, "e": "Ferritina alta + transferrina baja + IST normal = <b>anemia de trastornos crónicos</b>: hay que buscar la causa y tratar la enfermedad de base. No precisa biopsia medular de entrada, el hierro oral no sirve (hepcidina alta) y las pérdidas ginecológicas darían ferropenia (ferritina baja, transferrina alta). <br><small>📌 Cayó en: parcial 2023.</small>"}, {"n": "11", "noShuffle": false, "img": null, "q": "Paciente varón de 80 años con antecedentes de DM, HTA e ictus isquémico. Tratamiento crónico con aspirina, omeprazol, metformina e irbesartan. En un hemograma realizado por el médico de atención primaria se observa: Hb: 7 g/dl, VCM: 120 fl, leucocitos: 2.500 /mm3, neutrófilos: 1.200/mm3, plaquetas: 75.000/mm3, reticulocitos disminuidos. LDH y bilirrubina indirecta discretamente elevada. Frotis de sangre periférica: ovalocitos, neutrófilos hipersegmentados, ausencia de agregados plaquetares y no se observan blastos. El diagnóstico más probable es:", "o": ["Anemia hemolítica por déficit de glucosa 6-fosfato-deshidrogenasa", "Anemia megaloblástica por déficit de vitamina B12", "Síndrome de VEXAS", "Leucemia mieloide aguda"], "c": 2, "e": "Macrocitosis con pancitopenia, reticulocitos bajos, hemólisis leve (LDH y bilirrubina indirecta), ovalocitos y <b>neutrófilos hipersegmentados = anemia megaloblástica</b>; omeprazol y metformina favorecen el déficit de B12. El déficit de G6PD daría hemólisis regenerativa, sin blastos no es LMA y nada apunta a VEXAS (inflamación sistémica, vacuolas en precursores). <br><small>📌 Cayó en: parcial 2023.</small>"}, {"n": "12", "noShuffle": false, "img": null, "q": "Respecto a la betatalasemia señale la respuesta falsa", "o": ["Los rasgos talasémicos son asintomáticos", "La talasemia minor puede presentar una anemia leve microcítica e hipocroma", "Las manifestaciones clínicas de la talasemia intermedia se deben a la eritropoyesis ineficaz, la hemólisis y la sobrecarga de hierro", "La talasemia mayor es incompatible con la vida"], "c": 4, "e": "La <b>β-talasemia mayor (anemia de Cooley) es compatible con la vida</b> con transfusiones y quelación; lo incompatible con la vida es la hidropesía fetal de la α-talasemia (4 genes). Rasgo asintomático, minor microcítica leve e intermedia por eritropoyesis ineficaz, hemólisis y sobrecarga de hierro son ciertas. <br><small>📌 Cayó en: parcial 2023.</small>"}, {"n": "13", "noShuffle": false, "img": null, "q": "Mujer de 52 años, con artritis reumatoide, que se encuentra actualmente controlada en tratamiento con metotrexato. En el hemograma se encuentra: Hb 10 g/dL (V. normales 13,5-17,5), VCM 110 (VN 80-100), leucocitos 2.500/mm³ (V. normales 4,000 -11,500), plaquetas 100.000/mm³ (V. normales 125.000 -450.000) y en el frotis de sangre periférica se observan macroovalocitos e hipersegmentación de neutrófilos. El cuadro hematológico de esta paciente precisará, probablemente, tratamiento con:", "o": ["Corticosteroides", "Ácido folínico", "Ácido fólico", "Vitamina B12"], "c": 2, "e": "Megaloblastosis en tratamiento con <b>metotrexato</b>, que inhibe la dihidrofolato reductasa: se trata con <b>ácido folínico</b>, forma ya reducida que no necesita esa enzima. El ácido fólico depende de la enzima bloqueada, la B12 no corrige este mecanismo y los corticoides no tratan la megaloblastosis. <br><small>📌 Cayó en: recopilación 1. ⚠️ No sale tal cual en tus apuntes 2026.</small>"}, {"n": "14", "noShuffle": false, "img": null, "q": "Varón de 23 años que presenta el antecedente reciente de cuadro de rinorrea, lagrimeo, tos y expectoración blanquecina y otalgia. Acude por aparición de disnea de moderados esfuerzos y astenia. Además, refiere coloración azulada de los dedos con el frío. En la analítica presenta una hemoglobina de 7,7 g/dl, VCM 95, leucocitos 6000, plaquetas 300.000. GOT 23, GPT33, GGT 43, FA 33, LDH 340, bilirrubina indirecta 3,3. haptoglobina baja y reticulocitos 100.000. Test de Coombs positivo. Con respecto a la enfermedad que se sospecha, señale la respuesta incorrecta:", "o": ["Suele tener una buena respuesta a corticoides", "Puede ser secundaria a síndromes linfoproliferativos", "Habitualmente se activa el complemento", "Suele producirse por autoanticuerpos IgM"], "c": 1, "e": "Infección respiratoria (Mycoplasma), acrocianosis y Coombs positivo = <b>AHAI por anticuerpos fríos (IgM anti-I), que responde mal a corticoides</b>: evitar el frío, rituximab, plasmaféresis. Es cierto que activa el complemento, que es IgM y que puede ser secundaria a linfoproliferativos. Los corticoides son de los anticuerpos calientes. <br><small>📌 Cayó en: recopilación 1.</small>"}, {"n": "15", "noShuffle": false, "img": null, "q": "En relación con el diagnóstico de las anemias microcíticas, ¿cuál de las afirmaciones siguientes es falsa?", "o": ["En la anemia sideroblástica hay un aumento de los depósitos de hierro en el organismo", "En la anemia ferropénica siempre hay que investigar la causa de déficit de hierro", "Tanto en la anemia ferropénica como en la anemia de trastornos crónicos la ferritina está disminuida", "En la beta talasemia el número de hematíes suele estar normal o aumentado"], "c": 3, "e": "<b>La ferritina está baja en la ferropenia pero normal o alta en los trastornos crónicos</b> (es reactante de fase aguda); es el dato que las separa. Depósitos de hierro aumentados en la sideroblástica, buscar siempre la causa de la ferropenia y hematíes normales o altos en la β-talasemia son ciertas. <br><small>📌 Cayó en: recopilación 1.</small>"}, {"n": "16", "noShuffle": false, "img": null, "q": "En relación con el tratamiento de la anemia perniciosa, ¿Cuál de las siguientes afirmaciones es falsa?", "o": ["La vitamina B12 se debe administrar por vía parenteral", "La respuesta terapéutica es rápida", "La dosis terapéutica de la vitamina B12 debe estar en relación a la intensidad de la anemia", "El mecanismo responsable se mantiene toda la vida"], "c": 3, "e": "La <b>dosis de B12 no se ajusta a la intensidad de la anemia</b>: pauta estándar intramuscular, intensiva al principio y de mantenimiento de por vida. Es cierto que la vía es parenteral, que la respuesta es rápida (reticulocitosis en días) y que la gastritis autoinmune persiste toda la vida. <br><small>📌 Cayó en: recopilación 1. ⚠️ No sale tal cual en tus apuntes 2026.</small>"}, {"n": "17", "noShuffle": false, "img": null, "q": "Paciente diagnosticado de anemia ferropénica de causa conocida. Se le instaura tratamiento con sulfato ferroso. Si antes no ha habido contraindicación, la administración debe suspenderse cuando:", "o": ["Aumente la cifra de hemoglobina", "La sideremia sea normal", "El hierro de depósito (ferritina) sea normal.", "El volumen corpuscular medio sea normal"], "c": 3, "e": "El hierro oral se mantiene tras normalizar la Hb hasta la <b>repleción de depósitos: ferritina normal</b> (habitualmente 3-6 meses más). Suspenderlo al subir la Hb o al normalizarse la sideremia o el VCM deja los depósitos vacíos y la anemia recidiva. <br><small>📌 Cayó en: recopilación 1. ⚠️ No sale tal cual en tus apuntes 2026.</small>"}, {"n": "18", "noShuffle": false, "img": null, "q": "¿Cuál de las siguientes afirmaciones es falsa en relación con la anemia perniciosa?", "o": ["Se produce por un déficit de factor intrínseco", "En el hemograma encontramos anemia severa con VCM elevado y reticulocitos altos.", "El tratamiento consiste en la administración de vitamina B12 intramuscular", "La prueba diagnóstica de elección es la \"prueba de Schilling\" parenteral"], "c": 2, "e": "La anemia perniciosa es megaloblástica <b>arregenerativa: reticulocitos BAJOS</b>, no altos (hematopoyesis ineficaz). Se debe a déficit de factor intrínseco y se trata con B12 intramuscular. <i>La prueba de Schilling hoy está en desuso (dx con B12 sérica y anticuerpos anti-factor intrínseco).</i> <br><small>📌 Cayó en: recopilación 1.</small>"}, {"n": "19", "noShuffle": false, "img": null, "q": "Señale la relación incorrecta respecto a la etiología de la anemia por déficit de vitamina B12:", "o": ["Dieta inadecuada-vegetarianos estrictos", "Inhibición de células parietales-uso prolongado de inhibidores de la bomba de protones", "Alteraciones en el transporte-déficit congénito de alfa 1 antitripsina", "Alteraciones del intestino delgado-enfermedad celiaca"], "c": 3, "e": "Los defectos del <b>transporte de B12</b> se deben al déficit congénito de <b>transcobalamina II</b>, no de alfa-1-antitripsina. El veganismo estricto, los IBP prolongados (menos ácido para liberar la B12 de los alimentos) y la celiaquía sí pueden causar déficit. <br><small>📌 Cayó en: final 2022. ⚠️ No sale tal cual en tus apuntes 2026.</small>"}, {"n": "20", "noShuffle": false, "img": null, "q": "Respecto a la alfa-talasemia señale la afirmación incorrecta:", "o": ["Hidropesía fetal: la deleción afecta a los cuatro genes, formación de Hb de Bart (tetrámeros de gamma), anemia hemolítica severa con muerte en los primeros años de vida si no se realiza trasplante de médula", "Enfermedad por Hb H: deleción de tres genes, anemia hemolítica y esplenomegalia", "Rasgo talasémico: deleción de dos genes, discreto descenso de hemoglobina y microcitosis. La Hb A2 y Hb F son normales", "Talasemia silente: solo hay un gen afectado, no hay anemia"], "c": 1, "e": "La hidropesía fetal (deleción de los 4 genes, Hb Bart γ4) es <b>incompatible con la vida: muerte intrauterina o perinatal</b>, no en los primeros años. Enfermedad por Hb H (3 genes), rasgo (2 genes, HbA2 y HbF normales) y talasemia silente (1 gen, sin anemia) están bien descritos. <br><small>📌 Cayó en: final 2022.</small>"}, {"n": "21", "noShuffle": false, "img": null, "q": "Respecto a la hepcidina, señale la respuesta falsa:", "o": ["Inactiva la ferroportina de la membrana del enterocito", "Impide el paso de hierro a la circulación", "Bloquea la liberación de hierro en macrófagos", "Disminuye en la anemia de trastorno crónico"], "c": 4, "e": "La hepcidina inactiva la ferroportina (enterocito y macrófago) e impide el paso de hierro a la sangre; la inflamación la <b>AUMENTA en la anemia de trastornos crónicos</b>. Está baja en la ferropenia. <br><small>📌 Cayó en: ordinaria 2024.</small>"}, {"n": "22", "noShuffle": false, "img": null, "q": "En la anemia por déficit de hierro son síntomas atribuidos al déficit de hierro, excepto:", "o": ["Palpitaciones", "Coiloniquia", "Estomatitis angular", "Síndrome de piernas inquietas"], "c": 1, "e": "Las <b>palpitaciones son del síndrome anémico</b> (taquicardia compensadora), no del déficit de hierro en sí. Coiloniquia, estomatitis angular (rágades) y síndrome de piernas inquietas son clínica propia de la ferropenia y aparecen aunque no haya anemia. <br><small>📌 Cayó en: ordinaria 2024.</small>"}, {"n": "23", "noShuffle": false, "img": null, "q": "En el diagnóstico de la anemia perniciosa, señale la respuesta incorrecta:", "o": ["El hemograma y el análisis bioquímico pueden mostrar: anemia hiporregenerativa macrocítica, leucopenia, trombocitopenia, aumento de LDH y de bilirrubina indirecta.", "Se observa un déficit de ácido fólico que se pone de manifiesto mediante su determinación en suero.", "Anticuerpos frente al factor intrínseco, dada su especificidad, corroborará el diagnóstico.", "Anticuerpos frente a células parietales y antibomba de protones (anti-ATPasa H+/K+) son más sensibles, pero menos específicos."], "c": 2, "e": "En la anemia perniciosa lo que se demuestra en suero es el <b>déficit de vitamina B12</b>, no de ácido fólico. Anemia macrocítica hiporregenerativa con citopenias y patrón de hemólisis, anti-FI muy específicos y anti-células parietales más sensibles pero menos específicos son ciertos. <br><small>📌 Cayó en: ordinaria 2024.</small>"}, {"n": "24", "noShuffle": false, "img": null, "q": "Respecto a la betatalasemia, señale la respuesta falsa:", "o": ["β-talasemia menor o rasgo-talasémico, cursa con anemia leve microcítica, ADE normal. Hematíes elevados. Electroforesis de hemoglobina: Hb A2 elevada/ Hb F normal o alta.", "β-talasemia intermedia: Anemia más intensa, hepatoesplenomegalia, síndrome hemolítico crónico. Electroforesis de hemoglobina: Hb A2 elevada/ Hb F alta.", "β-talasemia mayor: en la mayoría de los casos es incompatible con la vida y suele producir muerte intrauterina.", "Los portadores silentes son asintomáticos y se suelen diagnosticar en estudios familiares."], "c": 3, "e": "La <b>β-talasemia mayor no es incompatible con la vida</b>: los síntomas empiezan en la lactancia (al sustituirse la HbF) y sobreviven con transfusiones y quelación. La muerte intrauterina corresponde a la hidropesía fetal de la α-talasemia. Minor, intermedia y portadores silentes están bien descritos. <br><small>📌 Cayó en: ordinaria 2024.</small>"}, {"n": "25", "noShuffle": false, "img": null, "q": "Nos planteamos tratar con hierro parenteral en un paciente con anemia por déficit de hierro, excepto:", "o": ["Necesidad de aporte rápido", "Intolerancia gastrointestinal", "En los pacientes con hemoglobina < 9 g /dl", "Malabsorción"], "c": 3, "e": "Una <b>Hb <9 g/dL no es por sí sola indicación de hierro intravenoso</b>. La vía parenteral se usa si hay malabsorción, intolerancia digestiva al hierro oral o necesidad de reponer rápido (anemia muy severa). <br><small>📌 Cayó en: ordinaria 2024.</small>"}, {"n": "26", "noShuffle": false, "img": null, "q": "De la célula progenitora mieloide derivan las siguientes células excepto:", "o": ["Eritrocito", "Plaqueta", "NK", "Monocitos"], "c": 3, "e": "Las <b>células NK derivan del progenitor linfoide</b>, como los linfocitos T y B. Del progenitor mieloide salen eritrocitos, plaquetas (vía megacariocitos), granulocitos y monocitos. <br><small>📌 Cayó en: final 2018. ⚠️ No sale tal cual en tus apuntes 2026.</small>"}, {"n": "27", "noShuffle": false, "img": null, "q": "¿Cuál es el tratamiento de elección en un paciente al que se diagnostica anemia hemolítica autoinmune por anticuerpos calientes?", "o": ["Corticoides", "Esplenectomía", "Rituximab", "Soporte transfusional"], "c": 1, "e": "En la AHAI por anticuerpos calientes (IgG) la primera línea son los <b>corticoides</b>; el rituximab y la esplenectomía quedan para refractarios y la transfusión es solo soporte si hay clínica grave. <br><small>📌 Cayó en: final 2018.</small>"}, {"n": "28", "noShuffle": false, "img": null, "q": "En el estudio de una anemia leve microcítica en la que hemos descartado una ferropenia, solicitamos un estudio de electroforesis de hemoglobina con el siguiente resultado: Hb A2 elevada, Hb F normal. La sospecha diagnóstica será:", "o": ["Alfa-talassemia", "Hemoglobinopatía M", "Beta-talasemia", "Anemia de células falciformes"], "c": 3, "e": "Anemia leve microcítica sin ferropenia con <b>HbA2 elevada = β-talasemia minor</b>. En la α-talasemia la HbA2 no está elevada, la drepanocitosis muestra HbS en la electroforesis y la Hb M produce metahemoglobinemia, no este patrón. <br><small>📌 Cayó en: final 2018.</small>"}, {"n": "29", "noShuffle": false, "img": null, "q": "Todas son causas de pancitopenia excepto:", "o": ["Hiperesplenismo", "Déficit de Vit B12", "Aplasia medular", "Trombocitopenia esencial"], "c": 4, "e": "La <b>trombocitemia esencial cursa con trombocitosis</b>, no con pancitopenia (la opción dice «trombocitopenia esencial», errata del original). Hiperesplenismo (secuestro), déficit de B12 (hematopoyesis ineficaz) y aplasia medular (fallo de producción) sí producen pancitopenia. <br><small>📌 Cayó en: final 2018.</small>"}, {"n": "30", "noShuffle": false, "img": null, "q": "Respecto a los índices eritrocitarios, señale la respuesta falsa:", "o": ["Actualmente no tienen utilidad en el estudio de las anemias", "Los eritrocitos con una HCM disminuida se denominan hipocrómicos", "El término hipercromía solo tiene utilidad en el estudio de algunas anemias como la esferocitosis, donde aumenta CHCM, en el resto no es apropiado utilizar este término.", "El VCM sirve para clasificar las anemias en microcíticas, normocíticas y macrocíticas."], "c": 1, "e": "Los índices eritrocitarios <b>sí son útiles</b>: el VCM clasifica las anemias en microcíticas, normocíticas y macrocíticas, la HCM baja define la hipocromía y la CHCM alta es típica de la esferocitosis. Por
