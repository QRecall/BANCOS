ncorrecta en el cáncer de páncreas:", "o": ["En estadios I y II resecados, la mediana de supervivencia es de 18 meses.", "En estadios III, la mediana de supervivencia es de 6-10 meses.", "En estadios IV, la mediana de supervivencia es de 4-8 meses.", "En estadios IV, la probabilidad de supervivencia a 1 año es del 50%."], "c": 4, "e": "Irresecables/metastásicos: mediana <b>4-8 meses y menos del 20 % vivos al año</b>, no el 50 %. Las otras cifras son las de los apuntes: resecados (I-II) mediana 18 meses y 20 % a 5 años; estadio III, 6-10 meses. <br><small>📌 Cayó en: parcial 2024, parcial 2023.</small>"}, {"n": "3", "noShuffle": false, "img": null, "q": "En el tratamiento sistémico del hepatocarcinoma, uno de estos grupos farmacológicos NO se utiliza habitualmente:", "o": ["Quimioterapia", "Inmunoterapia", "Antiangiogénicos", "Inhibidores múltiples de tirosin quinasa"], "c": 1, "e": "La <b>quimioterapia clásica no se usa</b> en el tratamiento sistémico del HCC. 1.ª línea estándar: atezolizumab (inmunoterapia) + bevacizumab (antiangiogénico); alternativas sorafenib o lenvatinib (inhibidores multicinasa); 2.ª línea regorafenib, cabozantinib, ramucirumab o anti-PD-1. <br><small>📌 Cayó en: parcial 2024.</small>"}, {"n": "4", "noShuffle": false, "img": null, "q": "¿Cuál es la localización más frecuente de los tumores del estroma gastrointestinal (GIST)?", "o": ["Intestino delgado", "Colon", "Estómago", "Recto"], "c": 3, "e": "El GIST asienta sobre todo en el <b>estómago</b> (50-60 %), seguido del intestino delgado; recto, esófago y colon son raros. Además, a igual tamaño y mitosis, el gástrico tiene mejor pronóstico. <br><small>📌 Cayó en: parcial 2024, parcial 2023.</small>"}, {"n": "5", "noShuffle": false, "img": null, "q": "En relación con el tratamiento adyuvante del cáncer de páncreas, sólo una respuesta es correcta:", "o": ["La radioterapia adyuvante mejora la supervivencia", "La quimioterapia adyuvante debe comenzar en las 4-6 semanas siguientes a la cirugía.", "La quimioterapia adyuvante puede posponerse hasta 12 semanas para permitir la recuperación funcional.", "Debe emplearse siempre el triplete FOLFIRINOX"], "c": 3, "e": "ESPAC-3: <b>completar los 6 ciclos importa más que empezar pronto</b>; retrasar la QT hasta 12 semanas no empeora el resultado. La RT adyuvante no ha demostrado beneficio, y FOLFIRINOX no es obligatorio: en mayores de 70 años o pacientes frágiles se usa gemcitabina + capecitabina. <br><small>📌 Cayó en: parcial 2024.</small>"}, {"n": "6", "noShuffle": false, "img": null, "q": "Entre los tratamientos posibles para un hepatocarcinoma, uno de los siguientes NO está indicado en los estadios precoces (0 y A) de la clasificación de Barcelona (BCLC):", "o": ["Resección (hepatectomía)", "Ablación percutánea", "Trasplante hepático", "Quimioembolización"], "c": 4, "e": "BCLC 0-A → <b>resección, ablación o trasplante</b> (intención curativa). La <b>quimioembolización (TACE)</b> es el tratamiento del estadio B (intermedio, multinodular); el C recibe tratamiento sistémico y el D, solo soporte. <br><small>📌 Cayó en: parcial 2024, final 2025.</small>"}, {"n": "7", "noShuffle": false, "img": null, "q": "Salvo uno, todos los siguientes se consideran factores de riesgo para desarrollar un cáncer de páncreas. Señale el factor no asociado:", "o": ["Tabaco", "Edad", "Pancreatitis crónica", "Desnutrición crónica"], "c": 4, "e": "Factores de riesgo del cáncer de páncreas: edad (mediana 71 años), tabaco, DM de larga evolución, <b>obesidad</b>, alcohol (a través de la pancreatitis crónica) y genética. La <b>desnutrición no es factor de riesgo</b>: lo que cuenta es el exceso de peso. <br><small>📌 Cayó en: parcial 2023, final 2025.</small>"}, {"n": "8", "noShuffle": false, "img": null, "q": "Uno de los parámetros siguientes no está presente en la clasificación de Barcelona del hepatocarcinoma (BCLC):", "o": ["Función hepática", "Estado general (performance status)", "Niveles séricos de alfafetoproteína", "Número y tamaño de las lesiones"], "c": 3, "e": "El BCLC combina <b>carga tumoral (número y tamaño de nódulos, invasión portal o extrahepática), función hepática y ECOG</b>. La <b>alfafetoproteína</b> se usa en el cribado (con la ecografía) y el seguimiento, pero no es un parámetro de la estadificación BCLC. <br><small>📌 Cayó en: parcial 2023.</small>"}, {"n": "9", "noShuffle": false, "img": null, "q": "Entre las manifestaciones clínicas de los tumores malignos de la vía biliar, una de estas es poco frecuente:", "o": ["Ictericia indolora", "Rectorragia", "Dolor abdominal", "Astenia, anorexia y adelgazamiento"], "c": 2, "e": "Clínica típica: <b>ictericia obstructiva indolora (80 %)</b>, prurito, pérdida de peso (50 %) y dolor abdominal sordo (40 %). La <b>rectorragia</b> no forma parte del cuadro: orienta a tumores de colon izquierdo o recto. <br><small>📌 Cayó en: parcial 2023, final 2025.</small>"}, {"n": "10", "noShuffle": true, "img": null, "q": "En un paciente de 60 años con carcinoma de páncreas que acude por dolor en el gemelo derecho y aumento de temperatura:", "o": ["Realizaremos como estudio complementario una ecografía del miembro inferior", "Exploraremos al paciente y sospecharemos una isquemia arterial", "Sospecharemos la presencia de una metástasis ósea", "Ninguna de las anteriores es verdadera"], "c": 1, "e": "Dolor y calor en la pantorrilla en un paciente con cáncer de páncreas → sospecha de <b>TVP</b> (el páncreas es de los tumores más trombogénicos) → <b>ecografía (doppler) del miembro inferior</b>. La isquemia arterial da frialdad y palidez, no calor, y el gemelo es músculo, no hueso. <br><small>📌 Cayó en: recopilación 1, final 2018.</small>"}, {"n": "11", "noShuffle": false, "img": null, "q": "En relación con la cirugía del cáncer de páncreas localizado, señale la afirmación INCORRECTA:", "o": ["El objetivo es la resección del tumor, independientemente del estado de los márgenes", "El atrapamiento de la arteria mesentérica superior hace que el tumor sea irresecable", "El atrapamiento del tronco celíaco hace que el tumor sea irresecable", "Aproximadamente un 15 % de los pacientes son resecables al diagnóstico"], "c": 1, "e": "El objetivo es la <b>resección completa con márgenes libres (R0)</b>, principal factor pronóstico; resecar dejando márgenes afectos no cura. Son ciertas: el atrapamiento de la AMS o del tronco celíaco define la irresecabilidad, y solo un 10-15 % es resecable al diagnóstico. <br><small>📌 Cayó en: final 2025. Enunciado reconstruido (del final 2025 solo se conserva un resumen).</small>"}, {"n": "12", "noShuffle": false, "img": null, "q": "Señale la asociación INCORRECTA entre tumor neuroendocrino pancreático y su manifestación clínica:", "o": ["VIPoma – diarrea acuosa", "Somatostatinoma – úlceras gástricas", "Insulinoma – hipoglucemia", "Glucagonoma – erupciones cutáneas"], "c": 2, "e": "Las <b>úlceras gástricas son del gastrinoma</b> (Zollinger-Ellison). El <b>somatostatinoma</b> da hiperglucemia, diarrea con esteatorrea, cálculos biliares e ictericia. VIPoma = diarrea acuosa con hipopotasemia; insulinoma = hipoglucemia; glucagonoma = erupciones cutáneas e hiperglucemia. <br><small>📌 Cayó en: final 2025. Enunciado reconstruido (del final 2025 solo se conserva un resumen).</small>"}, {"n": "13", "noShuffle": false, "img": null, "q": "¿En cuál de los siguientes tumores de la vía biliar son más frecuentes las alteraciones moleculares tratables con terapia dirigida?", "o": ["Carcinoma de vesícula biliar", "Colangiocarcinoma extrahepático distal", "Colangiocarcinoma intrahepático", "Colangiocarcinoma perihiliar (tumor de Klatskin)"], "c": 3, "e": "El <b>colangiocarcinoma intrahepático</b> concentra las dianas: <b>mutación de IDH1</b> (ivosidenib), <b>fusiones de FGFR2</b> (pemigatinib, futibatinib), NTRK y BRAF V600E. Vesícula y extrahepático tienen sobre todo amplificación de HER2, con menos variedad de dianas. El perfil molecular es obligado en la enfermedad avanzada. <br><small>📌 Cayó en: final 2025. Enunciado reconstruido (del final 2025 solo se conserva un resumen).</small>"}, {"n": "14", "noShuffle": false, "img": null, "q": "¿Cuál es el tratamiento de elección del GIST diseminado (metastásico)?", "o": ["Quimioterapia basada en doxorrubicina", "Imatinib", "Sunitinib", "Cirugía citorreductora sola"], "c": 2, "e": "El <b>imatinib</b> (inhibidor de KIT/PDGFRA) es la 1.ª línea del GIST avanzado: llevó la mediana de supervivencia de menos de 2 a más de 5 años y supera claramente a la QT con doxorrubicina. El <b>sunitinib es la 2.ª línea</b>, tras la resistencia secundaria al imatinib. <br><small>📌 Cayó en: final 2025. Enunciado reconstruido (del final 2025 solo se conserva un resumen).</small>"}, {"n": "15", "noShuffle": false, "img": null, "q": "Señale la afirmación FALSA sobre el carcinoma epidermoide de esófago:", "o": ["Es más frecuente en países subdesarrollados", "Predomina en el tercio inferior del esófago", "Sus principales factores de riesgo son el tabaco y el alcohol", "Su incidencia ha disminuido en las últimas décadas"], "c": 2, "e": "El epidermoide predomina en los <b>tercios superior y medio</b>; el <b>tercio inferior y la unión esofagogástrica son del adenocarcinoma</b> (Barrett, ERGE, obesidad). Las demás son ciertas: epidermoide = tabaco + alcohol, países subdesarrollados e incidencia en descenso. <br><small>📌 Cayó en: final 2025. Enunciado reconstruido (del final 2025 solo se conserva un resumen).</small>"}, {"n": "16", "noShuffle": false, "img": null, "q": "¿Cuál es el tratamiento estándar del cáncer de esófago localmente avanzado (estadios II-III)?", "o": ["Cirugía inicial (esofagectomía)", "Cirugía seguida de radioterapia adyuvante", "Quimioterapia exclusiva", "Quimiorradioterapia neoadyuvante (seguida de cirugía) o quimiorradioterapia definitiva"], "c": 4, "e": "En el localmente avanzado el estándar es multimodal: escamoso → <b>QT-RT neoadyuvante + cirugía, o QT-RT definitiva</b> con cirugía de rescate; adenocarcinoma → FLOT perioperatorio o QT-RT neoadyuvante. Si queda enfermedad residual tras neoadyuvancia + R0, nivolumab adyuvante (CheckMate 577). La cirugía inicial es para T1-T2 N0. <br><small>📌 Cayó en: final 2025. Enunciado reconstruido (del final 2025 solo se conserva un resumen).</small>"}, {"n": "17", "noShuffle": false, "img": null, "q": "¿Cuál es el subtipo molecular más frecuente del cáncer gástrico según la clasificación del Atlas Genómico del Cáncer (TCGA)?", "o": ["Asociado al virus de Epstein-Barr", "Inestabilidad de microsatélites", "Genómicamente estable", "Inestabilidad cromosómica"], "c": 4, "e": "De los cuatro subtipos TCGA, el más frecuente es la <b>inestabilidad cromosómica (≈50 %)</b>, típica del tipo intestinal y de la unión esofagogástrica (con frecuentes amplificaciones como HER2). Le siguen MSI (≈20 %), genómicamente estable (≈20 %, tipo difuso) y VEB (≈9 %). Los apuntes listan los subtipos, pero no sus frecuencias. <br><small>📌 Cayó en: final 2025. ⚠️ No sale tal cual en tus apuntes 2026. Enunciado reconstruido (del final 2025 solo se conserva un resumen).</small>"}, {"n": "18", "noShuffle": false, "img": null, "q": "¿Cuál de los siguientes pólipos colónicos no tiene potencial de malignización?", "o": ["Pólipo hiperplásico", "Adenoma tubular", "Adenoma tubulovelloso", "Adenoma velloso"], "c": 1, "e": "Los <b>pólipos hiperplásicos</b> (pequeños, típicos de recto-sigma) se consideran no malignos (~20 % de los pólipos). Todos los <b>adenomas</b> son precursores (secuencia adenoma-carcinoma): el velloso es el de más riesgo y el tubular el de menos. Matiz: las lesiones serradas sésiles sí pueden malignizar (vía CIMP). <br><small>📌 Cayó en: final 2025. Enunciado reconstruido (del final 2025 solo se conserva un resumen).</small>"}, {"n": "19", "noShuffle": false, "img": null, "q": "¿Cuál es el grupo molecular más frecuente en el cáncer colorrectal metastásico?", "o": ["RAS mutado", "BRAF mutado", "Inestabilidad de microsatélites (MSI-H)", "Amplificación de HER2"], "c": 1, "e": "En el CCR metastásico el grupo más frecuente es <b>RAS mutado (35-45 %)</b>, que excluye los anti-EGFR. BRAF mutado supone el 8-12 % (90 % V600E, peor pronóstico); MSI-H es minoritario (~2 %, candidato a inmunoterapia) y la amplificación de HER2 ronda el 3-5 %. <br><small>📌 Cayó en: final 2025. Enunciado reconstruido (del final 2025 solo se conserva un resumen).</small>"}, {"n": "20", "noShuffle": false, "img": null, "q": "¿Cuál de las siguientes neoplasias se asocia con mayor riesgo de enfermedad tromboembólica venosa?", "o": ["Cáncer de páncreas", "Cáncer de mama", "Cáncer de próstata", "Cáncer de tiroides"], "c": 1, "e": "El <b>cáncer de páncreas</b> es de los más trombogénicos: riesgo «muy alto» en la escala de Khorana, junto con el gástrico (también destacan cerebro y pulmón). Mama, próstata y tiroides puntúan 0 en Khorana. En el páncreas, una TVP o una tromboflebitis migratoria pueden ser el debut. <br><small>📌 Cayó en: final 2025. Enunciado reconstruido (del final 2025 solo se conserva un resumen).</small>"}, {"n": "21", "noShuffle": false, "img": null, "q": "En relación con la cirugía del cáncer de esófago, sólo una de estas afirmaciones es correcta:", "o": ["La cirugía inicial es el tratamiento de elección en la enfermedad localmente avanzada (estadios II y III)", "Generalmente se excluye el tercio inferior por su complejidad anatómica", "Sólo la resección con márgenes libres (R0) es potencialmente curativa", "Es una cirugía convencional, cualquier cirujano puede realizarla"], "c": 3, "e": "Solo la <b>resección R0</b> es potencialmente curativa; las R1/R2 aportan poco. La cirugía de inicio es para la enfermedad precoz (T1-T2 N0); la localmente avanzada recibe neoadyuvancia. Se excluye el <b>tercio superior</b>, no el inferior, y es una cirugía compleja, de alta morbimortalidad, que exige cirujanos expertos. <br><small>📌 Cayó en: ordinaria 2024.</small>"}, {"n": "22", "noShuffle": false, "img": null, "q": "En el tratamiento del cáncer gástrico irresecable o metastásico, ¿qué afirmación es correcta?", "o": ["La quimioterapia que se utiliza como primera línea de tratamiento es un triplete de platino, fluoropirimidinas y un fármaco antiangiogénico.", "En los tumores que expresan HER-2 (Her-2 positivos) está indicado añadir trastuzumab a la quimioterapia.", "En los casos con carcinomatosis peritoneal están indicadas la cirugía reductora y quimioterapia posterior para eliminar el tumor no resecado.", "En los tumores que expresan PDL-1 positivo está indicado añadir trastuzumab más nivolumab."], "c": 2, "e": "En el gástrico avanzado HER2+ se añade <b>trastuzumab</b> a platino + fluoropirimidina (ToGA); si es PD-L1+, se añade <b>nivolumab</b> (CheckMate 649), no trastuzumab. La 1.ª línea es un doblete, no un triplete con antiangiogénico, y en la carcinomatosis el tratamiento local es solo paliativo. <br><small>📌 Cayó en: ordinaria 2024, final 2025.</small>"}, {"n": "23", "noShuffle": false, "img": null, "q": "Con respecto al tratamiento adyuvante del cáncer de colon, sólo una de estas afirmaciones es falsa:", "o": ["El incremento en la supervivencia se estima en un 15-20%", "Deben tratarse todos los pacientes con estadio III (ganglios positivos)", "Deben tratarse sólo los estadios II (ganglios negativos) con criterios de riesgo", "El tratamiento debe durar siempre 6 meses"], "c": 4, "e": "La duración no es siempre 6 meses: según IDEA, <b>XELOX 3 meses no es inferior</b> a 6 meses en el estadio III de bajo riesgo (T1-3 N1) y reduce la neurotoxicidad del oxaliplatino. Ciertas: se trata todo estadio III y, del estadio II, solo el de alto riesgo. <br><small>📌 Cayó en: ordinaria 2024, final 2025.</small>"}, {"n": "24", "noShuffle": false, "img": null, "q": "El tratamiento estándar del cáncer de recto localmente avanzado (estadios II y III) consiste en:", "o": ["Cirugía (escisión total del mesorrecto)", "Cirugía (EMT) seguida de quimioterapia adyuvante", "Cirugía (EMT) seguida de quimiorradioterapia adyuvante", "Quimiorradioterapia neoadyuvante seguida de cirugía (EMT)"], "c": 4, "e": "Recto II-III: <b>neoadyuvancia (QT-RT larga con fluoropirimidinas, RT corta 5×5 o TNT) seguida de escisión total del mesorrecto</b>. Reduce el tumor, facilita conservar el esfínter y baja la recidiva local. El recto no se opera de entrada salvo tumores muy precoces; la QT-RT postoperatoria controla peor y es más tóxica. <br><small>📌 Cayó en: ordinaria 2024, final 2025.</small>"}, {"n": "25", "noShuffle": false, "img": null, "q": "Uno de los siguientes factores no tiene influencia en la decisión de tratamiento en el cáncer colorrectal metastásico:", "o": ["Estado general (performance status)", "Perfil molecular", "Clasificación TNM", "Resecabilidad de las metástasis"], "c": 3, "e": "En el CCR metastásico todos son estadio IV (M1): el <b>TNM no cambia la decisión</b>. Sí pesan el <b>estado general</b> y la comorbilidad, el <b>perfil molecular</b> (RAS, BRAF, MSI), la localización del primario y la <b>resecabilidad de las metástasis</b> (resección hepática R0: supervivencia a 5 años del 55 %). <br><small>📌 Cayó en: ordinaria 2024, final 2025.</small>"}, {"n": "26", "noShuffle": false, "img": null, "q": "¿Cuál de las siguientes no es cierta sobre los tumores GIST?", "o": ["Tienen crecimiento exofítico expansivo, no infiltrativo", "Son tumores de estirpe mesenquimal", "La linfadenectomía siempre es necesaria en su tratamiento", "Se tratan con cirugía e inhibidores de la tirosin kinasa"], "c": 3, "e": "En el GIST <b>no se hace linfadenectomía</b> de ganglios no afectados: las metástasis ganglionares son raras. Se busca la resección R0 con la pseudocápsula intacta. Ciertas: tumor mesenquimal (sarcoma del tubo digestivo) de crecimiento expansivo, tratado con cirugía e imatinib (inhibidor de la tirosina cinasa KIT/PDGFRA). <br><small>📌 Cayó en: final 2018.</small>"}, {"n": "27", "noShuffle": false, "img": null, "q": "En relación con el hepatocarcinoma es verdadera:", "o": ["El norte de África y América latina son áreas de elevada incidencia", "El tratamiento óptimo de la enfermedad avanzada o metastásica es con las terapias sistémicas, como los antiangiogénicos e inhibidores de tirosin kinasa", "Se asocia a infección por virus de hepatitis A", "Característicamente afecta a la vena central de 1 lobulillo hepático"], "c": 2, "e": "El HCC avanzado (BCLC C) se trata con <b>terapia sistémica</b>: hoy, 1.ª línea <b>atezolizumab + bevacizumab</b> (inmunoterapia + antiangiogénico), con sorafenib o lenvatinib (multicinasa) como alternativa. Falsas: las áreas de mayor incidencia son Asia oriental y África subsahariana, el VHA no cronifica ni causa HCC, y la invasión vascular típica es portal. <br><small>📌 Cayó en: final 2018.</small>"}, {"n": "28", "noShuffle": false, "img": null, "q": "En el tratamiento del carcinoma de páncreas, indique la correcta:", "o": ["Los pacientes con tumores resecados y sin evidencia de enfermedad residual deberían recibir hormonoterapia", "La enfermedad resecable supone la mayoría de los casos", "En la enfermedad irresecable, si el paciente presenta mal estado funcional, debe iniciarse quimioterapia de forma urgente", "En los tumores resecables son factores de buen pronóstico medir < 3 cm, grado histológico 1 y la ausencia de ganglios regionales afectados en la radiología."], "c": 4, "e": "En el resecable son de buen pronóstico el <b>tamaño < 3 cm, el grado 1 y la ausencia de ganglios</b>, además del R0 (el principal). Falsas: la adyuvancia es QT (mFOLFIRINOX o gemcitabina + capecitabina), no hormonoterapia; solo un 10-15 % es resecable, y con mal estado funcional se prioriza el tratamiento de soporte. <br><small>📌 Cayó en: final 2020. ⚠️ No sale tal cual en tus apuntes 2026.</small>"}, {"n": "29", "noShuffle": false, "img": null, "q": "Señala cuál de las siguientes afirmaciones sobre el carcinoma de páncreas es CORRECTA:", "o": ["La obesidad y la dieta rica en grasas se han asociado con un aumento en el riesgo de desarrollar carcinoma de páncreas.", "Los carcinomas exocrinos pancreáticos se originan más frecuentemente en la cola pancreática", "No se han descrito alteraciones genéticas asociadas a un riesgo aumentado de carcinoma de páncreas", "El Ca 125 se encuentra elevado en un alto porcentaje de pacientes con carcinoma de páncreas, y su uso está indicado tanto para el screening, como para el seguimiento de los pacientes diagnosticados y en tratamiento."], "c": 1, "e": "La <b>obesidad</b> (IMC > 30) es factor de riesgo establecido (la dieta grasa, con evidencia menos consistente). Falsas: el 75 % asienta en la <b>cabeza</b>; hay predisposición genética (BRCA, Peutz-Jeghers, pancreatitis hereditaria, 10 % familiar), y el marcador es el <b>CA 19.9</b> (con el CEA), que no sirve para cribado. <br><small>📌 Cayó en: final 2020.</small>"}, {"n": "30", "noShuffle": false, "img": null, "q": "Con respecto a los colangiocarcinomas:", "o": ["Son más frecuentemente carcinomas escamosos", "Son más frecuentemente intrahepáticos", "La causa más frecuente es cualquier tipo de inflamación crónica de la vía biliar", "La clínica es altamente específica del cáncer"], "c": 3, "e": "Los factores de riesgo conocidos (colangitis esclerosante, colitis ulcerosa, parásitos hepáticos, colangitis recurrente, quistes de colédoco/Caroli) comparten la <b>inflamación crónica de la vía biliar</b>. Falsas: son <b>adenocarcinomas</b>, el más frecuente es el <b>perihiliar (Klatskin)</b> y no el intrahepático, y la clínica es inespecífica. <br><small>📌 Cayó en: final 2018. ⚠️ No sale tal cual en tus apuntes 2026.</small>"}, {"n": "31", "noShuffle": false, "img": null, "q": "En relación al tratamiento del adenocarcinoma gástrico, señale la falsa:", "o": ["En los estadios iniciales el tratamiento fundamental es la resección quirúrgica", "No hay evidencia científica para recomendar el tratamiento adyuvante tras la resección de un carcinoma gástrico", "En pacientes con enfermedad avanzada (Estadio IV), la cirugía paliativa del tumor primario está indicada en caso de dolor, obstrucción intestinal o hemorragia digestiva.", "El tratamiento sistémico se basa en la poliquimioterapia basada en combinación de Cisplatino y Fluoropirimidinas, a las que se puede asociar Trastuzumab en caso de tumores con sobreexpresión de HER 2."], "c": 2, "e": "Sí hay evidencia de QT tras la resección: el <b>metaanálisis GASTRIC</b> (HR 0,82) y la QT perioperatoria (MAGIC; hoy <b>FLOT</b>) mejoran la supervivencia. Ciertas: cirugía en estadios iniciales, cirugía paliativa por obstrucción o hemorragia en el estadio IV, y platino + fluoropirimidina ± trastuzumab si HER2+. <br><small>📌 Cayó en: final 2020.</small>"}, {"n": "32", "noShuffle": false, "img": null, "q": "Señale la afirmación CORRECTA en relación con las alteraciones moleculares del carcinoma de colon.", "o": ["El síndrome de Lynch está mediado por alteraciones genéticas en los genes reparadores del ADN de la familia MMR (hMLH1, hMSH2, hMSH6)", "En los pacientes con tumores con mutaciones de KRAS está indicado el tratamiento con anticuerpos monoclonales anti-EGFR (Cetuximab o Panitumumab)", "Las mutaciones de BRAF son predictivas de respuesta a Bevacizumab (antiangiogénico)", "En pacientes con tumores con sobreexpresión de Her2 está indicado el tratamiento con anticuerpos moleculares anti-Her3 (Trastuzumab o Pertuzumab)"], "c": 1, "e": "Lynch = mutación germinal de los <b>genes reparadores MMR</b> (MLH1, MSH2, MSH6, PMS2) → inestabilidad de microsatélites. Falsas: los anti-EGFR exigen <b>RAS y BRAF nativos</b>; BRAF no predice respuesta a bevacizumab (que sirve con cualquier estado de RAS/BRAF), y trastuzumab y pertuzumab son anti-HER2, no anti-HER3. <br><small>📌 Cayó en: final 2020.</small>"}, {"n": "33", "noShuffle": false, "img": null, "q": "Señale la afirmación CORRECTA en relación al carcinoma de colon:", "o": ["Menos del 10% se asocian con síndromes hereditarios como el Síndrome de Poliposis Adenomatosa Familiar, o el Síndrome de Lynch", "Representa la primera causa de muerte por cáncer en los países occidentales.", "Excepcionalmente los carcinomas colorrectales provienen de adenomas previos.", "Más del 50% de los casos presentan metástasis (Estadio IV) en el momento del diagnóstico."], "c": 1, "e": "Solo un <b>~5 % del CCR es hereditario</b> (Lynch 2-4 %, PAF < 1 %). Falsas: es la <b>2.ª causa de muerte por cáncer, tras el pulmón</b>; la mayoría procede de <b>adenomas</b> (secuencia adenoma-carcinoma), y al diagnóstico solo ~20 % está en estadio IV. <br><small>📌 Cayó en: final 2020.</small>"}], "uro": [{"n": "1", "noShuffle": false, "img": null, "q": "Paciente, varón de 56 años. En analítica de rutina solicitada por MAP se objetivan cifras de PSA de 12,2 ng/mL y el tacto rectal es normal. Se realiza biopsia transrectal y se confirma un adenocarcinoma acinar de próstata gleason 7 (4+3). En resonancia de estadiaje el tumor afecta a la zona periférica del lóbulo prostático izquierdo (T2b). ¿Cuál de las siguientes sería una opción de tratamiento válida en este paciente?", "o": ["Prostatectomía radical +- linfadenectomía pélvica", "Radioterapia externa con terapia de deprivación androgénica durante 2 años", "Vigilancia activa", "Terapia de deprivación androgénica exclusiva"], "c": 1, "e": "PSA 10-20, Gleason 4+3 y T2b = <b>riesgo intermedio desfavorable</b>: prostatectomía radical (± linfadenectomía) o RT con TDA de 6 meses. La vigilancia activa solo vale en bajo riesgo e intermedio favorable (3+4); la TDA de 2-3 años con RT es del alto riesgo y la TDA exclusiva es paliativa (pacientes frágiles). <br><small>📌 Cayó en: parcial 2024.</small>"}, {"n": "2", "noShuffle": false, "img": null, "q": "Acude a su consulta remitido por su MAP un paciente de 60 años, con clínica miccional irritativa y elevación de las cifras de PSA hasta alcanzar unas cifras de 8,6 ng/mL. Presenta como antecedente oncológico padre fallecido por carcinoma de próstata. En el tacto rectal se describe aumento de consistencia del lóbulo derecho. ¿Cuál sería la actitud más indicada?", "o": ["Iniciar tratamiento con antiandrógenos y análogo LHRH.", "Indicarle al paciente la realización de una ecografía y biopsia transrectal.", "Realizar una resonancia magnética nuclear.", "Iniciar tratamiento con inhibidores de la 5-alfa-reductasa para reducir a la mitad los niveles de PSA"], "c": 2, "e": "Tacto rectal sospechoso (lóbulo duro) → <b>ECO transrectal y biopsia</b>, sea cual sea el PSA (algoritmo de los apuntes); además hay antecedente paterno. No se trata sin diagnóstico histológico (antiandrógenos/LHRH) y los inhibidores de la 5-alfa-reductasa enmascaran el PSA. La RM puede guiar la biopsia, pero no la sustituye. <br><small>📌 Cayó en: parcial 2023.</small>"}, {"n": "3", "noShuffle": false, "img": null, "q": "Ante un paciente con carcinoma renal de células claras, hemangioblastomas retinianos y en cerebro, ¿qué mutación genética sospecharía?", "o": ["Mutación en PTEN", "Mutación en fumarato-hidratasa", "Mutación en BRCA", "Mutación en el gen Von-Hippel-Lindau"], "c": 4, "e": "Carcinoma renal de células claras + hemangioblastomas de retina y SNC = <b>enfermedad de Von Hippel-Lindau</b> (gen supresor VHL, 3p; su pérdida dispara VEGF y angiogénesis). Fumarato hidratasa → leiomiomatosis hereditaria con cáncer renal (no de células claras); PTEN → síndrome de Cowden; BRCA → mama, ovario, próstata. <br><small>📌 Cayó en: recopilación 1, final 2020.</small>"}, {"n": "4", "noShuffle": false, "img": null, "q": "Paciente de 30 años diagnosticado de carcinoma de testículo por una masa testicular de 4 cm. El TAC de estudio de extensión evidenció la presencia de adenopatías retroperitoneales e inguinales, metástasis pulmonares y hepáticas. ¿Cuál de las siguientes opciones realizaría en primer lugar?", "o": ["Orquiectomía transescrotal", "Orquiectomía inguinal", "Quimioterapia pese a no disponer de anatomía patológica", "Radioterapia sobre el testículo"], "c": 2, "e": "Ante sospecha de cáncer testicular, el primer paso es la <b>orquiectomía por vía inguinal</b> (diagnóstica y terapéutica), también con metástasis salvo riesgo vital inmediato; después, quimioterapia (BEP) según IGCCCG. La vía <b>transescrotal está proscrita</b> (altera el drenaje linfático) y la radioterapia testicular no tiene papel. <br><small>📌 Cayó en: recopilación 1, final 2020.</small>"}, {"n": "5", "noShuffle": false, "img": null, "q": "Paciente de 44 años que acude a urgencias por masa testicular de reciente aparición. ¿Qué prueba de imagen solicitaría en primer lugar?", "o": ["RMN de testículo", "Ecografía de testículo", "PET-TAC", "PET"], "c": 2, "e": "La primera prueba ante una masa testicular es la <b>ecografía testicular</b> (con la exploración física): distingue lesión sólida intratesticular de hidrocele o espermatocele. La RM es complementaria y la PET no se recomienda en el diagnóstico. <br><small>📌 Cayó en: recopilación 1, recopilación 2.</small>"}, {"n": "6", "noShuffle": false, "img": null, "q": "Paciente de 55 años diagnosticado ante elevación de PSA y mediante biopsia de un adenocarcinoma de próstata, Gleason 5+4. En el TAC de estudio de extensión se evidencian metástasis óseas. ¿Cuál sería su tratamiento inicial?", "o": ["Tratamiento sintomático-paliativo", "Prostatectomía radical", "Radioterapia sobre la próstata", "Bloqueo androgénico máximo (análogos de LHRH y antiandrógenos) con o sin quimioterapia"], "c": 4, "e": "Gleason 9 con metástasis óseas = enfermedad <b>metastásica hormonosensible</b>: el tratamiento inicial es la <b>supresión androgénica</b> (análogo LHRH ± antiandrógeno), que puede combinarse con docetaxel o nuevos hormonales. Cirugía o RT de la próstata no son el tratamiento inicial de la enfermedad metastásica, y solo paliar infratrata a un paciente de 55 años. <br><small>📌 Cayó en: recopilación 1, final 2020.</small>"}, {"n": "7", "noShuffle": false, "img": null, "q": "¿Cuál de las siguientes características no es típica de un cáncer de testículo?", "o": ["Transiluminación positiva", "Aumento del volumen indoloro", "Sensación de peso", "Los pacientes son asintomáticos en la mayoría de las ocasiones"], "c": 1, "e": "Un tumor testicular es una <b>masa sólida</b>: <b>no transilumina</b> (la transiluminación positiva orienta a hidrocele o espermatocele). Lo típico es un aumento de volumen indoloro, a veces con sensación de peso, sin otros síntomas en la mayoría de los casos. <br><small>📌 Cayó en: recopilación 1, final 2020. ⚠️ No sale tal cual en tus apuntes 2026.</small>"}, {"n": "8", "noShuffle": false, "img": null, "q": "¿Cuál de los siguientes es considerado un factor pronóstico en el estadio I de cáncer de testículo tipo no seminoma?", "o": ["Infiltración venosa o linfática", "Infiltración de rete testis", "Tamaño tumoral igual o superior a 4 cm", "Presencia de abundante necrosis tumoral"], "c": 1, "e": "En el no seminoma estadio I el factor pronóstico de recaída es la <b>invasión linfovascular</b> (en vigilancia, 15-20 % de recaídas sin ella y 40-50 % con ella; si LVI+ se ofrece BEP ×1). El <b>tamaño ≥ 4 cm</b> y la <b>rete testis</b> son factores de riesgo del <b>seminoma</b>. <br><small>📌 Cayó en: recopilación 1, final 2020.</small>"}, {"n": "9", "noShuffle": false, "img": null, "q": "¿Qué define nuestra elección de tratamiento farmacológico en el cáncer renal metastásico?", "o": ["Presencia de necrosis tumoral", "Grupo de riesgo según criterios MSKCC o modelo de Cleveland (Heng)", "Infiltración de rete testis", "Tamaño del tumor renal"], "c": 2, "e": "En el carcinoma renal metastásico la 1.ª línea se elige según el <b>grupo de riesgo MSKCC o IMDC (Heng)</b>: favorable → IO + TKI; intermedio/malo → IO + TKI o ipilimumab-nivolumab. Tamaño y necrosis cuentan para el riesgo de recidiva tras cirugía (SSIGN); la rete testis es del testículo. <i>(«Cleveland» es como venía en el examen; el modelo de Heng es el IMDC.)</i> <br><small>📌 Cayó en: recopilación 1.</small>"}, {"n": "10", "noShuffle": false, "img": null, "q": "Sobre el cáncer de próstata, señale la respuesta correcta:", "o": ["En la enfermedad localizada, la prostatectomía radical, la radioterapia o la vigilancia activa son opciones de tratamiento válidas", "Para el diagnóstico se necesitan al menos 10 cilindros positivos en la biopsia", "Tras la prostatectomía radical, el PSA debe ser indetectable a las 2 semanas", "La bicalutamida y la abiraterona son antiandrógenos no esteroideos de primera generación"], "c": 1, "e": "Cierta: en el cáncer localizado son válidas <b>prostatectomía radical, RT o vigilancia activa</b> según el riesgo. Falsa d: la <b>abiraterona inhibe CYP17</b> (síntesis de andrógenos), no es antiandrógeno; la bicalutamida sí lo es (no esteroideo, 1.ª generación). Falsas b y c: basta un cilindro con cáncer, y el PSA posprostatectomía se valora hacia las 6 semanas. <br><small>📌 Cayó en: final 2025. Enunciado reconstruido (del final 2025 solo se conserva un resumen).</small>"}, {"n": "11", "noShuffle": false, "img": null, "q": "¿Cuál es, aproximadamente, la mediana de supervivencia global del carcinoma renal metastásico tratado en primera línea con combinaciones de inmunoterapia y antiangiogénicos?", "o": ["6 meses", "12 meses", "24 meses", "48 meses"], "c": 4, "e": "Con las combinaciones de inmunoterapia y antiangiogénicos en 1.ª línea (desde 2018), la mediana de supervivencia del carcinoma renal metastásico ronda los <b>48 meses</b>. Las otras cifras corresponden a eras previas: ~12 meses con citocinas y ~24 meses con terapias dirigidas (TKI). <br><small>📌 Cayó en: final 2025. Enunciado reconstruido (del final 2025 solo se conserva un resumen).</small>"}, {"n": "12", "noShuffle": false, "img": null, "q": "¿Cuál es la principal indicación de quimioterapia adyuvante en el cáncer de testículo estadio I?", "o": ["Seminoma de menos de 4 cm sin invasión de la rete testis", "No seminoma con invasión linfovascular", "No seminoma sin invasión linfovascular", "Cualquier tumor germinal en estadio I tras la orquiectomía"], "c": 2, "e": "En el estadio I la opción preferida es la <b>vigilancia activa</b>. La principal indicación de QT adyuvante es el <b>no seminoma con invasión linfovascular</b> (recaída 40-50 % en vigilancia): <b>BEP ×1</b> la reduce al ~5 %. Sin LVI se vigila, y el seminoma sin factores de riesgo tampoco se trata. <br><small>📌 Cayó en: final 2025. Enunciado reconstruido (del final 2025 solo se conserva un resumen).</small>"}, {"n": "13", "noShuffle": false, "img": null, "q": "Ante un paciente de 49 años, asintomático, con antecedente oncológico de padre fallecido por carcinoma de próstata. En analítica de rutina realizada en su empresa se evidencia un PSA (Antígeno Prostático Específico) de 5,9 ng/mL. En el tacto rectal se describe aumento de consistencia del lóbulo derecho. ¿Cuál sería la actitud más indicada?", "o": ["Indicarle al paciente la realización de una ecografía y biopsia transrectal.", "Iniciar tratamiento con antiandrógenos y análogo LHRH.", "Realizar una gammagrafía ósea.", "Iniciar tratamiento con inhibidores de la 5-alfa-reductasa para reducir a la mitad los niveles de PSA."], "c": 1, "e": "<b>Tacto rectal sospechoso</b> → <b>ECO transrectal y biopsia</b> con cualquier PSA; además hay antecedente de padre con cáncer de próstata. No se inicia hormonoterapia sin histología, la gammagrafía ósea es de estadificación (tras el diagnóstico) y los inhibidores de la 5-alfa-reductasa enmascaran el PSA. <br><small>📌 Cayó en: final 2022.</small>"}, {"n": "14", "noShuffle": false, "img": null, "q": "Paciente, varón de 30 años, casado sin hijos, diagnosticado mediante exploración física y confirmado ecográficamente de tumor sólido en el teste derecho ¿Cuál es la actitud más correcta?", "o": ["Orquiectomía por vía inguinal.", "Observación.", "Radioterapia.", "Quimioterapia y posteriormente orquiectomía."], "c": 1, "e": "Tumor sólido testicular confirmado por ecografía → <b>orquiectomía radical por vía inguinal</b>, diagnóstica y terapéutica; nunca biopsia ni vía escrotal. Al ser joven sin hijos, ofrecer antes <b>criopreservación de semen</b>. Ni observación ni RT o QT sin histología. <br><small>📌 Cayó en: final 2022.</small>"}, {"n": "15", "noShuffle": false, "img": null, "q": "De los tumores renales, ¿cuál es el subtipo histológico más frecuente?", "o": ["Carcinoma papilar.", "Angiomiolipoma.", "Carcinoma cromófobo.", "Carcinoma de células claras."], "c": 4, "e": "El subtipo más frecuente de carcinoma renal es el de <b>células claras</b> (~75-85 %), ligado a la vía VHL-VEGF. Le siguen el papilar (~10-15 %) y el cromófobo (~5 %). El angiomiolipoma es un tumor benigno (asociado a esclerosis tuberosa). <br><small>📌 Cayó en: final 2022.</small>"}, {"n": "16", "noShuffle": false, "img": null, "q": "Una de estas terapias sistémicas no está indicada en el tratamiento del cáncer renal", "o": ["Quimioterapia", "Inmunoterapia", "Inhibidores de tirosina quinasa con efecto antiangiogénico", "Inmunoterapia adyuvante"], "c": 1, "e": "El carcinoma renal es <b>quimiorresistente</b>: la <b>quimioterapia no está indicada</b>. Sí lo están los TKI antiangiogénicos (sunitinib, cabozantinib, axitinib…), la inmunoterapia (anti-PD-1 ± anti-CTLA-4) en enfermedad avanzada y el <b>pembrolizumab adyuvante</b> tras nefrectomía en riesgo intermedio/alto. <br><small>📌 Cayó en: ordinaria 2024.</small>"}, {"n": "17", "noShuffle": false, "img": null, "q": "¿Cuál es la presentación clínica más frecuente del cáncer renal?", "o": ["Asintomático, como hallazgo radiológico incidental", "Tríada de dolor lumbar, hematuria y masa abdominal", "Síndromes paraneoplásicos (hipercalcemia, fiebre…)", "Manifestaciones de enfermedad metastásica (disnea, dolor óseo)"], "c": 1, "e": "Hoy más del 60 % de los cánceres renales se diagnostican de forma <b>incidental</b> en una prueba de imagen. La tríada dolor-hematuria-masa aparece en < 10 % (y sugiere enfermedad avanzada); síndromes paraneoplásicos (~30 %) y metástasis son formas de debut menos habituales. <br><small>📌 Cayó en: ordinaria 2024.</small>"}, {"n": "18", "noShuffle": true, "img": null, "q": "Sobre el cáncer de próstata, ¿cuál de las afirmaciones es CORRECTA?", "o": ["Es el cáncer más frecuente en varones y representa la segunda causa de muerte tras el cáncer de pulmón.", "El tipo histológico más frecuente es el adenocarcinoma de tipo acinar.", "En el cáncer de próstata localizado la cirugía, la radioterapia o la vigilancia activa pueden ser opciones de tratamiento válidas.", "Todas las respuestas anteriores son correctas."], "c": 4, "e": "Las tres afirmaciones son ciertas según los apuntes: el cáncer de próstata es el <b>más frecuente en varones</b> y la 2.ª causa de muerte por cáncer (dato de las diapositivas); el <b>adenocarcinoma acinar</b> es el tipo habitual (95 %); en enfermedad localizada valen <b>cirugía, RT o vigilancia activa</b>. → <b>Todas</b>. <i>Dato de tus diapositivas de próstata; la SEOM (T29) lo sitúa 3.º en España.</i> <br><small>📌 Cayó en: ordinaria 2024.</small>"}, {"n": "19", "noShuffle": false, "img": null, "q": "¿Qué triada es característica del debut de un cáncer renal?", "o": ["Síndrome miccional, dolor lumbar y fiebre", "Hematuria, dolor lumbar y masa abdominal", "Hematuria, escozor y polaquiuria", "Dolor lumbar, ciatalgia y fiebre"], "c": 2, "e": "La tríada clásica del cáncer renal es <b>hematuria, dolor lumbar (flanco) y masa abdominal</b>. Hoy aparece en < 10 % e indica enfermedad avanzada; lo habitual es el diagnóstico incidental (> 60 %). <br><small>📌 Cayó en: recopilación 2.</small>"}, {"n": "20", "noShuffle": false, "img": null, "q": "¿Cuál de los siguientes no es un factor pronóstico en los tumores seminomatosos de testículo diagnosticados en estadio I?", "o": ["Presentar metástasis pulmonares", "Tamaño tumoral", "Infiltración de rete testis", "Todos lo son"], "c": 1, "e": "Por definición el estadio I no tiene metástasis: <b>tener metástasis pulmonares no es un factor pronóstico del estadio I</b> (sería ya enfermedad avanzada). En el seminoma estadio I los factores de riesgo de recaída son el <b>tamaño tumoral (> 4 cm)</b> y la <b>invasión de la rete testis</b>. <br><small>📌 Cayó en: final 2020. ⚠️ No sale tal cual en tus apuntes 2026.</small>"}, {"n": "21", "noShuffle": false, "img": null, "q": "Con respecto al carcinoma renal ¿cuál de las siguientes afirmaciones es falsa?", "o": ["El 75% de los carcinomas renales presentan histología de células claras", "El 50% son carcinomas renales cromófobos", "El subtipo de carcinomas renales cromófobo y oncocitoma es infrecuente", "El 15% de los carcinomas renales son de estirpe papilar"], "c": 2, "e": "Falsa la b: el cromófobo es <b>infrecuente (~5 %)</b>, no el 50 %. Ciertas: <b>células claras ~75-85 %</b>, papilar ~10-15 %, y cromófobo y oncocitoma son minoritarios. <br><small>📌 Cayó en: recopilación 2.</small>"}, {"n": "22", "noShuffle": false, "img": null, "q": "¿Cuál de las siguientes no es un factor de riesgo para padecer cáncer renal?", "o": ["Tabaco", "Obesidad", "Hipotensión", "Exposición a tóxicos"], "c": 3, "e": "Factores de riesgo del cáncer renal: <b>tabaco, obesidad, hipertensión arterial</b>, insuficiencia renal crónica/diálisis/trasplante, exposición laboral a tóxicos y síndromes hereditarios (VHL, esclerosis tuberosa). La <b>hipotensión</b> no lo es: el factor es la HTA. <br><small>📌 Cayó en: recopilación 2.</small>"}, {"n": "23", "noShuffle": false, "img": null, "q": "En el tratamiento de los tumores de células germinales, señale la opción incorrecta:", "o": ["La persistencia de marcadores tumorales elevados tras finalizar quimioterapia es indicador de presencia de enfermedad tumoral viable", "La presencia de concentraciones altas de AFP en un paciente con diagnóstico histológico de seminoma puro, indica la presencia de componente mixto y por tanto debe ser tratado como neoplasia no seminomatosa", "Los tumores de células germinales presentan frecuentemente mutaciones, siendo las más características las del cromosoma 12.", "Es obligada la resección de las masas tumorales residuales en todos los TCG seminomatosos."], "c": 4, "e": "Incorrecta la d: en el <b>seminoma</b> las masas residuales <b>< 3 cm se vigilan</b> y las ≥ 3 cm se valoran con <b>PET-TC</b> (cirugía solo si PET+); la mayoría son fibrosis. La resección sistemática de residuos ≥ 1 cm es del <b>no seminoma</b>. El resto es cierto (alteraciones del cromosoma 12, AFP = componente no seminomatoso). <br><small>📌 Cayó en: final 2018.</small>"}, {"n": "24", "noShuffle": false, "img": null, "q": "No es de mal pronóstico en un cáncer renal:", "o": ["Anemia", "Elevación LDH", "Hipercalcemia", "Elevación de colesterol"], "c": 4, "e": "En el carcinoma renal metastásico son de mal pronóstico (MSKCC/IMDC) la <b>anemia</b>, la <b>hipercalcemia</b> y la <b>LDH elevada</b> (MSKCC), además de Karnofsky < 80 %, intervalo < 1 año, neutrofilia y trombocitosis. La <b>elevación del colesterol</b> no forma parte de estos índices. <br><small>📌 Cayó en: final 2018. ⚠️ No sale tal cual en tus apuntes 2026.</small>"}, {"n": "25", "noShuffle": false, "img": null, "q": "¿Qué síndrome hereditario renal sospecharía en un paciente con cáncer renal multifocal bilateral que presenta una mutación patogénica en el gen MET?", "o": ["Sdr. de cáncer papilar hereditario tipo I", "Sdr. de Birt-Hogg-Dubé", "Sdr. de leiomiomatosis hereditaria", "Sdr. de Von Hippel-Lindau"], "c": 1, "e": "Cáncer renal multifocal y bilateral con mutación germinal activadora de <b>MET</b> = <b>carcinoma papilar renal hereditario tipo 1</b>. Birt-Hogg-Dubé (FLCN) → tumores cromófobos/oncocíticos; leiomiomatosis hereditaria (FH) → carcinoma con déficit de fumarato hidratasa (papilar tipo 2); Von Hippel-Lindau (VHL) → células claras. <br><small>📌 Cayó en: final 2020. ⚠️ No sale tal cual en tus apuntes 2026.</small>"}, {"n": "26", "noShuffle": false, "img": null, "q": "¿Cuál es la histología más frecuente en los tumores renales?", "o": ["Carcinoma Escamoso", "Carcinoma Urotelial", "Adenocarcinoma", "Carcinoma de Células Claras"], "c": 4, "e": "El tumor renal maligno más frecuente es el carcinoma de células renales, y su subtipo más frecuente el de <b>células claras</b> (~75-85 %). El urotelial (de pelvis renal) y el escamoso son raros. «Adenocarcinoma» es un término genérico menos preciso: la respuesta esperada es células claras. <br><small>📌 Cayó en: final 2020.</small>"}, {"n": "27", "noShuffle": true, "img": null, "q": "Un cáncer de próstata de bajo riesgo se caracteriza por:", "o": ["Índice de Gleason ≤ 6 y PSA < 10", "La braquiterapia de baja tasa es una técnica eficaz al igual que la radioterapia externa", "La cirugía consigue resultados parejos a la braquiterapia", "Todas las anteriores"], "c": 4, "e": "Bajo riesgo = <b>Gleason ≤ 6, PSA < 10 y T1-T2a</b>. En él, <b>cirugía, RT externa y braquiterapia de baja tasa (I-125)</b> consiguen resultados equivalentes (control local ~80 % a 5 años), además de la vigilancia activa. → <b>Todas</b> son ciertas. <br><small>📌 Cayó en: recopilación 2.</small>"}, {"n": "28", "noShuffle": false, "img": null, "q": "¿Qué variable NO está incluida en la clasificación de D'Amico de elección terapéutica del cáncer de próstata localizado?", "o": ["Niveles de Hemoglobina", "Estadio T", "Gleason", "PSA"], "c": 1, "e": "La clasificación de <b>D'Amico</b> (riesgo bajo/intermedio/alto del cáncer localizado) usa <b>PSA, Gleason y estadio T</b>. La hemoglobina no interviene. <br><small>📌 Cayó en: final 2020.</small>"}], "sarc": [{"n": "1", "noShuffle": true, "img": null, "q": "Paciente varón de 29 años que presenta dolor en tibia proximal de predominio nocturno que cede exclusivamente con aspirina y empeora con la ingesta de alcohol, al que se le practica una radiografía de dicha localización objetivando la presencia de una lesión de 0,5 cm radioopaca rodeada de un halo de esclerosis. ¿Cuál sería su sospecha clínico-radiológica?", "o": ["Ninguna de las anteriores", "Osteoma osteoide", "Osteosarcoma", "Encondroma"], "c": 2, "e": "Adulto joven con <b>dolor nocturno que cede con aspirina/AINE</b> y lesión pequeña (< 1,5 cm) rodeada de esclerosis reactiva = <b>osteoma osteoide</b>, tumor óseo benigno. El osteosarcoma da una lesión destructiva con reacción perióstica (rayos de sol, Codman); el encondroma suele ser indoloro y de matriz cartilaginosa. <br><small>📌 Cayó en: recopilación 1, final 2020. ⚠️ No sale tal cual en tus apuntes 2026.</small>"}, {"n": "2", "noShuffle": false, "img": null, "q": "¿Qué tumor de partes blandas se caracteriza por poder generar afectación del estado general, poder asociar leucocitosis y fiebre imitando una osteomielitis?", "o": ["Cáncer de testículo", "Cáncer renal", "Sarcoma de Ewing", "Cáncer de próstata"], "c": 3, "e": "El <b>sarcoma de Ewing</b> asocia enfermedad sistémica (fiebre, afectación general, leucocitosis, ↑VSG y LDH, anemia) y por eso <b>simula una osteomielitis</b>. Ojo: es sobre todo óseo (85 %; 15 % en partes blandas), aunque el enunciado lo llame «de partes blandas». <i>(El examen lo llama «de partes blandas», pero el Ewing es sobre todo óseo.)</i> <br><small>📌 Cayó en: recopilación 1.</small>"}, {"n": "3", "noShuffle": false, "img": null, "q": "Señale la afirmación FALSA sobre el tratamiento adyuvante de los sarcomas de partes blandas:", "o": ["La radioterapia postoperatoria está indicada en tumores de alto grado, de gran tamaño (> 5 cm) y profundos", "La radioterapia postoperatoria está indicada tras una resección R1-R2 cuando no es posible la reintervención", "La quimioterapia adyuvante se plantea en tumores de alto riesgo (G3, > 5 cm, profundos)", "La quimiorradioterapia preoperatoria es el tratamiento de elección en la mayoría de los casos"], "c": 4, "e": "La RT preoperatoria <b>no se usa de rutina</b>: se reserva para cirugía borderline o subtipos radiosensibles (liposarcoma mixoide), y no existe una «QT-RT preoperatoria de elección». Ciertas: RT adyuvante en alto grado, > 5 cm y profundos o tras R1-R2; QT adyuvante (ifosfamida + epirrubicina) en G3, > 5 cm y profundos. <br><small>📌 Cayó en: final 2025. Enunciado reconstruido (del final 2025 solo se conserva un resumen).</small>"}, {"n": "4", "noShuffle": false, "img": null, "q": "Respecto a los sarcomas señale la afirmación INCORRECTA:", "o": ["Son neoplasias malignas derivadas del tejido mesenquimal.", "Tienen gran tendencia a la recidiva local.", "En caso de presentar metástasis a distancia, los pulmones son el lugar de asiento más frecuente de los sarcomas retroperitoneales.", "La edad más frecuente de presentación es la comprendida entre los 50 y los 55 años."], "c": 3, "e": "Las metástasis de los sarcomas <b>retroperitoneales e intraabdominales van al hígado</b>; las de las <b>extremidades, al pulmón</b>. Lo demás es cierto: neoplasia mesenquimal, gran tendencia a la recidiva local y edad media de 50-55 años. <br><small>📌 Cayó en: final 2022.</small>"}, {"n": "5", "noShuffle": false, "img": null, "q": "Una de estas afirmaciones sobre los sarcomas es falsa:", "o": ["Son tumores poco frecuentes", "Tienen tendencia a la recidiva local", "Tienen tendencia a la afectación ganglionar", "Tienen tendencia al desarrollo de metástasis"], "c": 3, "e": "Los sarcomas dan <b>metástasis ganglionares raras</b> (excepciones: epitelioide, células claras, angiosarcoma y rabdomiosarcoma). Son ciertas: tumores poco frecuentes (0,5-1 %), gran tendencia a la recidiva local y a las metástasis a distancia (10 % al diagnóstico, hasta el 50 % en la evolución), sobre todo pulmonares o hepáticas. <br><small>📌 Cayó en: ordinaria 2024, final 2025.</small>"}, {"n": "6", "noShuffle": false, "img": null, "q": "Una de estas características del osteosarcoma es falsa:", "o": ["Se localiza más frecuentemente en las metáfisis de los huesos largos (rodilla)", "Se caracteriza por la formación de hueso y presencia de matriz osteoide", "El tratamiento de elección es la cirugía, pero precisa siempre tratamiento quimioterápico adyuvante y/o neoadyuvante", "Se diagnostica mediante la traslocación EWSR1-FLI1 t(11;22)"], "c": 4, "e": "<b>EWSR1-FLI1 t(11;22) es la translocación del sarcoma de Ewing</b>; el osteosarcoma tiene genética compleja (TP53, RB1, CDKN2A/B) y se diagnostica por la <b>presencia de osteoide</b>. La localización en metáfisis de huesos largos (rodilla) es cierta. Ojo con c: el de bajo grado se trata solo con cirugía. <br><small>📌 Cayó en: ordinaria 2024, final 2025.</small>"}, {"n": "7", "noShuffle": false, "img": null, "q": "Una de estas características del sarcoma de Ewing es falsa:", "o": ["Se localiza más frecuentemente en huesos planos (pelvis) y diáfisis de huesos largos", "Se caracteriza por lesiones osteolíticas, con reacción perióstica y presencia de masa de partes blandas", "Presenta 2 picos de incidencia: 0-19 años y más de 60 años", "Es muy sensible a la quimioterapia y radioterapia"], "c": 3, "e": "El Ewing tiene un <b>único pico en la adolescencia</b> (mediana 15 años) y es casi inexistente en adultos; el <b>segundo pico en mayores es del osteosarcoma</b>. Ciertas: pelvis/huesos planos y diáfisis, lesión lítica con reacción perióstica en capas de cebolla y masa de partes blandas, y gran radio- y quimiosensibilidad. <br><small>📌 Cayó en: ordinaria 2024, final 2025.</small>"}, {"n": "8", "noShuffle": false, "img": null, "q": "Sólo uno de estos tumores es curable con quimioterapia en fase metastásica:", "o": ["Cáncer renal", "Cáncer de testículo", "Sarcomas de partes blandas", "Osteosarcoma"], "c": 2, "e": "El <b>cáncer de testículo</b> es el modelo de tumor curable con QT incluso metastásico (> 90 % de curación gracias al cisplatino, esquema BEP). El renal es quimiorresistente; en los sarcomas de partes blandas metastásicos la QT es paliativa, y el osteosarcoma metastásico solo se cura si además se resecan las metástasis. <br><small>📌 Cayó en: ordinaria 2024, final 2025.</small>"}, {"n": "9", "noShuffle": false, "img": null, "q": "¿Cuál de los siguientes factores no se correlaciona con la etiología de los sarcomas de partes blandas?", "o": ["Linfedema", "Radiaciones ionizantes", "Síndrome de Trousseau", "Exposición a herbicidas o asbesto"], "c": 3, "e": "El <b>síndrome de Trousseau</b> (tromboflebitis migratoria) es un fenómeno paraneoplásico, sobre todo del cáncer de páncreas, no una causa de sarcoma. Sí predisponen: <b>irradiación previa</b> (décadas antes), <b>linfedema crónico</b> (angiosarcoma de Stewart-Treves), tóxicos como los herbicidas y síndromes hereditarios (NF1, retinoblastoma). <br><small>📌 Cayó en: final 2018. ⚠️ No sale tal cual en tus apuntes 2026.</small>"}, {"n": "10", "noShuffle": false, "img": null, "q": "¿De qué tumor óseo es característica la imagen radiológica de tumor osteolítico que presenta reacción perióstica perpendicular al hueso conocida como imagen en rayos de sol o púas de peine?", "o": ["Osteosarcoma", "Sarcoma de Ewing", "Osteoblastoma", "Encondroma"], "c": 1, "e": "La reacción perióstica perpendicular al hueso en <b>«rayos de sol» o «púas de peine»</b> (y el triángulo de Codman) es típica del <b>osteosarcoma</b>. El Ewing da reacción en <b>capas de cebolla</b>; osteoblastoma y encondroma son benignos y no producen ese patrón. <br><small>📌 Cayó en: final 2020.</small>"}]};

/* ── CSS dinámico ── */
function injectSecCSS(){
  var css='';
  SECS.forEach(function(s){
    var m=META.secciones[s]||{};
    var c=m.color||'#1a56db',cd=m.colorDim||'#e8f0fe';
    css+='.tab.t-'+s+'.on{background:'+cd+';color:'+c+';border-color:'+c+'}\n';
    css+='.ph.s-'+s+'{border-left:4px solid '+c+'}\n';
    // Variables CSS por sección para el badge coloreado
    css+='#panel-'+s+' .qnum.sec-colored{background:'+cd+';color:'+c+'}\n';
  });
  var st=document.createElement('style');st.textContent=css;document.head.appendChild(st);
}

/* ── Header ── */
function buildHeader(){
  var total=SECS.reduce(function(a,s){return a+(D[s]?D[s].length:0);},0);
  var t=document.getElementById('h-tit');if(t)t.textContent=META.titulo||'Banco MIR';
  var pt=document.getElementById('page-title');if(pt)pt.textContent=META.titulo||'Banco MIR';
  var m=document.getElementById('h-meta');
  if(m){var p=[];if(total)p.push(total+' preguntas');if(META.examen)p.push(META.examen);m.textContent=p.join(' · ');}
  var d=document.getElementById('ph-gdesc');if(d)d.textContent=META.subtitulo||'';
  var r=document.getElementById('sc-rem-all');if(r)r.textContent='○ '+total;
}

/* ── Tabs ── */
function buildTabs(){
  var total=SECS.reduce(function(a,s){return a+(D[s]?D[s].length:0);},0);

  var w=document.getElementById('tabs-wrap');if(w)w.innerHTML=h;
}
